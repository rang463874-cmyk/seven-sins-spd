###### Seven Sins: Sloth ######
actors.hero.heroclass.sloth=sloth
actors.hero.heroclass.sloth_desc_short=Bearer of the sin of _Sloth_. Too lazy to fight, Sloth summons _dream puppets_ to do it instead, and grows _permanently stronger_ from the enemies they defeat.
actors.hero.heroclass.sloth_desc=Sloth starts with the _Cozy Pillow_, worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn. The pillow costs _time_: it powers _Summon Puppet_, _Nap_, _Swap_ and _Yawn_, and after each one you _doze off_ and can't act for a few turns.\n\n_Dream puppets_ are allies that roam the floor and fight in Sloth's place. Each puppet out _borrows 15% of Sloth's max HP_ until it is gone, and puppets have _no armor_. They vanish when Sloth leaves the floor, so they must be summoned again on each new floor. Enemies they defeat grant _sloth points_, which raise melee damage, accuracy, max HP, armor and evasion without limit (the puppets share all but the armor). Enemies Sloth defeats personally give only a third, and Sloth's own _melee attacks deal 30% less damage_.\n\nSloth starts with a _cudgel_ and knows _potions of healing_ and _scrolls of recharging_.
actors.hero.heroclass.sloth_unlock=Sloth is unlocked from the start.

actors.hero.herosubclass.dream_lord=dream lord
actors.hero.herosubclass.dream_lord_short_desc=The _Dream Lord_ commands _one more_ dream puppet, and enemies the puppets defeat rise briefly as _nightmares_ that fight alongside them.
actors.hero.herosubclass.dream_lord_desc=The Dream Lord rules an army of dreams. The maximum number of dream puppets is increased by _1_.\n\nWhen a dream puppet defeats an enemy, a _nightmare_ appears in its place and fights for _10 turns_. Nightmares have _70%_ of a puppet's power, and up to _2_ can exist at once.\n\nThe Dream Lord's talents add more nightmares, share pain with the puppets, or make the puppets hit harder.
actors.hero.herosubclass.sleepwalker=sleepwalker
actors.hero.herosubclass.sleepwalker_short_desc=The _Sleepwalker_ falls asleep after staying put for _2 turns_, and while asleep _automatically attacks_ nearby enemies every turn.
actors.hero.herosubclass.sleepwalker_desc=The Sleepwalker fights in their sleep. Staying on the same tile for _2 turns_ or more puts them to sleep, and while asleep they make a _free attack_ on an adjacent enemy every turn. Automatic attacks deal _60%_ damage and trigger weapon effects.\n\nEnemies defeated by automatic attacks give _full_ sloth points. Moving wakes them up.\n\nThe Sleepwalker's talents strengthen automatic attacks, reduce damage taken while asleep, or attack several enemies at once.

actors.hero.talent.sloth_idle.title=idling
actors.hero.talent.sloth_idle.desc=_+1:_ Gain _15%_ more sloth points.\n\n_+2:_ Gain _30%_ more sloth points.
actors.hero.talent.sloth_comfy.title=dream sight
actors.hero.talent.sloth_comfy.desc=Sloth sees through the eyes of the dream puppets roaming the floor.\n\n_+1:_ See the tiles within _2_ of every puppet\n\n_+2:_ See _everything_ the puppets see
actors.hero.talent.sloth_snore.title=snoring
actors.hero.talent.sloth_snore.desc=A newly summoned dream puppet snores loudly, _taunting_ enemies within _3 tiles_. Taunted enemies only attack the puppet.\n\n_+1:_ _3 turns_\n\n_+2:_ _5 turns_
actors.hero.talent.sloth_linger.title=lingering
actors.hero.talent.sloth_linger.desc=While Sloth stays put, every dream puppet regenerates HP each turn.\n\n_+1:_ _1_ per turn\n\n_+2:_ _2_ per turn
actors.hero.talent.sloth_pillow.title=full-belly nap
actors.hero.talent.sloth_pillow.desc=Eating takes _1 turn_ instead of 3, and after a meal your next pillow skills don't make you doze off.\n\n_+1:_ _1_ skill\n\n_+2:_ _2_ skills
actors.hero.talent.sloth_restful.title=restful sleep
actors.hero.talent.sloth_restful.desc=Enemies the dream puppets kill _drop no items_, but every puppet kill refreshes Sloth.\n\n_+1:_ Each puppet kill restores _15 satiety_ and cures _one_ harmful state (poison, bleeding, weakness, cripple, blindness and the like).\n\n_+2:_ Each puppet kill restores _30 satiety_ and cures _every_ harmful state.
actors.hero.talent.sloth_roll.title=switcheroo
actors.hero.talent.sloth_roll.desc=A dream puppet swapped with Swap gains shielding.\n\n_+1:_ _(5 + level)_\n\n_+2:_ _twice_ that
actors.hero.talent.sloth_yawn.title=contagious yawn
actors.hero.talent.sloth_yawn.desc=Dream puppet attacks have a chance to _slow_ the enemy for _2 turns_.\n\n_+1:_ _15%_ chance\n\n_+2:_ _30%_ chance
actors.hero.talent.sloth_shove.title=light dreams
actors.hero.talent.sloth_shove.desc=Dream puppets borrow less of Sloth's max HP. (base 15% each)\n\n_+1:_ _11%_ each\n\n_+2:_ _7.5%_ each
actors.hero.talent.sloth_apathy.title=apathy
actors.hero.talent.sloth_apathy.desc=All stat bonuses from sloth points are increased, for the puppets too.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.sloth_snooze.title=five more minutes
actors.hero.talent.sloth_snooze.desc=Dream puppets and nightmares have more max HP.\n\n_+1:_ _15%_ more\n\n_+2:_ _30%_ more\n\n_+3:_ _45%_ more
actors.hero.talent.lord_nightmare.title=nightmare horde
actors.hero.talent.lord_nightmare.desc=Nightmares from kills last longer and more can exist. (base 10 turns, 2)\n\n_+1:_ _15 turns_, _3_\n\n_+2:_ _20 turns_, _4_\n\n_+3:_ _25 turns_, _5_
actors.hero.talent.lord_bond.title=dream bond
actors.hero.talent.lord_bond.desc=Sloth takes less damage for every puppet and nightmare out. (up to 50%)\n\n_+1:_ _3%_ each\n\n_+2:_ _6%_ each\n\n_+3:_ _9%_ each
actors.hero.talent.lord_command.title=command
actors.hero.talent.lord_command.desc=Dream puppets and nightmares deal more damage.\n\n_+1:_ _10%_ more\n\n_+2:_ _20%_ more\n\n_+3:_ _30%_ more
actors.hero.talent.walk_reflex.title=reflexes
actors.hero.talent.walk_reflex.desc=Automatic attacks while asleep deal more damage. (base 60%)\n\n_+1:_ _80%_\n\n_+2:_ _100%_\n\n_+3:_ _120%_
actors.hero.talent.walk_deep.title=deep sleep
actors.hero.talent.walk_deep.desc=Take less damage while asleep.\n\n_+1:_ _8%_ less\n\n_+2:_ _16%_ less\n\n_+3:_ _24%_ less
actors.hero.talent.walk_brawl.title=sleepy brawl
actors.hero.talent.walk_brawl.desc=Automatic attacks while asleep hit more enemies. (base 1)\n\n_+1:_ _2_\n\n_+2:_ _3_\n\n_+3:_ _4_
actors.hero.talent.legion_count.title=great host
actors.hero.talent.legion_count.desc=Nightmare Legion calls more nightmares. (base 2)\n\n_+1:_ _3_\n\n_+2:_ _3_\n\n_+3:_ _4_\n\n_+4:_ _4_
actors.hero.talent.legion_duration.title=long night
actors.hero.talent.legion_duration.desc=Nightmare Legion's nightmares stay longer. (base 20 turns)\n\n_+1:_ _25 turns_\n\n_+2:_ _30 turns_\n\n_+3:_ _35 turns_\n\n_+4:_ _40 turns_
actors.hero.talent.legion_taunt.title=commotion
actors.hero.talent.legion_taunt.desc=Nightmare Legion's nightmares _taunt_ enemies within _3 tiles_ as they appear.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.auto_duration.title=left running
actors.hero.talent.auto_duration.desc=Auto Hunt lasts longer. (base 10 turns)\n\n_+1:_ _13 turns_\n\n_+2:_ _16 turns_\n\n_+3:_ _19 turns_\n\n_+4:_ _22 turns_
actors.hero.talent.auto_power.title=efficient farming
actors.hero.talent.auto_power.desc=Auto Hunt's attacks deal more damage. (base 70%)\n\n_+1:_ _85%_\n\n_+2:_ _100%_\n\n_+3:_ _115%_\n\n_+4:_ _130%_
actors.hero.talent.auto_reach.title=area farming
actors.hero.talent.auto_reach.desc=Auto Hunt attacks more enemies, farther away. (base 1 tile, 1 enemy)\n\n_+1:_ _1 tile_, _2_\n\n_+2:_ _2 tiles_, _2_\n\n_+3:_ _2 tiles_, _3_\n\n_+4:_ _3 tiles_, _3_
actors.hero.talent.proxy_duration.title=long contract
actors.hero.talent.proxy_duration.desc=Proxy lasts longer. (base 10 turns)\n\n_+1:_ _13 turns_\n\n_+2:_ _16 turns_\n\n_+3:_ _19 turns_\n\n_+4:_ _22 turns_
actors.hero.talent.proxy_mend.title=patch-up
actors.hero.talent.proxy_mend.desc=Using Proxy heals every dream puppet.\n\n_+1:_ _20%_\n\n_+2:_ _40%_\n\n_+3:_ _60%_\n\n_+4:_ _80%_
actors.hero.talent.proxy_shield.title=under the covers
actors.hero.talent.proxy_shield.desc=Using Proxy gives Sloth shielding based on max HP.\n\n_+1:_ _5%_\n\n_+2:_ _10%_\n\n_+3:_ _15%_\n\n_+4:_ _20%_

actors.hero.abilities.sloth.nightmarelegion.name=nightmare legion
actors.hero.abilities.sloth.nightmarelegion.short_desc=Calls up several _nightmares_ to fight in Sloth's place.
actors.hero.abilities.sloth.nightmarelegion.desc=Summons _2 nightmares_ nearby. Nightmares have _70%_ of a dream puppet's power and fight for _20 turns_ before fading. Enemies they defeat give full sloth points.
actors.hero.abilities.sloth.autohunt.name=auto hunt
actors.hero.abilities.sloth.autohunt.short_desc=Dozing off, Sloth _automatically attacks nearby enemies every turn_.
actors.hero.abilities.sloth.autohunt.desc=For _10 turns_, Sloth makes a free attack at _70%_ damage on an adjacent enemy every turn. It continues even while moving or doing other things, and enemies defeated by automatic attacks give full sloth points.
actors.hero.abilities.sloth.proxy.name=proxy
actors.hero.abilities.sloth.proxy.short_desc=For a while, _dream puppets take the damage_ meant for Sloth.
actors.hero.abilities.sloth.proxy.desc=For _10 turns_, all damage Sloth would take is _split evenly_ among living dream puppets and nightmares. With no puppets out, damage is only _halved_.

actors.buffs.slothrepose.name=sloth
actors.buffs.slothrepose.desc_head=Sloth points: _%d_\nDream puppets: _%d / %d_
actors.buffs.slothrepose$doze.name=dozing
actors.buffs.slothrepose$doze.desc=You are nodding off, the price of the pillow's power. You can't do anything until you wake up.\n\nTurns remaining: %s.
actors.buffs.slothrepose$refreshed.name=well fed
actors.buffs.slothrepose$refreshed.desc=A good meal keeps you awake. Your next _%d_ pillow skills won't make you doze off.
actors.buffs.slothrepose.desc_stats=Bonus weapon damage (melee & thrown): _+%d_\nAccuracy: _+%d%%_\nMax HP: _+%d_\nBonus armor: _0-%d_\nEvasion: _+%d%%_\n\nDream puppets grow stronger with sloth points too (but never have armor). Each puppet out borrows part of your max HP, and your own melee attacks deal 30%% less damage.
actors.buffs.slothrepose.desc_asleep=_Asleep:_ automatically attacking nearby enemies every turn.
actors.buffs.slothrepose.doze=Zzz...
actors.buffs.slothrepose$taunted.name=taunted
actors.buffs.slothrepose$taunted.desc=Provoked by a dream puppet, this creature only chases and attacks that puppet.\n\nTurns remaining: %s
actors.buffs.slothrepose$taunted.shout=Taunt!
actors.buffs.slothrepose$proxyguard.name=proxy
actors.buffs.slothrepose$proxyguard.desc=Dream puppets are taking the damage meant for Sloth.\n\nTurns remaining: %s
actors.buffs.slothrepose$autohunt.name=auto hunt
actors.buffs.slothrepose$autohunt.desc=Even while dozing, Sloth automatically attacks nearby enemies every turn.\n\nTurns remaining: %s
actors.buffs.slothrepose$dreammark.name=ordered target
actors.buffs.slothrepose$dreammark.desc=The Sloth has pointed every dream puppet at this creature. They hunt it wherever it goes and deal _+%d%%_ damage to it.\n\nTurns remaining: %s
actors.buffs.slothrepose$dreamforge.name=dream forge
actors.buffs.slothrepose$dreamforge.desc=You are deep asleep, dreaming of your %s growing stronger. Any damage will wake you and end the dream.\n\nTurns remaining: %d
actors.buffs.slothrepose$dreamforge.forged=You wake up refreshed. Your %s was really strengthened in the dream!
actors.buffs.slothrepose$dreamforge.forged_status=+1
actors.buffs.slothrepose$dreamforge.nothing=You wake up, but the item you dreamed of is gone.
actors.buffs.slothrepose$dreamforge.broken=You were jolted awake! The dream slips away...
actors.buffs.slothrepose$dreamforge.broken_status=Awake!
actors.mobs.npcs.dreampuppet.name=dream puppet
actors.mobs.npcs.dreampuppet.name_nightmare=nightmare
actors.mobs.npcs.dreampuppet.desc=A bluish puppet that slipped out of Sloth's dreams. Instead of guarding its owner, it _roams the floor as it pleases_, pouncing on any enemy it spots, asleep or not. It has _no armor_, and while it is out it holds a share of Sloth's max HP. It grows stronger with Sloth's level and sloth points, and fades like a dream once Sloth leaves the floor.
actors.mobs.npcs.dreampuppet.desc_nightmare=A passing nightmare. It will fade in _%d turns_.

###### Seven Sins: Vault Mirror ######
actors.mobs.npcs.vaultmirror.scene_gluttony=You see a small _mirror jewel case_ resting on the long table of an empty banquet hall. The mirror inside its lid shows you wearing one more trinket than you do now.
actors.mobs.npcs.vaultmirror.scene_greed=You see a small _mirror jewel case_ resting on a spotless ledger without a single debt. The mirror inside its lid shows you wearing one more trinket than you do now.
actors.mobs.npcs.vaultmirror.scene_wrath=You see a small _mirror jewel case_ resting on the middle of a burned-out village square. The mirror inside its lid shows you wearing one more trinket than you do now.
actors.mobs.npcs.vaultmirror.scene_pride=You see a small _mirror jewel case_ resting on an empty throne. The mirror inside its lid shows you wearing one more trinket than you do now.
actors.mobs.npcs.vaultmirror.scene_lust=You see a small _mirror jewel case_ resting on a vanity table with its candles snuffed out. The mirror inside its lid shows you wearing one more trinket than you do now.
actors.mobs.npcs.vaultmirror.scene_envy=You see a small _mirror jewel case_ resting on the end of a hallway lined with portraits. The mirror inside its lid shows you wearing one more trinket than you do now.
actors.mobs.npcs.vaultmirror.scene_sloth=You see a small _mirror jewel case_ resting on an endless field at dusk. The mirror inside its lid shows you wearing one more trinket than you do now.

###### Seven Sins: Horsemen ######
actors.mobs.npcs.prophet.name=prophet of seals
actors.mobs.npcs.prophet.desc=A prophet with a deep hood pulled low. They hide in the sewers, waiting for the day the seals of the apocalypse break.
actors.mobs.npcs.prophet.intro=So you've come, %s. I have been waiting.\n\nOn this floor lies a sealed _sanctum_, where the _Seal Warden_ guards the _seal of the apocalypse_. Once you step inside, it will close the way out behind you. It borrows the power of the four horsemen, and every time it is wounded it shifts between the aspects of Conquest, War, Famine and Death, gaining a new technique each time. When the ground beneath you is marked, move.\n\nDefeat it and bring me the seal, and I will share with you the power of one of the _four horsemen_ waiting beyond.
actors.mobs.npcs.prophet.reminder=You haven't brought the seal yet. The _Seal Warden_ waits in its sanctum on this floor. Remember: each time it changes its aspect it learns a new technique, and every one of them is marked on the ground a moment before it strikes.
actors.mobs.sealwarden.name=seal warden
actors.mobs.sealwarden.desc=An armored warden guarding the seal of the apocalypse from its sanctum. It borrows the power of the four horsemen, taking on the next horseman's aspect each time it loses a quarter of its health. Its techniques are marked on the ground a moment before they land; step out of the marks to avoid them.
actors.mobs.sealwarden.desc_conquest=_Aspect of Conquest:_ thick armor turns blows aside.
actors.mobs.sealwarden.desc_war=_Aspect of War:_ attacks half again as fast.
actors.mobs.sealwarden.desc_famine=_Aspect of Famine:_ its hits weaken you and steal satiety.
actors.mobs.sealwarden.desc_death=_Aspect of Death:_ hits much harder against foes below half health.
actors.mobs.sealwarden.aspect_war=War!
actors.mobs.sealwarden.aspect_famine=Famine!
actors.mobs.sealwarden.aspect_death=Death!
actors.mobs.sealwarden.aspect_conquest=Conquest!
actors.mobs.sealwarden.notice=You who would touch the seal... in the name of the four horsemen, I will stop you!
actors.mobs.sealwarden.yell_war=The red horse rides! The blade will not rest!
actors.mobs.sealwarden.yell_famine=The black scales tip... I will take your strength.
actors.mobs.sealwarden.yell_death=The pale horse has come, and hell follows with it...
actors.mobs.sealwarden.yell_conquest=He who rides the white horse conquers, and conquers again!
actors.mobs.sealwarden.defeated=The seal... is breaking...
actors.mobs.sealwarden.sealed=Stone grinds shut over the doorway. There is no way out but through the warden!
actors.mobs.sealwarden.unsealed=The stone over the doorway crumbles away.
actors.mobs.sealwarden.skill_volley=Volley!
actors.mobs.sealwarden.skill_charge=Charge!
actors.mobs.sealwarden.skill_blight=Blight!
actors.mobs.sealwarden.skill_reap=Reap!
actors.mobs.sealwarden.skill_kill=The Seal Warden's technique struck you down...
actors.mobs.sealwarden.desc_skills=_Techniques:_
actors.mobs.sealwarden.desc_skill_volley=- _Volley_ (Conquest): arrows rain on your tile and the four tiles beside it.
actors.mobs.sealwarden.desc_skill_charge=- _Charge_ (War): it dashes in a straight line through you, crippling whoever it runs over.
actors.mobs.sealwarden.desc_skill_blight=- _Blight_ (Famine): an X of withering spreads diagonally through you, weakening and starving you and healing the warden.
actors.mobs.sealwarden.desc_skill_reap=- _Reap_ (Death): a sweep over every tile around it, deadlier against the badly wounded.
actors.mobs.npcs.prophet$sealbearer.name=seal bearer
actors.mobs.npcs.prophet$sealbearer.desc=This creature carries a fragment of the apocalypse's seals. Defeat it and it will drop the fragment.

###### Seven Sins: Unique ######
sins.uniquestats.wrath=_Unique, attack speed:_ +%d%%
sins.uniquestats.gluttony=_Unique, HP regeneration:_ +%s per turn
sins.uniquestats.greed=_Unique, loot chance:_ +%d%%
sins.uniquestats.pride=_Unique, debuff resistance:_ %d%%
sins.uniquestats.lust=_Unique, movement speed:_ +%d%%
sins.uniquestats.envy=_Unique, rare monster spawns:_ +%d%% (max 300%%; at max, kills have a 5%% chance of 3 turns of mind vision)
