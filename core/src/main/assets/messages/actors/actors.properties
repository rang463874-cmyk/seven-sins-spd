actors.buffs.predatorstomach$coma.name=food coma
actors.buffs.predatorstomach$coma.desc=You're full and sluggish, but sturdier for it. The next hit you take is reduced by _%d%%_.
actors.buffs.gluttonimbue$venom.name=venom gut
actors.buffs.gluttonimbue$venom.desc=The toxic gas you swallowed has soaked into your body. Your melee hits _poison_, and you're immune to poison.\n\nTurns remaining: %s.
actors.buffs.gluttonimbue$numbing.name=numbing gut
actors.buffs.gluttonimbue$numbing.desc=The paralytic gas you swallowed has soaked into your body. Your melee hits have a _25%%_ chance to _paralyze_, and you're immune to paralysis.\n\nTurns remaining: %s.
actors.buffs.gluttonimbue$acid.name=acid gut
actors.buffs.gluttonimbue$acid.desc=The corrosive gas you swallowed has soaked into your body. Your melee hits _corrode_, and you're immune to corrosion.\n\nTurns remaining: %s.
actors.buffs.gluttonimbue$frenzy.name=frenzy
actors.buffs.gluttonimbue$frenzy.desc=You chewed up a scroll of rage. Your melee damage is increased by _35%%_.\n\nTurns remaining: %s.

###### Seven Sins: Greed ######
actors.hero.heroclass.greed=greed
actors.hero.heroclass.greed_desc_short=Bearer of the sin of _Greed_. Greed grows _stronger the more gold they carry_, and spends a _payment limit_ filled by picking up gold on payment skills.
actors.hero.heroclass.greed_desc=Greed starts with the _Golden Card_, worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn. Melee damage, accuracy, max HP, armor and evasion rise without limit based on the _gold currently carried_. Spending gold in shops lowers them again.\n\nPicking up gold fills the _payment limit_ by the same amount (the gold still goes into your purse). The limit pays for skills like _Coin Shot_, _Golden Guard_, _Express Fee_ (teleport) and _Bribe_. _Remote Sale_ sells items at shop prices anywhere.\n\nGreed starts with a _dagger_ and knows _potions of healing_ and _scrolls of magic mapping_.
actors.hero.heroclass.greed_unlock=Greed is unlocked from the start.
actors.hero.herosubclass.banker=banker
actors.hero.herosubclass.banker_short_desc=The _Banker_ earns _compound interest_ on carried gold every time they reach a new floor.
actors.hero.herosubclass.banker_desc=The Banker knows how to make money work. On reaching each new floor, they earn _5%_ of their carried gold as interest, which _compounds_. Saving gold grows both stats and interest.\n\nThe Banker's talents raise the rate, let interest fill the payment limit, or pay dividends without changing floors.
actors.hero.herosubclass.usurer=usurer
actors.hero.herosubclass.usurer_short_desc=The _Usurer_ _forces loans_ on enemies, deals heavy bonus damage to debtors, and collects _double the principal_ when they die.
actors.hero.herosubclass.usurer_desc=The Usurer gains _Forced Loan_ as a payment skill. Lending an enemy gold _from your purse_ equal to 3x its max HP makes it a _debtor_.\n\nEvery hit on a debtor deals bonus damage equal to _8% of the principal_, and when a debtor dies _twice the principal_ comes back to your purse. If a debtor escapes, the principal is lost.
actors.hero.talent.greed_penny.title=penny pincher
actors.hero.talent.greed_penny.desc=_+1:_ Picking up gold grants _10%_ more.\n\n_+2:_ Picking up gold grants _20%_ more.
actors.hero.talent.greed_loot.title=nose for loot
actors.hero.talent.greed_loot.desc=_+1:_ Each enemy killed gives _(2 + depth)_ gold.\n\n_+2:_ Each enemy killed gives _twice_ that.
actors.hero.talent.greed_gilded_skin.title=gilded skin
actors.hero.talent.greed_gilded_skin.desc=Picking up gold grants shielding based on the amount.\n\n_+1:_ _4%_ of the gold (up to 15% of max HP)\n\n_+2:_ _8%_ of the gold (up to 30% of max HP)
actors.hero.talent.greed_discount.title=discount coupon
actors.hero.talent.greed_discount.desc=_+1:_ All payment skills cost _15%_ less.\n\n_+2:_ All payment skills cost _30%_ less.
actors.hero.talent.greed_hoard.title=golden meal
actors.hero.talent.greed_hoard.desc=Eating takes _1 turn_ instead of 3, and each meal fills the payment gauge.\n\n_+1:_ _15%_ of its maximum\n\n_+2:_ _30%_ of its maximum
actors.hero.talent.greed_compensation.title=compensation
actors.hero.talent.greed_compensation.desc=Taking damage fills the payment limit based on the damage.\n\n_+1:_ _50%_ of damage taken\n\n_+2:_ _100%_ of damage taken
actors.hero.talent.greed_express.title=express shipping
actors.hero.talent.greed_express.desc=Express Fee can move farther. (base 4 tiles)\n\n_+1:_ _5 tiles_\n\n_+2:_ _6 tiles_
actors.hero.talent.greed_bribery.title=backroom deals
actors.hero.talent.greed_bribery.desc=Bribe lasts longer. (base 10 turns)\n\n_+1:_ _15 turns_\n\n_+2:_ _20 turns_
actors.hero.talent.greed_coinshot.title=coin bomb
actors.hero.talent.greed_coinshot.desc=_+1:_ Coin Shot deals _25%_ more damage.\n\n_+2:_ Coin Shot deals _50%_ more damage.
actors.hero.talent.greed_prestige.title=vip status
actors.hero.talent.greed_prestige.desc=All stat bonuses from carried gold are increased.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.greed_midas.title=midas touch
actors.hero.talent.greed_midas.desc=Melee hits have a chance to give _(5 + depth)_ gold.\n\n_+1:_ _5%_ chance\n\n_+2:_ _10%_ chance\n\n_+3:_ _15%_ chance
actors.hero.talent.banker_rate.title=preferred rate
actors.hero.talent.banker_rate.desc=Raises the per-floor interest rate. (base 5%)\n\n_+1:_ _8%_\n\n_+2:_ _11%_\n\n_+3:_ _14%_
actors.hero.talent.banker_capitalize.title=capitalized interest
actors.hero.talent.banker_capitalize.desc=Interest also fills the _payment limit_.\n\n_+1:_ _50%_ of interest\n\n_+2:_ _100%_ of interest\n\n_+3:_ _150%_ of interest
actors.hero.talent.banker_dividend.title=dividends
actors.hero.talent.banker_dividend.desc=Pays _half the interest_ periodically, even without changing floors.\n\n_+1:_ every _300 turns_\n\n_+2:_ every _200 turns_\n\n_+3:_ every _100 turns_
actors.hero.talent.usurer_gouge.title=price gouging
actors.hero.talent.usurer_gouge.desc=Debtors repay more when killed. (base 2x the principal)\n\n_+1:_ _2.5x_\n\n_+2:_ _3x_\n\n_+3:_ _3.5x_
actors.hero.talent.usurer_collector.title=debt collector
actors.hero.talent.usurer_collector.desc=Bonus damage against debtors is increased.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_
actors.hero.talent.usurer_lien.title=lien
actors.hero.talent.usurer_lien.desc=Debtors deal less damage to you.\n\n_+1:_ _10%_ less\n\n_+2:_ _20%_ less\n\n_+3:_ _30%_ less
actors.hero.talent.rain_radius.title=downpour
actors.hero.talent.rain_radius.desc=Gold Rain covers a larger area. (base 2 tiles)\n\n_+1:_ _3 tiles_\n\n_+2:_ _3 tiles_\n\n_+3:_ _4 tiles_\n\n_+4:_ _4 tiles_
actors.hero.talent.rain_dazzle.title=dazzling shine
actors.hero.talent.rain_dazzle.desc=Enemies hit by Gold Rain are _blinded_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.rain_refund.title=refund
actors.hero.talent.rain_refund.desc=Each enemy hit by Gold Rain fills the payment limit, more on deeper floors.\n\n_+1:_ base _5_ per enemy\n\n_+2:_ base _10_\n\n_+3:_ base _15_\n\n_+4:_ base _20_
actors.hero.talent.ins_coverage.title=extended coverage
actors.hero.talent.ins_coverage.desc=Insurance restores more HP. (base 30%)\n\n_+1:_ _40%_\n\n_+2:_ _50%_\n\n_+3:_ _60%_\n\n_+4:_ _70%_
actors.hero.talent.ins_term.title=long-term policy
actors.hero.talent.ins_term.desc=Insurance lasts longer. (base 50 turns)\n\n_+1:_ _75 turns_\n\n_+2:_ _100 turns_\n\n_+3:_ _125 turns_\n\n_+4:_ _150 turns_
actors.hero.talent.ins_payout.title=special rider
actors.hero.talent.ins_payout.desc=An insurance payout grants brief _invulnerability_.\n\n_+1:_ _2 turns_\n\n_+2:_ _3 turns_\n\n_+3:_ _4 turns_\n\n_+4:_ _5 turns_
actors.hero.talent.bankrupt_reach.title=collection network
actors.hero.talent.bankrupt_reach.desc=Bankruptcy reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.bankrupt_seize.title=total seizure
actors.hero.talent.bankrupt_seize.desc=Bankruptcy deals more bonus damage to debtors. (base 50% of the principal)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_\n\n_+4:_ _150%_
actors.hero.talent.bankrupt_dread.title=creditor's dread
actors.hero.talent.bankrupt_dread.desc=Enemies that survive Bankruptcy are _terrified_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.abilities.greed.goldrain.name=gold rain
actors.hero.abilities.greed.goldrain.short_desc=Showers coins around you, damaging _every visible enemy_ nearby.
actors.hero.abilities.greed.goldrain.desc=Deals damage based on your level plus _0.3 per 100 gold carried_ to every visible enemy within 2 tiles. Grows stronger the more gold you carry.
actors.hero.abilities.greed.insurance.name=insurance
actors.hero.abilities.greed.insurance.short_desc=Takes out a policy that lets you survive _one lethal blow_.
actors.hero.abilities.greed.insurance.desc=For 50 turns, a hit that would kill you instead leaves you at _30% of max HP_ and ends the policy. Triggers before an ankh.
actors.hero.abilities.greed.insurance.payout=The insurance paid out! You cheated death.
actors.hero.abilities.greed.bankruptcy.name=bankruptcy
actors.hero.abilities.greed.bankruptcy.short_desc=Declares every visible enemy bankrupt. _Debtors_ take heavy damage based on what they owe.
actors.hero.abilities.greed.bankruptcy.desc=Deals damage based on your level to every visible enemy within 4 tiles. Debtors take extra damage equal to _50% of the principal_. Pairs especially well with the Usurer.
actors.buffs.greedvault.name=golden vault
actors.buffs.greedvault.desc_money=Gold carried: _%d_\nPayment limit: _%d / %d_
actors.buffs.greedvault.desc_stats=Bonus weapon damage (melee & thrown): _+%d_\nAccuracy: _+%d%%_\nMax HP: _+%d_\nBonus armor: _0-%d_\nEvasion: _+%d%%_
actors.buffs.greedvault.desc_interest=Interest per floor: _%d%%_
actors.buffs.greedvault.interest=%d gold of interest was deposited.
actors.buffs.greedvault$debt.name=debt
actors.buffs.greedvault$debt.desc=Was forced to borrow _%d_ gold from Greed. Each hit comes with a reminder, and on death it repays _%d_ gold.
actors.buffs.greedvault$debt.collected=Collected a debt of %d gold!
actors.buffs.greedvault$insurance.name=insured
actors.buffs.greedvault$insurance.desc=The policy is active and will cover one lethal blow.\n\nTerm remaining: %s turns

###### Seven Sins: Wrath ######
actors.hero.heroclass.wrath=wrath
actors.hero.heroclass.wrath_desc_short=Bearer of the sin of _Wrath_. Wrath _spreads rage among enemies so they fight each other_, and grows _permanently stronger_ from the blood they spill.
actors.hero.heroclass.wrath_desc=Wrath starts with the _War Drum_, worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn. The drum spends _rage_ to power _Provoke_, _Discord_, _Contagion_ and _Dash_. Rage builds as you _deal and take damage_ and slowly cools when no enemies are around.\n\nEvery time an enemy _damages or kills another enemy_, Wrath gains grudge points, which raise melee damage, accuracy, max HP, armor and evasion without limit.\n\nWrath starts with _studded gloves_ and knows _potions of healing_ and _scrolls of rage_.
actors.hero.heroclass.wrath_unlock=Wrath is unlocked from the start.
actors.hero.herosubclass.instigator=instigator
actors.hero.herosubclass.instigator_short_desc=The _Instigator's_ rage lasts _50%_ longer, and enraged enemies deal _20%_ more damage to other enemies.
actors.hero.herosubclass.instigator_desc=The Instigator stokes the fire rather than fighting it. Amok and discord from the War Drum last _50%_ longer, and enraged enemies deal _20%_ more damage to other enemies.\n\nThe Instigator's talents boost infighting damage further, let rage spread on its own, or start riots when enemies kill each other.
actors.hero.herosubclass.avenger=avenger
actors.hero.herosubclass.avenger_short_desc=The _Avenger_ heals for _10%_ of the damage enemies deal to each other in view.
actors.hero.herosubclass.avenger_desc=The Avenger draws strength from the brawl. Whenever an enemy in view damages another enemy, the Avenger heals for _10%_ of that damage.\n\nThe Avenger's talents increase this healing, build up attack power while watching enemies fight, or deal more damage to enraged enemies.
actors.hero.talent.wrath_spite.title=spite
actors.hero.talent.wrath_spite.desc=_+1:_ Grudge points gained are increased by _15%_.\n\n_+2:_ Grudge points gained are increased by _30%_.
actors.hero.talent.wrath_fuel.title=boiling blood
actors.hero.talent.wrath_fuel.desc=_+1:_ Getting hit grants _2.5_ extra rage.\n\n_+2:_ Getting hit grants _5_ extra rage.
actors.hero.talent.wrath_first_blood.title=first blood
actors.hero.talent.wrath_first_blood.desc=An enraged enemy's first attack on another enemy is stronger.\n\n_+1:_ _30%_ more damage\n\n_+2:_ _60%_ more damage
actors.hero.talent.wrath_glare.title=glare
actors.hero.talent.wrath_glare.desc=Enemies enraged by the War Drum become _vulnerable_.\n\n_+1:_ _3 turns_\n\n_+2:_ _5 turns_
actors.hero.talent.wrath_drummer.title=angry meal
actors.hero.talent.wrath_drummer.desc=Eating takes _1 turn_ instead of 3, and each meal builds rage.\n\n_+1:_ _25_\n\n_+2:_ _50_
actors.hero.talent.wrath_tempo.title=quick tempo
actors.hero.talent.wrath_tempo.desc=All rage gained is increased.\n\n_+1:_ _20%_ more\n\n_+2:_ _40%_ more
actors.hero.talent.wrath_dash_strike.title=charge
actors.hero.talent.wrath_dash_strike.desc=Dash damages adjacent enemies on landing.\n\n_+1:_ a light impact\n\n_+2:_ a heavy impact, and _+1 tile_ of dash range
actors.hero.talent.wrath_long_grudge.title=lasting grudge
actors.hero.talent.wrath_long_grudge.desc=Rage from the War Drum lasts longer.\n\n_+1:_ _25%_ longer\n\n_+2:_ _50%_ longer
actors.hero.talent.wrath_scavenge.title=third party
actors.hero.talent.wrath_scavenge.desc=Gain rage whenever an enemy is killed by another enemy.\n\n_+1:_ _6_\n\n_+2:_ _12_
actors.hero.talent.wrath_fury.title=fury
actors.hero.talent.wrath_fury.desc=All stat bonuses from grudge points are increased, including points already earned.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.wrath_chaos.title=chaos
actors.hero.talent.wrath_chaos.desc=Provoke has a chance to spread to one adjacent enemy.\n\n_+1:_ _20%_ chance\n\n_+2:_ _40%_ chance\n\n_+3:_ _60%_ chance
actors.hero.talent.instigator_fervor.title=fervor
actors.hero.talent.instigator_fervor.desc=Enraged enemies deal even more damage to other enemies.\n\n_+1:_ _15%_ more\n\n_+2:_ _30%_ more\n\n_+3:_ _45%_ more
actors.hero.talent.instigator_plague.title=plague of rage
actors.hero.talent.instigator_plague.desc=Enemies hit by an enraged enemy have a chance to become amok.\n\n_+1:_ _15%_ chance\n\n_+2:_ _30%_ chance\n\n_+3:_ _45%_ chance
actors.hero.talent.instigator_riot.title=riot
actors.hero.talent.instigator_riot.desc=When an enemy is killed by another enemy, enemies within 2 tiles go amok.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_
actors.hero.talent.avenger_feast.title=blood feast
actors.hero.talent.avenger_feast.desc=Healing from infighting is increased. (base 10%)\n\n_+1:_ _15%_\n\n_+2:_ _20%_\n\n_+3:_ _25%_
actors.hero.talent.avenger_empower.title=oath of vengeance
actors.hero.talent.avenger_empower.desc=Each time enemies in view fight each other, gain _+1_ melee damage, lasting 10 turns.\n\n_+1:_ up to _+3_\n\n_+2:_ up to _+6_\n\n_+3:_ up to _+9_
actors.hero.talent.avenger_execute.title=execution
actors.hero.talent.avenger_execute.desc=Melee damage against enraged enemies is increased.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.cry_reach.title=thunderous voice
actors.hero.talent.cry_reach.desc=War Cry reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.cry_endure.title=endless roar
actors.hero.talent.cry_endure.desc=Amok from War Cry lasts longer. (base 6 turns)\n\n_+1:_ _8 turns_\n\n_+2:_ _10 turns_\n\n_+3:_ _12 turns_\n\n_+4:_ _14 turns_
actors.hero.talent.cry_fright.title=intimidation
actors.hero.talent.cry_fright.desc=Enemies who hear War Cry are _weakened_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.spirit_might.title=mighty spirits
actors.hero.talent.spirit_might.desc=Wrath spirits are tougher and stronger.\n\n_+1:_ _25%_ more HP, _+2_ levels\n\n_+2:_ _50%_ HP, _+4_ levels\n\n_+3:_ _75%_ HP, _+6_ levels\n\n_+4:_ _100%_ HP, _+8_ levels
actors.hero.talent.spirit_hunger.title=hungry spirits
actors.hero.talent.spirit_hunger.desc=Each attack by a wrath spirit heals you.\n\n_+1:_ _1 HP_\n\n_+2:_ _2 HP_\n\n_+3:_ _3 HP_\n\n_+4:_ _4 HP_
actors.hero.talent.spirit_spite.title=spiteful spirits
actors.hero.talent.spirit_spite.desc=When a wrath spirit fades, adjacent enemies go amok.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.burst_power.title=explosive rage
actors.hero.talent.burst_power.desc=Rage Burst deals more damage.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.burst_radius.title=shrapnel
actors.hero.talent.burst_radius.desc=Rage Burst covers a larger area. (base 1 tile)\n\n_+1:_ _1 tile_\n\n_+2:_ _2 tiles_\n\n_+3:_ _2 tiles_\n\n_+4:_ _3 tiles_
actors.hero.talent.burst_chain.title=chain rage
actors.hero.talent.burst_chain.desc=Enemies that survive Rage Burst go amok again.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.abilities.wrath.warcry.name=war cry
actors.hero.abilities.wrath.warcry.short_desc=A furious roar that drives _every visible enemy_ into a rage.
actors.hero.abilities.wrath.warcry.desc=Every visible enemy within 4 tiles goes amok for _6 turns_ and attacks the others. War Drum talents also apply. Bosses and minibosses are affected too.
actors.hero.abilities.wrath.wrathspirits.name=wrath spirits
actors.hero.abilities.wrath.wrathspirits.short_desc=Calls forth _three wrath spirits_ to fight at your side.
actors.hero.abilities.wrath.wrathspirits.desc=Summons _3 corrupted wrath spirits_ around you. They scale with the floor and fight as allies, slowly fading over time like corrupted monsters.
actors.hero.abilities.wrath.wrathspirits.no_space=There is no room to summon the spirits.
actors.hero.abilities.wrath.wrathspirits$spirit.name=wrath spirit
actors.hero.abilities.wrath.wrathspirits$spirit.desc=A knot of grudges always looking for a fight. It answered Wrath's call and fights alongside you for now.
actors.hero.abilities.wrath.rageburst.name=rage burst
actors.hero.abilities.wrath.rageburst.short_desc=Every visible _enraged enemy_ explodes, hurting itself and everything nearby.
actors.hero.abilities.wrath.rageburst.desc=Every visible enemy under amok, discord or contagion explodes. Exploding enemies take damage based on your level, and other enemies within 1 tile take half. Overlapping blasts stack.
actors.hero.abilities.wrath.rageburst.no_targets=You don't see any enraged enemies.
actors.buffs.wrathgrudge.name=grudge
actors.buffs.wrathgrudge.desc_head=Grudge points: _%d_\nRage: _%d/%d_
actors.buffs.wrathgrudge.desc_stats=Bonus weapon damage (melee & thrown): _+%d_\nAccuracy: _+%d%%_\nMax HP: _+%d_\nBonus armor: _0-%d_\nEvasion: _+%d%%_
actors.buffs.wrathgrudge$discord.name=discord
actors.buffs.wrathgrudge$discord.desc=This enemy holds a deep grudge against another enemy and will only attack it.
actors.buffs.wrathgrudge$contagion.name=contagious rage
actors.buffs.wrathgrudge$contagion.desc=This enemy is consumed by uncontrollable rage. Anything it hits also goes amok.
actors.buffs.wrathgrudge$vengeance.name=oath of vengeance
actors.buffs.wrathgrudge$vengeance.desc=Watching enemies fight fuels your thirst for vengeance. Bonus melee damage: _+%d_ (%d turns left)

###### Seven Sins: Pride ######
actors.hero.heroclass.pride=pride
actors.hero.heroclass.pride_desc_short=Bearer of the sin of _Pride_. Pride gains glory and grows _permanently stronger_ by _defeating enemies without taking a single hit_, but being hit shatters their dignity.
actors.hero.heroclass.pride_desc=Pride fights _from afar_. It starts with a _set of throwing knives_ and the _Crown of Hubris_, worn in an artifact slot. Growth stays if the crown is taken off, but its skills only work while it is worn. The crown spends _dignity_ to issue _Command_, _Duel_, _Procession_ and _Decree_.\n\nAny enemy that _hurts Pride_ becomes insolent. Defeating an enemy that isn't insolent grants _glory_, which raises thrown weapon damage, accuracy, max HP, armor and evasion without limit. While unhurt, Pride builds _dignity_ that boosts thrown weapon damage, but it shatters the moment they are hit. Up close Pride is clumsy: _melee attacks deal 30% less damage_. A _casting mold_ (alchemy) adds weapons to a thrown set for good.\n\nPride also carries a _rapier_ and knows _potions of healing_ and _scrolls of mirror image_.
actors.hero.heroclass.pride_unlock=Pride is unlocked from the start.
actors.hero.herosubclass.monarch=monarch
actors.hero.herosubclass.monarch_short_desc=The _Monarch's_ Command turns enemies at half health or less into _vassals_.
actors.hero.herosubclass.monarch_desc=The Monarch takes in those who kneel. Commanding an enemy at _half health or less_ makes it a loyal _vassal_ instead of stunning it. The Monarch can keep one vassal.\n\nWhen a vassal defeats an enemy that isn't insolent, the Monarch gains _half_ the glory. The Monarch's talents allow more vassals, subjugate healthier enemies, or empower vassals.
actors.hero.herosubclass.paragon=paragon
actors.hero.herosubclass.paragon_short_desc=The _Paragon_ deals _25%_ more damage and has _20%_ more evasion with no allies in sight, deals _25%_ more damage to enemies with more HP than them, and can raise an _effigy_ that draws enemies away.
actors.hero.herosubclass.paragon_desc=The Paragon needs no one's help. With no allies in sight, the Paragon deals _25%_ more damage and gains _20%_ evasion. The Paragon also deals _25%_ more damage to enemies whose current HP is higher than their own.\n\nThe Paragon's crown gains _Effigy of Pride_: a golden statue that draws every nearby enemy to attack it instead, so the Paragon can keep shooting alone. The statue doesn't count as an ally, and enemies that strike it don't become insolent.\n\nThe Paragon's talents strengthen fighting alone, deal more damage to stronger foes, or gain dignity from flawless victories.
actors.hero.talent.pride_vanity.title=vanity
actors.hero.talent.pride_vanity.desc=_+1:_ Glory gained is increased by _15%_.\n\n_+2:_ Glory gained is increased by _30%_.
actors.hero.talent.pride_composure.title=composure
actors.hero.talent.pride_composure.desc=Increases maximum dignity. (base 10)\n\n_+1:_ _13_\n\n_+2:_ _16_
actors.hero.talent.pride_poise.title=poise
actors.hero.talent.pride_poise.desc=Dignity builds faster. (base 1 per 3 turns)\n\n_+1:_ every _2.5 turns_\n\n_+2:_ every _2 turns_
actors.hero.talent.pride_grace.title=keeping face
actors.hero.talent.pride_grace.desc=Some dignity remains after being hit.\n\n_+1:_ keep _25%_\n\n_+2:_ keep _50%_
actors.hero.talent.pride_regalia.title=royal banquet
actors.hero.talent.pride_regalia.desc=Eating takes _1 turn_ instead of 3, and each meal builds dignity.\n\n_+1:_ _3_\n\n_+2:_ _6_
actors.hero.talent.pride_swift_crown.title=royal retrieval
actors.hero.talent.pride_swift_crown.desc=Thrown weapons sometimes fly straight back into your hand instead of falling to the ground.\n\n_+1:_ _25%_ chance\n\n_+2:_ _50%_ chance
pride.pridehooks.swift_return=Returned!
actors.hero.talent.pride_procession.title=triumphal march
actors.hero.talent.pride_procession.desc=Procession can move farther. (base 4 tiles)\n\n_+1:_ _5 tiles_\n\n_+2:_ _6 tiles_
actors.hero.talent.pride_decree.title=absolute decree
actors.hero.talent.pride_decree.desc=Decree nullifies more attacks. (base 1)\n\n_+1:_ _2_\n\n_+2:_ _3_
actors.hero.talent.pride_scorn.title=scorn
actors.hero.talent.pride_scorn.desc=Command stuns for longer. (base 3 turns)\n\n_+1:_ _4 turns_\n\n_+2:_ _5 turns_
actors.hero.talent.pride_majesty.title=majesty
actors.hero.talent.pride_majesty.desc=All stat bonuses from glory are increased, including glory already earned.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.pride_supremacy.title=supremacy
actors.hero.talent.pride_supremacy.desc=Flawless victories heal you.\n\n_+1:_ _3%_ of max HP\n\n_+2:_ _6%_\n\n_+3:_ _9%_
actors.hero.talent.monarch_court.title=royal court
actors.hero.talent.monarch_court.desc=Increases how many vassals you can keep. (base 1)\n\n_+1:_ _2_\n\n_+2:_ _3_\n\n_+3:_ _4_
actors.hero.talent.monarch_dominion.title=dominion
actors.hero.talent.monarch_dominion.desc=Healthier enemies can be made vassals. (base 50% HP or less)\n\n_+1:_ _60%_\n\n_+2:_ _70%_\n\n_+3:_ _80%_
actors.hero.talent.monarch_loyalty.title=loyalty
actors.hero.talent.monarch_loyalty.desc=Vassals deal more damage.\n\n_+1:_ _15%_\n\n_+2:_ _30%_\n\n_+3:_ _45%_
actors.hero.talent.paragon_solitude.title=aloofness
actors.hero.talent.paragon_solitude.desc=The damage bonus when alone is increased. (base 25%)\n\n_+1:_ _35%_\n\n_+2:_ _45%_\n\n_+3:_ _55%_
actors.hero.talent.paragon_giantslayer.title=giantslayer
actors.hero.talent.paragon_giantslayer.desc=The damage bonus against enemies with more HP is increased. (base 25%)\n\n_+1:_ _40%_\n\n_+2:_ _55%_\n\n_+3:_ _70%_
actors.hero.talent.paragon_legend.title=legend
actors.hero.talent.paragon_legend.desc=Flawless victories grant dignity.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_
actors.hero.talent.reign_reach.title=vast realm
actors.hero.talent.reign_reach.desc=Reign reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.reign_duration.title=eternal reign
actors.hero.talent.reign_duration.desc=Enemies kneeling to Reign stay stunned longer. (base 3 turns)\n\n_+1:_ _4 turns_\n\n_+2:_ _5 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _7 turns_
actors.hero.talent.reign_humble.title=humiliation
actors.hero.talent.reign_humble.desc=Enemies kneeling to Reign become _vulnerable_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.aegis_count.title=impregnable
actors.hero.talent.aegis_count.desc=Aegis blocks more attacks. (base 3)\n\n_+1:_ _4_\n\n_+2:_ _5_\n\n_+3:_ _6_\n\n_+4:_ _7_
actors.hero.talent.aegis_riposte.title=retribution
actors.hero.talent.aegis_riposte.desc=Blocking an adjacent enemy's attack with Aegis triggers a counterattack.\n\n_+1:_ _25%_ of your damage\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.aegis_dignity.title=unshaken dignity
actors.hero.talent.aegis_dignity.desc=Each attack blocked by Aegis builds dignity.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_\n\n_+4:_ _4_
actors.hero.talent.judge_power.title=divine punishment
actors.hero.talent.judge_power.desc=Judgement deals more damage.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.judge_dignity.title=dignified strike
actors.hero.talent.judge_dignity.desc=Judgement consumes all dignity to deal bonus damage per stack.\n\n_+1:_ _2_ per stack\n\n_+2:_ _4_\n\n_+3:_ _6_\n\n_+4:_ _8_
actors.hero.talent.judge_glory.title=divine glory
actors.hero.talent.judge_glory.desc=Killing a non-insolent enemy with Judgement grants extra glory.\n\n_+1:_ _50%_ extra\n\n_+2:_ _100%_\n\n_+3:_ _150%_\n\n_+4:_ _200%_
actors.hero.abilities.pride.reign.name=reign
actors.hero.abilities.pride.reign.short_desc=Makes _every visible enemy_ kneel.
actors.hero.abilities.pride.reign.desc=Every visible enemy within 4 tiles is stunned for _3 turns_. Bosses and minibosses do not kneel.
actors.hero.abilities.pride.aegis.name=aegis
actors.hero.abilities.pride.aegis.short_desc=Completely blocks the next _3 attacks_. Blocked attacks don't shatter dignity.
actors.hero.abilities.pride.aegis.desc=Surrounds you with an untouchable aura. The next _3 attacks_ you take deal no damage, and their attackers don't become insolent.
actors.hero.abilities.pride.judgement.name=judgement
actors.hero.abilities.pride.judgement.short_desc=Calls down a _bolt from above_ on one visible enemy. Stronger with more glory.
actors.hero.abilities.pride.judgement.desc=Deals heavy damage based on your level plus _50% of your glory_ to one enemy in sight, at any range.
actors.hero.abilities.pride.judgement.prompt=Choose an enemy to judge
actors.hero.abilities.pride.judgement.no_target=There is no one to judge there.
actors.buffs.prideglory.name=glory
actors.buffs.prideglory.desc_head=Glory points: _%d_\nDignity: _%d/%d_ (thrown weapon damage _+%d%%_)
actors.buffs.prideglory.desc_stats=Bonus thrown weapon damage: _+%d_\nAccuracy: _+%d%%_\nMax HP: _+%d_\nBonus armor: _0-%d_\nEvasion: _+%d%%_\n\nMelee attacks deal 30%% less damage.
actors.buffs.prideglory.shattered=dignity shattered
actors.buffs.prideglory.flawless=flawless
actors.buffs.prideglory.bow_given=Pride now fights from afar: you receive a set of throwing knives!
actors.mobs.npcs.prideeffigy.name=effigy of pride
actors.mobs.npcs.prideeffigy.desc=A golden statue of the Paragon in a heroic pose. Every enemy nearby can't help attacking it instead.\n\nIt crumbles in _%d turns_.
actors.buffs.prideglory$decree.name=decree
actors.buffs.prideglory$decree.desc=Bound by Pride's decree. Its next _%d_ attacks will be nullified.
actors.buffs.prideglory$decree.nullified=nullified
actors.buffs.prideglory$duel.name=duel
actors.buffs.prideglory$duel.desc=You are in a one-on-one duel. No one but your opponent can harm you, and you deal 20%% more damage to them.\n\nTurns remaining: %s
actors.buffs.prideglory$duel.interfere=dueling
actors.buffs.prideglory$aegis.name=aegis
actors.buffs.prideglory$aegis.desc=You are wrapped in an untouchable aura. It will block the next _%d_ attacks.
actors.buffs.prideglory$aegis.blocked=untouchable
actors.buffs.prideglory$vassal.name=vassal
actors.buffs.prideglory$vassal.desc=Knelt before Pride and swore loyalty. It now fights as an ally.

###### Seven Sins: Lust ######
actors.hero.heroclass.lust=lust
actors.hero.heroclass.lust_desc_short=Bearer of the sin of _Lust_. Lust dances past attacks to _charm_ enemies and _drinks the blood_ of the charmed to grow permanently stronger. The perfume's skills are paid for with _Lust's own HP_.
actors.hero.heroclass.lust_desc=Lust starts with the _Alluring Perfume_, worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn. Its skills cost _HP_ instead of charges: _Blood Kiss_, _Step_, _Drain_ and _Rapture_.\n\n_Enchanting dance:_ _dodging_ an enemy's attack charms that enemy.\n_Lifesteal:_ melee hits on charmed enemies steal _25%_ of the damage as HP. Stolen life becomes _desire_, which raises melee damage, accuracy, max HP, armor and evasion without limit.\n\nLust starts with a _dagger_ and knows _potions of healing_ and _scrolls of lullaby_.
actors.hero.heroclass.lust_unlock=Lust is unlocked from the start.

actors.hero.herosubclass.night_dancer=night dancer
actors.hero.herosubclass.night_dancer_short_desc=The _Night Dancer_ makes a _free counterattack_ every time they dodge an attack.
actors.hero.herosubclass.night_dancer_desc=The Night Dancer weaves between blades like a dance. Every dodged attack is answered with a _counterattack_ dealing _75%_ damage, with lifesteal and weapon effects.\n\nThe Night Dancer's talents strengthen counters, raise evasion, or heal on every dodge.
actors.hero.herosubclass.crimson_noble=crimson noble
actors.hero.herosubclass.crimson_noble_short_desc=The _Crimson Noble_ pays _half_ the HP for perfume skills, steals more life _the lower their HP_, and turns overflowing lifesteal into _shielding_.
actors.hero.herosubclass.crimson_noble_desc=The Crimson Noble knows how to handle blood. Perfume skills cost _half_ as much HP.\n\nLifesteal grows as HP drops, stealing _50%_ more at very low HP, and life stolen beyond max HP becomes _shielding_ at _half_ its value.\n\nThe Crimson Noble's talents strengthen the shield and low-HP lifesteal, or return part of the HP spent on skills as shielding.

actors.hero.talent.lust_yearning.title=yearning
actors.hero.talent.lust_yearning.desc=_+1:_ Gain _15%_ more desire.\n\n_+2:_ Gain _30%_ more desire.
actors.hero.talent.lust_linger.title=lingering scent
actors.hero.talent.lust_linger.desc=All charms last longer.\n\n_+1:_ _25%_ longer\n\n_+2:_ _50%_ longer
actors.hero.talent.lust_sweet.title=sweet blood
actors.hero.talent.lust_sweet.desc=Steal more life from charmed enemies. (base 25% of damage)\n\n_+1:_ _30%_\n\n_+2:_ _35%_
actors.hero.talent.lust_blush.title=heart flutter
actors.hero.talent.lust_blush.desc=Deal more damage to charmed enemies.\n\n_+1:_ _10%_ more\n\n_+2:_ _20%_ more
actors.hero.talent.lust_bottle.title=blood-warming meal
actors.hero.talent.lust_bottle.desc=Eating takes _1 turn_ instead of 3, and each meal restores HP.\n\n_+1:_ _10%_ of max HP\n\n_+2:_ _20%_ of max HP
actors.hero.talent.lust_refill.title=distant lips
actors.hero.talent.lust_refill.desc=Blood Kiss reaches farther. (base 3 tiles)\n\n_+1:_ _4 tiles_\n\n_+2:_ _5 tiles_
actors.hero.talent.lust_waft.title=light steps
actors.hero.talent.lust_waft.desc=Step lasts longer. (base 5 turns)\n\n_+1:_ _7 turns_\n\n_+2:_ _9 turns_
actors.hero.talent.lust_thirst.title=thirst
actors.hero.talent.lust_thirst.desc=Drain steals more life.\n\n_+1:_ _25%_ more\n\n_+2:_ _50%_ more
actors.hero.talent.lust_embrace.title=deep kiss
actors.hero.talent.lust_embrace.desc=Blood Kiss charms for longer. (base 3 turns)\n\n_+1:_ _5 turns_\n\n_+2:_ _7 turns_
actors.hero.talent.lust_obsession.title=obsession
actors.hero.talent.lust_obsession.desc=All stat bonuses from desire are increased, including desire already gained.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.lust_heartstrings.title=heartstrings
actors.hero.talent.lust_heartstrings.desc=The enchanting dance (charm on dodge) lasts longer. (base 2 turns)\n\n_+1:_ _3 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _5 turns_
actors.hero.talent.dancer_counter.title=blade dance
actors.hero.talent.dancer_counter.desc=Counterattacks deal more damage. (base 75%)\n\n_+1:_ _90%_\n\n_+2:_ _105%_\n\n_+3:_ _120%_
actors.hero.talent.dancer_grace.title=grace
actors.hero.talent.dancer_grace.desc=Evasion is increased.\n\n_+1:_ _4%_\n\n_+2:_ _8%_\n\n_+3:_ _12%_
actors.hero.talent.dancer_tempo.title=tempo
actors.hero.talent.dancer_tempo.desc=Heal every time you dodge.\n\n_+1:_ _2 + level/10_\n\n_+2:_ _4 + level/10_\n\n_+3:_ _6 + level/10_
actors.hero.talent.noble_blood.title=noble blood
actors.hero.talent.noble_blood.desc=Overflowing lifesteal makes a bigger shield. (base 50%)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_
actors.hero.talent.noble_thirst.title=crimson thirst
actors.hero.talent.noble_thirst.desc=The low-HP lifesteal bonus is larger. (base 50% at very low HP)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_
actors.hero.talent.noble_price.title=noble's price
actors.hero.talent.noble_price.desc=Part of the HP spent on perfume skills returns as shielding.\n\n_+1:_ _20%_\n\n_+2:_ _40%_\n\n_+3:_ _60%_
actors.hero.talent.dance_reach.title=grand stage
actors.hero.talent.dance_reach.desc=Enchanting Dance reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.dance_encore.title=encore
actors.hero.talent.dance_encore.desc=Charms from Enchanting Dance last longer. (base 6 turns)\n\n_+1:_ _8 turns_\n\n_+2:_ _10 turns_\n\n_+3:_ _12 turns_\n\n_+4:_ _14 turns_
actors.hero.talent.dance_daze.title=dizzying
actors.hero.talent.dance_daze.desc=Enemies who watch Enchanting Dance suffer _vertigo_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.pact_shield.title=blood shield
actors.hero.talent.pact_shield.desc=Blood Pact's shield is larger. (base 150% of the HP offered)\n\n_+1:_ _175%_\n\n_+2:_ _200%_\n\n_+3:_ _225%_\n\n_+4:_ _250%_
actors.hero.talent.pact_duration.title=long contract
actors.hero.talent.pact_duration.desc=Blood Pact's lifesteal lasts longer. (base 10 turns)\n\n_+1:_ _13 turns_\n\n_+2:_ _16 turns_\n\n_+3:_ _19 turns_\n\n_+4:_ _22 turns_
actors.hero.talent.pact_thirst.title=gluttonous pact
actors.hero.talent.pact_thirst.desc=Steal more life during Blood Pact. (base 25% of damage)\n\n_+1:_ _35%_\n\n_+2:_ _45%_\n\n_+3:_ _55%_\n\n_+4:_ _65%_
actors.hero.talent.macabre_count.title=endless dance
actors.hero.talent.macabre_count.desc=Danse Macabre strikes more enemies. (base 3)\n\n_+1:_ _4_\n\n_+2:_ _5_\n\n_+3:_ _6_\n\n_+4:_ _7_
actors.hero.talent.macabre_power.title=last dance
actors.hero.talent.macabre_power.desc=Danse Macabre deals more damage.\n\n_+1:_ _15%_ more\n\n_+2:_ _30%_ more\n\n_+3:_ _45%_ more\n\n_+4:_ _60%_ more
actors.hero.talent.macabre_charm.title=charming blade
actors.hero.talent.macabre_charm.desc=Enemies that survive Danse Macabre are charmed.\n\n_+1:_ _1 turn_\n\n_+2:_ _2 turns_\n\n_+3:_ _3 turns_\n\n_+4:_ _4 turns_

actors.hero.abilities.lust.enchantingdance.name=grand stage
actors.hero.abilities.lust.enchantingdance.short_desc=Charms _every visible enemy_.
actors.hero.abilities.lust.enchantingdance.desc=Charms every visible enemy within 4 tiles for _6 turns_. Charm duration talents also apply. Bosses can't be charmed.
actors.hero.abilities.lust.bloodpact.name=blood pact
actors.hero.abilities.lust.bloodpact.short_desc=Offer _30%_ of max HP for a _big shield_ and _strong lifesteal_.
actors.hero.abilities.lust.bloodpact.desc=Offers _30%_ of max HP (this can't kill you). Gain shielding equal to _150%_ of the HP offered, and for _10 turns_ every melee hit steals an extra _25%_ of its damage.
actors.hero.abilities.lust.dansemacabre.name=danse macabre
actors.hero.abilities.lust.dansemacabre.short_desc=_Teleports between_ visible enemies, striking each in turn.
actors.hero.abilities.lust.dansemacabre.desc=Teleports to the _3_ nearest visible enemies within 6 tiles one after another, striking each with an attack that always hits. Lifesteal and weapon effects apply.
actors.hero.abilities.lust.dansemacabre.no_targets=There's no one in sight to dance with.

actors.buffs.lustdesire.name=desire
actors.buffs.lustdesire.desc_head=Desire: _%d_\n\nMelee hits on charmed enemies steal life, and dodging an attack charms the attacker.
actors.buffs.lustdesire.desc_stats=Bonus weapon damage (melee & thrown): _+%d_\nAccuracy: _+%d%%_\nMax HP: _+%d_\nBonus armor: _0-%d_\nEvasion: _+%d%%_
actors.buffs.lustdesire$sway.name=step
actors.buffs.lustdesire$sway.desc=Light footwork turns attacks aside. Evasion is greatly increased.\n\nTurns remaining: %s
actors.buffs.lustdesire$rapture.name=rapture
actors.buffs.lustdesire$rapture.desc=Drunk on the taste of blood. Every melee hit steals 25%% of its damage.\n\nTurns remaining: %s
actors.buffs.lustdesire$bloodpact.name=blood pact
actors.buffs.lustdesire$bloodpact.desc=A pact sealed in blood. Every melee hit steals life fiercely.\n\nTurns remaining: %s

###### Seven Sins: Envy ######
actors.hero.heroclass.envy=envy
actors.hero.heroclass.envy_desc_short=Bearer of the sin of _Envy_. Envy's own power is meagre, but it _copies other sins' skills and monster abilities_ and even imitates how others grow.
actors.hero.heroclass.envy_desc=Envy starts with the _Mirror of Envy_, worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn.\n\nEnvy has no skills of its own. Each level up lets it copy one of _another sin's skills_, and registering rare variants, quest monsters and bosses in the _bestiary_ lets it copy that _monster's ability_ too. Copies go into the mirror's slots and are paid for with a very slowly filling _jealousy gauge_, which fills twice as fast while a strong enemy is in sight.\n\nEnvy's own growth is meagre: it only gains envy when it registers a new monster in the bestiary. Instead it can _imitate another sin's way of growing_ at half efficiency.\n\nEnvy starts with a _worn shortsword_ and knows _potions of healing_ and _scrolls of transmutation_.
actors.hero.heroclass.envy_unlock=Envy is unlocked from the start.
actors.hero.herosubclass.usurper=doppelganger
actors.hero.herosubclass.usurper_short_desc=The _Doppelganger_ imitates _two_ sins' growth at once and uses copied sin skills for _25%_ less.
actors.hero.herosubclass.usurper_desc=The Doppelganger wears others' shapes whole. It can imitate up to _two_ sins' growth, the second at half efficiency, and copied sin skills cost _25%_ less jealousy.\n\nIts talents raise the second growth's efficiency, make sin skills cheaper still, or grant envy whenever a sin skill is used.
actors.hero.herosubclass.copycat=copycat
actors.hero.herosubclass.copycat_short_desc=The _Copycat_ doubles every bestiary trait and can hold _one more_ copied skill.
actors.hero.herosubclass.copycat_desc=The Copycat copies what it sees, only better. Every bestiary trait is _doubled_, and the mirror gains _1_ more slot.\n\nIts talents strengthen bestiary traits, power up copied monster abilities, or grant more envy for defeating kinds already registered.
actors.hero.talent.envy_covet.title=covetous
actors.hero.talent.envy_covet.desc=_+1:_ Envy gained is increased by _15%_.\n\n_+2:_ Envy gained is increased by _30%_.
actors.hero.talent.envy_grasp.title=grasping
actors.hero.talent.envy_grasp.desc=Defeating a kind of monster listed in the bestiary fills the jealousy gauge.\n\n_+1:_ _10_\n\n_+2:_ _20_
actors.hero.talent.envy_petty.title=petty
actors.hero.talent.envy_petty.desc=After using a copied skill, your next melee hit within _10 turns_ deals more damage.\n\n_+1:_ _15%_\n\n_+2:_ _30%_
actors.hero.talent.envy_snatch.title=covetous eye
actors.hero.talent.envy_snatch.desc=The jealousy gauge fills even faster while a strong enemy is in sight. (2x by default)\n\n_+1:_ _2.5x_\n\n_+2:_ _3x_
actors.hero.talent.envy_mirror.title=someone else's meal
actors.hero.talent.envy_mirror.desc=Eating takes _1 turn_ instead of 3, and each meal fills the jealousy gauge.\n\n_+1:_ _15_\n\n_+2:_ _30_
actors.hero.talent.envy_polish.title=wide mirror
actors.hero.talent.envy_polish.desc=Raises the jealousy gauge's maximum. (100 by default)\n\n_+1:_ _+25_\n\n_+2:_ _+50_
actors.hero.talent.envy_switch.title=practiced imitation
actors.hero.talent.envy_switch.desc=Imitated growth becomes more efficient. (50% by default)\n\n_+1:_ _65%_\n\n_+2:_ _80%_
actors.hero.talent.envy_level.title=cheap knockoff
actors.hero.talent.envy_level.desc=Copied skills cost less jealousy.\n\n_+1:_ _10%_ less\n\n_+2:_ _20%_ less
actors.hero.talent.envy_resent.title=resentment
actors.hero.talent.envy_resent.desc=Getting hit fills the jealousy gauge.\n\n_+1:_ _1_\n\n_+2:_ _2_
actors.hero.talent.envy_jealousy.title=jealousy
actors.hero.talent.envy_jealousy.desc=All stat bonuses from envy are increased, including envy already earned.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.envy_trophy.title=trophies
actors.hero.talent.envy_trophy.desc=Each registered bestiary monster increases max HP.\n\n_+1:_ _+2_ each\n\n_+2:_ _+4_\n\n_+3:_ _+6_
actors.hero.talent.usurp_tyranny.title=perfect disguise
actors.hero.talent.usurp_tyranny.desc=The second imitated growth becomes more efficient. (50% of your growth efficiency by default)\n\n_+1:_ _65%_\n\n_+2:_ _80%_\n\n_+3:_ _95%_
actors.hero.talent.usurp_drain.title=familiar hands
actors.hero.talent.usurp_drain.desc=Copied sin skills cost even less.\n\n_+1:_ _30%_ less in total\n\n_+2:_ _35%_ less\n\n_+3:_ _40%_ less
actors.hero.talent.usurp_crown.title=borrowed strength
actors.hero.talent.usurp_crown.desc=Gain envy every time you use a copied sin skill.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_
actors.hero.talent.copy_study.title=observation
actors.hero.talent.copy_study.desc=Bestiary abilities are even stronger. (base 2x)\n\n_+1:_ _2.25x_\n\n_+2:_ _2.5x_\n\n_+3:_ _2.75x_
actors.hero.talent.copy_mask.title=mask
actors.hero.talent.copy_mask.desc=Copied monster abilities are more powerful.\n\n_+1:_ _20%_\n\n_+2:_ _40%_\n\n_+3:_ _60%_
actors.hero.talent.copy_echo.title=review
actors.hero.talent.copy_echo.desc=Defeating a kind already in the bestiary grants part of the envy you got for registering it.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_
actors.hero.talent.plunder_reach.title=raiding party
actors.hero.talent.plunder_reach.desc=Plunder reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.plunder_stacks.title=clean sweep
actors.hero.talent.plunder_stacks.desc=Plunder grants more jealousy per enemy. (5 by default)\n\n_+1:_ _7.5_\n\n_+2:_ _10_\n\n_+3:_ _12.5_\n\n_+4:_ _15_
actors.hero.talent.plunder_spoils.title=spoils
actors.hero.talent.plunder_spoils.desc=Each enemy hit by Plunder grants envy.\n\n_+1:_ _0.5_\n\n_+2:_ _1_\n\n_+3:_ _1.5_\n\n_+4:_ _2_
actors.hero.talent.trans_amplify.title=amplify
actors.hero.talent.trans_amplify.desc=Debuffs passed on by Transference last longer.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.trans_heal.title=relief
actors.hero.talent.trans_heal.desc=Using Transference heals you.\n\n_+1:_ _5%_ of max HP\n\n_+2:_ _10%_\n\n_+3:_ _15%_\n\n_+4:_ _20%_
actors.hero.talent.trans_weaken.title=passing the curse
actors.hero.talent.trans_weaken.desc=Transference's target is also _weakened_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.fall_power.title=plummet
actors.hero.talent.fall_power.desc=Downfall closes more of the health gap. (base 50%)\n\n_+1:_ _62%_\n\n_+2:_ _75%_\n\n_+3:_ _87%_\n\n_+4:_ _100%_
actors.hero.talent.fall_reach.title=enemy of all
actors.hero.talent.fall_reach.desc=Downfall reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.fall_rob.title=penniless
actors.hero.talent.fall_rob.desc=Each enemy hit by Downfall fills the jealousy gauge.\n\n_+1:_ _3_\n\n_+2:_ _6_\n\n_+3:_ _9_\n\n_+4:_ _12_
actors.hero.abilities.envy.plunder.name=plunder
actors.hero.abilities.envy.plunder.short_desc=Drain jealousy from _every visible enemy_, damaging them and filling your gauge.
actors.hero.abilities.envy.plunder.desc=Deal level-based damage to every visible enemy within 4 tiles and weaken them for _5 turns_. Each enemy hit fills the jealousy gauge by _5_.
actors.hero.abilities.envy.transference.name=transference
actors.hero.abilities.envy.transference.short_desc=Passes all your _harmful effects_ onto one enemy.
actors.hero.abilities.envy.transference.desc=Choose an enemy in sight. All harmful effects on you are removed, and those with a duration are moved onto that enemy as they were. Hunger is not transferred.
actors.hero.abilities.envy.transference.prompt=Choose an enemy to pass your misfortune to
actors.hero.abilities.envy.transference.no_target=There is no target there.
actors.hero.abilities.envy.transference.moved=Passed on %d harmful effects.
actors.hero.abilities.envy.downfall.name=downfall
actors.hero.abilities.envy.downfall.short_desc=Drags _healthier enemies'_ health down to your level.
actors.hero.abilities.envy.downfall.desc=Every visible enemy within 4 tiles with a higher health ratio than yours takes damage equal to _50% of the gap_. Bosses take half. This damage can't kill.
