actors.buffs.gluttondebt.name=hunger debt
actors.buffs.gluttondebt.desc=Heavy rumination ate more than your stomach held. Until the debt is repaid, you are weakened, vulnerable and hexed, and every bit of satiety you gain goes to the debt first.\n\nDebt remaining: _%d satiety_
actors.buffs.gluttondebt.repaid=You have finally paid back your stomach.
actors.buffs.gluttondebt.repaid_status=Repaid!
actors.buffs.predatorstomach.converted=Your stomach turns the harmful power into your own!
