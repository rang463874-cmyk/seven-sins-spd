###### Seven Sins: Elites ######
elites.sinelite.name=%s elite
elites.sinelite.mob_name=%1$s %2$s
elites.sinelite.prefix_0=gluttonous
elites.sinelite.prefix_1=greedy
elites.sinelite.prefix_2=wrathful
elites.sinelite.prefix_3=proud
elites.sinelite.prefix_4=lustful
elites.sinelite.prefix_5=envious
elites.sinelite.prefix_6=slothful
elites.sinelite.desc_0=Possessed by _gluttony_. Its hits steal your satiety and heal it, and it shrugs off a little of every blow.
elites.sinelite.desc_1=Possessed by _greed_. Every hit steals some of your gold, and it is a little keener than its kind. Kill it to get back twice what it took.
elites.sinelite.desc_2=Possessed by _wrath_. It hits harder the more it is hurt, and when it spots you it riles up the monsters around it.
elites.sinelite.desc_3=Possessed by _pride_. A barrier of pride (20% of its health) returns whenever it goes 4 turns without being hit.
elites.sinelite.desc_4=Possessed by _lust_. Its hits drink a little of your life and may charm you.
elites.sinelite.desc_5=Possessed by _envy_. It is much keener than its kind, and its hits strip one of your positive effects.
elites.sinelite.desc_6=Possessed by _sloth_. It is found asleep, but once woken it moves and strikes in a frenzy for a while.
elites.sinelite.desc_common=Sin elites have 50% more health, give double experience and drop a _sin essence_. Slaying an elite of your own sin also feeds your sin.
elites.sinelite.greed_steal=It snatched %d gold from you!
elites.sinelite.wrath_roar=Roar!
elites.sinelite.pride_shield=Pride!
elites.sinelite.envy_steal=Mine!
elites.sinelite.sloth_wake=Frenzy!
elites.sinelite.own_sin=Devouring the %s sin feeds your own.
actors.mobs.elites.regionelite.skill_kill=Killed by the %s...
actors.mobs.elites.ratchieftain.name=rat chieftain
actors.mobs.elites.ratchieftain.desc=A huge, scarred rat that rules the sewers. It squeals for its brood and rushes in straight lines, and its bites leave bleeding wounds.\n\nIts techniques are marked on the ground a moment before they land.
actors.mobs.elites.ratchieftain.notice=Skreeee!
actors.mobs.elites.ratchieftain.skill_squeal=Squeal!
actors.mobs.elites.ratchieftain.skill_rush=Rush!
actors.mobs.elites.chainwarden.name=escaped chief jailer
actors.mobs.elites.chainwarden.desc=The prison's chief jailer, who broke his own chains. He hurls a chain down a marked line to drag his prey close, and slams the ground around himself.\n\nHis techniques are marked on the ground a moment before they land.
actors.mobs.elites.chainwarden.notice=Back in your cell, prisoner!
actors.mobs.elites.chainwarden.skill_chain=Chain!
actors.mobs.elites.chainwarden.skill_slam=Slam!
actors.mobs.elites.gnollforeman.name=gnoll foreman
actors.mobs.elites.gnollforeman.desc=The overseer of the gnoll mines, armed with a satchel of bombs. He lobs clusters of bombs at marked tiles and brings the ceiling down on intruders.\n\nHis techniques are marked on the ground a moment before they land.
actors.mobs.elites.gnollforeman.notice=Intruder! Fire in the hole!
actors.mobs.elites.gnollforeman.skill_bomb=Bomb!
actors.mobs.elites.gnollforeman.skill_cavein=Cave-in!
actors.mobs.elites.fallenpriest.name=fallen priest
actors.mobs.elites.fallenpriest.desc=A priest of the dwarven city who now serves the demons. He blesses every monster around him and curses the ground in an X through his foes.\n\nHis curses are marked on the ground a moment before they land.
actors.mobs.elites.fallenpriest.notice=Kneel before the new gods!
actors.mobs.elites.fallenpriest.skill_bless=Blessing!
actors.mobs.elites.fallenpriest.skill_curse=Curse!
actors.mobs.elites.hellhound.name=hellhound
actors.mobs.elites.hellhound.desc=One of a pair of demonic hounds that hunt the halls together. It pounces onto marked ground and breathes fire down marked lines. If its twin falls, it flies into a rage.\n\nIts techniques are marked on the ground a moment before they land.
actors.mobs.elites.hellhound.desc_enraged=_Enraged:_ its twin is dead. It hits 50% harder and attacks faster.
actors.mobs.elites.hellhound.notice=Grrrrr...
actors.mobs.elites.hellhound.skill_pounce=Pounce!
actors.mobs.elites.hellhound.skill_breath=Hellfire!
actors.mobs.elites.hellhound.enraged=Enraged!
actors.mobs.elites.hellhound.yell_enraged=AWOOOOOOO!

###### Seven Sins: Demons ######
demons.demonlord.lucifer_name=Lucifer
demons.demonlord.lucifer_title=Lucifer, demon lord of pride
demons.demonlord.lucifer_desc=A tall figure of white marble and gold, wings folded like a mantle. The fallen morning star looks down on everything, including you.
demons.demonlord.lucifer_boss_desc=The morning star has shed its mask of courtesy. Its light blinds, and its star falls wherever the ground glows.
demons.demonlord.lucifer_trial=Your _max HP is reduced by 25%_.
demons.demonlord.lucifer_perk=While your HP is at _75% or more_, you deal _+20% damage_.
demons.demonlord.lucifer_skill_name=Morning Star
demons.demonlord.lucifer_skill_desc=A star falls on a 3x3 area you choose, dealing heavy damage and _blinding_ survivors for 5 turns.
demons.demonlord.lucifer_altar="Kneel? No. I would not ask that of you... yet. Carry a lighter life to the prison's warden, and prove you are worth looking at."
demons.demonlord.lucifer_altar_own="Ah... my own reflection crawls out of the sewers. Pride recognizes pride. Show me you deserve to stand beside me, child of the crown."
demons.demonlord.lucifer_accepted=Lucifer's gaze settles on you. Your body feels fragile.
demons.demonlord.lucifer_accepted_own=Lucifer smiles. "Do not disappoint me. I despise disappointment above all."
demons.demonlord.lucifer_judge="You endured. Barely, but you did. Take my seal, and let the light of the morning star walk before you."
demons.demonlord.lucifer_judge_own="Splendid. Not a single bowed head on your way here, I trust? Take the seal. We are the only ones worthy of it."
demons.demonlord.lucifer_challenge="And now you look at me as if you could reach my height. Would you like to try?"
demons.demonlord.lucifer_challenge_own="Of course you want my throne. I would think less of you if you didn't. Come, then."
demons.demonlord.lucifer_wait="Take your time. Stars are patient."
demons.demonlord.lucifer_wait_own="Hesitation? How unbecoming of us."
demons.demonlord.lucifer_boss_notice=Behold the light you will never reach!
demons.demonlord.lucifer_boss_notice_own=Only one of us may wear the crown!
demons.demonlord.lucifer_boss_enrage=You dare wound ME?!
demons.demonlord.lucifer_boss_enrage_own=Yes... that is the arrogance I wanted to see!
demons.demonlord.lucifer_boss_death=Even a fallen star... burns brightest at the end...
demons.demonlord.lucifer_boss_death_own=Wear it well... my heir...
demons.demonlord.mammon_name=Mammon
demons.demonlord.mammon_title=Mammon, demon lord of greed
demons.demonlord.mammon_desc=A hulking golem of molten gold and coins, every movement jingling. Its eyes gleam like two freshly minted pieces.
demons.demonlord.mammon_boss_desc=Mammon wants everything back, with interest. Its blows can knock the gold straight out of your purse.
demons.demonlord.mammon_trial=All _gold you pick up is halved_.
demons.demonlord.mammon_perk=All _gold you pick up is increased by 30%_.
demons.demonlord.mammon_skill_name=Midas Touch
demons.demonlord.mammon_skill_desc=Touches an enemy you can see: an ordinary monster _turns to gold_ at once. Bosses and elites instead lose _15% of their max HP_.
demons.demonlord.mammon_altar="A deal, a deal! I take half of every coin you find until the prison's warden falls. Then I pay you back. Generously!"
demons.demonlord.mammon_altar_own="Hoho! I can smell a fellow collector. You know the value of a coin. A partnership, then? Fifty-fifty... for now."
demons.demonlord.mammon_accepted=Coins jingle from nowhere. Half of your future gold now belongs to Mammon.
demons.demonlord.mammon_accepted_own=Mammon rubs its golden hands together. "Pleasure doing business, partner."
demons.demonlord.mammon_judge="Debt paid, contract honoured! Here, the seal of Midas, and a little extra in every purse you find from now on."
demons.demonlord.mammon_judge_own="Not a single coin wasted, I see. Beautiful bookkeeping! Take the seal, partner, and make us both richer."
demons.demonlord.mammon_challenge="Hm? You want to rob me? Everything I own came from someone like you. Come and try to take it back."
demons.demonlord.mammon_challenge_own="A hostile takeover! Oh, I'm almost proud. Almost."
demons.demonlord.mammon_wait="Come back when you can afford it."
demons.demonlord.mammon_wait_own="Smart. Never bet before checking the books."
demons.demonlord.mammon_boss_notice=Everything you have is MINE!
demons.demonlord.mammon_boss_notice_own=Let's settle the accounts, partner!
demons.demonlord.mammon_boss_enrage=My gold! You're scratching my gold!
demons.demonlord.mammon_boss_enrage_own=Fine! No more discounts!
demons.demonlord.mammon_boss_death=Keep... the change...
demons.demonlord.mammon_boss_death_own=A fine... return on investment...
demons.demonlord.asmodeus_name=Asmodeus
demons.demonlord.asmodeus_title=Asmodeus, demon lord of lust
demons.demonlord.asmodeus_desc=A figure of impossible grace, wrapped in crimson silk and a heady scent. It is hard to look away, and harder to remember why you should.
demons.demonlord.asmodeus_boss_desc=Asmodeus dances between its marks. Whoever is caught in them is charmed and drained.
demons.demonlord.asmodeus_trial=Your _natural regeneration stops_.
demons.demonlord.asmodeus_perk=Your attacks _drain 10% of the damage_ dealt as healing.
demons.demonlord.asmodeus_skill_name=Allure
demons.demonlord.asmodeus_skill_desc=Every enemy in sight is _charmed_ for 6 turns.
demons.demonlord.asmodeus_altar="Such a lovely, warm body... let me taste a little of it. No healing until the prison's warden falls, darling. Desire grows sweeter when it starves."
demons.demonlord.asmodeus_altar_own="Oh my, oh my... you smell exactly like me. Did you come all this way just to dance with me? I'm flattered."
demons.demonlord.asmodeus_accepted=A sweet scent clings to you. Your wounds no longer close on their own.
demons.demonlord.asmodeus_accepted_own=Asmodeus blows you a kiss. "Don't die before our next dance."
demons.demonlord.asmodeus_judge="You held on, all thirsty and trembling. How adorable. Here, my seal, and a little of my thirst."
demons.demonlord.asmodeus_judge_own="Every step of it was a dance, wasn't it? Take my seal, my dear. The whole dungeon will fall for you."
demons.demonlord.asmodeus_challenge="You want me? Everyone does. But you'll have to catch me first."
demons.demonlord.asmodeus_challenge_own="A duel of hearts? How romantic. Let's see who charms whom."
demons.demonlord.asmodeus_wait="I'll be waiting, darling."
demons.demonlord.asmodeus_wait_own="Playing hard to get? I love it."
demons.demonlord.asmodeus_boss_notice=Come closer... closer...
demons.demonlord.asmodeus_boss_notice_own=Shall we dance, my mirror?
demons.demonlord.asmodeus_boss_enrage=You'll pay for that with your blood!
demons.demonlord.asmodeus_boss_enrage_own=Oh, you play rough! I like that!
demons.demonlord.asmodeus_boss_death=What a... beautiful end...
demons.demonlord.asmodeus_boss_death_own=Keep dancing... for me...
demons.demonlord.leviathan_name=Leviathan
demons.demonlord.leviathan_title=Leviathan, demon lord of envy
demons.demonlord.leviathan_desc=A coiling serpent of ice-cold water, scales flickering in every colour it has ever coveted. Its eyes never stop measuring what you have.
demons.demonlord.leviathan_boss_desc=Leviathan has risen along a whole wall of the arena. Its body is part of the fight: strike any coil and you strike the serpent itself. It never moves, but its _Great Wave_ floods every lane but one or two (stand in a safe lane), its _Undertow_ drags you back to the wall, and its _Bite_ tears at whatever stands in front of its head.
demons.demonlord.leviathan_trial=Your _accuracy and evasion are reduced by 20%_.
demons.demonlord.leviathan_perk=_20% of the damage_ enemies deal to you is _thrown back_ at them.
demons.demonlord.leviathan_skill_name=Tidal Wave
demons.demonlord.leviathan_skill_desc=A wave rolls up to 6 tiles in a line, damaging and _knocking back_ every enemy in it.
demons.demonlord.leviathan_altar="You have so much... eyes, hands, a future. I'll borrow a little of your sharpness until the prison's warden falls. Don't look at me like that."
demons.demonlord.leviathan_altar_own="...You. You copy everything too, don't you? I hate you. I want to be you. Prove you deserve to be envied."
demons.demonlord.leviathan_accepted=Cold water seeps into your joints. Your movements feel dull.
demons.demonlord.leviathan_accepted_own=Leviathan hisses. "If you fail, I'll take everything you have."
demons.demonlord.leviathan_judge="...Hmph. You made it. I'm jealous. Take the seal. Let them feel what it is to have what's theirs thrown back."
demons.demonlord.leviathan_judge_own="You even copied my patience. Infuriating. Wonderful. Take it, and make everyone else envy us."
demons.demonlord.leviathan_challenge="Now you want my power too? Of course you do. Everybody wants what I have."
demons.demonlord.leviathan_challenge_own="Copy this, then. If you can."
demons.demonlord.leviathan_wait="Run. I'll still be watching."
demons.demonlord.leviathan_wait_own="Afraid I'm better? I am."
demons.demonlord.leviathan_boss_notice=Everything you have should have been MINE!
demons.demonlord.leviathan_boss_notice_own=There can only be one original!
demons.demonlord.leviathan_boss_enrage=Drown! Drown in it!
demons.demonlord.leviathan_boss_enrage_own=Stop imitating me!
demons.demonlord.leviathan_boss_death=Why... is it always... someone else...
demons.demonlord.leviathan_boss_death_own=Now... I envy you... most of all...
demons.demonlord.beelzebub_name=Beelzebub
demons.demonlord.beelzebub_title=Beelzebub, demon lord of gluttony
demons.demonlord.beelzebub_desc=The lord of flies: a bloated, armoured thing crawling with buzzing swarms. The air around it tastes of rot and honey.
demons.demonlord.beelzebub_boss_desc=Beelzebub never fights alone. Its swarm keeps growing for as long as it lives.
demons.demonlord.beelzebub_trial=You get _hungry twice as fast_.
demons.demonlord.beelzebub_perk=Eating food _heals 25% of your max HP_.
demons.demonlord.beelzebub_skill_name=Swarm
demons.demonlord.beelzebub_skill_desc=Summons _3 demon flies_ that fight for you for 30 turns.
demons.demonlord.beelzebub_altar="Hungry? Not yet. You will be. Twice as hungry until the prison's warden falls. Hunger is the truest prayer."
demons.demonlord.beelzebub_altar_own="Bzzz... a stomach without a bottom. I can hear it growling from here. You and I are going to get along, little maw."
demons.demonlord.beelzebub_accepted=A fly lands on your tongue. Your stomach starts growling.
demons.demonlord.beelzebub_accepted_own=Beelzebub's swarm buzzes approvingly. "Eat everything. Leave nothing."
demons.demonlord.beelzebub_judge="You starved and you didn't die. Good. Now every meal will mend you, and my flies will follow you."
demons.demonlord.beelzebub_judge_own="You ate your way here, didn't you? Splendid appetite! Take my seal, and never stop chewing."
demons.demonlord.beelzebub_challenge="You look... delicious. Do you want to fight, or do you want to be dinner? Same thing to me."
demons.demonlord.beelzebub_challenge_own="Who eats whom? Let's find out!"
demons.demonlord.beelzebub_wait="Go. Fatten up."
demons.demonlord.beelzebub_wait_own="Hungry for something else first? Understandable."
demons.demonlord.beelzebub_boss_notice=The feast begins!
demons.demonlord.beelzebub_boss_notice_own=Only one stomach can rule this dungeon!
demons.demonlord.beelzebub_boss_enrage=MORE! I need MORE!
demons.demonlord.beelzebub_boss_enrage_own=You bite well! Now I bite back!
demons.demonlord.beelzebub_boss_death=Still... hungry...
demons.demonlord.beelzebub_boss_death_own=Eat me... and grow...
demons.demonlord.satan_name=Satan
demons.demonlord.satan_title=Satan, demon lord of wrath
demons.demonlord.satan_desc=A robed figure wreathed in hellfire, horns blackened by smoke. The floor smoulders wherever it stands.
demons.demonlord.satan_boss_desc=Satan's fury spills out as hellfire around it. Don't stand close when the ground is marked.
demons.demonlord.satan_trial=You take _25% more damage_ from enemies.
demons.demonlord.satan_perk=You deal _+3% damage for every 10% of HP missing_.
demons.demonlord.satan_skill_name=Hellfire
demons.demonlord.satan_skill_desc=Hellfire erupts around you to 2 tiles, damaging enemies and _setting them on fire_.
demons.demonlord.satan_altar="Every blow will hurt more until the prison's warden falls. Let it. Pain is fuel. Burn with it, and come back angrier."
demons.demonlord.satan_altar_own="I can feel it... the drum in your chest, beating for war. Good. Let the world hurt you more, and hit back harder."
demons.demonlord.satan_accepted=Embers sink into your skin. Every wound will burn hotter.
demons.demonlord.satan_accepted_own=Satan roars with laughter. "Bleed, and rage!"
demons.demonlord.satan_judge="You bled and kept walking. That is wrath. Take my seal; the closer you are to death, the harder you will strike."
demons.demonlord.satan_judge_own="Still angry? GOOD. Never let that fire go out. Take the seal and burn them all."
demons.demonlord.satan_challenge="You want to fight me? Finally, someone with a spine. Come!"
demons.demonlord.satan_challenge_own="Rage against rage! This will be glorious!"
demons.demonlord.satan_wait="Coward. Come back when your blood boils."
demons.demonlord.satan_wait_own="Let the anger build. I'll wait."
demons.demonlord.satan_boss_notice=BURN!
demons.demonlord.satan_boss_notice_own=Show me your fury!
demons.demonlord.satan_boss_enrage=Now I'm ANGRY!
demons.demonlord.satan_boss_enrage_own=YES! MORE!
demons.demonlord.satan_boss_death=The fire... never dies...
demons.demonlord.satan_boss_death_own=Carry... my flame...
demons.demonlord.belphegor_name=Belphegor
demons.demonlord.belphegor_title=Belphegor, demon lord of sloth
demons.demonlord.belphegor_desc=A massive horned brute slumped on an invisible throne, yawning. It looks as though it might fall asleep in the middle of a sentence.
demons.demonlord.belphegor_boss_desc=Belphegor barely moves, but whatever its marks touch grows heavy and slow.
demons.demonlord.belphegor_trial=Your _movement speed is reduced by 25%_.
demons.demonlord.belphegor_perk=Resting _heals 1% of your max HP_ every turn.
demons.demonlord.belphegor_skill_name=Idleness
demons.demonlord.belphegor_skill_desc=Do nothing, gain everything: _recharges your wands and artifacts_ and heals 20% of your max HP.
demons.demonlord.belphegor_altar="Hnn...? Oh. You want something. Fine... walk slower until the prison's warden falls. Hurrying is so tiring anyway..."
demons.demonlord.belphegor_altar_own="Zzz... oh, a fellow napper. You carry a pillow too? We understand each other. ...Wake me when you're done."
demons.demonlord.belphegor_accepted=Your legs feel heavy. Every step takes effort.
demons.demonlord.belphegor_accepted_own=Belphegor is already snoring.
demons.demonlord.belphegor_judge="...You're back? Already? Ugh. Here, take this. Rest more. You'll get stronger doing nothing. Trust me."
demons.demonlord.belphegor_judge_own="You made it without even trying, I bet. Perfect. Take my seal... and a nap."
demons.demonlord.belphegor_challenge="Fight...? Now...? ...Fine. But I'm not getting up for long."
demons.demonlord.belphegor_challenge_own="Whoever falls asleep first loses. ...Or wins?"
demons.demonlord.belphegor_wait="Good. Later is the best time for everything."
demons.demonlord.belphegor_wait_own="Exactly. Why fight today?"
demons.demonlord.belphegor_boss_notice=You woke me up...
demons.demonlord.belphegor_boss_notice_own=Let's finish this quickly. I want to sleep.
demons.demonlord.belphegor_boss_enrage=Now I'm really awake... and annoyed.
demons.demonlord.belphegor_boss_enrage_own=You're keeping me up!
demons.demonlord.belphegor_boss_death=Finally... I can rest...
demons.demonlord.belphegor_boss_death_own=Good night... sleepyhead...
actors.buffs.demontrial.name=Trial of %s
actors.buffs.demontrial.name_none=Demon lord's trial
actors.buffs.demontrial.desc=You have taken the trial of %s at the altar of the demon lords.\n\n%s\n\nThe trial ends when Tengu, the warden of the prison, is defeated. The lord will then come to judge you.
actors.buffs.demonperk.name=Boon of %s
actors.buffs.demonperk.desc=%s has acknowledged you.\n\n%s\n\nDemon skill charge: %d/100.
actors.buffs.demonperk.desc_defeated=You have defeated the lord's true form: this boon is _50% stronger_ and the demon skill charges twice as fast.
actors.mobs.npcs.demonaltar.name=altar of the demon lords
actors.mobs.npcs.demonaltar.desc=A blackened altar that rose from the slime where Goo fell. Seven sigils burn on its surface, one for each demon lord. Touch it to take a lord's trial.
actors.mobs.npcs.demonaltar.appears=Something rises from the slime... the altar of the demon lords!
actors.mobs.npcs.demonlordnpc.name=demon lord
actors.mobs.npcs.demonlordnpc.desc=A demon lord.
actors.mobs.npcs.demonlordnpc.appears=%s steps out of the shadows to judge your trial.
actors.mobs.npcs.demonlordnpc.empowered=The demon lord's power flows into you. Your boon grows stronger!
actors.mobs.npcs.demonlordnpc.skill_granted=A new skill burns into your soul: _%s_. It sits above your skill bar.
actors.mobs.npcs.demonlordnpc.portal_open=The domain trembles. The stairs back to the prison have opened.
levels.demonarenalevel.embers_name=hellfire embers
demons.demonskill.desc=A power granted by %s.\n\n%s\n\nUses the boon's whole charge (100), which refills by 1 every turn (2 once the lord's true form is defeated). Charge: _%d/100_.
demons.demonskill.cost=charge 100
actors.mobs.npcs.demonlordnpc.fight=Fight its true form
actors.mobs.npcs.demonlordnpc.later=Not now
actors.mobs.demonlordboss.name=demon lord
actors.mobs.demonlordboss.desc=A demon lord in its true form.
actors.mobs.demonlordboss.notice=...
actors.mobs.demonlordboss.skill_hellfire=Hellfire ring!
actors.mobs.demonlordboss.skill_summon=Rise, servants!
actors.mobs.demonlordboss.skill_lucifer=Morning star!
actors.mobs.demonlordboss.skill_mammon=Pay up!
actors.mobs.demonlordboss.skill_asmodeus=Embrace!
actors.mobs.demonlordboss.skill_leviathan=Tidal wave!
actors.mobs.demonlordboss.skill_beelzebub=Swarm!
actors.mobs.demonlordboss.skill_satan=Inferno!
actors.mobs.demonlordboss.skill_belphegor=Torpor!
actors.mobs.demonlordboss.steal=Mammon snatches %d gold from you!
actors.mobs.leviathanboss.skill_wave=Great wave!
actors.mobs.leviathanboss.skill_bite=Devour!
actors.mobs.leviathanboss.skill_undertow=Undertow!
actors.mobs.leviathancoil.name=Leviathan's coil
actors.mobs.leviathancoil.desc=A stretch of Leviathan's enormous body, lying along the wall. Blows that land here wound the serpent itself.
actors.mobs.demonfly.name=demon fly
actors.mobs.demonfly.desc=A fat, buzzing fly from Beelzebub's swarm. Fast, frail and always hungry.

###### Seven Sins: Virtues ######
virtues.virtue.humility=humility
virtues.virtue.charity=charity
virtues.virtue.chastity=chastity
virtues.virtue.patience=patience
virtues.virtue.temperance=temperance
virtues.virtue.kindness=kindness
virtues.virtue.diligence=diligence
virtues.virtue.humility_angel=Michael
virtues.virtue.charity_angel=Raguel
virtues.virtue.chastity_angel=Gabriel
virtues.virtue.patience_angel=Uriel
virtues.virtue.temperance_angel=Raphael
virtues.virtue.kindness_angel=Jeremiel
virtues.virtue.diligence_angel=Sariel
actors.mobs.virtues.archangelboss.humility_notice=Once I cast down the morning star. Today I cast down you.
actors.mobs.virtues.archangelboss.humility_notice_own=So the crown has found a new head. It will fall as the first one did.
actors.mobs.virtues.archangelboss.humility_phase=Who is like God? Not you!
actors.mobs.virtues.archangelboss.humility_phase_own=Bow your head, little king!
actors.mobs.virtues.archangelboss.humility_death=The amulet... is yours to bear... humbly...
actors.mobs.virtues.archangelboss.humility_death_own=Even the proud... may yet learn to kneel...
actors.mobs.virtues.archangelboss.sig_humility=_Signature, Humbling Light:_ a wide cross of light that weakens and strips every blessing.
actors.mobs.virtues.archangelboss.skill_humility=Humbling light!
actors.mobs.virtues.archangelboss.charity_notice=All you carry was given to you. I have come to collect it.
actors.mobs.virtues.archangelboss.charity_notice_own=A dragon on a heap of gold. How small you are beneath it.
actors.mobs.virtues.archangelboss.charity_phase=Give, and it shall be given!
actors.mobs.virtues.archangelboss.charity_phase_own=Open your hands!
actors.mobs.virtues.archangelboss.charity_death=I give you... my defeat...
actors.mobs.virtues.archangelboss.charity_death_own=Keep it all, then... and be poor forever...
actors.mobs.virtues.archangelboss.sig_charity=_Signature, Great Tithe:_ heals itself and rains gold-taking light on your tile and scattered tiles around it, taking a fifth of your gold.
actors.mobs.virtues.archangelboss.skill_charity=Great tithe!
actors.mobs.virtues.archangelboss.chastity_notice=I bring a message, sinner: your journey ends here.
actors.mobs.virtues.archangelboss.chastity_notice_own=Your perfume does not reach heaven.
actors.mobs.virtues.archangelboss.chastity_phase=Behold the pure light!
actors.mobs.virtues.archangelboss.chastity_phase_own=I will not be moved by you!
actors.mobs.virtues.archangelboss.chastity_death=My message... was not heard...
actors.mobs.virtues.archangelboss.chastity_death_own=Not even now... do I feel desire...
actors.mobs.virtues.archangelboss.sig_chastity=_Signature, Pure Radiance:_ every tile within 2 is purified: blinds and strips blessings.
actors.mobs.virtues.archangelboss.skill_chastity=Pure radiance!
actors.mobs.virtues.archangelboss.patience_notice=I have watched over the gate since the beginning. I can wait for your end.
actors.mobs.virtues.archangelboss.patience_notice_own=Burn as hot as you like. The fire of God burns longer.
actors.mobs.virtues.archangelboss.patience_phase=Still I stand.
actors.mobs.virtues.archangelboss.patience_phase_own=Your rage only feeds my flame!
actors.mobs.virtues.archangelboss.patience_death=My vigil... ends at last...
actors.mobs.virtues.archangelboss.patience_death_own=Your fury... outlasted heaven itself...
actors.mobs.virtues.archangelboss.sig_patience=_Signature, Wall of Fire:_ gains a barrier and blasts everything within 2 tiles away.
actors.mobs.virtues.archangelboss.skill_patience=Wall of fire!
actors.mobs.virtues.archangelboss.temperance_notice=I heal the sick and the wounded. You, I will cure of everything.
actors.mobs.virtues.archangelboss.temperance_notice_own=You have eaten the whole dungeon. Now you will fast.
actors.mobs.virtues.archangelboss.temperance_phase=Enough!
actors.mobs.virtues.archangelboss.temperance_phase_own=No more feasts!
actors.mobs.virtues.archangelboss.temperance_death=Be healed... of your hunger...
actors.mobs.virtues.archangelboss.temperance_death_own=You would devour... even an angel...
actors.mobs.virtues.archangelboss.sig_temperance=_Signature, Great Fast:_ a wide cross that empties the stomach (-150 satiety) and cripples.
actors.mobs.virtues.archangelboss.skill_temperance=Great fast!
actors.mobs.virtues.archangelboss.kindness_notice=I have come to show you mercy. It will not feel like mercy.
actors.mobs.virtues.archangelboss.kindness_notice_own=You want what everyone has. Let me give you what you deserve.
actors.mobs.virtues.archangelboss.kindness_phase=Mercy is not weakness!
actors.mobs.virtues.archangelboss.kindness_phase_own=I hold no envy for you, only pity!
actors.mobs.virtues.archangelboss.kindness_death=Go in peace...
actors.mobs.virtues.archangelboss.kindness_death_own=I never wanted... what you have...
actors.mobs.virtues.archangelboss.sig_kindness=_Signature, Merciful Embrace:_ heals itself and roots everything on a chessboard of tiles around you (a step straight sideways is safe).
actors.mobs.virtues.archangelboss.skill_kindness=Merciful embrace!
actors.mobs.virtues.archangelboss.diligence_notice=I have not closed my eyes since creation. I see everything you have done.
actors.mobs.virtues.archangelboss.diligence_notice_own=Wake up. Your long dream ends here.
actors.mobs.virtues.archangelboss.diligence_phase=I never tire!
actors.mobs.virtues.archangelboss.diligence_phase_own=No more sleep for you!
actors.mobs.virtues.archangelboss.diligence_death=At last... my eyes may close...
actors.mobs.virtues.archangelboss.diligence_death_own=Beaten... by one who slept through it all...
actors.mobs.virtues.archangelboss.sig_diligence=_Signature, Unceasing Charge:_ charges straight through you, crippling, and quickens itself.
actors.mobs.virtues.archangelboss.skill_diligence=Unceasing charge!
actors.mobs.virtues.archangelboss.name=archangel %s
actors.mobs.virtues.archangelboss.desc=%s, archangel of %s, has descended to stand between you and the Amulet of Yendor. As long as it stands, the amulet cannot be taken.\n\nIt telegraphs its skills: _Judgment_ (a cross of light along your row and column, blinding), _Holy Lance_ (a long line) and its own signature move. It _ascends_ at two thirds and one third of its health, gaining a holy barrier, and fights faster after the second.
actors.mobs.virtues.archangelboss.skill_judgment=Judgment!
actors.mobs.virtues.archangelboss.skill_lance=Holy lance!
actors.mobs.virtues.archangelboss.amulet_guarded=A holy presence keeps your hand from the amulet. The archangel must fall first.
actors.mobs.virtues.archangelboss.amulet_free=The holy presence fades. The amulet is yours to take.
actors.mobs.virtues.virtuechampion.name_humility=saint of humility
actors.mobs.virtues.virtuechampion.desc_humility=A saint in pale gold robes who has never once raised her eyes above anyone. Her humbling blows sap the strength of the proud, and a veil of light turns blows aside.
actors.mobs.virtues.virtuechampion.humility_notice=Kneel, sinner. Not to me. To the truth.
actors.mobs.virtues.virtuechampion.humility_notice_own=You wear a crown no one gave you. I have come to take it off.
actors.mobs.virtues.virtuechampion.humility_death=Even this... I accept humbly...
actors.mobs.virtues.virtuechampion.humility_death_own=Your pride won... this time. It always falls in the end.
actors.mobs.virtues.virtuechampion.name_charity=saint of charity
actors.mobs.virtues.virtuechampion.desc_charity=A saint who gives everything away, including mercy to monsters. She heals every enemy of yours around her, and her tithe takes a tenth of your gold for the poor.
actors.mobs.virtues.virtuechampion.charity_notice=What you hoard, I will give away.
actors.mobs.virtues.virtuechampion.charity_notice_own=All that gold, and not one coin given. Let me teach you to share.
actors.mobs.virtues.virtuechampion.charity_death=Take it... take everything I have...
actors.mobs.virtues.virtuechampion.charity_death_own=Even my death... I give to you...
actors.mobs.virtues.virtuechampion.name_chastity=saint of chastity
actors.mobs.virtues.virtuechampion.desc_chastity=A saint in spotless white. No charm can touch her heart. Her purifying light strips away every blessing on its path, and her halo blinds those who come too close.
actors.mobs.virtues.virtuechampion.chastity_notice=Your sins leave a stain on the very air.
actors.mobs.virtues.virtuechampion.chastity_notice_own=Your sweet words won't work on me. Not one of them.
actors.mobs.virtues.virtuechampion.chastity_death=I remain... pure...
actors.mobs.virtues.virtuechampion.chastity_death_own=Even now... I feel nothing for you...
actors.mobs.virtues.virtuechampion.name_patience=paladin of patience
actors.mobs.virtues.virtuechampion.desc_patience=A paladin behind a great tower shield. He waits, he endures, and when he is ready he strikes back at everything around him.
actors.mobs.virtues.virtuechampion.patience_notice=I have waited a long time for you.
actors.mobs.virtues.virtuechampion.patience_notice_own=Rage all you like. I will still be standing.
actors.mobs.virtues.virtuechampion.patience_death=My watch... is over...
actors.mobs.virtues.virtuechampion.patience_death_own=Your fury... outlasted my patience...
actors.mobs.virtues.virtuechampion.name_temperance=paladin of temperance
actors.mobs.virtues.virtuechampion.desc_temperance=A lean paladin who eats one meal a day. His fasting blows empty your stomach, and his measured strikes leave you limping.
actors.mobs.virtues.virtuechampion.temperance_notice=Enough. You have taken enough.
actors.mobs.virtues.virtuechampion.temperance_notice_own=You devour without end. I am here to make you fast.
actors.mobs.virtues.virtuechampion.temperance_death=In moderation... always...
actors.mobs.virtues.virtuechampion.temperance_death_own=Even you... will be full one day...
actors.mobs.virtues.virtuechampion.name_kindness=saint of kindness
actors.mobs.virtues.virtuechampion.desc_kindness=A gentle saint who smiles even as she fights. She mends her own wounds and blesses herself, and her warm embrace roots you in place.
actors.mobs.virtues.virtuechampion.kindness_notice=I don't want to hurt you. But I will stop you.
actors.mobs.virtues.virtuechampion.kindness_notice_own=Why want what others have? Let me give you what you need instead.
actors.mobs.virtues.virtuechampion.kindness_death=I hope... you find peace...
actors.mobs.virtues.virtuechampion.kindness_death_own=I never envied you... not even now...
actors.mobs.virtues.virtuechampion.name_diligence=paladin of diligence
actors.mobs.virtues.virtuechampion.desc_diligence=A paladin who has not slept in years. Nothing can put him to sleep or freeze him in place; he charges straight through you and quickens his pace when he must.
actors.mobs.virtues.virtuechampion.diligence_notice=No rest for the wicked. Nor for me.
actors.mobs.virtues.virtuechampion.diligence_notice_own=Wake up, sluggard. Your judgment has come.
actors.mobs.virtues.virtuechampion.diligence_death=At last... I may rest...
actors.mobs.virtues.virtuechampion.diligence_death_own=You... won by sleeping...? Unbelievable...
actors.mobs.virtues.virtuechampion.desc_common=A champion of the seven virtues, come to judge you. It grows as strong as the floor it hunts on and telegraphs its skills (step out of the marked tiles). Defeating it yields two sin essences and blessed equipment.
actors.mobs.virtues.virtuechampion.desc_nemesis=_Your nemesis:_ this virtue opposes your sin. You and it deal each other _25% more damage_, and defeating it grants _50 sin points_ and a _scroll of upgrade_.
actors.mobs.virtues.virtuechampion.arrives=You feel a holy presence: the %s has come to this floor to judge you!
actors.mobs.virtues.virtuechampion.arrives_nemesis=Your sin trembles: the %s, your nemesis, has come for you!
actors.mobs.virtues.virtuechampion.awaits=You feel a holy presence: the %s awaits you in its sanctum on this floor.
actors.mobs.virtues.virtuechampion.awaits_nemesis=Your sin trembles: the %s, your nemesis, awaits you in its sanctum on this floor!
actors.mobs.virtues.virtuechampion.sealed=Light floods the doorway and hardens into stone. There is no way out until the judgment is over!
actors.mobs.virtues.virtuechampion.unsealed=The light sealing the doorway fades away.
actors.mobs.virtues.virtuechampion.nemesis_slain=You have defeated your nemesis! Your sin grows stronger.
actors.mobs.virtues.virtuechampion.tithe_taken=The saint takes %d gold as a tithe.
actors.mobs.virtues.humilitychampion.skill_humble=Be humbled!
actors.mobs.virtues.humilitychampion.skill_veil=Veil of humility!
actors.mobs.virtues.charitychampion.skill_alms=Alms for all!
actors.mobs.virtues.charitychampion.skill_tithe=Your tithe!
actors.mobs.virtues.chastitychampion.skill_purify=Be purified!
actors.mobs.virtues.chastitychampion.skill_halo=Holy halo!
actors.mobs.virtues.patiencechampion.skill_endure=I endure!
actors.mobs.virtues.patiencechampion.skill_retribution=Retribution!
actors.mobs.virtues.temperancechampion.skill_fast=Fast!
actors.mobs.virtues.temperancechampion.skill_measure=Measured strike!
actors.mobs.virtues.kindnesschampion.skill_mercy=Mercy!
actors.mobs.virtues.kindnesschampion.skill_embrace=Gentle embrace!
actors.mobs.virtues.diligencechampion.skill_charge=Onward!
actors.mobs.virtues.diligencechampion.skill_vigil=Eternal vigil!
actors.mobs.virtues.archangelboss.heaven_opens=Beyond the amulet the floor parts in light: a stairway leads down into the heavens.
actors.mobs.heaven.believer.name=believer
actors.mobs.heaven.believer.desc=A faithful soul of the heavens in a plain white robe. Believers walk together in small flocks, and when one falls, its dying cry calls every other enemy close by straight to you.
actors.mobs.heaven.believer.death_cry=The believer's dying cry rallies the faithful against you!
actors.mobs.heaven.priest.name=priest
actors.mobs.heaven.priest.desc=A priest of the heavens, never seen without a flock. It mends the wounds of the monsters around it and wraps them in shields of light. Left alone in a fight, it offers its own life, and a lesser angel descends in its place.
actors.mobs.heaven.priest.bless=The priest's prayer mends and shields its flock!
actors.mobs.heaven.priest.sacrifice=Left alone, the priest offers its own life... and a lesser angel descends!
actors.mobs.heaven.lesserangel.name=lesser angel
actors.mobs.heaven.lesserangel.desc=A small angel called down by a priest's sacrifice. It cannot move from where it appeared, but its white spears hit hard. Its radiance shields it at first and wears away every turn, and before long it fades back into the light.
actors.mobs.heaven.seraph.name=seraph
actors.mobs.heaven.seraph.desc=A towering seraph wreathed in holy fire, so large it fills four tiles. It never leaves the room it guards. Anyone standing next to it burns every turn, its spear reaches two tiles away, and once it can drag a foe to itself with a chain of light.
actors.mobs.heaven.seraph.chain=Come and be judged!
actors.mobs.heaven.seraph.burned=You were burned away by a seraph's holy fire...
actors.mobs.heaven.seraphpart.name=seraph
actors.mobs.heaven.seraphpart.desc=Part of a seraph's towering body.
actors.mobs.heaven.holygiant.name=holy giant
actors.mobs.heaven.holygiant.desc=A colossus of the heavens rising from the void to the waist, crackling with lightning. Its body cannot be harmed, but the arms it slams down can: break both arms to bring it down.\n\nIt slams a whole arm down across your side (a strip 3 tiles wide and 8 long from its ledge) and leaves it lying there for a few turns, calls a branching lightning that spreads over the arena and paralyses, and when badly hurt it charges a judgment that strikes everything it can see. Hide behind a wall when it does.
actors.mobs.heaven.holygiant.notice=WHO WALKS THE HEAVENS WITH A SINNER'S STEP?
actors.mobs.heaven.holygiant.skill_slam=Arm slam!
actors.mobs.heaven.holygiant.skill_bolt=Branching lightning!
actors.mobs.heaven.holygiant.immune=immune
actors.mobs.heaven.holygiant.arm_lost=MY ARM...!
actors.mobs.heaven.holygiant.judgment_start=KNEEL BEFORE THE JUDGMENT OF HEAVEN!
actors.mobs.heaven.holygiant.judgment_warn=The holy giant gathers light for a judgment over the whole floor! Get behind a wall!
actors.mobs.heaven.holygiant.judgment_count=Judgment: %d
actors.mobs.heaven.holygiant.judgment_release=BE JUDGED!
actors.mobs.heaven.holygiant.judgment_kill=You were struck down by the holy giant's judgment...
actors.mobs.heaven.holygiant.collapse=THE HEAVENS... WILL NOT... FALL...
actors.mobs.heaven.holygiant.gem_appears=The giant slumps over and a blue gem falls into the middle of the hall. The host of heaven pours in from the edges: reach the gem!
actors.mobs.heaven.holygiant.death=...so be it. Take my heart, sinner.
actors.mobs.heaven.giantfist.name_left=giant's left arm
actors.mobs.heaven.giantfist.name_right=giant's right arm
actors.mobs.heaven.giantfist.desc=One of the holy giant's arms, lying across the floor where it struck, fist at the end. It lifts back up after a few turns. Every blow on the arm is a blow on the giant, and enough of them will break it.
levels.holygiantlevel.void_name=Void
levels.holygiantlevel.void_desc=A dark void beyond the edge of the heavens. Something enormous stirs down there.

