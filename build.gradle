buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {

    ext {
        appName = 'Seven Sins'
        appPackageName = 'com.shatteredpixel.shatteredpixeldungeon'

        //Seven Sins: the mod's own version (based on Shattered Pixel Dungeon 4.0.2).
        //To release: raise both numbers (code +1 every release, never lower: Android refuses
        //to install a lower code over a higher one), push, then push a tag "v<appVersionName>".
        //Debug builds add "-INDEV", which keeps the developer tools on.
        appVersionCode = 1000
        appVersionName = '1.0.0'
        spdBaseVersion = '4.0.2'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}