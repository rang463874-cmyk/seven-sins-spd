name: Build APK

# Every push to a branch: builds a debug APK (developer tools on) and publishes it to the
# "test-build" pre-release so it can be downloaded from a phone.
# A push to main whose appVersionName (build.gradle) has no release yet also publishes a versioned release
# "Seven Sins <version>" (tag v<version>, created by the workflow), so releasing = raising the version and pushing.
# Pushing a tag "v<version>" by hand does the same (the tag must match appVersionName).
# Both are signed with the committed debug keystore, so each installs over the other and saves are kept.
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        id: ver
        run: |
          VERSION=$(grep -m1 "appVersionName = " build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Seven Sins $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersionName $VERSION in build.gradle"
            exit 1
          fi
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$VERSION" >/dev/null 2>&1; then
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "versioned release: $RELEASE"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          if [[ "${{ steps.ver.outputs.release }}" == "true" ]]; then
            NAME="SevenSins-${{ steps.ver.outputs.version }}.apk"
          else
            NAME="SevenSins-${{ steps.ver.outputs.version }}-test-${GITHUB_SHA::7}.apk"
          fi
          cp android/build/outputs/apk/debug/*.apk "out/$NAME"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: seven-sins-apk
          path: out/*.apk

      - name: Publish to the test-build pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.ver.outputs.release != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Seven Sins test build
          prerelease: true
          make_latest: false
          body: |
            Latest test build of Seven Sins ${{ steps.ver.outputs.version }} from ${{ github.ref_name }} (${{ github.sha }}).
            Installs alongside the official Shattered Pixel Dungeon (package suffix .indev).
            Developer tools are enabled in this build.
          files: out/*.apk

      - name: Publish the versioned release
        if: ${{ steps.ver.outputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Seven Sins ${{ steps.ver.outputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Seven Sins ${{ steps.ver.outputs.version }} (based on Shattered Pixel Dungeon 4.0.2).
            Installs over the test builds and keeps your saves. Developer tools are enabled.
          files: out/*.apk
