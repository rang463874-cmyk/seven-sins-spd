name: Build test APK

# Builds a debug APK (with the developer tools enabled) on every push,
# and publishes it to a "test-build" pre-release so it can be downloaded from a phone.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/build/outputs/apk/debug/*.apk "out/SevenSins-debug-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: seven-sins-debug-apk
          path: out/*.apk

      - name: Publish to the test-build pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Seven Sins test build
          prerelease: true
          make_latest: false
          body: |
            Latest debug build from ${{ github.ref_name }} (${{ github.sha }}).
            Installs alongside the official Shattered Pixel Dungeon (package suffix .indev).
            Developer tools are enabled in this build.
          files: out/*.apk
