demons.demonlord.lucifer_name=Lucifer
demons.demonlord.lucifer_title=Lucifer, demon lord of pride
demons.demonlord.lucifer_desc=A tall figure of white marble and gold, wings folded like a mantle. The fallen morning star looks down on everything, including you.
demons.demonlord.lucifer_boss_desc=The morning star has shed its mask of courtesy. Its light blinds, and its star falls wherever the ground glows.
demons.demonlord.lucifer_trial=Your _max HP is reduced by 25%_.
demons.demonlord.lucifer_perk=While your HP is at _75% or more_, you deal _+20% damage_.
demons.demonlord.lucifer_skill_name=Morning Star
demons.demonlord.lucifer_skill_desc=A star falls on a 3x3 area you choose, dealing heavy damage and _blinding_ survivors for 5 turns.
demons.demonlord.lucifer_altar="Kneel? No. I would not ask that of you... yet. Carry a lighter life to the prison's warden, and prove you are worth looking at."
demons.demonlord.lucifer_altar_own="Ah... my own reflection crawls out of the sewers. Pride recognizes pride. Show me you deserve to stand beside me, child of the crown."
demons.demonlord.lucifer_accepted=Lucifer's gaze settles on you. Your body feels fragile.
demons.demonlord.lucifer_accepted_own=Lucifer smiles. "Do not disappoint me. I despise disappointment above all."
demons.demonlord.lucifer_judge="You endured. Barely, but you did. Take my seal, and let the light of the morning star walk before you."
demons.demonlord.lucifer_judge_own="Splendid. Not a single bowed head on your way here, I trust? Take the seal. We are the only ones worthy of it."
demons.demonlord.lucifer_challenge="And now you look at me as if you could reach my height. Would you like to try?"
demons.demonlord.lucifer_challenge_own="Of course you want my throne. I would think less of you if you didn't. Come, then."
demons.demonlord.lucifer_wait="Take your time. Stars are patient."
demons.demonlord.lucifer_wait_own="Hesitation? How unbecoming of us."
demons.demonlord.lucifer_boss_notice=Behold the light you will never reach!
demons.demonlord.lucifer_boss_notice_own=Only one of us may wear the crown!
demons.demonlord.lucifer_boss_enrage=You dare wound ME?!
demons.demonlord.lucifer_boss_enrage_own=Yes... that is the arrogance I wanted to see!
demons.demonlord.lucifer_boss_death=Even a fallen star... burns brightest at the end...
demons.demonlord.lucifer_boss_death_own=Wear it well... my heir...
demons.demonlord.mammon_name=Mammon
demons.demonlord.mammon_title=Mammon, demon lord of greed
demons.demonlord.mammon_desc=A hulking golem of molten gold and coins, every movement jingling. Its eyes gleam like two freshly minted pieces.
demons.demonlord.mammon_boss_desc=Mammon wants everything back, with interest. Its blows can knock the gold straight out of your purse.
demons.demonlord.mammon_trial=All _gold you pick up is halved_.
demons.demonlord.mammon_perk=All _gold you pick up is increased by 30%_.
demons.demonlord.mammon_skill_name=Midas Touch
demons.demonlord.mammon_skill_desc=Touches an enemy you can see: an ordinary monster _turns to gold_ at once. Bosses and elites instead lose _15% of their max HP_.
demons.demonlord.mammon_altar="A deal, a deal! I take half of every coin you find until the prison's warden falls. Then I pay you back. Generously!"
demons.demonlord.mammon_altar_own="Hoho! I can smell a fellow collector. You know the value of a coin. A partnership, then? Fifty-fifty... for now."
demons.demonlord.mammon_accepted=Coins jingle from nowhere. Half of your future gold now belongs to Mammon.
demons.demonlord.mammon_accepted_own=Mammon rubs its golden hands together. "Pleasure doing business, partner."
demons.demonlord.mammon_judge="Debt paid, contract honoured! Here, the seal of Midas, and a little extra in every purse you find from now on."
demons.demonlord.mammon_judge_own="Not a single coin wasted, I see. Beautiful bookkeeping! Take the seal, partner, and make us both richer."
demons.demonlord.mammon_challenge="Hm? You want to rob me? Everything I own came from someone like you. Come and try to take it back."
demons.demonlord.mammon_challenge_own="A hostile takeover! Oh, I'm almost proud. Almost."
demons.demonlord.mammon_wait="Come back when you can afford it."
demons.demonlord.mammon_wait_own="Smart. Never bet before checking the books."
demons.demonlord.mammon_boss_notice=Everything you have is MINE!
demons.demonlord.mammon_boss_notice_own=Let's settle the accounts, partner!
demons.demonlord.mammon_boss_enrage=My gold! You're scratching my gold!
demons.demonlord.mammon_boss_enrage_own=Fine! No more discounts!
demons.demonlord.mammon_boss_death=Keep... the change...
demons.demonlord.mammon_boss_death_own=A fine... return on investment...
demons.demonlord.asmodeus_name=Asmodeus
demons.demonlord.asmodeus_title=Asmodeus, demon lord of lust
demons.demonlord.asmodeus_desc=A figure of impossible grace, wrapped in crimson silk and a heady scent. It is hard to look away, and harder to remember why you should.
demons.demonlord.asmodeus_boss_desc=Asmodeus dances between its marks. Whoever is caught in them is charmed and drained.
demons.demonlord.asmodeus_trial=Your _natural regeneration stops_.
demons.demonlord.asmodeus_perk=Your attacks _drain 10% of the damage_ dealt as healing.
demons.demonlord.asmodeus_skill_name=Allure
demons.demonlord.asmodeus_skill_desc=Every enemy in sight is _charmed_ for 6 turns.
demons.demonlord.asmodeus_altar="Such a lovely, warm body... let me taste a little of it. No healing until the prison's warden falls, darling. Desire grows sweeter when it starves."
demons.demonlord.asmodeus_altar_own="Oh my, oh my... you smell exactly like me. Did you come all this way just to dance with me? I'm flattered."
demons.demonlord.asmodeus_accepted=A sweet scent clings to you. Your wounds no longer close on their own.
demons.demonlord.asmodeus_accepted_own=Asmodeus blows you a kiss. "Don't die before our next dance."
demons.demonlord.asmodeus_judge="You held on, all thirsty and trembling. How adorable. Here, my seal, and a little of my thirst."
demons.demonlord.asmodeus_judge_own="Every step of it was a dance, wasn't it? Take my seal, my dear. The whole dungeon will fall for you."
demons.demonlord.asmodeus_challenge="You want me? Everyone does. But you'll have to catch me first."
demons.demonlord.asmodeus_challenge_own="A duel of hearts? How romantic. Let's see who charms whom."
demons.demonlord.asmodeus_wait="I'll be waiting, darling."
demons.demonlord.asmodeus_wait_own="Playing hard to get? I love it."
demons.demonlord.asmodeus_boss_notice=Come closer... closer...
demons.demonlord.asmodeus_boss_notice_own=Shall we dance, my mirror?
demons.demonlord.asmodeus_boss_enrage=You'll pay for that with your blood!
demons.demonlord.asmodeus_boss_enrage_own=Oh, you play rough! I like that!
demons.demonlord.asmodeus_boss_death=What a... beautiful end...
demons.demonlord.asmodeus_boss_death_own=Keep dancing... for me...
demons.demonlord.leviathan_name=Leviathan
demons.demonlord.leviathan_title=Leviathan, demon lord of envy
demons.demonlord.leviathan_desc=A coiling serpent of ice-cold water, scales flickering in every colour it has ever coveted. Its eyes never stop measuring what you have.
demons.demonlord.leviathan_boss_desc=Leviathan has risen along a whole wall of the arena. Its body is part of the fight: strike any coil and you strike the serpent itself. It never moves, but its _Great Wave_ floods every lane but one or two (stand in a safe lane), its _Undertow_ drags you back to the wall, and its _Bite_ tears at whatever stands in front of its head.
demons.demonlord.leviathan_trial=Your _accuracy and evasion are reduced by 20%_.
demons.demonlord.leviathan_perk=_20% of the damage_ enemies deal to you is _thrown back_ at them.
demons.demonlord.leviathan_skill_name=Tidal Wave
demons.demonlord.leviathan_skill_desc=A wave rolls up to 6 tiles in a line, damaging and _knocking back_ every enemy in it.
demons.demonlord.leviathan_altar="You have so much... eyes, hands, a future. I'll borrow a little of your sharpness until the prison's warden falls. Don't look at me like that."
demons.demonlord.leviathan_altar_own="...You. You copy everything too, don't you? I hate you. I want to be you. Prove you deserve to be envied."
demons.demonlord.leviathan_accepted=Cold water seeps into your joints. Your movements feel dull.
demons.demonlord.leviathan_accepted_own=Leviathan hisses. "If you fail, I'll take everything you have."
demons.demonlord.leviathan_judge="...Hmph. You made it. I'm jealous. Take the seal. Let them feel what it is to have what's theirs thrown back."
demons.demonlord.leviathan_judge_own="You even copied my patience. Infuriating. Wonderful. Take it, and make everyone else envy us."
demons.demonlord.leviathan_challenge="Now you want my power too? Of course you do. Everybody wants what I have."
demons.demonlord.leviathan_challenge_own="Copy this, then. If you can."
demons.demonlord.leviathan_wait="Run. I'll still be watching."
demons.demonlord.leviathan_wait_own="Afraid I'm better? I am."
demons.demonlord.leviathan_boss_notice=Everything you have should have been MINE!
demons.demonlord.leviathan_boss_notice_own=There can only be one original!
demons.demonlord.leviathan_boss_enrage=Drown! Drown in it!
demons.demonlord.leviathan_boss_enrage_own=Stop imitating me!
demons.demonlord.leviathan_boss_death=Why... is it always... someone else...
demons.demonlord.leviathan_boss_death_own=Now... I envy you... most of all...
demons.demonlord.beelzebub_name=Beelzebub
demons.demonlord.beelzebub_title=Beelzebub, demon lord of gluttony
demons.demonlord.beelzebub_desc=The lord of flies: a bloated, armoured thing crawling with buzzing swarms. The air around it tastes of rot and honey.
demons.demonlord.beelzebub_boss_desc=Beelzebub never fights alone. Its swarm keeps growing for as long as it lives.
demons.demonlord.beelzebub_trial=You get _hungry twice as fast_.
demons.demonlord.beelzebub_perk=Eating food _heals 25% of your max HP_.
demons.demonlord.beelzebub_skill_name=Swarm
demons.demonlord.beelzebub_skill_desc=Summons _3 demon flies_ that fight for you for 30 turns.
demons.demonlord.beelzebub_altar="Hungry? Not yet. You will be. Twice as hungry until the prison's warden falls. Hunger is the truest prayer."
demons.demonlord.beelzebub_altar_own="Bzzz... a stomach without a bottom. I can hear it growling from here. You and I are going to get along, little maw."
demons.demonlord.beelzebub_accepted=A fly lands on your tongue. Your stomach starts growling.
demons.demonlord.beelzebub_accepted_own=Beelzebub's swarm buzzes approvingly. "Eat everything. Leave nothing."
demons.demonlord.beelzebub_judge="You starved and you didn't die. Good. Now every meal will mend you, and my flies will follow you."
demons.demonlord.beelzebub_judge_own="You ate your way here, didn't you? Splendid appetite! Take my seal, and never stop chewing."
demons.demonlord.beelzebub_challenge="You look... delicious. Do you want to fight, or do you want to be dinner? Same thing to me."
demons.demonlord.beelzebub_challenge_own="Who eats whom? Let's find out!"
demons.demonlord.beelzebub_wait="Go. Fatten up."
demons.demonlord.beelzebub_wait_own="Hungry for something else first? Understandable."
demons.demonlord.beelzebub_boss_notice=The feast begins!
demons.demonlord.beelzebub_boss_notice_own=Only one stomach can rule this dungeon!
demons.demonlord.beelzebub_boss_enrage=MORE! I need MORE!
demons.demonlord.beelzebub_boss_enrage_own=You bite well! Now I bite back!
demons.demonlord.beelzebub_boss_death=Still... hungry...
demons.demonlord.beelzebub_boss_death_own=Eat me... and grow...
demons.demonlord.satan_name=Satan
demons.demonlord.satan_title=Satan, demon lord of wrath
demons.demonlord.satan_desc=A robed figure wreathed in hellfire, horns blackened by smoke. The floor smoulders wherever it stands.
demons.demonlord.satan_boss_desc=Satan's fury spills out as hellfire around it. Don't stand close when the ground is marked.
demons.demonlord.satan_trial=You take _25% more damage_ from enemies.
demons.demonlord.satan_perk=You deal _+3% damage for every 10% of HP missing_.
demons.demonlord.satan_skill_name=Hellfire
demons.demonlord.satan_skill_desc=Hellfire erupts around you to 2 tiles, damaging enemies and _setting them on fire_.
demons.demonlord.satan_altar="Every blow will hurt more until the prison's warden falls. Let it. Pain is fuel. Burn with it, and come back angrier."
demons.demonlord.satan_altar_own="I can feel it... the drum in your chest, beating for war. Good. Let the world hurt you more, and hit back harder."
demons.demonlord.satan_accepted=Embers sink into your skin. Every wound will burn hotter.
demons.demonlord.satan_accepted_own=Satan roars with laughter. "Bleed, and rage!"
demons.demonlord.satan_judge="You bled and kept walking. That is wrath. Take my seal; the closer you are to death, the harder you will strike."
demons.demonlord.satan_judge_own="Still angry? GOOD. Never let that fire go out. Take the seal and burn them all."
demons.demonlord.satan_challenge="You want to fight me? Finally, someone with a spine. Come!"
demons.demonlord.satan_challenge_own="Rage against rage! This will be glorious!"
demons.demonlord.satan_wait="Coward. Come back when your blood boils."
demons.demonlord.satan_wait_own="Let the anger build. I'll wait."
demons.demonlord.satan_boss_notice=BURN!
demons.demonlord.satan_boss_notice_own=Show me your fury!
demons.demonlord.satan_boss_enrage=Now I'm ANGRY!
demons.demonlord.satan_boss_enrage_own=YES! MORE!
demons.demonlord.satan_boss_death=The fire... never dies...
demons.demonlord.satan_boss_death_own=Carry... my flame...
demons.demonlord.belphegor_name=Belphegor
demons.demonlord.belphegor_title=Belphegor, demon lord of sloth
demons.demonlord.belphegor_desc=A massive horned brute slumped on an invisible throne, yawning. It looks as though it might fall asleep in the middle of a sentence.
demons.demonlord.belphegor_boss_desc=Belphegor barely moves, but whatever its marks touch grows heavy and slow.
demons.demonlord.belphegor_trial=Your _movement speed is reduced by 25%_.
demons.demonlord.belphegor_perk=Resting _heals 1% of your max HP_ every turn.
demons.demonlord.belphegor_skill_name=Idleness
demons.demonlord.belphegor_skill_desc=Do nothing, gain everything: _recharges your wands and artifacts_ and heals 20% of your max HP.
demons.demonlord.belphegor_altar="Hnn...? Oh. You want something. Fine... walk slower until the prison's warden falls. Hurrying is so tiring anyway..."
demons.demonlord.belphegor_altar_own="Zzz... oh, a fellow napper. You carry a pillow too? We understand each other. ...Wake me when you're done."
demons.demonlord.belphegor_accepted=Your legs feel heavy. Every step takes effort.
demons.demonlord.belphegor_accepted_own=Belphegor is already snoring.
demons.demonlord.belphegor_judge="...You're back? Already? Ugh. Here, take this. Rest more. You'll get stronger doing nothing. Trust me."
demons.demonlord.belphegor_judge_own="You made it without even trying, I bet. Perfect. Take my seal... and a nap."
demons.demonlord.belphegor_challenge="Fight...? Now...? ...Fine. But I'm not getting up for long."
demons.demonlord.belphegor_challenge_own="Whoever falls asleep first loses. ...Or wins?"
demons.demonlord.belphegor_wait="Good. Later is the best time for everything."
demons.demonlord.belphegor_wait_own="Exactly. Why fight today?"
demons.demonlord.belphegor_boss_notice=You woke me up...
demons.demonlord.belphegor_boss_notice_own=Let's finish this quickly. I want to sleep.
demons.demonlord.belphegor_boss_enrage=Now I'm really awake... and annoyed.
demons.demonlord.belphegor_boss_enrage_own=You're keeping me up!
demons.demonlord.belphegor_boss_death=Finally... I can rest...
demons.demonlord.belphegor_boss_death_own=Good night... sleepyhead...
actors.buffs.demontrial.name=Trial of %s
actors.buffs.demontrial.name_none=Demon lord's trial
actors.buffs.demontrial.desc=You have taken the trial of %s at the altar of the demon lords.\n\n%s\n\nThe trial ends when Tengu, the warden of the prison, is defeated. The lord will then come to judge you.
actors.buffs.demonperk.name=Boon of %s
actors.buffs.demonperk.desc=%s has acknowledged you.\n\n%s\n\nDemon seal charge: %d/100.
actors.buffs.demonperk.desc_defeated=You have defeated the lord's true form: this boon is _50% stronger_ and the seal charges twice as fast.
actors.mobs.npcs.demonaltar.name=altar of the demon lords
actors.mobs.npcs.demonaltar.desc=A blackened altar that rose from the slime where Goo fell. Seven sigils burn on its surface, one for each demon lord. Touch it to take a lord's trial.
actors.mobs.npcs.demonaltar.appears=Something rises from the slime... the altar of the demon lords!
actors.mobs.npcs.demonlordnpc.name=demon lord
actors.mobs.npcs.demonlordnpc.desc=A demon lord.
actors.mobs.npcs.demonlordnpc.appears=%s steps out of the shadows to judge your trial.
actors.mobs.npcs.demonlordnpc.empowered=The demon lord's power flows into your seal. Your boon grows stronger!
actors.mobs.npcs.demonlordnpc.fight=Fight its true form
actors.mobs.npcs.demonlordnpc.later=Not now
actors.mobs.demonlordboss.name=demon lord
actors.mobs.demonlordboss.desc=A demon lord in its true form.
actors.mobs.demonlordboss.notice=...
actors.mobs.demonlordboss.skill_hellfire=Hellfire ring!
actors.mobs.demonlordboss.skill_summon=Rise, servants!
actors.mobs.demonlordboss.skill_lucifer=Morning star!
actors.mobs.demonlordboss.skill_mammon=Pay up!
actors.mobs.demonlordboss.skill_asmodeus=Embrace!
actors.mobs.demonlordboss.skill_leviathan=Tidal wave!
actors.mobs.demonlordboss.skill_beelzebub=Swarm!
actors.mobs.demonlordboss.skill_satan=Inferno!
actors.mobs.demonlordboss.skill_belphegor=Torpor!
actors.mobs.demonlordboss.steal=Mammon snatches %d gold from you!
actors.mobs.leviathanboss.skill_wave=Great wave!
actors.mobs.leviathanboss.skill_bite=Devour!
actors.mobs.leviathanboss.skill_undertow=Undertow!
actors.mobs.leviathancoil.name=Leviathan's coil
actors.mobs.leviathancoil.desc=A stretch of Leviathan's enormous body, lying along the wall. Blows that land here wound the serpent itself.
actors.mobs.demonfly.name=demon fly
actors.mobs.demonfly.desc=A fat, buzzing fly from Beelzebub's swarm. Fast, frail and always hungry.
