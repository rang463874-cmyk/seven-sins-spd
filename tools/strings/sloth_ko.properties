actors.hero.heroclass.sloth=나태
actors.hero.heroclass.sloth_desc_short=칠죄종 중 _나태_의 죄를 짊어진 자. 나태는 직접 싸우기 귀찮아서 _꿈 인형_을 불러 대신 싸우게 하고, 인형이 쓰러뜨린 적으로 _영구적으로 강해집니다_.
actors.hero.heroclass.sloth_desc=나태는 _안락한 베개_를 유물 칸에 착용한 채 시작합니다. 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다. 베개는 _시간_을 대가로 _꿈 인형 소환_, _낮잠_, _바꿔치기_, _하품_을 사용합니다. 기술을 쓰면 그만큼 _낮잠_에 빠져 몇 턴 동안 아무것도 할 수 없습니다.\n\n_꿈 인형_은 나태 대신 싸우는 아군입니다. 층을 떠나면 사라지므로 새 층에서 다시 불러야 합니다. 인형이 적을 쓰러뜨리면 _나태 점수_가 쌓여 나태와 인형의 근접 피해, 명중, 최대 체력, 방어력, 회피가 끝없이 오릅니다. 나태가 직접 쓰러뜨리면 점수를 1/3만 얻습니다.\n\n나태는 _곤봉_을 들고 시작하며, _치유 물약_과 _재충전의 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.sloth_unlock=나태는 처음부터 해금되어 있습니다.

actors.hero.herosubclass.dream_lord=꿈의 군주
actors.hero.herosubclass.dream_lord_short_desc=_꿈의 군주_는 꿈 인형을 _하나 더_ 거느리고, 인형이 쓰러뜨린 적은 잠시 _악몽_으로 되살아나 함께 싸웁니다.
actors.hero.herosubclass.dream_lord_desc=꿈의 군주는 꿈속 군대를 거느립니다. 꿈 인형의 최대 수가 _1_ 늘어납니다.\n\n꿈 인형이 적을 쓰러뜨리면 그 자리에 _악몽_이 생겨 _10턴_ 동안 함께 싸웁니다. 악몽은 인형의 _70%_ 성능이며, 동시에 _2마리_까지 유지됩니다.\n\n전용 특성으로 악몽을 늘리거나, 인형과 고통을 나누거나, 인형의 공격력을 높일 수 있습니다.
actors.hero.herosubclass.sleepwalker=몽유병자
actors.hero.herosubclass.sleepwalker_short_desc=_몽유병자_는 제자리에 _2턴_ 머물면 잠들고, 잠든 동안 매 턴 주변 적을 _자동으로 공격_합니다.
actors.hero.herosubclass.sleepwalker_desc=몽유병자는 자면서도 싸웁니다. 같은 자리에 _2턴_ 이상 머물면 잠이 들고, 잠든 동안 매 턴 인접한 적 하나에게 _공짜 공격_을 합니다. 자동 공격은 _60%_ 피해이며 무기 효과도 발동합니다.\n\n자동 공격으로 쓰러뜨린 적은 나태 점수를 _온전히_ 줍니다. 움직이면 잠에서 깹니다.\n\n전용 특성으로 자동 공격을 강화하거나, 잠든 동안 받는 피해를 줄이거나, 여러 적을 동시에 공격할 수 있습니다.

actors.hero.talent.sloth_idle.title=빈둥거림
actors.hero.talent.sloth_idle.desc=_+1:_ 나태 점수를 _15%_ 더 얻습니다.\n\n_+2:_ 나태 점수를 _30%_ 더 얻습니다.
actors.hero.talent.sloth_comfy.title=편안한 자세
actors.hero.talent.sloth_comfy.desc=꿈 인형이 _2칸_ 안에 있으면 나태가 받는 피해가 줄어듭니다.\n\n_+1:_ _10%_ 감소\n\n_+2:_ _20%_ 감소
actors.hero.talent.sloth_snore.title=코골이
actors.hero.talent.sloth_snore.desc=꿈 인형을 소환하면 요란하게 코를 골아 주변 _3칸_ 안의 적을 _도발_합니다. 도발당한 적은 인형만 공격합니다.\n\n_+1:_ _3턴_\n\n_+2:_ _5턴_
actors.hero.talent.sloth_linger.title=미적거림
actors.hero.talent.sloth_linger.desc=나태가 제자리에 머무는 동안 모든 꿈 인형이 매 턴 체력을 회복합니다.\n\n_+1:_ 턴당 _1_\n\n_+2:_ 턴당 _2_
actors.hero.talent.sloth_pillow.title=배부른 낮잠
actors.hero.talent.sloth_pillow.desc=음식을 먹는 데 _3턴_이 아니라 _1턴_이 걸리고, 먹고 나면 다음 베개 기술은 낮잠 없이 쓸 수 있습니다.\n\n_+1:_ 기술 _1번_\n\n_+2:_ 기술 _2번_
actors.hero.talent.sloth_restful.title=숙면
actors.hero.talent.sloth_restful.desc=_+1:_ 기술 후 낮잠 시간이 _20%_ 줄어듭니다.\n\n_+2:_ 기술 후 낮잠 시간이 _40%_ 줄어듭니다.
actors.hero.talent.sloth_roll.title=바꿔치기 달인
actors.hero.talent.sloth_roll.desc=바꿔치기로 자리를 바꾼 꿈 인형이 방어막을 얻습니다.\n\n_+1:_ _(5 + 레벨)_\n\n_+2:_ 그 _2배_
actors.hero.talent.sloth_yawn.title=전염되는 하품
actors.hero.talent.sloth_yawn.desc=꿈 인형의 공격이 일정 확률로 적을 _2턴_ 동안 _느리게_ 만듭니다.\n\n_+1:_ _15%_ 확률\n\n_+2:_ _30%_ 확률
actors.hero.talent.sloth_shove.title=귀찮아
actors.hero.talent.sloth_shove.desc=나태를 공격한 적은 가장 가까운 꿈 인형에게 _도발_당합니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_
actors.hero.talent.sloth_apathy.title=무관심
actors.hero.talent.sloth_apathy.desc=나태 점수로 얻는 모든 스탯 효과가 증가합니다. 꿈 인형에게도 적용됩니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.sloth_snooze.title=5분만 더
actors.hero.talent.sloth_snooze.desc=꿈 인형과 악몽의 최대 체력이 늘어납니다.\n\n_+1:_ _15%_ 증가\n\n_+2:_ _30%_ 증가\n\n_+3:_ _45%_ 증가
actors.hero.talent.lord_nightmare.title=악몽의 무리
actors.hero.talent.lord_nightmare.desc=처치로 생기는 악몽의 지속 시간과 최대 수가 늘어납니다. (기본 10턴, 2마리)\n\n_+1:_ _15턴_, _3마리_\n\n_+2:_ _20턴_, _4마리_\n\n_+3:_ _25턴_, _5마리_
actors.hero.talent.lord_bond.title=꿈의 끈
actors.hero.talent.lord_bond.desc=나와 있는 꿈 인형과 악몽 하나당 나태가 받는 피해가 줄어듭니다. (최대 50%)\n\n_+1:_ 하나당 _3%_\n\n_+2:_ 하나당 _6%_\n\n_+3:_ 하나당 _9%_
actors.hero.talent.lord_command.title=지휘
actors.hero.talent.lord_command.desc=꿈 인형과 악몽의 피해가 늘어납니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.walk_reflex.title=반사 신경
actors.hero.talent.walk_reflex.desc=잠든 동안의 자동 공격 피해가 늘어납니다. (기본 60%)\n\n_+1:_ _80%_\n\n_+2:_ _100%_\n\n_+3:_ _120%_
actors.hero.talent.walk_deep.title=깊은 잠
actors.hero.talent.walk_deep.desc=잠든 동안 받는 피해가 줄어듭니다.\n\n_+1:_ _8%_ 감소\n\n_+2:_ _16%_ 감소\n\n_+3:_ _24%_ 감소
actors.hero.talent.walk_brawl.title=잠결의 난투
actors.hero.talent.walk_brawl.desc=잠든 동안 자동 공격하는 적의 수가 늘어납니다. (기본 1)\n\n_+1:_ _2_\n\n_+2:_ _3_\n\n_+3:_ _4_
actors.hero.talent.legion_count.title=대군
actors.hero.talent.legion_count.desc=악몽 군단이 부르는 악몽의 수가 늘어납니다. (기본 2)\n\n_+1:_ _3_\n\n_+2:_ _3_\n\n_+3:_ _4_\n\n_+4:_ _4_
actors.hero.talent.legion_duration.title=긴 밤
actors.hero.talent.legion_duration.desc=악몽 군단의 악몽이 더 오래 머뭅니다. (기본 20턴)\n\n_+1:_ _25턴_\n\n_+2:_ _30턴_\n\n_+3:_ _35턴_\n\n_+4:_ _40턴_
actors.hero.talent.legion_taunt.title=소란
actors.hero.talent.legion_taunt.desc=악몽 군단의 악몽이 나타나면서 주변 _3칸_의 적을 _도발_합니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.auto_duration.title=장시간 방치
actors.hero.talent.auto_duration.desc=자동 사냥의 지속 시간이 늘어납니다. (기본 10턴)\n\n_+1:_ _13턴_\n\n_+2:_ _16턴_\n\n_+3:_ _19턴_\n\n_+4:_ _22턴_
actors.hero.talent.auto_power.title=효율 사냥
actors.hero.talent.auto_power.desc=자동 사냥의 공격 피해가 늘어납니다. (기본 70%)\n\n_+1:_ _85%_\n\n_+2:_ _100%_\n\n_+3:_ _115%_\n\n_+4:_ _130%_
actors.hero.talent.auto_reach.title=광역 사냥
actors.hero.talent.auto_reach.desc=자동 사냥이 더 많은 적을, 더 멀리까지 공격합니다. (기본 1칸, 1명)\n\n_+1:_ _1칸_, _2명_\n\n_+2:_ _2칸_, _2명_\n\n_+3:_ _2칸_, _3명_\n\n_+4:_ _3칸_, _3명_
actors.hero.talent.proxy_duration.title=장기 계약
actors.hero.talent.proxy_duration.desc=대리인의 지속 시간이 늘어납니다. (기본 10턴)\n\n_+1:_ _13턴_\n\n_+2:_ _16턴_\n\n_+3:_ _19턴_\n\n_+4:_ _22턴_
actors.hero.talent.proxy_mend.title=수리
actors.hero.talent.proxy_mend.desc=대리인을 쓸 때 모든 꿈 인형의 체력을 회복합니다.\n\n_+1:_ _20%_\n\n_+2:_ _40%_\n\n_+3:_ _60%_\n\n_+4:_ _80%_
actors.hero.talent.proxy_shield.title=이불 속
actors.hero.talent.proxy_shield.desc=대리인을 쓸 때 나태가 최대 체력에 비례한 방어막을 얻습니다.\n\n_+1:_ _5%_\n\n_+2:_ _10%_\n\n_+3:_ _15%_\n\n_+4:_ _20%_

actors.hero.abilities.sloth.nightmarelegion.name=악몽 군단
actors.hero.abilities.sloth.nightmarelegion.short_desc=_악몽_ 여러 마리를 불러내 대신 싸우게 합니다.
actors.hero.abilities.sloth.nightmarelegion.desc=주변에 _악몽 2마리_를 소환합니다. 악몽은 꿈 인형의 _70%_ 성능으로 _20턴_ 동안 싸운 뒤 사라집니다. 악몽이 쓰러뜨린 적도 나태 점수를 온전히 줍니다.
actors.hero.abilities.sloth.autohunt.name=자동 사냥
actors.hero.abilities.sloth.autohunt.short_desc=꾸벅꾸벅 졸면서 _매 턴 주변 적을 자동으로 공격_합니다.
actors.hero.abilities.sloth.autohunt.desc=_10턴_ 동안 매 턴 인접한 적 하나에게 _70%_ 피해의 공짜 공격을 합니다. 움직이거나 다른 행동을 해도 계속되며, 자동 공격으로 쓰러뜨린 적은 나태 점수를 온전히 줍니다.
actors.hero.abilities.sloth.proxy.name=대리인
actors.hero.abilities.sloth.proxy.short_desc=잠시 동안 나태가 받을 _피해를 꿈 인형들이 대신_ 받습니다.
actors.hero.abilities.sloth.proxy.desc=_10턴_ 동안 나태가 받는 모든 피해가 살아 있는 꿈 인형과 악몽에게 _똑같이 나뉘어_ 들어갑니다. 인형이 하나도 없으면 피해가 _절반_으로만 줄어듭니다.

actors.buffs.slothrepose.name=나태
actors.buffs.slothrepose.desc_head=나태 점수: _%d_\n꿈 인형: _%d / %d_
actors.buffs.slothrepose$doze.name=낮잠
actors.buffs.slothrepose$doze.desc=베개의 힘을 쓴 대가로 꾸벅꾸벅 졸고 있습니다. 깨어날 때까지 아무것도 할 수 없습니다.\n\n남은 턴: %s.
actors.buffs.slothrepose$refreshed.name=배부름
actors.buffs.slothrepose$refreshed.desc=든든히 먹어서 잠이 오지 않습니다. 다음 베개 기술 _%d번_은 낮잠 없이 쓸 수 있습니다.
actors.buffs.slothrepose.desc_stats=근접 추가 피해: _+%d_\n정확도: _+%d%%_\n최대 체력: _+%d_\n추가 방어력: _0~%d_\n회피: _+%d%%_\n\n꿈 인형도 나태 점수만큼 강해집니다.
actors.buffs.slothrepose.desc_asleep=_잠든 상태:_ 매 턴 주변 적을 자동으로 공격합니다.
actors.buffs.slothrepose.doze=쿨쿨...
actors.buffs.slothrepose$taunted.name=도발당함
actors.buffs.slothrepose$taunted.desc=꿈 인형에게 약이 올라 그 인형만 쫓아가 공격합니다.\n\n남은 시간: %s턴
actors.buffs.slothrepose$taunted.shout=도발!
actors.buffs.slothrepose$proxyguard.name=대리인
actors.buffs.slothrepose$proxyguard.desc=나태가 받을 피해를 꿈 인형들이 대신 받고 있습니다.\n\n남은 시간: %s턴
actors.buffs.slothrepose$autohunt.name=자동 사냥
actors.buffs.slothrepose$autohunt.desc=꾸벅꾸벅 졸면서도 매 턴 주변 적을 자동으로 공격합니다.\n\n남은 시간: %s턴
actors.mobs.npcs.dreampuppet.name=꿈 인형
actors.mobs.npcs.dreampuppet.name_nightmare=악몽
actors.mobs.npcs.dreampuppet.desc=나태의 꿈에서 빠져나온 푸르스름한 인형입니다. 주인 곁을 지키는 대신 층 곳곳을 _제멋대로 돌아다니며_, 눈에 띄는 적은 자고 있든 말든 덤벼듭니다. 나태의 레벨과 나태 점수만큼 강해지고, 층을 떠나면 꿈이 깨듯 사라집니다.
actors.mobs.npcs.dreampuppet.desc_nightmare=잠시 머무는 악몽입니다. _%d턴_ 뒤에 사라집니다.
