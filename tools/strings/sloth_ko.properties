actors.hero.heroclass.sloth=나태
actors.hero.heroclass.sloth_desc_short=칠죄종 중 _나태_의 죄를 짊어진 자. 나태는 _제자리에 머물수록_ 무기력이 쌓여 단단해지고, 그 상태로 적을 쓰러뜨려 _영구적으로 강해집니다_.
actors.hero.heroclass.sloth_desc=나태는 장비 칸을 차지하지 않는 _안락한 베개_를 가지고 시작합니다. 베개는 시간이 지나면 충전되며, 충전을 써서 _낮잠_, _저리 가_, _하품_, _굴러가기_를 사용합니다.\n\n움직이지 않는 턴마다 _무기력_이 1씩 쌓여(최대 20) 방어력이 오르고, 10 이상이면 체력이 재생됩니다. 움직이면 무기력이 사라집니다. 무기력이 _5 이상_인 채로 적을 쓰러뜨리면 _나태 점수_를 얻어 근접 피해, 명중, 최대 체력, 방어력, 회피가 끝없이 오릅니다.\n\n나태는 _곤봉_을 들고 시작하며, _치유 물약_과 _재충전의 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.sloth_unlock=나태는 처음부터 해금되어 있습니다.

actors.hero.herosubclass.hibernator=동면자
actors.hero.herosubclass.hibernator_short_desc=_동면자_는 무기력을 _40_까지 쌓고, 무기력으로 얻는 방어력이 _50%_ 늘며 더 빨리 재생합니다.
actors.hero.herosubclass.hibernator_desc=동면자는 겨울잠을 자듯 버팁니다. 무기력의 최대치가 _20_ 늘어나고, 무기력으로 얻는 방어력이 _50%_ 증가하며, 체력 재생도 빨라집니다.\n\n전용 특성으로 방어력과 재생을 더 키우거나, 무기력을 더 많이 쌓을 수 있습니다.
actors.hero.herosubclass.sleeping_lion=잠든 사자
actors.hero.herosubclass.sleeping_lion_short_desc=_잠든 사자_는 무기력이 5 이상일 때의 근접 공격에 무기력 1당 _5%_의 추가 피해를 실어 한 번에 쏟아냅니다.
actors.hero.herosubclass.sleeping_lion_desc=잠든 사자는 가만히 웅크렸다가 한 번에 덮칩니다. 무기력이 _5 이상_일 때 근접 공격을 하면 무기력 1당 _5%_ 더 큰 피해를 주고, 쌓인 무기력을 모두 소모합니다. 이 일격으로 적을 쓰러뜨리면 소모한 무기력만큼 나태 점수를 얻습니다.\n\n전용 특성으로 일격을 더 강하게 하거나, 일격 후 무기력을 남기거나, 일격으로 쓰러뜨린 적 주변을 겁에 질리게 할 수 있습니다.

actors.hero.talent.sloth_idle.title=빈둥거림
actors.hero.talent.sloth_idle.desc=_+1:_ 얻는 나태 점수가 _15%_ 증가합니다.\n\n_+2:_ 얻는 나태 점수가 _30%_ 증가합니다.
actors.hero.talent.sloth_comfy.title=편안한 자세
actors.hero.talent.sloth_comfy.desc=무기력의 최대치가 늘어납니다.\n\n_+1:_ _+5_\n\n_+2:_ _+10_
actors.hero.talent.sloth_snore.title=코골이
actors.hero.talent.sloth_snore.desc=무기력으로 인한 체력 재생이 빨라집니다. (기본 6턴마다 1)\n\n_+1:_ _5턴_마다\n\n_+2:_ _4턴_마다
actors.hero.talent.sloth_linger.title=미적거림
actors.hero.talent.sloth_linger.desc=움직여도 무기력의 일부가 남습니다.\n\n_+1:_ _25%_ 유지\n\n_+2:_ _50%_ 유지
actors.hero.talent.sloth_pillow.title=푹신한 베개
actors.hero.talent.sloth_pillow.desc=베개의 최대 충전 수가 늘어납니다. (기본 3)\n\n_+1:_ _4회_\n\n_+2:_ _5회_
actors.hero.talent.sloth_restful.title=숙면
actors.hero.talent.sloth_restful.desc=베개의 충전 속도가 빨라집니다.\n\n_+1:_ _20%_ 빨라짐\n\n_+2:_ _40%_ 빨라짐
actors.hero.talent.sloth_roll.title=데굴데굴
actors.hero.talent.sloth_roll.desc=굴러가기의 이동 거리가 늘어납니다. (기본 3칸)\n\n_+1:_ _4칸_\n\n_+2:_ _5칸_
actors.hero.talent.sloth_yawn.title=전염되는 하품
actors.hero.talent.sloth_yawn.desc=하품의 범위가 늘어납니다. (기본 2칸)\n\n_+1:_ _3칸_\n\n_+2:_ _4칸_
actors.hero.talent.sloth_shove.title=귀찮아
actors.hero.talent.sloth_shove.desc=저리 가가 적을 더 멀리, 더 세게 밀쳐냅니다.\n\n_+1:_ 거리 _+1_, 피해 _2배_\n\n_+2:_ 거리 _+2_, 피해 _3배_
actors.hero.talent.sloth_apathy.title=무관심
actors.hero.talent.sloth_apathy.desc=나태 점수로 얻는 모든 스탯 효과가 증가합니다. 이미 쌓은 점수에도 적용됩니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.sloth_snooze.title=5분만 더
actors.hero.talent.sloth_snooze.desc=낮잠을 자면 해로운 효과가 사라집니다. 배고픔은 사라지지 않습니다.\n\n_+1:_ _1개_\n\n_+2:_ _2개_\n\n_+3:_ _3개_
actors.hero.talent.hib_thick.title=두꺼운 지방층
actors.hero.talent.hib_thick.desc=무기력으로 얻는 방어력이 더 늘어납니다. (기본 50%)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_
actors.hero.talent.hib_dream.title=긴 꿈
actors.hero.talent.hib_dream.desc=체력 재생이 더 빨라집니다.\n\n_+1:_ 재생 간격 _-1턴_\n\n_+2:_ _-2턴_\n\n_+3:_ _-3턴_
actors.hero.talent.hib_deep.title=깊은 동면
actors.hero.talent.hib_deep.desc=무기력의 최대치가 더 늘어납니다.\n\n_+1:_ _+10_\n\n_+2:_ _+20_\n\n_+3:_ _+30_
actors.hero.talent.lion_pounce.title=도약
actors.hero.talent.lion_pounce.desc=잠든 사자의 일격이 더 강해집니다.\n\n_+1:_ 무기력 1당 _6%_\n\n_+2:_ _7%_\n\n_+3:_ _8%_
actors.hero.talent.lion_wake.title=선잠
actors.hero.talent.lion_wake.desc=일격 후에도 무기력의 일부가 남습니다.\n\n_+1:_ _20%_\n\n_+2:_ _40%_\n\n_+3:_ _60%_
actors.hero.talent.lion_roar.title=포효
actors.hero.talent.lion_roar.desc=일격으로 적을 쓰러뜨리면 주변 3칸의 적이 _공포_에 빠집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_
actors.hero.talent.slumber_reach.title=꿈나라
actors.hero.talent.slumber_reach.desc=영원한 잠의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.slumber_deep.title=혼수
actors.hero.talent.slumber_deep.desc=영원한 잠에 빠진 적은 맞아도 잠시 움직이지 못합니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.slumber_rest.title=평온
actors.hero.talent.slumber_rest.desc=영원한 잠으로 재운 적 하나당 체력을 회복합니다.\n\n_+1:_ 최대 체력의 _5%_\n\n_+2:_ _10%_\n\n_+3:_ _15%_\n\n_+4:_ _20%_
actors.hero.talent.stag_reach.title=고인 시간
actors.hero.talent.stag_reach.desc=정체의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.stag_duration.title=끝없는 오후
actors.hero.talent.stag_duration.desc=정체의 지속 시간이 늘어납니다. (기본 6턴)\n\n_+1:_ _8턴_\n\n_+2:_ _10턴_\n\n_+3:_ _12턴_\n\n_+4:_ _14턴_
actors.hero.talent.stag_cripple.title=늪
actors.hero.talent.stag_cripple.desc=정체에 걸린 적이 _불구_가 됩니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.nap_shield.title=이불 속
actors.hero.talent.nap_shield.desc=철벽 낮잠의 방어막이 늘어납니다.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.nap_heal.title=개운함
actors.hero.talent.nap_heal.desc=철벽 낮잠을 자면 체력을 회복합니다.\n\n_+1:_ 최대 체력의 _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_\n\n_+4:_ _40%_
actors.hero.talent.nap_dreams.title=단꿈
actors.hero.talent.nap_dreams.desc=철벽 낮잠을 자면 베개가 충전됩니다.\n\n_+1:_ _0.5회분_\n\n_+2:_ _1회분_\n\n_+3:_ _1.5회분_\n\n_+4:_ _2회분_

actors.hero.abilities.sloth.eternalslumber.name=영원한 잠
actors.hero.abilities.sloth.eternalslumber.short_desc=보이는 _모든 적_을 깊은 잠에 빠뜨립니다.
actors.hero.abilities.sloth.eternalslumber.desc=4칸 안에 보이는 모든 적이 _마법의 잠_에 빠집니다. 잠든 적은 공격받으면 깨어납니다. 보스는 잠들지 않습니다.
actors.hero.abilities.sloth.stagnation.name=정체
actors.hero.abilities.sloth.stagnation.short_desc=세상을 나태의 속도에 맞춥니다. 보이는 적 전부가 _느려집니다_.
actors.hero.abilities.sloth.stagnation.desc=4칸 안에 보이는 모든 적이 _6턴_ 동안 감속됩니다. 보스에게도 통합니다.
actors.hero.abilities.sloth.fortifiednap.name=철벽 낮잠
actors.hero.abilities.sloth.fortifiednap.short_desc=웅크리고 낮잠에 들어 _큰 방어막_을 얻고 무기력을 _즉시 최대로_ 채웁니다.
actors.hero.abilities.sloth.fortifiednap.desc=무기력을 최대치로 채우고, _10 + 레벨 + 무기력_만큼의 방어막을 얻습니다.

actors.buffs.slothrepose.name=무기력
actors.buffs.slothrepose.desc_head=나태 점수: _%d_\n무기력: _%d/%d_ (방어력 _+%d_)\n베개 충전: _%d/%d_
actors.buffs.slothrepose.desc_stats=근접 추가 피해: _+%d_\n정확도: _+%d%%_\n최대 체력: _+%d_\n추가 방어력: _0~%d_\n회피: _+%d%%_
actors.buffs.slothrepose.pounce=덮치기
