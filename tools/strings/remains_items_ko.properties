items.remains.mawfang.name=부러진 아귀 이빨
items.remains.mawfang.desc=예전 식탐의 아귀에서 빠진 이빨입니다. 아직도 무언가를 씹고 싶어 하는 듯합니다.\n\n씹어 먹으면 _포만감이 150_ 차고 최대 체력의 _5%_를 회복합니다.
items.remains.meltedcard.name=녹아내린 카드 조각
items.remains.meltedcard.desc=불길에 녹아 뭉개진 황금 카드의 잔해입니다. 그래도 금은 금입니다.\n\n녹여 쓰면 _(층 수 × 20)_ 골드를 얻습니다.
items.remains.torndrumhead.name=찢어진 북가죽
items.remains.torndrumhead.desc=수없이 두드려 찢어진 전쟁 북의 가죽입니다. 한 번은 더 울릴 수 있을 것 같습니다.\n\n두드리면 주변 _3칸_ 안의 적이 _3턴_ 동안 서로 싸웁니다.
items.remains.crackedgem.name=금 간 왕관 보석
items.remains.crackedgem.desc=교만의 왕관에서 떨어져 나온 보석입니다. 금이 갔어도 그 오만한 빛은 여전합니다.\n\n사용하면 _30턴_ 안에 받는 다음 공격 _한 번_을 완전히 막아냅니다.
items.remains.brokenperfume.name=깨진 향수병
items.remains.brokenperfume.desc=깨진 향수병 바닥에 마지막 몇 방울이 남아 있습니다. 달콤한 향이 아직 진하게 풍깁니다.\n\n깨뜨리면 주변 _3칸_ 안의 적이 _5턴_ 동안 매혹됩니다.
items.remains.mirrorshard.name=시기의 거울 파편
items.remains.mirrorshard.desc=시기의 거울에서 떨어져 나온 날카로운 파편입니다. 비친 것을 탐내는 성질은 그대로입니다.\n\n사용하면 _4칸_ 안의 가장 가까운 적에게서 최대 체력의 _15%_만큼 생명력을 빼앗아 회복합니다.
items.remains.mirrorshard.nothing=파편에 비칠 적이 없다.
items.remains.pillowstuffing.name=터진 베개 솜
items.remains.pillowstuffing.desc=낡은 베개에서 삐져나온 솜뭉치입니다. 보기만 해도 눈꺼풀이 무거워집니다.\n\n흩뿌리면 주변 _3칸_ 안의 적이 _졸음_에 빠지고, 최대 체력의 _5%_를 회복합니다.
items.remains.crackedgem$ward.name=흠 없는 위엄
items.remains.crackedgem$ward.desc=다음에 받는 공격 한 번을 완전히 막아냅니다.\n\n남은 시간: %s턴
items.remains.crackedgem$ward.blocked=막아냈다!
