windows.wndblacksmith.sin_forge=_Sigil of Sin (%d favor):_ I can forge a seal holding the power of the sin you carry. Press it into any melee weapon, and you can take it off and move it later.
windows.wndblacksmith.sin_forge_verify=This'll take everything I've got. It'll use up all your favor. Sure about this?
