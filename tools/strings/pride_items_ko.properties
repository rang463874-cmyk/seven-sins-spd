items.pridecrown.name=오만의 왕관
items.pridecrown.desc=보석이 박힌 황금 왕관입니다. 유물/반지 칸에 착용하는 유물이며, 착용해야 기술을 쓸 수 있습니다.\n\n왕관은 _위엄_을 써서 하찮은 것들에게 명령을 내립니다. 위엄은 맞지 않는 동안 쌓이고 쌓인 만큼 원거리 피해를 올려 주지만, 맞는 순간 무너집니다. 위엄을 아낄지 쓸지는 당신의 몫입니다. 한 대도 맞지 않고 적을 쓰러뜨리면 _영광_이 쌓여 영구적으로 강해집니다.
items.pridecrown.ac_command=명령
items.pridecrown.prompt=어떤 명령을 내릴까요? (충전 %d/%d)
items.pridecrown.opt_command=왕명 (충전 %d)
items.pridecrown.opt_duel=결투 신청 (충전 %d)
items.pridecrown.opt_procession=행차 (충전 %d)
items.pridecrown.opt_decree=하명 (충전 %d)
items.pridecrown.prompt_command=무릎 꿇릴 적을 선택하세요
items.pridecrown.skill_disdain=멸시
items.pridecrown.skill_disdain_desc=멀리 있는 적에게 경멸의 시선을 던져 _%d~%d_ 피해를 줍니다. 위엄 보너스가 피해에 그대로 붙습니다. 손 하나 대지 않고 적을 쓰러뜨리면 _무결한 승리_로 인정됩니다.
items.pridecrown.prompt_disdain=멸시할 적을 선택하세요
items.pridecrown.prompt_duel=결투를 신청할 적을 선택하세요
items.pridecrown.prompt_procession=행차할 칸을 선택하세요 (최대 %d칸)
items.pridecrown.prompt_decree=공격을 금지할 적을 선택하세요
items.pridecrown.no_target=그곳에는 대상이 없다.
items.pridecrown.defiant=이 자는 왕명에 굴하지 않는다.
items.pridecrown.bad_cell=그곳으로는 행차할 수 없다.
items.pridecrown.vassal=%s(이)가 무릎 꿇고 충성을 맹세했다!
items.pridecrown.duel=%s에게 결투를 신청했다!
items.armor.pridearmor.name=교만의 망토
items.armor.pridearmor.desc=흰 담비 털로 장식한 화려한 망토입니다. 입은 자의 위엄을 한껏 드높입니다.
items.pridecrown.skill_header=위엄 %d / %d
items.pridecrown.skill_command=명령
items.pridecrown.skill_command_desc=적 하나를 _%d턴_ 동안 마비시킵니다. 군주는 크게 다친 적을 가신으로 삼습니다. 보스에게는 통하지 않습니다.
items.pridecrown.skill_duel=결투
items.pridecrown.skill_duel_desc=적 하나와 _12턴_ 동안 결투합니다. 결투 상대만 당신을 해칠 수 있고, 상대에게 주는 피해가 20% 늘어납니다.
items.pridecrown.skill_procession=행차
items.pridecrown.skill_procession_desc=최대 _%d칸_ 떨어진 빈칸으로 위풍당당하게 이동합니다.
items.pridecrown.skill_decree=하명
items.pridecrown.skill_decree_desc=적 하나의 다음 공격 _%d번_을 무효로 만듭니다.
items.pridecrown.skill_effigy=교만의 석상
items.pridecrown.skill_effigy_desc=영웅 전용. 4칸 안의 빈칸에 황금 석상(_체력 %d_, _%d턴_)을 세웁니다. 석상 주위 _%d칸_ 안의 모든 적이 당신 대신 석상을 공격합니다. 석상은 아군으로 치지 않으며, 석상을 때린 적은 불경한 자가 되지 않습니다. 석상은 한 번에 하나만 세울 수 있습니다.
items.pridecrown.prompt_effigy=석상을 세울 4칸 안의 빈칸을 선택하세요
