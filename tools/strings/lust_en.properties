actors.hero.heroclass.lust=lust
actors.hero.heroclass.lust_desc_short=Bearer of the sin of _Lust_. Lust _charms_ enemies into helplessness and _drains their life_ to grow permanently stronger.
actors.hero.heroclass.lust_desc=Lust starts with the _Alluring Perfume_, which takes no equipment slot. The perfume recharges over time, and its charges power _Glance_, _Scent_, _Drain_ and _Allure_.\n\n_Draining life_ from charmed enemies and _defeating charmed enemies_ builds desire, which raises melee damage, accuracy, max HP, armor and evasion without limit. Draining doesn't break the charm. Bosses and minibosses can't be charmed.\n\nLust starts with a _dagger_ and knows _potions of healing_ and _scrolls of lullaby_.
actors.hero.heroclass.lust_unlock=Lust is unlocked from the start.

actors.hero.herosubclass.siren=siren
actors.hero.herosubclass.siren_short_desc=Enemies charmed by the _Siren_ _attack other enemies_, and those fights build desire too.
actors.hero.herosubclass.siren_desc=Those enthralled by the Siren's song turn their blades on their own kind. Enemies charmed by the Siren seek out and attack nearby enemies that aren't charmed, and the damage they deal builds desire.\n\nThe Siren's talents strengthen charmed enemies' attacks, extend charms as they fight, or increase the desire gained.
actors.hero.herosubclass.dreamweaver=dreamweaver
actors.hero.herosubclass.dreamweaver_short_desc=Enemies charmed by the _Dreamweaver_ _fall asleep_, and sleeping enemies yield _50% more life_ when drained.
actors.hero.herosubclass.dreamweaver_desc=The Dreamweaver harvests life within dreams. Charmed enemies fall asleep, and draining a sleeping enemy takes _50%_ more life without waking it.\n\nThe Dreamweaver's talents increase draining further, lengthen charms, or recharge the perfume when draining sleeping enemies.

actors.hero.talent.lust_yearning.title=yearning
actors.hero.talent.lust_yearning.desc=_+1:_ Desire gained is increased by _15%_.\n\n_+2:_ Desire gained is increased by _30%_.
actors.hero.talent.lust_linger.title=lingering scent
actors.hero.talent.lust_linger.desc=Charms from the perfume last longer.\n\n_+1:_ _25%_ longer\n\n_+2:_ _50%_ longer
actors.hero.talent.lust_sweet.title=sweet vitality
actors.hero.talent.lust_sweet.desc=Draining heals more.\n\n_+1:_ _20%_ more\n\n_+2:_ _40%_ more
actors.hero.talent.lust_blush.title=heartthrob
actors.hero.talent.lust_blush.desc=Your attacks deal more damage to charmed enemies.\n\n_+1:_ _10%_\n\n_+2:_ _20%_
actors.hero.talent.lust_bottle.title=larger bottle
actors.hero.talent.lust_bottle.desc=Increases the perfume's maximum charges. (base 3)\n\n_+1:_ _4_\n\n_+2:_ _5_
actors.hero.talent.lust_refill.title=refill
actors.hero.talent.lust_refill.desc=The perfume recharges faster.\n\n_+1:_ _20%_ faster\n\n_+2:_ _40%_ faster
actors.hero.talent.lust_waft.title=wafting scent
actors.hero.talent.lust_waft.desc=Scent covers a larger area. (base 2 tiles)\n\n_+1:_ _3 tiles_\n\n_+2:_ _4 tiles_
actors.hero.talent.lust_thirst.title=thirst
actors.hero.talent.lust_thirst.desc=Drain takes more life.\n\n_+1:_ _20%_ more\n\n_+2:_ _40%_ more
actors.hero.talent.lust_embrace.title=embrace
actors.hero.talent.lust_embrace.desc=Moving with Allure grants shielding.\n\n_+1:_ _10%_ of max HP\n\n_+2:_ _20%_ of max HP
actors.hero.talent.lust_obsession.title=obsession
actors.hero.talent.lust_obsession.desc=All stat bonuses from desire are increased, including desire already earned.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.lust_heartstrings.title=heartstrings
actors.hero.talent.lust_heartstrings.desc=Defeating a charmed enemy recharges the perfume.\n\n_+1:_ _0.2 charges_\n\n_+2:_ _0.4 charges_\n\n_+3:_ _0.6 charges_
actors.hero.talent.siren_song.title=siren song
actors.hero.talent.siren_song.desc=Enemies charmed by the Siren deal more damage to other enemies.\n\n_+1:_ _15%_\n\n_+2:_ _30%_\n\n_+3:_ _45%_
actors.hero.talent.siren_echo.title=echo
actors.hero.talent.siren_echo.desc=Each time a charmed enemy attacks another enemy, its charm is extended.\n\n_+1:_ _1 turn_\n\n_+2:_ _2 turns_\n\n_+3:_ _3 turns_
actors.hero.talent.siren_devotion.title=devotion
actors.hero.talent.siren_devotion.desc=Desire from charmed enemies' fights is increased.\n\n_+1:_ _50%_\n\n_+2:_ _100%_\n\n_+3:_ _150%_
actors.hero.talent.dream_deep.title=deep sleep
actors.hero.talent.dream_deep.desc=Draining sleeping enemies takes even more life. (base 50%)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_
actors.hero.talent.dream_lullaby.title=lullaby
actors.hero.talent.dream_lullaby.desc=The Dreamweaver's charms last longer.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_
actors.hero.talent.dream_reverie.title=reverie
actors.hero.talent.dream_reverie.desc=Draining a sleeping enemy recharges the perfume.\n\n_+1:_ _0.15 charges_\n\n_+2:_ _0.3 charges_\n\n_+3:_ _0.45 charges_
actors.hero.talent.dance_reach.title=grand stage
actors.hero.talent.dance_reach.desc=Enchanting Dance reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.dance_encore.title=encore
actors.hero.talent.dance_encore.desc=Charms from Enchanting Dance last longer. (base 6 turns)\n\n_+1:_ _8 turns_\n\n_+2:_ _10 turns_\n\n_+3:_ _12 turns_\n\n_+4:_ _14 turns_
actors.hero.talent.dance_daze.title=dizzying
actors.hero.talent.dance_daze.desc=Enemies who watch Enchanting Dance suffer _vertigo_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.siphon_power.title=indulgence
actors.hero.talent.siphon_power.desc=Soul Siphon takes more life.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.siphon_shield.title=overflowing vitality
actors.hero.talent.siphon_shield.desc=Overhealing from Soul Siphon becomes shielding.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.siphon_charm.title=captive souls
actors.hero.talent.siphon_charm.desc=Enemies hit by Soul Siphon stay charmed longer.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.break_power.title=shattered
actors.hero.talent.break_power.desc=Heartbreak deals more damage.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.break_fear.title=betrayal
actors.hero.talent.break_fear.desc=Enemies that survive Heartbreak are _terrified_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.break_desire.title=memory of pain
actors.hero.talent.break_desire.desc=Each heart broken by Heartbreak grants desire.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_\n\n_+4:_ _4_

actors.hero.abilities.lust.enchantingdance.name=enchanting dance
actors.hero.abilities.lust.enchantingdance.short_desc=Charms _every visible enemy_.
actors.hero.abilities.lust.enchantingdance.desc=Charms every visible enemy within 4 tiles for _6 turns_. Perfume talents and subclass effects also apply. Bosses can't be charmed.
actors.hero.abilities.lust.soulsiphon.name=soul siphon
actors.hero.abilities.lust.soulsiphon.short_desc=Drains life from _every visible charmed enemy_ at once.
actors.hero.abilities.lust.soulsiphon.desc=Uses Drain at _1.5x_ power on every charmed enemy in sight. Their charms are not broken.
actors.hero.abilities.lust.soulsiphon.no_targets=You don't see any charmed enemies.
actors.hero.abilities.lust.heartbreak.name=heartbreak
actors.hero.abilities.lust.heartbreak.short_desc=Breaks the charm on _every visible charmed enemy_, dealing damage. The more charm they had left, the more it hurts.
actors.hero.abilities.lust.heartbreak.desc=Ends the charm on every charmed enemy in sight, dealing damage based on your level plus _3 per remaining turn of charm_.
actors.hero.abilities.lust.heartbreak.no_targets=You don't see any charmed enemies.

actors.buffs.lustdesire.name=desire
actors.buffs.lustdesire.desc_head=Desire: _%d_\nPerfume charges: _%d/%d_
actors.buffs.lustdesire.desc_stats=Bonus melee damage: _+%d_\nAccuracy: _+%d%%_\nMax HP: _+%d_\nBonus armor: _0-%d_\nEvasion: _+%d%%_
