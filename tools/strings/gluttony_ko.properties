actors.hero.heroclass.gluttony_desc=식탐은 _포식자의 아귀_를 유물 칸에 착용한 채 시작합니다. 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다. 아귀를 사용해 착용하지 않은 장비를 삼키면 그 장비의 _등급과 강화 수치_에 따라 포식 점수를 얻습니다.\n\n_무기_를 삼키면 근접 추가 피해와 정확도가, _방어구_를 삼키면 최대 체력, 방어력, 회피가, _장신구_(반지·아티팩트·트링킷)를 삼키면 모든 스탯이 조금씩 오릅니다. 저주받은 장비는 절반만 흡수됩니다.\n\n아귀로 포만감을 써서 적을 _물어뜯어_ 체력을 빼앗을 수도 있습니다.\n\n식탐은 _낡은 소검_을 들고 시작하며, _치유 물약_과 _저주 해제 주문서_를 알아볼 수 있습니다.
