actors.hero.heroclass.gluttony_desc_short=칠죄종 중 _식탐_의 죄를 짊어진 자. 식탐은 _무엇이든 먹어치워_ 강해지는 사냥꾼입니다. 물약, 음식, 주문서 같은 _소모품_을 쓸 때마다 _영구적인 스탯_을 얻고, 해로운 물약마저 힘으로 바꿉니다.
actors.hero.heroclass.gluttony_desc=식탐은 _포식자의 아귀_를 유물 칸에 착용한 채 시작합니다. 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다.\n\n식탐은 _소모품_으로 성장합니다. _물약_은 근접 피해와 정확도를, _음식과 씨앗_은 최대 체력과 방어력을, _주문서와 룬석_은 모든 스탯을 조금씩, 특히 회피를 올립니다. 처음 먹어 보는 종류는 _미식 도감_에 등록되고, 도감을 채울수록 새 능력이 열립니다.\n\n무엇이든 먹는 식탐에게는 _해로운 물약과 주문서도 버프_가 됩니다. 아귀의 기술은 포만감을 대가로 씁니다.\n\n식탐은 _낡은 소검_을 들고 시작하며, _치유 물약_과 _저주 해제 주문서_를 알아볼 수 있습니다.
actors.hero.herosubclass.gourmand=미식가
actors.hero.herosubclass.gourmand_short_desc=_미식가_는 음식으로 _포만감을 50% 더_ 얻고, 음식과 씨앗에서 _2배의 포식 점수_를 얻습니다.
actors.hero.herosubclass.gourmand_desc=미식가는 한 입 한 입을 음미하는 포식자입니다. 음식을 먹으면 포만감을 _50%_ 더 얻고, 음식과 씨앗으로 얻는 포식 점수가 _2배_가 됩니다.\n\n전용 특성으로 음식에서 더 많은 것을 얻어냅니다.
actors.hero.herosubclass.inheritor=연금 포식자
actors.hero.herosubclass.inheritor_short_desc=_연금 포식자_는 물약, 주문서, 룬석에서 _포식 점수를 50% 더_ 얻습니다.
actors.hero.herosubclass.inheritor_desc=연금 포식자는 마법의 맛을 아는 포식자입니다. 물약, 주문서, 룬석으로 얻는 포식 점수가 _50%_ 늘어납니다.\n\n전용 특성으로 물약과 주문서의 힘을 더 깊이 끌어냅니다.
actors.hero.talent.predator_feast.title=포식의 만찬
actors.hero.talent.predator_feast.desc=_+1:_ 음식을 먹으면 최대 체력의 _10%_를 회복합니다.\n\n_+2:_ 음식을 먹으면 최대 체력의 _20%_를 회복합니다.
actors.hero.talent.predator_taste.title=감식의 혀
actors.hero.talent.predator_taste.desc=_+1:_ 소모품을 쓸 때마다 가방 속 미감정 장비 하나의 _저주 여부_를 알아냅니다.\n\n_+2:_ 소모품을 쓸 때마다 가방 속 미감정 장비 하나를 _감정_합니다.
actors.hero.talent.predator_fang.title=굶주린 송곳니
actors.hero.talent.predator_fang.desc=소모품을 쓸 때마다, 적을 죽일 때마다 배가 찹니다.\n\n_+1:_ 소모품당 포만감 _15_, 처치당 _10_\n\n_+2:_ 소모품당 포만감 _30_, 처치당 _20_
actors.hero.talent.predator_hide.title=단단한 위장
actors.hero.talent.predator_hide.desc=_+1:_ 소모품을 쓰면 최대 체력의 _4%_만큼 방어막을 얻습니다.\n\n_+2:_ 소모품을 쓰면 최대 체력의 _8%_만큼 방어막을 얻습니다.
actors.hero.talent.predator_gluttony.title=든든한 한 끼
actors.hero.talent.predator_gluttony.desc=음식을 먹는 데 _3턴_이 아니라 _1턴_이 걸리고, 음식으로 얻는 포만감이 늘어납니다.\n\n_+1:_ 포만감 _20%_ 추가\n\n_+2:_ 포만감 _40%_ 추가
actors.hero.talent.predator_curse_eater.title=위산 체질
actors.hero.talent.predator_curse_eater.desc=_+1:_ 중독, 점액, 부식으로 받는 피해가 _절반_이 됩니다.\n\n_+2:_ 중독, 점액, 부식에 _면역_이 됩니다.
actors.hero.talent.predator_efficiency.title=효율적인 소화
actors.hero.talent.predator_efficiency.desc=_+1:_ 모든 포식 점수가 _10%_ 증가합니다.\n\n_+2:_ 모든 포식 점수가 _20%_ 증가합니다.
actors.hero.talent.predator_scraps.title=넓은 목구멍
actors.hero.talent.predator_scraps.desc=통째로 삼키기로 얻는 포식 점수가 늘어납니다. (기본 3배)\n\n_+1:_ _4.5배_\n\n_+2:_ _6배_
actors.hero.talent.predator_instinct.title=사냥 본능
actors.hero.talent.predator_adapt.title=고른 영양
actors.hero.talent.predator_adapt.desc=포식 점수를 얻을 때 나머지 두 분류에도 일부가 쌓입니다.\n\n_+1:_ 각각 얻은 점수의 _5%_\n\n_+2:_ 각각 _10%_\n\n_+3:_ 각각 _15%_
actors.hero.talent.gourmand_second_stomach.title=제2의 위장
actors.hero.talent.gourmand_second_stomach.desc=_+1:_ 모든 포식 점수가 추가로 _10%_ 증가합니다.\n\n_+2:_ 모든 포식 점수가 추가로 _20%_ 증가합니다.\n\n_+3:_ 모든 포식 점수가 추가로 _30%_ 증가합니다.
actors.hero.talent.gourmand_leftovers.title=남김없이
actors.hero.talent.gourmand_leftovers.desc=음식을 먹을 때마다 최대 체력이 영구히 증가합니다.\n\n_+1:_ 한 번에 _+1_\n\n_+2:_ 한 번에 _+2_\n\n_+3:_ 한 번에 _+3_
actors.hero.talent.gourmand_food_coma.title=식곤증
actors.hero.talent.gourmand_food_coma.desc=음식을 먹은 뒤 처음 받는 공격의 피해가 줄어듭니다.\n\n_+1:_ _20%_ 감소\n\n_+2:_ _35%_ 감소\n\n_+3:_ _50%_ 감소
actors.hero.talent.inheritor_resonance.title=공명
actors.hero.talent.inheritor_resonance.desc=물약을 마시면 일정 확률로 _신속_, _축복_, _방어막_ 중 하나를 추가로 얻습니다.\n\n_+1:_ _15%_ 확률\n\n_+2:_ _30%_ 확률\n\n_+3:_ _45%_ 확률
actors.hero.talent.inheritor_memory.title=오래가는 변이
actors.hero.talent.inheritor_memory.desc=해로운 물약과 주문서가 바뀐 버프의 지속 시간이 늘어납니다.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_
actors.hero.talent.inheritor_purify.title=정화의 맛
actors.hero.talent.inheritor_purify.desc=_+1:_ 주문서를 읽으면 해로운 상태 이상 _하나_를 없앱니다.\n\n_+2:_ 주문서를 읽으면 해로운 상태 이상을 _모두_ 없앱니다.\n\n_+3:_ 추가로 최대 체력의 _10%_만큼 방어막을 얻습니다.
actors.hero.talent.bite_digest.desc=탐식의 아가리로 적을 처치하면 얻는 음식 점수가 늘어납니다. (기본 2)\n\n_+1:_ _3점_\n\n_+2:_ _4점_\n\n_+3:_ _5점_\n\n_+4:_ _6점_
actors.hero.abilities.predator.gorgebite.short_desc=근처의 적에게 달려들어 _물어뜯습니다._ 처치하면 _음식 점수_를 얻고 체력을 회복합니다.
actors.hero.abilities.predator.gorgebite.devoured=음식 +%s
actors.hero.abilities.predator.irongut.desc=_10 + 레벨 + 음식 점수_만큼의 방어막을 즉시 얻습니다. 음식을 많이 먹을수록 강해집니다.
actors.buffs.predatorstomach.name=포식
actors.buffs.predatorstomach.desc_head=지금까지 소모품을 _%d개_ 먹었습니다.
actors.buffs.predatorstomach.desc_points=포식 점수\n물약: _%s_   음식: _%s_   주문서: _%s_
actors.buffs.predatorstomach.desc_codex=미식 도감: _%d/%d종_ (아귀의 턱에서 확인)
actors.buffs.predatorstomach.cat_0=물약
actors.buffs.predatorstomach.cat_1=음식
actors.buffs.predatorstomach.cat_2=주문서
actors.buffs.predatorstomach.codex_new=미식 도감에 %s 등록! (%d종)
actors.buffs.predatorstomach.codex_unlock=미식 도감 보상: %s
actors.buffs.predatorstomach.codex_5=소모품을 쓸 때마다 체력 3% 회복
actors.buffs.predatorstomach.codex_10=씨앗을 먹어 이로운 효과만 얻기
actors.buffs.predatorstomach.codex_20=바뀐 버프 지속 시간 +50%
actors.buffs.predatorstomach.codex_30=주문서를 읽을 때 15% 확률로 보존 (강화·변환 제외)
actors.buffs.predatorstomach.codex_40=아귀 기술의 포만감 비용 절반
actors.buffs.predatorstomach.codex_50=만찬: 소모품마다 포만감 30과 체력 5% 방어막
actors.buffs.predatorstomach.codex_60=물약 효과가 25% 확률로 두 번 발동 (성장 물약 제외)
actors.buffs.predatorstomach.codex_70=물어뜯기 흡혈량 2배 (입힌 피해의 60%)
actors.buffs.predatorstomach.codex_80=소모품을 쓸 때마다 5% 확률로 죄의 정수를 얻음
actors.buffs.predatorstomach.codex_alchemy=죄악의 미식가 (죄악 연금술 %d/%d종 맛봄): 모든 식탐 점수 +20%%
actors.buffs.predatorstomach.codex_perks=_보상_ (맛본 종류 수)
actors.buffs.predatorstomach.codex_unknown=???
actors.buffs.predatorstomach.codex_note_new=_식탐 도감: 아직 맛보지 않음!_ 먹으면 새 항목이 채워집니다.
actors.buffs.predatorstomach.codex_note_known=식탐 도감: 이미 맛봄.
actors.buffs.predatorstomach.codex_note_unknown=식탐 도감: 감정해야 맛본 적이 있는지 알 수 있습니다.
actors.buffs.predatorstomach.essence_found=바닥에 죄스러운 무언가가 남았다. 죄의 정수를 얻었다!
actors.buffs.predatorstomach.sec_potions=물약
actors.buffs.predatorstomach.sec_exotic_potions=특수 물약
actors.buffs.predatorstomach.sec_brews=양조주와 영약
actors.buffs.predatorstomach.sec_scrolls=주문서
actors.buffs.predatorstomach.sec_exotic_scrolls=특수 주문서
actors.buffs.predatorstomach.sec_stones=룬석
actors.buffs.predatorstomach.sec_seeds=씨앗
actors.buffs.predatorstomach.sec_food=음식
actors.buffs.predatorstomach.sec_sins=죄악 연금술
actors.buffs.gluttondebt.name=허기 부채
actors.buffs.gluttondebt.desc=무리한 되새김질로 위장이 감당할 수 있는 것보다 많이 먹어 치웠습니다. 부채를 다 갚을 때까지 약화, 취약, 저주(헥스)에 걸리며, 얻는 포만감은 모두 부채부터 갚습니다.\n\n남은 부채: _포만감 %d_
actors.buffs.gluttondebt.repaid=마침내 위장에 진 빚을 다 갚았다.
actors.buffs.gluttondebt.repaid_status=청산!
actors.buffs.predatorstomach.converted=식탐의 위장이 해로운 힘을 자신의 것으로 바꿨다!
actors.buffs.predatorstomach.echo=맛이 입안에 맴돈다... 효과가 한 번 더 발동했다!
actors.buffs.predatorstomach.preserved=%s(을)를 다 읽었지만 사라지지 않았다!
actors.buffs.predatorstomach.ac_eat_seed=먹기
actors.buffs.predatorstomach$fang.desc=방금 먹은 것 덕분에 송곳니가 날카롭습니다. 다음 _%d번_의 근접 공격이 더 강해집니다.
actors.buffs.predatorstomach$coma.desc=배가 불러 몸이 둔해졌지만 그만큼 단단합니다. 다음에 받는 공격의 피해가 _%d%%_ 줄어듭니다.
actors.buffs.gluttonimbue$venom.name=독의 위장
actors.buffs.gluttonimbue$venom.desc=삼킨 독가스가 몸에 스며들었습니다. 근접 공격이 적을 _중독_시키고, 중독에 면역입니다.\n\n남은 턴: %s.
actors.buffs.gluttonimbue$numbing.name=마비의 위장
actors.buffs.gluttonimbue$numbing.desc=삼킨 마비 가스가 몸에 스며들었습니다. 근접 공격이 _25%%_ 확률로 적을 _마비_시키고, 마비에 면역입니다.\n\n남은 턴: %s.
actors.buffs.gluttonimbue$acid.name=부식의 위장
actors.buffs.gluttonimbue$acid.desc=삼킨 부식 가스가 몸에 스며들었습니다. 근접 공격이 적을 _부식_시키고, 부식에 면역입니다.\n\n남은 턴: %s.
actors.buffs.gluttonimbue$frenzy.name=광폭화
actors.buffs.gluttonimbue$frenzy.desc=분노의 주문서를 씹어 삼켰습니다. 근접 공격 피해가 _35%%_ 증가합니다.\n\n남은 턴: %s.
