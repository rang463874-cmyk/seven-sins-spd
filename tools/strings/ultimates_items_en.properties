###### Seven Sins: ultimates ######
sins.ultimateskills.can_learn=You reached level %d! Pick an ultimate with _Learn Ultimate_ on the skill bar.
sins.ultimateskills.learn=Learn Ultimate
sins.ultimateskills.learn_desc=At _level %d_ and _level %d_ you pick one of three ultimates of your class. The choice is permanent.\n\nUltimates cost no resource, but need a cooldown before they can be used again.
sins.ultimateskills.choose_title=Level %d Ultimate
sins.ultimateskills.choose_msg=Choose one ultimate to learn. The choice is permanent. (The button on the right shows its description.)
sins.ultimateskills.learned=You learned the ultimate _%s_!
sins.ultimateskills.cooldown=cooldown %d turns (%d left)
sins.ultimateskills.cooldown_info=Cooldown: _%d turns_
sins.ultimateskills.prompt=Choose a target
sins.ultimateskills.no_target=There is no target there.
sins.ultimateskills.not_adjacent=It only works on an adjacent enemy.
sins.ultimateskills.no_boss=It doesn't work on bosses.
sins.ultimateskills.no_charmed=No charmed enemy is in sight.
sins.ultimateskills.no_room=There is no room to summon.
sins.ultimateskills.no_enemies=There are no enemies in sight.
sins.ultimateskills.blocked=blocked!
actors.buffs.ultimatebook.effect_desc=%s\n\nTurns remaining: %s.
actors.buffs.ultimatebook.effect_count=Blocks left: _%d_
sins.ultimate.devour=Devour
sins.ultimate.devour_desc=Swallow an adjacent enemy. A regular enemy at _35%%_ HP or less is eaten at once, healing _20%%_ of your max HP and filling your stomach. Otherwise it takes _%d-%d_ damage.
sins.ultimate.acid_rain=Acid Deluge
sins.ultimate.acid_rain_desc=Visible enemies within _3 tiles_ take _%d-%d_ damage and are covered in _ooze_ and _weakened_ for 10 turns.
sins.ultimate.iron_stomach=Iron Stomach
sins.ultimate.iron_stomach_desc=For _20 turns_ you take _35%_ less damage.
sins.ultimate.iron_stomach_buff=You take 35% less damage.
sins.ultimate.abyss_maw=Abyssal Maw
sins.ultimate.abyss_maw_desc=Visible enemies within _5 tiles_ are dragged next to you and take _%d-%d_ damage. Regular enemies left at _25%%_ HP or less are swallowed.
sins.ultimate.feast=Grand Feast
sins.ultimate.feast_desc=Fills your stomach and HP, cures every harmful state and gives a shield of _25%_ of your max HP.
sins.ultimate.glutton_avatar=Avatar of Gluttony
sins.ultimate.glutton_avatar_desc=For _20 turns_ you deal _50%_ more damage and heal _25%_ of the damage your attacks deal.
sins.ultimate.glutton_avatar_buff=+50% damage dealt, attacks heal 25% of their damage.
sins.ultimate.gold_storm=Golden Storm
sins.ultimate.gold_storm_desc=Visible enemies within _4 tiles_ are pelted with gold for _%d-%d_ damage, +1 per 100 gold you carry (at most 3x your level).
sins.ultimate.bounty=Bounty
sins.ultimate.bounty_desc=Put a bounty on an enemy for _30 turns_. It takes _30%%_ more damage, and when it dies it drops _%d_ gold and fills _25%%_ of your payment limit.
sins.ultimate.bounty_buff=Takes 30% more damage and drops gold on death.
sins.ultimate.gold_armor=Golden Armor
sins.ultimate.gold_armor_desc=For _20 turns_ damage you take is paid from the _payment limit_ first (1 limit per damage).
sins.ultimate.gold_armor_buff=Damage taken is paid from the payment limit.
sins.ultimate.midas=Midas Touch
sins.ultimate.midas_desc=Turn a visible enemy to gold. A regular enemy dies at once and becomes _%d_ gold. Bosses and elites take _15%%_ of their max HP as damage.
sins.ultimate.compound=Compound Interest
sins.ultimate.compound_desc=Fills the payment limit and earns _10%%_ of your carried gold as interest (at most _%d_ gold).
sins.ultimate.golden_age=Golden Age
sins.ultimate.golden_age_desc=For _25 turns_ every payment skill is _free_ and you deal _30%_ more damage.
sins.ultimate.golden_age_buff=Payment skills are free and you deal 30% more damage.
sins.ultimate.quake=Earthshaker
sins.ultimate.quake_desc=Strike the ground: enemies within _2 tiles_ take _%d-%d_ damage and are paralysed for _2 turns_ (bosses aren't paralysed).
sins.ultimate.blood_rage=Blood Rage
sins.ultimate.blood_rage_desc=Fills your rage, and for _20 turns_ you deal _40%_ more damage but take _15%_ more.
sins.ultimate.blood_rage_buff=+40% damage dealt, +15% damage taken.
sins.ultimate.vendetta=Brand of Vendetta
sins.ultimate.vendetta_desc=Brand an enemy for _25 turns_. It takes _50%_ more damage from everything, and its death fills your rage.
sins.ultimate.vendetta_buff=Takes 50% more damage from everything.
sins.ultimate.berserk=Berserker
sins.ultimate.berserk_desc=For _15 turns_ your HP can't drop below _1_ and you deal _50%_ more damage.
sins.ultimate.berserk_buff=You can't fall and deal 50% more damage.
sins.ultimate.eruption=Wrath Eruption
sins.ultimate.eruption_desc=Unleash all your rage: visible enemies within _6 tiles_ take _%d-%d_ + _60%% of your rage_ as damage.
sins.ultimate.war_drums=Drums of War
sins.ultimate.war_drums_desc=Visible regular enemies within _8 tiles_ go berserk for _15 turns_ and fight each other.
sins.ultimate.judgment=Royal Judgment
sins.ultimate.judgment_desc=Fire a ray of judgment at an enemy for _%d-%d_ damage, boosted by dignity.
sins.ultimate.kneel=Kneel!
sins.ultimate.kneel_desc=Every regular enemy in sight is paralysed for _3 turns_. Bosses and elites are weakened for _5 turns_.
sins.ultimate.aegis=Inviolable
sins.ultimate.aegis_desc=For _30 turns_ the next _3_ attacks from enemies are blocked completely.
sins.ultimate.aegis_buff=Attacks from enemies are blocked completely.
sins.ultimate.blade_rain=Rain of Blades
sins.ultimate.blade_rain_desc=Every enemy in sight is struck by falling blades for _%d-%d_ damage.
sins.ultimate.absolute=Absolute Monarchy
sins.ultimate.absolute_desc=Fills your dignity, and for _25 turns_ being hurt doesn't shatter it.
sins.ultimate.absolute_buff=Being hurt doesn't shatter your dignity.
sins.ultimate.divine_right=Divine Right
sins.ultimate.divine_right_desc=For _20 turns_ your attacks never miss and deal _40%_ more damage.
sins.ultimate.divine_right_buff=Attacks never miss and deal 40% more damage.
sins.ultimate.dance=Enchanting Dance
sins.ultimate.dance_desc=Visible regular enemies within _3 tiles_ are charmed for _6 turns_.
sins.ultimate.blood_feast=Blood Feast
sins.ultimate.blood_feast_desc=Drain _%d-%d_ life from every charmed enemy in sight and heal as much as you took.
sins.ultimate.shadow_dance=Shadow Dance
sins.ultimate.shadow_dance_desc=For _15 turns_ your evasion is _doubled_.
sins.ultimate.shadow_dance_buff=Your evasion is doubled.
sins.ultimate.thrall=Slave of Love
sins.ultimate.thrall_desc=A regular enemy becomes your ally for good. Doesn't work on bosses and elites.
sins.ultimate.crimson_night=Crimson Night
sins.ultimate.crimson_night_desc=For _20 turns_ your attacks heal _30%_ of the damage they deal.
sins.ultimate.crimson_night_buff=Attacks heal 30% of their damage.
sins.ultimate.fatal_kiss=Fatal Kiss
sins.ultimate.fatal_kiss_desc=Kiss an adjacent enemy for damage equal to _40%%_ of your max HP (_%d_) and heal as much as you took.
sins.ultimate.flood=Flood of Envy
sins.ultimate.flood_desc=Fills your jealousy gauge.
sins.ultimate.mirror_images=Mirror Images
sins.ultimate.mirror_images_desc=Summon _2_ mirror images (nightmare puppets) that fight beside you for _25 turns_.
sins.ultimate.evil_eye=Evil Eye
sins.ultimate.evil_eye_desc=Glare at an enemy: it is _weakened_, _vulnerable_ and _hexed_ for _15 turns_.
sins.ultimate.usurp=Usurp
sins.ultimate.usurp_desc=Steal a visible enemy's life. A regular enemy dies at once and you gain a shield of half its max HP (at most half of yours). Bosses and elites take _15%_ of their max HP as damage.
sins.ultimate.reflection=Reflection
sins.ultimate.reflection_desc=For _15 turns_ _50%_ of the damage enemies deal to you is dealt back to them.
sins.ultimate.reflection_buff=50% of damage taken is dealt back to the attacker.
sins.ultimate.envy_storm=Storm of Envy
sins.ultimate.envy_storm_desc=Every enemy in sight takes _%d-%d_ damage, +_3%%_ per monster registered in your bestiary.
sins.ultimate.slumber=Deep Slumber
sins.ultimate.slumber_desc=Every regular enemy in sight falls into a deep sleep.
sins.ultimate.legion=Dream Legion
sins.ultimate.legion_desc=Summon _3_ nightmare puppets that fight beside you for _30 turns_.
sins.ultimate.reverie=Reverie
sins.ultimate.reverie_desc=Heal _40%_ of your max HP and gain a shield of _20%_, then doze off for _3 turns_.
sins.ultimate.eternal_sleep=Eternal Sleep
sins.ultimate.eternal_sleep_desc=Lull an enemy into eternal sleep. A sleeping regular enemy dies at once; any other takes _%d-%d_ damage.
sins.ultimate.nightmare=Nightmare
sins.ultimate.nightmare_desc=Every enemy in sight takes _%d-%d_ damage, and regular enemies are terrified for _10 turns_.
sins.ultimate.daydream=Daydream
sins.ultimate.daydream_desc=For _25 turns_ your allies deal _double_ damage and take _half_.
sins.ultimate.daydream_buff=Allies deal double damage and take half.
sins.ultimate.legion_goetia=Legion of the Goetia
sins.ultimate.legion_goetia_desc=Summons the _%d strongest demons_ recorded in the Lemegeton at once, for _%d turns_. They ignore the summon limit.
sins.ultimate.eternal_circle=Eternal Circle
sins.ultimate.eternal_circle_desc=For _%d turns_ casting does not erase the circle: the same spell can be cast again right away, and spells cost _half_ the mana.
sins.ultimate.eternal_circle_buff=Casting keeps the circle; spells cost half the mana.
sins.ultimate.ring_command=Command of the Ring
sins.ultimate.ring_command_desc=Binds a regular enemy to your will: it fights for you for _%d turns_. A boss or miniboss is instead _paralysed for %d turns_ and made vulnerable.
sins.ultimate.brass_vessel=Brass Vessel
sins.ultimate.brass_vessel_desc=Seals the target into Solomon's brass vessel. A regular enemy is sealed at once and counts as slain (a demon is recorded in the Lemegeton). A boss is bound for _%d turns_ and takes _double_ damage meanwhile; one that cannot be bound takes heavy damage instead.
sins.ultimate.brass_vessel_buff=Bound in the brass vessel: takes double damage.
sins.ultimate.magnum_opus=Magnum Opus
sins.ultimate.magnum_opus_desc=Every enemy in sight takes _%d-%d_ damage (grows with wisdom). Regular enemies left under a quarter of their health turn into salt and leave _%d gold_.
sins.ultimate.throne_of_wisdom=Throne of Wisdom
sins.ultimate.throne_of_wisdom_desc=For _%d turns_ you can use _all three principles_, even unlearned ones, drawing symbols takes no time and mana regenerates _three times_ as fast.
sins.ultimate.throne_of_wisdom_buff=All principles usable, free drawing, mana x3.
