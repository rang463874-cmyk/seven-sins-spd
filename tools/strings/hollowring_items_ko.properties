items.rings.hollowring.desc=드워프 왕이 품고 있던, 보석이 빠진 텅 빈 고리입니다. 다른 반지를 먹이면 그 반지는 사라지고, 고리가 그 반지의 힘을 배웁니다.\n\n같은 종류를 다시 먹이면 더 높은 강화 단계를 따릅니다. 각 힘은 _먹인 단계 - 1_로 작동하고, 열두 종류를 모두 먹이면 _열두 왕의 반지_가 되어 모든 힘이 _먹인 단계 + 1_로 작동합니다.
items.rings.hollowring.status=먹인 반지: _%d/%d_
items.rings.hollowring.status_complete=열두 왕의 반지: 모든 힘이 깨어났습니다. (%d/%d)
items.rings.hollowring.missing=%s: 아직 없음
items.rings.hollowring.power=%s: 먹인 단계 +%d, 작동 단계 _+%d_
items.rings.hollowring.ac_feed=먹이기
items.rings.hollowring.prompt=고리에 먹일 반지를 고르세요
items.rings.hollowring.fed=고리가 %s의 힘을 배웠다. (+%d)
items.rings.hollowring.completed=열두 반지의 힘이 하나로 모였다! 텅 빈 고리가 열두 왕의 반지가 되었다.
