virtues.virtue.humility=humility
virtues.virtue.charity=charity
virtues.virtue.chastity=chastity
virtues.virtue.patience=patience
virtues.virtue.temperance=temperance
virtues.virtue.kindness=kindness
virtues.virtue.diligence=diligence
virtues.virtue.humility_angel=Michael
virtues.virtue.charity_angel=Raguel
virtues.virtue.chastity_angel=Gabriel
virtues.virtue.patience_angel=Uriel
virtues.virtue.temperance_angel=Raphael
virtues.virtue.kindness_angel=Jeremiel
virtues.virtue.diligence_angel=Sariel
actors.mobs.virtues.archangelboss.humility_notice=Once I cast down the morning star. Today I cast down you.
actors.mobs.virtues.archangelboss.humility_notice_own=So the crown has found a new head. It will fall as the first one did.
actors.mobs.virtues.archangelboss.humility_phase=Who is like God? Not you!
actors.mobs.virtues.archangelboss.humility_phase_own=Bow your head, little king!
actors.mobs.virtues.archangelboss.humility_death=The amulet... is yours to bear... humbly...
actors.mobs.virtues.archangelboss.humility_death_own=Even the proud... may yet learn to kneel...
actors.mobs.virtues.archangelboss.sig_humility=_Signature, Humbling Light:_ a wide cross of light that weakens and strips every blessing.
actors.mobs.virtues.archangelboss.skill_humility=Humbling light!
actors.mobs.virtues.archangelboss.charity_notice=All you carry was given to you. I have come to collect it.
actors.mobs.virtues.archangelboss.charity_notice_own=A dragon on a heap of gold. How small you are beneath it.
actors.mobs.virtues.archangelboss.charity_phase=Give, and it shall be given!
actors.mobs.virtues.archangelboss.charity_phase_own=Open your hands!
actors.mobs.virtues.archangelboss.charity_death=I give you... my defeat...
actors.mobs.virtues.archangelboss.charity_death_own=Keep it all, then... and be poor forever...
actors.mobs.virtues.archangelboss.sig_charity=_Signature, Great Tithe:_ heals itself and rains gold-taking light on your tile and scattered tiles around it, taking a fifth of your gold.
actors.mobs.virtues.archangelboss.skill_charity=Great tithe!
actors.mobs.virtues.archangelboss.chastity_notice=I bring a message, sinner: your journey ends here.
actors.mobs.virtues.archangelboss.chastity_notice_own=Your perfume does not reach heaven.
actors.mobs.virtues.archangelboss.chastity_phase=Behold the pure light!
actors.mobs.virtues.archangelboss.chastity_phase_own=I will not be moved by you!
actors.mobs.virtues.archangelboss.chastity_death=My message... was not heard...
actors.mobs.virtues.archangelboss.chastity_death_own=Not even now... do I feel desire...
actors.mobs.virtues.archangelboss.sig_chastity=_Signature, Pure Radiance:_ every tile within 2 is purified: blinds and strips blessings.
actors.mobs.virtues.archangelboss.skill_chastity=Pure radiance!
actors.mobs.virtues.archangelboss.patience_notice=I have watched over the gate since the beginning. I can wait for your end.
actors.mobs.virtues.archangelboss.patience_notice_own=Burn as hot as you like. The fire of God burns longer.
actors.mobs.virtues.archangelboss.patience_phase=Still I stand.
actors.mobs.virtues.archangelboss.patience_phase_own=Your rage only feeds my flame!
actors.mobs.virtues.archangelboss.patience_death=My vigil... ends at last...
actors.mobs.virtues.archangelboss.patience_death_own=Your fury... outlasted heaven itself...
actors.mobs.virtues.archangelboss.sig_patience=_Signature, Wall of Fire:_ gains a barrier and blasts everything within 2 tiles away.
actors.mobs.virtues.archangelboss.skill_patience=Wall of fire!
actors.mobs.virtues.archangelboss.temperance_notice=I heal the sick and the wounded. You, I will cure of everything.
actors.mobs.virtues.archangelboss.temperance_notice_own=You have eaten the whole dungeon. Now you will fast.
actors.mobs.virtues.archangelboss.temperance_phase=Enough!
actors.mobs.virtues.archangelboss.temperance_phase_own=No more feasts!
actors.mobs.virtues.archangelboss.temperance_death=Be healed... of your hunger...
actors.mobs.virtues.archangelboss.temperance_death_own=You would devour... even an angel...
actors.mobs.virtues.archangelboss.sig_temperance=_Signature, Great Fast:_ a wide cross that empties the stomach (-150 satiety) and cripples.
actors.mobs.virtues.archangelboss.skill_temperance=Great fast!
actors.mobs.virtues.archangelboss.kindness_notice=I have come to show you mercy. It will not feel like mercy.
actors.mobs.virtues.archangelboss.kindness_notice_own=You want what everyone has. Let me give you what you deserve.
actors.mobs.virtues.archangelboss.kindness_phase=Mercy is not weakness!
actors.mobs.virtues.archangelboss.kindness_phase_own=I hold no envy for you, only pity!
actors.mobs.virtues.archangelboss.kindness_death=Go in peace...
actors.mobs.virtues.archangelboss.kindness_death_own=I never wanted... what you have...
actors.mobs.virtues.archangelboss.sig_kindness=_Signature, Merciful Embrace:_ heals itself and roots everything on a chessboard of tiles around you (a step straight sideways is safe).
actors.mobs.virtues.archangelboss.skill_kindness=Merciful embrace!
actors.mobs.virtues.archangelboss.diligence_notice=I have not closed my eyes since creation. I see everything you have done.
actors.mobs.virtues.archangelboss.diligence_notice_own=Wake up. Your long dream ends here.
actors.mobs.virtues.archangelboss.diligence_phase=I never tire!
actors.mobs.virtues.archangelboss.diligence_phase_own=No more sleep for you!
actors.mobs.virtues.archangelboss.diligence_death=At last... my eyes may close...
actors.mobs.virtues.archangelboss.diligence_death_own=Beaten... by one who slept through it all...
actors.mobs.virtues.archangelboss.sig_diligence=_Signature, Unceasing Charge:_ charges straight through you, crippling, and quickens itself.
actors.mobs.virtues.archangelboss.skill_diligence=Unceasing charge!
actors.mobs.virtues.archangelboss.name=archangel %s
actors.mobs.virtues.archangelboss.desc=%s, archangel of %s, has descended to stand between you and the Amulet of Yendor. As long as it stands, the amulet cannot be taken.\n\nIt telegraphs its skills: _Judgment_ (a cross of light along your row and column, blinding), _Holy Lance_ (a long line), _Radiant Bloom_ (light that grows from your tile one step each turn, like a crystal spire's) and its own signature move. It _ascends_ at two thirds and one third of its health, gaining a holy barrier, and fights faster after the second.
actors.mobs.virtues.archangelboss.skill_judgment=Judgment!
actors.mobs.virtues.archangelboss.skill_lance=Holy lance!
actors.mobs.virtues.archangelboss.skill_bloom=Radiant bloom!
actors.mobs.virtues.archangelboss.amulet_guarded=A holy presence keeps your hand from the amulet. The archangel must fall first.
actors.mobs.virtues.archangelboss.amulet_free=The holy presence fades. The amulet is yours to take.
actors.mobs.virtues.virtuechampion.name_humility=saint of humility
actors.mobs.virtues.virtuechampion.desc_humility=A saint in pale gold robes who has never once raised her eyes above anyone. Her humbling blows sap the strength of the proud, and a veil of light turns blows aside.
actors.mobs.virtues.virtuechampion.humility_notice=Kneel, sinner. Not to me. To the truth.
actors.mobs.virtues.virtuechampion.humility_notice_own=You wear a crown no one gave you. I have come to take it off.
actors.mobs.virtues.virtuechampion.humility_death=Even this... I accept humbly...
actors.mobs.virtues.virtuechampion.humility_death_own=Your pride won... this time. It always falls in the end.
actors.mobs.virtues.virtuechampion.name_charity=saint of charity
actors.mobs.virtues.virtuechampion.desc_charity=A saint who gives everything away, including mercy to monsters. She heals every enemy of yours around her, and her tithe takes a tenth of your gold for the poor.
actors.mobs.virtues.virtuechampion.charity_notice=What you hoard, I will give away.
actors.mobs.virtues.virtuechampion.charity_notice_own=All that gold, and not one coin given. Let me teach you to share.
actors.mobs.virtues.virtuechampion.charity_death=Take it... take everything I have...
actors.mobs.virtues.virtuechampion.charity_death_own=Even my death... I give to you...
actors.mobs.virtues.virtuechampion.name_chastity=saint of chastity
actors.mobs.virtues.virtuechampion.desc_chastity=A saint in spotless white. No charm can touch her heart. Her purifying light strips away every blessing on its path, and her halo blinds those who come too close.
actors.mobs.virtues.virtuechampion.chastity_notice=Your sins leave a stain on the very air.
actors.mobs.virtues.virtuechampion.chastity_notice_own=Your sweet words won't work on me. Not one of them.
actors.mobs.virtues.virtuechampion.chastity_death=I remain... pure...
actors.mobs.virtues.virtuechampion.chastity_death_own=Even now... I feel nothing for you...
actors.mobs.virtues.virtuechampion.name_patience=paladin of patience
actors.mobs.virtues.virtuechampion.desc_patience=A paladin behind a great tower shield. He waits, he endures, and when he is ready he strikes back at everything around him.
actors.mobs.virtues.virtuechampion.patience_notice=I have waited a long time for you.
actors.mobs.virtues.virtuechampion.patience_notice_own=Rage all you like. I will still be standing.
actors.mobs.virtues.virtuechampion.patience_death=My watch... is over...
actors.mobs.virtues.virtuechampion.patience_death_own=Your fury... outlasted my patience...
actors.mobs.virtues.virtuechampion.name_temperance=paladin of temperance
actors.mobs.virtues.virtuechampion.desc_temperance=A lean paladin who eats one meal a day. His fasting blows empty your stomach, and his measured strikes leave you limping.
actors.mobs.virtues.virtuechampion.temperance_notice=Enough. You have taken enough.
actors.mobs.virtues.virtuechampion.temperance_notice_own=You devour without end. I am here to make you fast.
actors.mobs.virtues.virtuechampion.temperance_death=In moderation... always...
actors.mobs.virtues.virtuechampion.temperance_death_own=Even you... will be full one day...
actors.mobs.virtues.virtuechampion.name_kindness=saint of kindness
actors.mobs.virtues.virtuechampion.desc_kindness=A gentle saint who smiles even as she fights. She mends her own wounds and blesses herself, and her warm embrace roots you in place.
actors.mobs.virtues.virtuechampion.kindness_notice=I don't want to hurt you. But I will stop you.
actors.mobs.virtues.virtuechampion.kindness_notice_own=Why want what others have? Let me give you what you need instead.
actors.mobs.virtues.virtuechampion.kindness_death=I hope... you find peace...
actors.mobs.virtues.virtuechampion.kindness_death_own=I never envied you... not even now...
actors.mobs.virtues.virtuechampion.name_diligence=paladin of diligence
actors.mobs.virtues.virtuechampion.desc_diligence=A paladin who has not slept in years. Nothing can put him to sleep or freeze him in place; he charges straight through you and quickens his pace when he must.
actors.mobs.virtues.virtuechampion.diligence_notice=No rest for the wicked. Nor for me.
actors.mobs.virtues.virtuechampion.diligence_notice_own=Wake up, sluggard. Your judgment has come.
actors.mobs.virtues.virtuechampion.diligence_death=At last... I may rest...
actors.mobs.virtues.virtuechampion.diligence_death_own=You... won by sleeping...? Unbelievable...
actors.mobs.virtues.virtuechampion.desc_common=A champion of the seven virtues, come to judge you. It grows as strong as the floor it hunts on and telegraphs its skills (step out of the marked tiles). Defeating it yields two sin essences and blessed equipment.
actors.mobs.virtues.virtuechampion.desc_nemesis=_Your nemesis:_ this virtue opposes your sin. You and it deal each other _25% more damage_, and defeating it grants _50 sin points_ and a _scroll of upgrade_.
actors.mobs.virtues.virtuechampion.arrives=You feel a holy presence: the %s has come to this floor to judge you!
actors.mobs.virtues.virtuechampion.arrives_nemesis=Your sin trembles: the %s, your nemesis, has come for you!
actors.mobs.virtues.virtuechampion.awaits=You feel a holy presence: the %s awaits you in its sanctum on this floor.
actors.mobs.virtues.virtuechampion.awaits_nemesis=Your sin trembles: the %s, your nemesis, awaits you in its sanctum on this floor!
actors.mobs.virtues.virtuechampion.sealed=Light floods the doorway and hardens into stone. There is no way out until the judgment is over!
actors.mobs.virtues.virtuechampion.unsealed=The light sealing the doorway fades away.
actors.mobs.virtues.virtuechampion.nemesis_slain=You have defeated your nemesis! Your sin grows stronger.
actors.mobs.virtues.virtuechampion.tithe_taken=The saint takes %d gold as a tithe.
actors.mobs.virtues.humilitychampion.skill_humble=Be humbled!
actors.mobs.virtues.humilitychampion.skill_veil=Veil of humility!
actors.mobs.virtues.charitychampion.skill_alms=Alms for all!
actors.mobs.virtues.charitychampion.skill_tithe=Your tithe!
actors.mobs.virtues.chastitychampion.skill_purify=Be purified!
actors.mobs.virtues.chastitychampion.skill_halo=Holy halo!
actors.mobs.virtues.patiencechampion.skill_endure=I endure!
actors.mobs.virtues.patiencechampion.skill_retribution=Retribution!
actors.mobs.virtues.temperancechampion.skill_fast=Fast!
actors.mobs.virtues.temperancechampion.skill_measure=Measured strike!
actors.mobs.virtues.kindnesschampion.skill_mercy=Mercy!
actors.mobs.virtues.kindnesschampion.skill_embrace=Gentle embrace!
actors.mobs.virtues.diligencechampion.skill_charge=Onward!
actors.mobs.virtues.diligencechampion.skill_vigil=Eternal vigil!
actors.mobs.virtues.archangelboss.heaven_opens=Beyond the amulet the floor parts in light: a stairway leads down into the heavens.
actors.mobs.heaven.believer.name=believer
actors.mobs.heaven.believer.desc=A faithful soul of the heavens in a plain white robe. Believers walk together in small flocks, and when one falls, its dying cry calls every other enemy close by straight to you.
actors.mobs.heaven.believer.death_cry=The believer's dying cry rallies the faithful against you!
actors.mobs.heaven.priest.name=priest
actors.mobs.heaven.priest.desc=A priest of the heavens, never seen without a flock. It mends the wounds of the monsters around it and wraps them in shields of light. Left alone in a fight, it offers its own life, and a lesser angel descends in its place.
actors.mobs.heaven.priest.bless=The priest's prayer mends and shields its flock!
actors.mobs.heaven.priest.sacrifice=Left alone, the priest offers its own life... and a lesser angel descends!
actors.mobs.heaven.lesserangel.name=lesser angel
actors.mobs.heaven.lesserangel.desc=A small angel called down by a priest's sacrifice. It cannot move from where it appeared, but its white spears hit hard. Its radiance shields it at first and wears away every turn, and before long it fades back into the light.
actors.mobs.heaven.seraph.name=seraph
actors.mobs.heaven.seraph.desc=A towering seraph wreathed in holy fire, so large it fills four tiles. It never leaves the room it guards. Anyone standing next to it burns every turn, its spear reaches two tiles away, and once it can drag a foe to itself with a chain of light.
actors.mobs.heaven.seraph.chain=Come and be judged!
actors.mobs.heaven.seraph.burned=You were burned away by a seraph's holy fire...
actors.mobs.heaven.seraphpart.name=seraph
actors.mobs.heaven.seraphpart.desc=Part of a seraph's towering body.
actors.mobs.heaven.holygiant.name=holy giant
actors.mobs.heaven.holygiant.desc=A colossus of the heavens rising from the void to the waist, crackling with lightning. Its body cannot be harmed, but the arms it slams down can: break both arms to bring it down.\n\nIt slams a whole arm down across your side (a strip 3 tiles wide and 8 long from its ledge) and leaves it lying there for a few turns, calls a branching lightning that spreads over the arena and paralyses, and when badly hurt it charges a judgment that strikes everything it can see. Hide behind a wall when it does.
actors.mobs.heaven.holygiant.notice=WHO WALKS THE HEAVENS WITH A SINNER'S STEP?
actors.mobs.heaven.holygiant.skill_slam=Arm slam!
actors.mobs.heaven.holygiant.skill_bolt=Branching lightning!
actors.mobs.heaven.holygiant.immune=immune
actors.mobs.heaven.holygiant.arm_lost=MY ARM...!
actors.mobs.heaven.holygiant.judgment_start=KNEEL BEFORE THE JUDGMENT OF HEAVEN!
actors.mobs.heaven.holygiant.judgment_warn=The holy giant gathers light for a judgment over the whole floor! Get behind a wall!
actors.mobs.heaven.holygiant.judgment_count=Judgment: %d
actors.mobs.heaven.holygiant.judgment_release=BE JUDGED!
actors.mobs.heaven.holygiant.judgment_kill=You were struck down by the holy giant's judgment...
actors.mobs.heaven.holygiant.collapse=THE HEAVENS... WILL NOT... FALL...
actors.mobs.heaven.holygiant.gem_appears=The giant slumps over and a blue gem falls into the middle of the hall. The host of heaven pours in from the edges: reach the gem!
actors.mobs.heaven.holygiant.death=...so be it. Take my heart, sinner.
actors.mobs.heaven.giantfist.name_left=giant's left arm
actors.mobs.heaven.giantfist.name_right=giant's right arm
actors.mobs.heaven.giantfist.desc=One of the holy giant's arms, lying across the floor where it struck, fist at the end. It lifts back up after a few turns. Every blow on the arm is a blow on the giant, and enough of them will break it.
levels.holygiantlevel.void_name=Void
levels.holygiantlevel.void_desc=A dark void beyond the edge of the heavens. Something enormous stirs down there.
