items.artifacts.sinartifact.awakened_name=awakened %s
items.artifacts.sinartifact.awakened_info=_You overcame the trial of sin._ The level cap is now _+20_ and a new skill is open. (Levels past +10 raise the effects at half the rate.)
items.artifacts.sinartifact.trial_hint=Overcome _the shadow of your own sin_ in a dark sanctum somewhere in the city, and this artifact will awaken once more.
sins.trialhooks.no_item=You have no signature artifact to awaken.
sins.trialhooks.awakened=The shadow of your sin sinks into your artifact. It awakens as the _%s_! The level cap is now +20 and you gained a new skill.
sins.trialhooks.no_target=There is no target there.
sins.trialhooks.prompt=Choose a target.
sins.trialhooks.bound=The %s is bound to the Seal of Solomon for good!
sins.trialhooks$cooldown.name=Trial skill cooldown
sins.trialhooks$cooldown.desc=You must wait before using your trial skill again.\n\nTurns remaining: %s
sins.trialhooks.skill_trial_gluttony=Devour
sins.trialhooks.skill_trial_gluttony_desc=_(Trial of sin · single target)_ A huge bite on one enemy for _heavy damage_, healing _half_ of it. The target is weakened for _8 turns_.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_greed=Midas Touch
sins.trialhooks.skill_trial_greed_desc=_(Trial of sin · single target)_ Damage one enemy and turn it to gold: paralysed for _6 turns_ (bosses _2_), vulnerable for _10 turns_, shedding coins at its feet.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_wrath=Wrathful Blow
sins.trialhooks.skill_trial_wrath_desc=_(Trial of sin · single target)_ Put _all_ your rage (at least 50) into one blow: _rage + twice your level_ as damage. The target is crippled for _6 turns_ and paralysed for _2_ (bosses _1_).\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_pride=Execution Order
sins.trialhooks.skill_trial_pride_desc=_(Trial of sin · single target)_ Order one enemy executed: damage grows with the share of HP it has lost, up to _double_. Paralysed for _4 turns_ (bosses _1_) and weakened for _8_.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_lust=Fatal Kiss
sins.trialhooks.skill_trial_lust_desc=_(Trial of sin · single target)_ Drain one enemy's life and heal _all_ the damage dealt. The target is charmed for _6 turns_ (bosses _2_). Costs _15%_ of your max HP.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_envy=Covetous Curse
sins.trialhooks.skill_trial_envy_desc=_(Trial of sin · single target)_ Covet what one enemy has: on top of the damage it loses _12%_ of its current HP (capped). Hexed, weakened and vulnerable for _10 turns_.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_sloth=Nightmare
sins.trialhooks.skill_trial_sloth_desc=_(Trial of sin · single target)_ Give one enemy a painful dream: non-boss enemies fall into _magical sleep_, bosses are slowed for _8 turns_ and paralysed for _1_. Then you doze off too and lose some turns.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_solomon=Binding Seal
sins.trialhooks.skill_trial_solomon_desc=_(Trial of sin · single target)_ Bind one enemy with the Seal of Solomon. A non-boss enemy becomes your ally _for good_. Bosses and enemies that can't be bound take _heavy damage_ scaled by your spell power, rooted for _4 turns_ and hexed for _8_.\n\nCooldown _40 turns_.
