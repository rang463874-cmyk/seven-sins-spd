items.artifacts.sinartifact.awakened_name=awakened %s
items.artifacts.sinartifact.awakened_info=_You overcame the trial of sin._ The level cap is now _+20_ and a new skill is open. (Levels past +10 raise the effects at half the rate.)
items.artifacts.sinartifact.trial_hint=Overcome _the shadow of your own sin_ in a dark sanctum somewhere in the city, and this artifact will awaken once more.
sins.trialhooks.no_item=You have no signature artifact to awaken.
sins.trialhooks.awakened=The shadow of your sin sinks into your artifact. It awakens as the _%s_! The level cap is now +20 and you gained a new skill.
sins.trialhooks.no_target=There is no target there.
sins.trialhooks.prompt=Choose a target.
sins.trialhooks.bound=The %s is bound to the Seal of Solomon for good!
sins.trialhooks$cooldown.name=Trial skill cooldown
sins.trialhooks$cooldown.desc=You must wait before using your trial skill again.\n\nTurns remaining: %s
sins.trialhooks.skill_trial_gluttony=Feast
sins.trialhooks.skill_trial_gluttony_desc=_(Trial of sin)_ Bite every enemy within _2 tiles_ for heavy damage and heal _half_ of it. Non-boss enemies dropping below _25%_ HP are swallowed whole, each filling a little satiety.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_greed=Midas Touch
sins.trialhooks.skill_trial_greed_desc=_(Trial of sin)_ Turn one enemy to gold: paralysed and vulnerable for _8 turns_, shedding coins at its feet. Bosses are slowed for _4 turns_ instead.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_wrath=Cataclysm
sins.trialhooks.skill_trial_wrath_desc=_(Trial of sin)_ Unleash _all_ your rage (at least 50) at once: enemies within _3 tiles_ take _half the rage + your level_ as damage and are crippled for _5 turns_.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_pride=Royal Decree
sins.trialhooks.skill_trial_pride_desc=_(Trial of sin)_ Every enemy in sight kneels: non-boss enemies are paralysed for _4 turns_, bosses weakened and vulnerable for _6 turns_.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_lust=Fatal Attraction
sins.trialhooks.skill_trial_lust_desc=_(Trial of sin)_ Charm every enemy within _4 tiles_ for _8 turns_ and drain their life, healing what you deal. Costs _15%_ of your max HP.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_envy=Doppelganger
sins.trialhooks.skill_trial_envy_desc=_(Trial of sin)_ Call up _3_ mirror images of yourself.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_sloth=Eternal Slumber
sins.trialhooks.skill_trial_sloth_desc=_(Trial of sin)_ Every enemy in sight falls into _magical sleep_; bosses are slowed for _5 turns_. Then you doze off too and lose some turns.\n\nCooldown _40 turns_.
sins.trialhooks.skill_trial_solomon=Binding Seal
sins.trialhooks.skill_trial_solomon_desc=_(Trial of sin)_ Bind one enemy with the Seal of Solomon. A non-boss enemy becomes your ally _for good_. Bosses and enemies that can't be bound take heavy magic damage and are hexed for _8 turns_.\n\nCooldown _40 turns_.
