items.heavenlyhalo.name=대천사의 후광
items.heavenlyhalo.desc=쓰러진 대천사의 머리 위에 떠 있던 빛의 고리입니다. 새로 머물 곳을 기다리듯 아직도 나지막이 울리고 있습니다.\n\n받아들이면 _유물/반지 공용 칸_이 하나 더 생겨, 이번 판이 끝날 때까지 유지됩니다. 거울 장식함과 함께 쓸 수 있습니다. 한 판에 한 번만 쓸 수 있습니다.
items.heavenlyhalo.ac_open=받아들이기
items.heavenlyhalo.already=이미 후광을 지니고 있다. 하나 더 받아들여도 아무 일도 일어나지 않는다.
items.heavenlyhalo.opened=후광이 빛이 되어 몸을 감싸고, 장신구를 하나 더 걸칠 수 있게 되었다!
items.bags.essencebag.name=정수 가방
items.bags.essencebag.desc=담은 것이 새어 나가지 않도록 문양이 수놓인 묵직한 진홍색 주머니입니다. 정수를 담기 위해 만들어졌습니다. 지금은 죄악의 정수를, 언젠가는 더 어두운 것을 담게 될지도 모릅니다. 이름 옆의 버튼을 누르면 이번 여정에서 만난 악마들의 도감, 레메게톤을 볼 수 있습니다.
items.artifactshard.name=%s 조각
items.artifactshard.desc=부서진 유물의 파편으로, 원래 힘의 일부가 아직 남아 있습니다. 사용하면 그 힘을 한 번 풀어내고 부서집니다.\n\n던전에서 얻은 기존 유물을 연금술 솥에서 부수면 얻을 수 있습니다(1개, 유물 3레벨마다 +1개).
items.artifactshard.ac_use=사용
items.artifactshard.prompt=대상을 선택하세요
items.artifactshard.invalid=그곳에는 아무 일도 일어나지 않는다.
items.artifactshard.too_heavy=너무 무거워서 끌어올 수 없다!
items.artifactshard.no_space=영혼이 나타날 자리가 없다.
items.artifactshard.spirit=속박된 영혼
items.artifactshard.effect_alchemiststoolkit=_연금술사의 도구 상자:_ 연금 에너지를 12 얻습니다.
items.artifactshard.effect_capeofthorns=_가시 망토:_ 최대 체력의 1/4(+현재 층 깊이)만큼 보호막을 얻습니다.
items.artifactshard.effect_chaliceofblood=_피의 성배:_ 몇 턴에 걸쳐 최대 체력의 절반을 회복합니다.
items.artifactshard.effect_cloakofshadows=_그림자 망토:_ 12턴 동안 투명해집니다.
items.artifactshard.effect_driedrose=_말린 장미:_ 아군 영혼 둘이 곁에 나타나 30턴 동안 함께 싸웁니다.
items.artifactshard.effect_etherealchains=_영체 사슬:_ 적(보스 제외)을 내 쪽으로 끌어오거나, 원하는 곳으로 최대 8칸까지 몸을 끌어당깁니다.
items.artifactshard.effect_holytome=_성스러운 서적:_ 한동안 축복을 받고, 최대 체력의 1/4을 회복합니다.
items.artifactshard.effect_hornofplenty=_풍요의 뿔:_ 든든한 식사를 한 만큼 배가 부릅니다.
items.artifactshard.effect_masterthievesarmband=_대도의 완장:_ 발밑에 금화 더미와 무작위 물약·주문서·룬석 하나가 떨어집니다.
items.artifactshard.effect_sandalsofnature=_자연의 신발:_ 주변에 키 큰 풀이 자라나고, 가까운 적은 5턴 동안 속박되며, 피부가 나무껍질처럼 단단해집니다.
items.artifactshard.effect_skeletonkey=_해골 열쇠:_ 잠긴 문이나 잠긴 상자를 열쇠 없이 엽니다.
items.artifactshard.effect_talismanofforesight=_예지의 부적:_ 층의 구조와 비밀을 드러내고, 5턴 동안 정신 시야를 얻습니다.
items.artifactshard.effect_timekeepershourglass=_시간 관리자의 모래시계:_ 5턴 동안 주변의 시간을 멈춥니다.
items.artifactshard.effect_unstablespellbook=_불안정한 마법서:_ 무작위 주문서 하나를 읽습니다(변환 주문서는 제외).
items.artifactshard.used_alchemiststoolkit=조각이 연금 에너지로 녹아내린다.
items.artifactshard.used_capeofthorns=가시 보호막이 몸을 감싼다.
items.artifactshard.used_chaliceofblood=따뜻한 피가 혈관을 타고 솟구친다.
items.artifactshard.used_cloakofshadows=그림자 속으로 녹아든다.
items.artifactshard.used_driedrose=충직한 영혼들이 조각의 부름에 응답한다!
items.artifactshard.used_holytome=성스러운 빛이 내려앉는다.
items.artifactshard.used_hornofplenty=배가 든든해졌다.
items.artifactshard.used_masterthievesarmband=어디선가 전리품이 쏟아진다!
items.artifactshard.used_sandalsofnature=자연이 부름에 응답한다!
items.artifactshard.used_skeletonkey=딸깍 하고 자물쇠가 열린다.
items.artifactshard.used_talismanofforesight=층의 비밀이 눈앞에 펼쳐진다.
items.artifactshard.used_timekeepershourglass=주변의 시간이 멈춰 선다.
items.artifactshard.used_unstablespellbook=조각이 번뜩이더니 스스로 %s(으)로 읽힌다!
items.holygem.name=푸른 보석
items.holygem.desc=천상의 힘으로 웅웅거리는 신성 거인의 푸른 심장입니다. 이것을 지닌 죄인은 두 번째 각성을 할 수 있습니다. 죄악을 완벽히 다스리거나, 죄악에 몸을 완전히 내맡기는 것입니다. 혹은 여기서 여정을 끝낼 수도 있습니다.
items.holygem.claimed=보석을 손에 쥐자 천상의 군세가 아침 안개처럼 흩어집니다.
items.holygem.ac_awaken=각성
items.holygem.ac_end=여정 끝내기
items.holygem.no_awaken=아직 각성하지 않은 죄인만 보석의 힘을 끌어낼 수 있다.
items.holygem.awaken_prompt=보석이 당신의 대답을 기다립니다.\n\n_%1$s_: %2$s\n\n_%3$s_: %4$s\n\n이 선택은 되돌릴 수 없습니다.
items.holygem.awaken_confirm=%s(으)로 각성하시겠습니까? 되돌릴 수 없습니다.
items.holygem.awakened=%1$s(으)로 각성했다! 2차 각성 특성 포인트를 %2$d점 얻었다.
items.holygem.end_prompt=여기서 여정을 끝내시겠습니까? 이번 판은 승리로 기록됩니다.
items.holygem.end_yes=예
items.holygem.end_no=아니오
sins.sinawakening.control_gluttony=미식의 왕
sins.sinawakening.control_greed=황금의 군주
sins.sinawakening.control_wrath=냉철한 분노
sins.sinawakening.control_pride=완벽한 군주
sins.sinawakening.control_lust=매혹의 주인
sins.sinawakening.control_envy=완벽한 모방자
sins.sinawakening.control_sloth=꿈의 군주
sins.sinawakening.monster_gluttony=식탐의 괴물
sins.sinawakening.monster_greed=탐욕의 괴물
sins.sinawakening.monster_wrath=분노의 괴물
sins.sinawakening.monster_pride=교만의 괴물
sins.sinawakening.monster_lust=색욕의 괴물
sins.sinawakening.monster_envy=시기의 괴물
sins.sinawakening.monster_sloth=나태의 괴물
sins.sinawakening.control_gluttony_desc=허기를 완벽히 다스립니다. 지금까지와 같은 방식으로 싸우며 큰 이점을 얻습니다.
sins.sinawakening.control_greed_desc=탐욕을 완벽히 다스립니다. 지금까지와 같은 방식으로 싸우며 큰 이점을 얻습니다.
sins.sinawakening.control_wrath_desc=분노를 완벽히 다스립니다. 지금까지와 같은 방식으로 싸우며 큰 이점을 얻습니다.
sins.sinawakening.control_pride_desc=교만을 완벽히 다스립니다. 지금까지와 같은 방식으로 싸우며 큰 이점을 얻습니다.
sins.sinawakening.control_lust_desc=욕망을 완벽히 다스립니다. 지금까지와 같은 방식으로 싸우며 큰 이점을 얻습니다.
sins.sinawakening.control_envy_desc=질투를 완벽히 다스립니다. 지금까지와 같은 방식으로 싸우며 큰 이점을 얻습니다.
sins.sinawakening.control_sloth_desc=나태를 완벽히 다스립니다. 지금까지와 같은 방식으로 싸우며 큰 이점을 얻습니다.
sins.sinawakening.monster_gluttony_desc=보조 가방을 삼켜 막대한 성장 포인트를 얻고, 삼킨 가방 종류의 아이템은 줍는 즉시 발동합니다. 이동속도와 공격속도가 50% 빨라지고 물어뜯기 사거리가 1칸 늘어납니다.
sins.sinawakening.monster_greed_desc=상점을 이용할 수 없고 최대 체력이 25% 줄어드는 대신, 금화에서 강대한 힘을 끌어냅니다.
sins.sinawakening.monster_wrath_desc=방어구 방어력과 회복량이 절반이 되는 대신, 멈출 수 없는 광기를 얻습니다.
sins.sinawakening.monster_pride_desc=체력이 가득 차 있지 않으면 받는 피해가 20% 늘어나는 대신, 압도적인 힘을 얻습니다.
sins.sinawakening.monster_lust_desc=자연 재생과 회복 물약 효과가 절반이 되는 대신, 모든 공격으로 피를 빠는 갈증을 얻습니다.
sins.sinawakening.monster_envy_desc=최대 체력이 20% 줄고 질투 게이지가 비면 피해를 받는 대신, 처치할 때마다 힘을 빼앗습니다.
sins.sinawakening.monster_sloth_desc=직접 공격 피해가 절반이 되는 대신, 악몽의 군세를 거느립니다.
sins.awakeningtalent.g_digestion.title=완벽한 소화
sins.awakeningtalent.g_digestion.desc=소모품의 성장 포인트 _+20/40/60%_.
sins.awakeningtalent.g_restraint.title=절제된 허기
sins.awakeningtalent.g_restraint.desc=포식자의 턱 스킬의 포만도 비용 _-15/30/45%_.
sins.awakeningtalent.g_nourish.title=영양 축적
sins.awakeningtalent.g_nourish.desc=음식을 먹으면 최대 체력 _10/20/30%_의 보호막.
sins.awakeningtalent.g_stomach.title=위장 확장
sins.awakeningtalent.g_stomach.desc=줍는 즉시 발동한 아이템의 성장 포인트 _+25/50/75%_.
sins.awakeningtalent.g_acid.title=소화액
sins.awakeningtalent.g_acid.desc=즉시 발동한 아이템마다 최대 체력 _3/6/9%_ 회복.
sins.awakeningtalent.g_dash.title=포식 질주
sins.awakeningtalent.g_dash.desc=아이템이 즉시 발동하면 _2/3/4_턴 동안 신속.
sins.awakeningtalent.r_interest.title=복리
sins.awakeningtalent.r_interest.desc=새 층에 갈 때마다 소지금의 _2/4/6%_를 이자로 받음.
sins.awakeningtalent.r_discount.title=흥정꾼
sins.awakeningtalent.r_discount.desc=상점 가격(원격 판매·통신 판매 포함) _-10/20/30%_.
sins.awakeningtalent.r_goldshield.title=금화 방패
sins.awakeningtalent.r_goldshield.desc=금화를 주우면 그 양의 _10/20/30%_만큼 보호막 (최대 체력 25%까지).
sins.awakeningtalent.r_goldskin.title=황금 피부
sins.awakeningtalent.r_goldskin.desc=소지금 1000당 방어 _+1/2/3_.
sins.awakeningtalent.r_plunder.title=약탈
sins.awakeningtalent.r_plunder.desc=처치할 때마다 일반 금화 더미의 _50/100/150%_를 추가로 떨어뜨림.
sins.awakeningtalent.r_goldfist.title=황금 주먹
sins.awakeningtalent.r_goldfist.desc=소지금 500당 근접 피해 _+1/2/3_.
sins.awakeningtalent.w_simmer.title=끓어오르는 분노
sins.awakeningtalent.w_simmer.desc=시야에 적이 없을 때 분노 감소 _-50/75/100%_.
sins.awakeningtalent.w_precise.title=정밀한 격노
sins.awakeningtalent.w_precise.desc=전쟁 북 스킬의 분노 비용 _-10/20/30%_.
sins.awakeningtalent.w_temper.title=단련된 분노
sins.awakeningtalent.w_temper.desc=분노가 50 이상일 때 받는 피해 _-8/16/24%_.
sins.awakeningtalent.w_bloodlust.title=피의 갈증
sins.awakeningtalent.w_bloodlust.desc=분노 1당 근접 피해 _+0.3/0.6/0.9%_.
sins.awakeningtalent.w_undying.title=불사의 분노
sins.awakeningtalent.w_undying.desc=치명상을 입으면 분노 100을 써서 체력 1로 버팀 (층마다 _1/2/3_회).
sins.awakeningtalent.w_slaughter.title=학살
sins.awakeningtalent.w_slaughter.desc=처치할 때마다 분노 _+10/20/30_.
sins.awakeningtalent.p_poise.title=흔들림 없는 품위
sins.awakeningtalent.p_poise.desc=맞아도 _20/40/60%_ 확률로 품위를 잃지 않음.
sins.awakeningtalent.p_royalshot.title=왕의 사격
sins.awakeningtalent.p_royalshot.desc=투척 무기 피해 _+10/20/30%_.
sins.awakeningtalent.p_glory.title=찬란한 영광
sins.awakeningtalent.p_glory.desc=무결 처치 영광 _+25/50/75%_.
sins.awakeningtalent.p_absolute.title=절대자
sins.awakeningtalent.p_absolute.desc=체력이 가득 찼을 때 주는 피해 _+20/40/60%_.
sins.awakeningtalent.p_reign.title=군림
sins.awakeningtalent.p_reign.desc=시야 안 적 1마리당 최대 품위 _+1/2/3_.
sins.awakeningtalent.p_divineeye.title=신의 눈
sins.awakeningtalent.p_divineeye.desc=적마다 처음 _1/2/3_번의 투척 공격은 반드시 명중.
sins.awakeningtalent.l_price.title=절제된 대가
sins.awakeningtalent.l_price.desc=향수 스킬의 체력 비용 _-15/30/45%_.
sins.awakeningtalent.l_deepcharm.title=깊은 매혹
sins.awakeningtalent.l_deepcharm.desc=매혹 지속 _+25/50/75%_.
sins.awakeningtalent.l_elegant.title=우아한 흡혈
sins.awakeningtalent.l_elegant.desc=매혹된 적에게서의 흡혈 _+20/40/60%_.
sins.awakeningtalent.l_feast.title=피의 향연
sins.awakeningtalent.l_feast.desc=모든 공격(투척 포함) 피해의 _6/12/18%_ 흡혈.
sins.awakeningtalent.l_nightdance.title=밤의 춤
sins.awakeningtalent.l_nightdance.desc=회피 _+5/10/15%_.
sins.awakeningtalent.l_aura.title=매혹의 기운
sins.awakeningtalent.l_aura.desc=매 턴 2칸 안의 적이 _10/20/30%_ 확률로 매혹.
sins.awakeningtalent.e_slots.title=완벽한 복제
sins.awakeningtalent.e_slots.desc=모방 칸 _+1/1/2_.
sins.awakeningtalent.e_thrift.title=알뜰한 질투
sins.awakeningtalent.e_thrift.desc=모방 스킬의 질투 비용 _-10/20/30%_.
sins.awakeningtalent.e_growth.title=매끄러운 모방
sins.awakeningtalent.e_growth.desc=성장 모방 효율 _+5/10/15%_.
sins.awakeningtalent.e_steal.title=빼앗은 힘
sins.awakeningtalent.e_steal.desc=각성 후 처치한 적 1마리당 피해 영구 _+0.1/0.2/0.3_.
sins.awakeningtalent.e_rivalry.title=라이벌 의식
sins.awakeningtalent.e_rivalry.desc=강한 적(라이벌)이 시야에 있으면 피해 _+10/20/30%_.
sins.awakeningtalent.e_takeform.title=형태 강탈
sins.awakeningtalent.e_takeform.desc=처치 시 _5/10/15%_ 확률로 질투 게이지 1/4 즉시 충전.
sins.awakeningtalent.s_nap.title=짧은 잠
sins.awakeningtalent.s_nap.desc=스킬 후 졸음 턴 _-20/40/60%_.
sins.awakeningtalent.s_puppets.title=생생한 꿈
sins.awakeningtalent.s_puppets.desc=꿈 인형의 체력·피해 _+15/30/45%_.
sins.awakeningtalent.s_more.title=북적이는 꿈
sins.awakeningtalent.s_more.desc=최대 꿈 인형 수 _+1/1/2_.
sins.awakeningtalent.s_legion.title=악몽 군단
