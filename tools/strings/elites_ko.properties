elites.sinelite.desc_0=_식탐_에 사로잡혔습니다. 공격에 맞으면 포만감을 빼앗기고 녀석은 회복하며, 받는 피해도 조금 줄어듭니다.
elites.sinelite.desc_1=_탐욕_에 사로잡혔습니다. 공격에 맞을 때마다 골드를 빼앗기며, 같은 종족보다 조금 더 날렵합니다. 쓰러뜨리면 빼앗긴 골드의 두 배를 돌려받습니다.
elites.sinelite.desc_2=_분노_에 사로잡혔습니다. 다칠수록 더 강하게 공격하며, 당신을 발견하면 주변 몬스터들을 흥분시킵니다.
elites.sinelite.desc_3=_교만_에 사로잡혔습니다. 4턴 동안 공격받지 않으면 체력의 20%에 해당하는 교만의 보호막이 다시 생깁니다.
elites.sinelite.desc_4=_색욕_에 사로잡혔습니다. 공격할 때마다 생명력을 조금 빨아들이며, 맞으면 매혹될 수 있습니다.
elites.sinelite.desc_5=_시기_에 사로잡혔습니다. 같은 종족보다 훨씬 날렵하며, 공격에 맞으면 이로운 효과 하나를 빼앗깁니다.
elites.sinelite.desc_6=_나태_에 사로잡혔습니다. 잠든 채로 발견되지만, 깨어나면 한동안 미친 듯이 움직이고 공격합니다.
elites.sinelite.desc_common=칠죄종 엘리트는 체력이 50% 많고, 경험치를 두 배로 주며, _죄의 정수_를 떨어뜨립니다. 자신과 같은 죄의 엘리트를 쓰러뜨리면 죄악 포인트도 얻습니다.
elites.sinelite.greed_steal=골드 %d개를 빼앗겼다!
elites.sinelite.wrath_roar=크아앙!
elites.sinelite.pride_shield=교만!
elites.sinelite.envy_steal=내 거야!
elites.sinelite.sloth_wake=광란!
elites.sinelite.own_sin=%s의 죄를 삼켜 당신의 죄가 자라납니다.
actors.mobs.elites.regionelite.skill_kill=%s에게 쓰러졌습니다...
actors.mobs.elites.ratchieftain.name=쥐 우두머리
actors.mobs.elites.ratchieftain.desc=하수도를 지배하는 흉터투성이의 거대한 쥐입니다. 찍찍거려 무리를 부르고 일직선으로 돌진하며, 물리면 피가 흐릅니다.\n\n기술을 쓰기 직전에 바닥에 표식이 나타납니다.
actors.mobs.elites.ratchieftain.notice=끼이이익!
actors.mobs.elites.ratchieftain.skill_squeal=찍찍!
actors.mobs.elites.ratchieftain.skill_rush=돌진!
actors.mobs.elites.chainwarden.name=탈옥한 간수장
actors.mobs.elites.chainwarden.desc=스스로 사슬을 끊고 나온 감옥의 간수장입니다. 표식이 그어진 직선으로 사슬을 던져 먹잇감을 끌어당기고, 주변 바닥을 내리찍습니다.\n\n기술을 쓰기 직전에 바닥에 표식이 나타납니다.
actors.mobs.elites.chainwarden.notice=감방으로 돌아가라, 죄수!
actors.mobs.elites.chainwarden.skill_chain=사슬!
actors.mobs.elites.chainwarden.skill_slam=내려찍기!
actors.mobs.elites.gnollforeman.name=놀 감독관
actors.mobs.elites.gnollforeman.desc=폭탄 주머니를 둘러멘 놀 광산의 감독관입니다. 표식이 그려진 곳에 폭탄을 던지고, 침입자 머리 위로 천장을 무너뜨립니다.\n\n기술을 쓰기 직전에 바닥에 표식이 나타납니다.
actors.mobs.elites.gnollforeman.notice=침입자다! 폭파 준비!
actors.mobs.elites.gnollforeman.skill_bomb=폭탄!
actors.mobs.elites.gnollforeman.skill_cavein=낙반!
actors.mobs.elites.fallenpriest.name=타락한 성직자
actors.mobs.elites.fallenpriest.desc=이제는 악마를 섬기는 드워프 도시의 성직자입니다. 주변의 모든 몬스터를 축복하고, 적의 발밑을 저주합니다.\n\n저주를 내리기 직전에 바닥에 표식이 나타납니다.
actors.mobs.elites.fallenpriest.notice=새로운 신들 앞에 무릎 꿇어라!
actors.mobs.elites.fallenpriest.skill_bless=축복!
actors.mobs.elites.fallenpriest.skill_curse=저주!
actors.mobs.elites.hellhound.name=지옥 사냥개
actors.mobs.elites.hellhound.desc=홀을 함께 사냥하는 한 쌍의 악마 사냥개 중 하나입니다. 표식이 그려진 곳으로 덮쳐들고, 표식이 그어진 직선으로 불을 뿜습니다. 짝이 쓰러지면 격노합니다.\n\n기술을 쓰기 직전에 바닥에 표식이 나타납니다.
actors.mobs.elites.hellhound.desc_enraged=_격노:_ 짝이 죽었습니다. 피해가 50% 늘고 더 빠르게 공격합니다.
actors.mobs.elites.hellhound.notice=그르르르...
actors.mobs.elites.hellhound.skill_pounce=덮치기!
actors.mobs.elites.hellhound.skill_breath=지옥불!
actors.mobs.elites.hellhound.enraged=격노!
actors.mobs.elites.hellhound.yell_enraged=아우우우우!
