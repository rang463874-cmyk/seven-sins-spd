actors.hero.heroclass.wrath=분노
actors.hero.heroclass.wrath_desc_short=칠죄종 중 _분노_의 죄를 짊어진 자. 분노는 _적들에게 분노를 퍼뜨려 서로 싸우게_ 만들고, 적끼리 흘린 피만큼 _영구적으로 강해집니다_.
actors.hero.heroclass.wrath_desc=분노는 _분노의 전쟁북_을 유물 칸에 착용한 채 시작합니다. 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다. 전쟁북은 _분노_를 써서 _도발_, _이간질_, _분노 전염_, _돌진_을 사용합니다. 분노는 _피해를 주고받을 때_ 차오르고, 주변에 적이 없으면 서서히 식습니다.\n\n적이 _다른 적에게 피해를 주거나 죽일 때마다_ 원한 점수가 쌓이고, 원한 점수에 비례해 근접 피해, 명중, 최대 체력, 방어력, 회피가 끝없이 오릅니다. 보스와 중간 보스는 분노에 휩쓸리지 않습니다.\n\n분노는 _격투 장갑_을 끼고 시작하며, _치유 물약_과 _분노의 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.wrath_unlock=분노는 처음부터 해금되어 있습니다.

actors.hero.herosubclass.instigator=선동가
actors.hero.herosubclass.instigator_short_desc=_선동가_는 분노의 지속 시간이 _50%_ 길고, 분노한 적이 다른 적에게 주는 피해가 _20%_ 증가합니다.
actors.hero.herosubclass.instigator_desc=선동가는 직접 칼을 들기보다 판을 키웁니다. 전쟁북으로 일으킨 광란과 이간질이 _50%_ 더 오래 지속되고, 분노한 적이 다른 적을 공격할 때 피해가 _20%_ 증가합니다.\n\n전용 특성으로 적끼리의 피해를 더 키우거나, 분노가 저절로 번지게 하거나, 적이 적에게 죽을 때 주변을 폭동에 빠뜨릴 수 있습니다.
actors.hero.herosubclass.avenger=복수귀
actors.hero.herosubclass.avenger_short_desc=_복수귀_는 눈앞에서 적끼리 주고받는 피해의 _10%_만큼 체력을 회복합니다.
actors.hero.herosubclass.avenger_desc=복수귀는 싸움판 한가운데에서 힘을 얻습니다. 시야 안에서 적이 다른 적에게 피해를 줄 때마다 그 피해의 _10%_만큼 체력을 회복합니다.\n\n전용 특성으로 회복량을 늘리거나, 적끼리의 싸움을 볼 때마다 공격력을 쌓거나, 분노한 적에게 더 큰 피해를 줄 수 있습니다.

actors.hero.talent.wrath_spite.title=앙심
actors.hero.talent.wrath_spite.desc=_+1:_ 얻는 원한 점수가 _15%_ 증가합니다.\n\n_+2:_ 얻는 원한 점수가 _30%_ 증가합니다.
actors.hero.talent.wrath_fuel.title=끓어오르는 피
actors.hero.talent.wrath_fuel.desc=_+1:_ 피격당할 때마다 분노를 _2.5_ 더 얻습니다.\n\n_+2:_ 피격당할 때마다 분노를 _5_ 더 얻습니다.
actors.hero.talent.wrath_first_blood.title=첫 피
actors.hero.talent.wrath_first_blood.desc=분노에 빠진 적이 다른 적에게 처음 가하는 공격이 강해집니다.\n\n_+1:_ 피해 _30%_ 증가\n\n_+2:_ 피해 _60%_ 증가
actors.hero.talent.wrath_glare.title=노려보기
actors.hero.talent.wrath_glare.desc=전쟁북으로 분노시킨 적이 _취약_ 상태가 됩니다.\n\n_+1:_ _3턴_\n\n_+2:_ _5턴_
actors.hero.talent.wrath_drummer.title=고수
actors.hero.talent.wrath_drummer.desc=최대 분노가 늘어납니다. (기본 100)\n\n_+1:_ _125_\n\n_+2:_ _150_
actors.hero.talent.wrath_tempo.title=빠른 장단
actors.hero.talent.wrath_tempo.desc=얻는 분노가 늘어납니다.\n\n_+1:_ _20%_ 증가\n\n_+2:_ _40%_ 증가
actors.hero.talent.wrath_dash_strike.title=돌격
actors.hero.talent.wrath_dash_strike.desc=돌진으로 착지할 때 인접한 적에게 피해를 줍니다.\n\n_+1:_ 약한 충격\n\n_+2:_ 강한 충격, 돌진 거리 _+1칸_
actors.hero.talent.wrath_long_grudge.title=오래가는 원한
actors.hero.talent.wrath_long_grudge.desc=전쟁북으로 일으킨 분노의 지속 시간이 늘어납니다.\n\n_+1:_ _25%_ 증가\n\n_+2:_ _50%_ 증가
actors.hero.talent.wrath_scavenge.title=어부지리
actors.hero.talent.wrath_scavenge.desc=적이 다른 적에게 죽으면 분노를 얻습니다.\n\n_+1:_ _6_\n\n_+2:_ _12_
actors.hero.talent.wrath_fury.title=격노
actors.hero.talent.wrath_fury.desc=원한 점수로 얻는 모든 스탯 효과가 증가합니다. 이미 쌓은 점수에도 적용됩니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.wrath_chaos.title=혼돈
actors.hero.talent.wrath_chaos.desc=도발이 일정 확률로 인접한 적 하나에게도 번집니다.\n\n_+1:_ _20%_ 확률\n\n_+2:_ _40%_ 확률\n\n_+3:_ _60%_ 확률
actors.hero.talent.instigator_fervor.title=광신
actors.hero.talent.instigator_fervor.desc=분노한 적이 다른 적에게 주는 피해가 추가로 증가합니다.\n\n_+1:_ _15%_ 추가\n\n_+2:_ _30%_ 추가\n\n_+3:_ _45%_ 추가
actors.hero.talent.instigator_plague.title=분노의 역병
actors.hero.talent.instigator_plague.desc=분노한 적에게 맞은 적이 일정 확률로 광란에 빠집니다.\n\n_+1:_ _15%_ 확률\n\n_+2:_ _30%_ 확률\n\n_+3:_ _45%_ 확률
actors.hero.talent.instigator_riot.title=폭동
actors.hero.talent.instigator_riot.desc=적이 다른 적에게 죽으면 주변 2칸 안의 적이 광란에 빠집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_
actors.hero.talent.avenger_feast.title=피의 향연
actors.hero.talent.avenger_feast.desc=적끼리의 피해로 회복하는 양이 늘어납니다. (기본 10%)\n\n_+1:_ _15%_\n\n_+2:_ _20%_\n\n_+3:_ _25%_
actors.hero.talent.avenger_empower.title=복수의 맹세
actors.hero.talent.avenger_empower.desc=시야 안에서 적끼리 싸울 때마다 근접 피해가 _+1_씩 쌓입니다. 10턴 동안 유지됩니다.\n\n_+1:_ 최대 _+3_\n\n_+2:_ 최대 _+6_\n\n_+3:_ 최대 _+9_
actors.hero.talent.avenger_execute.title=처단
actors.hero.talent.avenger_execute.desc=분노 상태인 적에게 주는 근접 피해가 증가합니다.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.cry_reach.title=쩌렁쩌렁
actors.hero.talent.cry_reach.desc=전쟁의 함성의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.cry_endure.title=멈추지 않는 함성
actors.hero.talent.cry_endure.desc=전쟁의 함성으로 일으킨 광란이 길어집니다. (기본 6턴)\n\n_+1:_ _8턴_\n\n_+2:_ _10턴_\n\n_+3:_ _12턴_\n\n_+4:_ _14턴_
actors.hero.talent.cry_fright.title=위압
actors.hero.talent.cry_fright.desc=전쟁의 함성을 들은 적이 _약화_됩니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.spirit_might.title=강대한 망령
actors.hero.talent.spirit_might.desc=분노의 망령의 체력과 공격력이 강해집니다.\n\n_+1:_ 체력 _25%_ 증가, 레벨 _+2_\n\n_+2:_ 체력 _50%_, 레벨 _+4_\n\n_+3:_ 체력 _75%_, 레벨 _+6_\n\n_+4:_ 체력 _100%_, 레벨 _+8_
actors.hero.talent.spirit_hunger.title=굶주린 망령
actors.hero.talent.spirit_hunger.desc=분노의 망령이 공격할 때마다 체력을 회복합니다.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_\n\n_+4:_ _4_
actors.hero.talent.spirit_spite.title=원한의 망령
actors.hero.talent.spirit_spite.desc=분노의 망령이 소멸할 때 인접한 적이 광란에 빠집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.burst_power.title=폭발적인 분노
actors.hero.talent.burst_power.desc=분노 폭발의 피해가 증가합니다.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.burst_radius.title=파편
actors.hero.talent.burst_radius.desc=분노 폭발이 휩쓰는 범위가 늘어납니다. (기본 1칸)\n\n_+1:_ _1칸_\n\n_+2:_ _2칸_\n\n_+3:_ _2칸_\n\n_+4:_ _3칸_
actors.hero.talent.burst_chain.title=연쇄 분노
actors.hero.talent.burst_chain.desc=분노 폭발에서 살아남은 적이 다시 광란에 빠집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_

actors.hero.abilities.wrath.warcry.name=전쟁의 함성
actors.hero.abilities.wrath.warcry.short_desc=분노에 찬 함성으로 _보이는 모든 적_을 광란에 빠뜨립니다.
actors.hero.abilities.wrath.warcry.desc=4칸 안에 보이는 모든 적이 _6턴_ 동안 광란에 빠져 서로를 공격합니다. 전쟁북 관련 특성도 함께 적용됩니다. 보스는 영향을 받지 않습니다.
actors.hero.abilities.wrath.wrathspirits.name=분노의 망령
actors.hero.abilities.wrath.wrathspirits.short_desc=_분노의 망령 세 마리_를 불러내 함께 싸웁니다.
actors.hero.abilities.wrath.wrathspirits.desc=주변에 타락한 _분노의 망령 3마리_를 소환합니다. 망령은 층에 맞는 힘을 가지고 아군으로 싸우며, 타락한 몬스터처럼 시간이 지나면 서서히 소멸합니다.
actors.hero.abilities.wrath.wrathspirits.no_space=망령을 불러낼 공간이 없다.
actors.hero.abilities.wrath.wrathspirits$spirit.name=분노의 망령
actors.hero.abilities.wrath.wrathspirits$spirit.desc=끊임없이 싸움을 찾아 헤매는 원한 덩어리입니다. 분노의 부름에 응해 잠시 함께 싸우고 있습니다.
actors.hero.abilities.wrath.rageburst.name=분노 폭발
actors.hero.abilities.wrath.rageburst.short_desc=보이는 _분노 상태의 적_ 전부가 폭발해 자신과 주변에 큰 피해를 줍니다.
actors.hero.abilities.wrath.rageburst.desc=시야 안의 광란, 이간질, 분노 전염 상태인 모든 적이 폭발합니다. 폭발한 적은 레벨에 비례한 피해를, 주변 1칸의 다른 적은 그 절반의 피해를 받습니다. 폭발이 겹치면 피해도 쌓입니다.
actors.hero.abilities.wrath.rageburst.no_targets=분노에 빠진 적이 보이지 않는다.

actors.buffs.wrathgrudge.name=원한
actors.buffs.wrathgrudge.desc_head=원한 점수: _%d_\n분노: _%d/%d_
actors.buffs.wrathgrudge.desc_stats=근접 추가 피해: _+%d_\n정확도: _+%d%%_\n최대 체력: _+%d_\n추가 방어력: _0~%d_\n회피: _+%d%%_
actors.buffs.wrathgrudge$discord.name=이간질
actors.buffs.wrathgrudge$discord.desc=다른 적 하나에게 깊은 원한을 품었습니다. 그 적만 노리고 공격합니다.
actors.buffs.wrathgrudge$contagion.name=분노 전염
actors.buffs.wrathgrudge$contagion.desc=걷잡을 수 없는 분노에 휩싸였습니다. 이 적에게 맞은 대상도 광란에 빠집니다.
actors.buffs.wrathgrudge$vengeance.name=복수의 맹세
actors.buffs.wrathgrudge$vengeance.desc=적끼리의 싸움을 지켜보며 복수심이 끓어오릅니다. 근접 피해 _+%d_ (남은 시간 %d턴)
