demons.demonlord.lucifer_name=루시퍼
demons.demonlord.lucifer_title=교만의 마왕 루시퍼
demons.demonlord.lucifer_desc=흰 대리석과 황금으로 빚은 듯한 장신의 존재. 망토처럼 접힌 날개를 두른 타락한 샛별은 모든 것을, 당신까지도 내려다보고 있습니다.
demons.demonlord.lucifer_boss_desc=샛별이 예의의 가면을 벗었습니다. 그 빛은 눈을 멀게 하고, 땅이 빛나는 곳마다 별이 떨어집니다.
demons.demonlord.lucifer_trial=_최대 체력이 25% 감소_합니다.
demons.demonlord.lucifer_perk=체력이 _75% 이상_이면 _피해량이 20% 증가_합니다.
demons.demonlord.lucifer_skill_name=새벽별
demons.demonlord.lucifer_skill_desc=지정한 3x3 범위에 별을 떨어뜨려 큰 피해를 주고, 살아남은 적을 5턴간 _실명_시킵니다.
demons.demonlord.lucifer_altar="무릎을 꿇으라고? 아니, 아직은 요구하지 않겠다. 줄어든 생명으로 감옥의 간수에게 가서, 내가 바라볼 가치가 있는 자임을 증명해라."
demons.demonlord.lucifer_altar_own="아아... 하수구에서 내 거울상이 기어 나오는군. 교만은 교만을 알아보는 법. 왕관의 아이여, 내 곁에 설 자격이 있음을 보여다오."
demons.demonlord.lucifer_accepted=루시퍼의 시선이 당신에게 머뭅니다. 몸이 덧없이 가벼워집니다.
demons.demonlord.lucifer_accepted_own=루시퍼가 미소 짓습니다. "실망시키지 마라. 나는 실망을 무엇보다 경멸한다."
demons.demonlord.lucifer_judge="버텼군. 간신히, 그래도 버텼다. 내 인장을 가져가라. 새벽별의 빛이 너의 앞길을 밝힐 것이다."
demons.demonlord.lucifer_judge_own="훌륭하다. 여기까지 오며 한 번도 고개를 숙이지 않았겠지? 인장을 받아라. 이것을 가질 자격이 있는 건 우리뿐이다."
demons.demonlord.lucifer_challenge="그래서 이제는 내 높이에 닿을 수 있다는 눈빛이군. 시험해 보겠나?"
demons.demonlord.lucifer_challenge_own="당연히 내 왕좌가 탐나겠지. 탐내지 않았다면 오히려 실망했을 거다. 덤벼라."
demons.demonlord.lucifer_wait="천천히 해라. 별은 인내심이 강하니."
demons.demonlord.lucifer_wait_own="망설임이라니, 우리답지 않군."
demons.demonlord.lucifer_boss_notice=결코 닿지 못할 빛을 보아라!
demons.demonlord.lucifer_boss_notice_own=왕관을 쓸 수 있는 건 둘 중 하나뿐이다!
demons.demonlord.lucifer_boss_enrage=감히 나에게 상처를!?
demons.demonlord.lucifer_boss_enrage_own=그래... 그 오만함을 보고 싶었다!
demons.demonlord.lucifer_boss_death=떨어지는 별이야말로... 마지막에 가장 밝게 타오르는 법...
demons.demonlord.lucifer_boss_death_own=잘 써라... 나의 후계자여...
demons.demonlord.mammon_name=맘몬
demons.demonlord.mammon_title=탐욕의 마왕 맘몬
demons.demonlord.mammon_desc=녹은 금화로 빚은 거대한 골렘. 움직일 때마다 동전 소리가 짤랑입니다. 두 눈이 갓 주조한 금화처럼 번뜩입니다.
demons.demonlord.mammon_boss_desc=맘몬은 모든 것을 이자까지 쳐서 돌려받으려 합니다. 그 일격은 당신의 지갑에서 금화를 털어 갑니다.
demons.demonlord.mammon_trial=_줍는 금화가 절반으로 줄어듭니다_.
demons.demonlord.mammon_perk=_줍는 금화가 30% 증가_합니다.
demons.demonlord.mammon_skill_name=미다스의 손
demons.demonlord.mammon_skill_desc=보이는 적 하나에게 손을 뻗어, 일반 몬스터는 즉시 _황금으로 변하게_ 합니다. 보스와 엘리트는 대신 _최대 체력의 15%_를 잃습니다.
demons.demonlord.mammon_altar="거래다, 거래! 감옥의 간수가 쓰러질 때까지 네가 줍는 금화의 절반은 내 몫이다. 그 뒤엔 넉넉히 갚아 주지!"
demons.demonlord.mammon_altar_own="호호! 동업자 냄새가 나는군. 너는 금화의 가치를 아는 놈이야. 동업 어떤가? 반반으로... 일단은."
demons.demonlord.mammon_accepted=어디선가 동전 소리가 납니다. 앞으로 줍는 금화의 절반은 맘몬의 것입니다.
demons.demonlord.mammon_accepted_own=맘몬이 황금 손을 비빕니다. "거래 즐거웠네, 동업자."
demons.demonlord.mammon_judge="빚은 갚았고 계약은 이행됐다! 자, 미다스의 인장이다. 앞으로 줍는 모든 지갑에 조금씩 덤도 얹어 주지."
demons.demonlord.mammon_judge_own="금화 한 닢도 허투루 쓰지 않았군. 아름다운 장부야! 인장을 받게, 동업자. 우리 둘 다 더 부자가 되자고."
demons.demonlord.mammon_challenge="응? 날 털겠다고? 내가 가진 건 전부 너 같은 놈들에게서 나왔지. 되찾아 갈 수 있으면 해 봐."
demons.demonlord.mammon_challenge_own="적대적 인수 합병이라! 오, 거의 자랑스러울 지경이군. 거의."
demons.demonlord.mammon_wait="감당할 수 있을 때 다시 오게."
demons.demonlord.mammon_wait_own="현명하군. 장부를 보기 전엔 절대 걸지 않는 법이지."
demons.demonlord.mammon_boss_notice=네가 가진 모든 것은 내 것이다!
demons.demonlord.mammon_boss_notice_own=정산할 시간이다, 동업자!
demons.demonlord.mammon_boss_enrage=내 금이! 내 금에 흠집을 내다니!
demons.demonlord.mammon_boss_enrage_own=좋다! 이제 할인은 없다!
demons.demonlord.mammon_boss_death=잔돈은... 가져가라...
demons.demonlord.mammon_boss_death_own=훌륭한... 투자 수익이군...
demons.demonlord.asmodeus_name=아스모데우스
demons.demonlord.asmodeus_title=색욕의 마왕 아스모데우스
demons.demonlord.asmodeus_desc=진홍빛 비단과 짙은 향기에 감싸인, 믿기 힘들 만큼 우아한 존재. 눈을 떼기 어렵고, 왜 떼야 하는지 기억해 내기는 더 어렵습니다.
demons.demonlord.asmodeus_boss_desc=아스모데우스는 표식 사이를 춤추듯 오갑니다. 표식에 걸린 자는 매혹되고 생명을 빨립니다.
demons.demonlord.asmodeus_trial=_자연 회복이 멈춥니다_.
demons.demonlord.asmodeus_perk=공격한 _피해량의 10%만큼 체력을 흡수_합니다.
demons.demonlord.asmodeus_skill_name=유혹
demons.demonlord.asmodeus_skill_desc=시야 안의 모든 적을 6턴간 _매혹_시킵니다.
demons.demonlord.asmodeus_altar="이렇게 따뜻하고 사랑스러운 몸이라니... 조금만 맛보게 해 줘. 감옥의 간수가 쓰러질 때까지 회복은 없어, 자기. 굶주릴수록 욕망은 달콤해지는 법이니까."
demons.demonlord.asmodeus_altar_own="어머, 어머... 너한테서 나랑 똑같은 냄새가 나. 나랑 춤추려고 여기까지 온 거야? 영광인걸."
demons.demonlord.asmodeus_accepted=달콤한 향기가 몸에 감깁니다. 이제 상처가 저절로 아물지 않습니다.
demons.demonlord.asmodeus_accepted_own=아스모데우스가 키스를 날립니다. "다음 춤을 추기 전에 죽으면 안 돼."
demons.demonlord.asmodeus_judge="목마르고 떨리는 몸으로 끝까지 버텼구나. 정말 귀여워. 자, 내 인장이야. 내 갈증도 조금 나눠 줄게."
demons.demonlord.asmodeus_judge_own="모든 걸음이 한 편의 춤이었지? 내 인장을 받아, 내 사랑. 던전 전체가 너에게 빠져들 거야."
demons.demonlord.asmodeus_challenge="날 원해? 다들 그렇지. 하지만 먼저 날 잡아야 할걸."
demons.demonlord.asmodeus_challenge_own="마음을 건 결투? 낭만적이야. 누가 누구를 홀리는지 보자."
demons.demonlord.asmodeus_wait="기다릴게, 자기."
demons.demonlord.asmodeus_wait_own="밀당하는 거야? 너무 좋아."
demons.demonlord.asmodeus_boss_notice=더 가까이... 더 가까이 와...
demons.demonlord.asmodeus_boss_notice_own=춤출까, 나의 거울아?
demons.demonlord.asmodeus_boss_enrage=그 대가는 피로 치르게 될 거야!
demons.demonlord.asmodeus_boss_enrage_own=어머, 거칠게 나오네! 마음에 들어!
demons.demonlord.asmodeus_boss_death=이 얼마나... 아름다운 끝이야...
demons.demonlord.asmodeus_boss_death_own=계속 춤춰 줘... 나를 위해서...
demons.demonlord.leviathan_name=레비아탄
demons.demonlord.leviathan_title=시기의 마왕 레비아탄
demons.demonlord.leviathan_desc=얼음장 같은 물로 이루어진 거대한 뱀. 비늘이 탐냈던 모든 색으로 일렁입니다. 그 눈은 당신이 가진 것을 끊임없이 재고 있습니다.
demons.demonlord.leviathan_boss_desc=레비아탄이 투기장의 벽 한 면을 통째로 차지하며 솟아올랐습니다. 몸통 전체가 전장의 일부라서, 어느 똬리를 쳐도 레비아탄 본체에 피해가 들어갑니다. 레비아탄은 움직이지 않는 대신, _대해일_로 한두 줄만 남기고 모든 줄을 휩쓸고(안전한 줄로 피하세요), _역류_로 당신을 벽 앞까지 끌어당기며, 머리 앞에 선 자를 _포식_합니다.
demons.demonlord.leviathan_trial=_명중률과 회피율이 20% 감소_합니다.
demons.demonlord.leviathan_perk=적에게 받은 _피해의 20%를 되돌려_ 줍니다.
demons.demonlord.leviathan_skill_name=해일
demons.demonlord.leviathan_skill_desc=일직선으로 최대 6칸까지 해일을 일으켜, 휩쓸린 모든 적에게 피해를 주고 _밀쳐냅니다_.
demons.demonlord.leviathan_altar="넌 가진 게 참 많구나... 눈도, 손도, 미래도. 감옥의 간수가 쓰러질 때까지 네 날카로움을 조금 빌려 가겠어. 그런 눈으로 보지 마."
demons.demonlord.leviathan_altar_own="...너. 너도 전부 따라 하지? 네가 싫어. 네가 되고 싶어. 시기받을 자격이 있다는 걸 증명해 봐."
demons.demonlord.leviathan_accepted=차가운 물이 관절에 스며듭니다. 몸놀림이 둔해집니다.
demons.demonlord.leviathan_accepted_own=레비아탄이 쉿쉿거립니다. "실패하면 네가 가진 걸 전부 가져갈 거야."
demons.demonlord.leviathan_judge="...흥. 해냈네. 질투 나. 인장이나 가져가. 자기 것을 되돌려 받는 기분이 어떤지 놈들에게 알려 줘."
demons.demonlord.leviathan_judge_own="내 인내심까지 따라 하다니. 화가 나. 멋져. 가져가. 그리고 다른 모두가 우리를 시기하게 만들어."
demons.demonlord.leviathan_challenge="이젠 내 힘까지 원하는 거야? 당연하겠지. 다들 내 걸 원하니까."
demons.demonlord.leviathan_challenge_own="그럼 이것도 따라 해 봐. 할 수 있다면."
demons.demonlord.leviathan_wait="도망쳐. 그래도 난 계속 지켜볼 테니까."
demons.demonlord.leviathan_wait_own="내가 더 나을까 봐 무서워? 맞아, 내가 더 나아."
demons.demonlord.leviathan_boss_notice=네가 가진 건 전부 내 것이었어야 했어!
demons.demonlord.leviathan_boss_notice_own=원본은 하나뿐이야!
demons.demonlord.leviathan_boss_enrage=가라앉아! 가라앉아 버려!
demons.demonlord.leviathan_boss_enrage_own=날 흉내 내지 마!
demons.demonlord.leviathan_boss_death=왜... 언제나... 다른 누군가가...
demons.demonlord.leviathan_boss_death_own=이제... 네가 제일... 부러워...
demons.demonlord.beelzebub_name=벨제부브
demons.demonlord.beelzebub_title=식탐의 마왕 벨제부브
demons.demonlord.beelzebub_desc=파리 대왕. 윙윙대는 벌레 떼가 기어 다니는 비대한 갑각의 괴물. 주변 공기에서 썩은 내와 꿀맛이 납니다.
demons.demonlord.beelzebub_boss_desc=벨제부브는 결코 혼자 싸우지 않습니다. 살아 있는 한 그 벌레 떼는 계속 불어납니다.
demons.demonlord.beelzebub_trial=_배고픔이 2배 빨리 찹니다_.
demons.demonlord.beelzebub_perk=음식을 먹으면 _최대 체력의 25%를 회복_합니다.
demons.demonlord.beelzebub_skill_name=파리 떼
demons.demonlord.beelzebub_skill_desc=30턴 동안 함께 싸우는 _악마 파리 3마리_를 소환합니다.
demons.demonlord.beelzebub_altar="배고프냐? 아직은 아니겠지. 곧 그렇게 될 거다. 감옥의 간수가 쓰러질 때까지 두 배로 굶주려라. 허기야말로 가장 진실한 기도이니."
demons.demonlord.beelzebub_altar_own="위이잉... 바닥없는 위장이로군. 여기서도 꼬르륵 소리가 들린다. 우린 잘 맞을 거다, 작은 아가리여."
demons.demonlord.beelzebub_accepted=파리 한 마리가 혀에 내려앉습니다. 배 속이 요동치기 시작합니다.
demons.demonlord.beelzebub_accepted_own=벨제부브의 벌레 떼가 흡족한 듯 윙윙거립니다. "전부 먹어라. 아무것도 남기지 마라."
demons.demonlord.beelzebub_judge="굶주리면서도 죽지 않았군. 좋다. 이제 모든 식사가 너를 치유하고, 내 파리들이 너를 따를 것이다."
demons.demonlord.beelzebub_judge_own="여기까지 먹어 치우며 왔겠지? 훌륭한 식욕이다! 내 인장을 받아라. 그리고 절대 씹기를 멈추지 마라."
demons.demonlord.beelzebub_challenge="너... 맛있어 보이는군. 싸우고 싶은 거냐, 저녁밥이 되고 싶은 거냐? 나한텐 똑같다."
demons.demonlord.beelzebub_challenge_own="누가 누구를 먹는지, 확인해 볼까!"
demons.demonlord.beelzebub_wait="가라. 살 좀 찌워 와라."
demons.demonlord.beelzebub_wait_own="다른 게 먼저 먹고 싶은가? 이해한다."
demons.demonlord.beelzebub_boss_notice=만찬을 시작하지!
demons.demonlord.beelzebub_boss_notice_own=이 던전을 지배할 위장은 하나뿐이다!
demons.demonlord.beelzebub_boss_enrage=더! 더 먹어야 한다!
demons.demonlord.beelzebub_boss_enrage_own=제법 물어뜯는군! 이번엔 내 차례다!
demons.demonlord.beelzebub_boss_death=아직도... 배가 고프다...
demons.demonlord.beelzebub_boss_death_own=나를 먹고... 자라라...
demons.demonlord.satan_name=사탄
demons.demonlord.satan_title=분노의 마왕 사탄
demons.demonlord.satan_desc=지옥불에 휩싸인 로브 차림의 존재. 뿔은 연기에 그을려 검게 탔습니다. 그것이 서 있는 바닥마다 불씨가 피어오릅니다.
demons.demonlord.satan_boss_desc=사탄의 분노는 주변으로 지옥불이 되어 쏟아집니다. 땅에 표식이 나타나면 가까이 서 있지 마세요.
demons.demonlord.satan_trial=적에게 받는 _피해가 25% 증가_합니다.
demons.demonlord.satan_perk=_잃은 체력 10%마다 피해량이 3% 증가_합니다.
demons.demonlord.satan_skill_name=지옥불
demons.demonlord.satan_skill_desc=주변 2칸에 지옥불을 터뜨려 적에게 피해를 주고 _불태웁니다_.
demons.demonlord.satan_altar="감옥의 간수가 쓰러질 때까지 모든 일격이 더 아플 것이다. 내버려 둬라. 고통은 연료다. 그걸로 타올라서, 더 분노한 채로 돌아와라."
demons.demonlord.satan_altar_own="느껴진다... 네 가슴속에서 전쟁을 위해 울리는 북소리가. 좋다. 세상이 너를 더 아프게 하게 둬라. 그리고 더 세게 되갚아라."
demons.demonlord.satan_accepted=불씨가 피부 속으로 스며듭니다. 모든 상처가 더 뜨겁게 타오를 것입니다.
demons.demonlord.satan_accepted_own=사탄이 크게 웃음을 터뜨립니다. "피 흘리고, 분노해라!"
demons.demonlord.satan_judge="피를 흘리면서도 계속 걸었군. 그것이 분노다. 내 인장을 받아라. 죽음에 가까울수록 너는 더 강하게 칠 것이다."
demons.demonlord.satan_judge_own="아직도 화가 나 있나? 좋다. 그 불꽃을 절대 꺼뜨리지 마라. 인장을 받아 모조리 불태워라."
demons.demonlord.satan_challenge="나와 싸우겠다고? 드디어 배짱 있는 놈이 나왔군. 와라!"
demons.demonlord.satan_challenge_own="분노 대 분노! 장관이겠군!"
demons.demonlord.satan_wait="겁쟁이. 피가 끓을 때 다시 와라."
demons.demonlord.satan_wait_own="분노를 쌓아라. 기다려 주지."
demons.demonlord.satan_boss_notice=불타라!
demons.demonlord.satan_boss_notice_own=네 분노를 보여라!
demons.demonlord.satan_boss_enrage=이제야 화가 나는군!
demons.demonlord.satan_boss_enrage_own=그래! 더!
demons.demonlord.satan_boss_death=불꽃은... 꺼지지 않는다...
demons.demonlord.satan_boss_death_own=내 불꽃을... 이어 가라...
demons.demonlord.belphegor_name=벨페고르
demons.demonlord.belphegor_title=나태의 마왕 벨페고르
demons.demonlord.belphegor_desc=보이지 않는 왕좌에 축 늘어져 하품하는 거대한 뿔 달린 짐승. 말하는 도중에도 잠들어 버릴 것만 같습니다.
demons.demonlord.belphegor_boss_desc=벨페고르는 거의 움직이지 않지만, 그 표식에 닿은 것은 무겁고 느려집니다.
demons.demonlord.belphegor_trial=_이동 속도가 25% 감소_합니다.
demons.demonlord.belphegor_perk=휴식할 때마다 _매 턴 최대 체력의 1%를 회복_합니다.
demons.demonlord.belphegor_skill_name=게으름
demons.demonlord.belphegor_skill_desc=아무것도 하지 않고 모든 것을 얻습니다. _마법 막대와 유물을 충전_하고 최대 체력의 20%를 회복합니다.
demons.demonlord.belphegor_altar="흐음...? 아. 뭔가 원하는구나. 좋아... 감옥의 간수가 쓰러질 때까지 천천히 걸어. 어차피 서두르는 건 피곤하잖아..."
demons.demonlord.belphegor_altar_own="쿨... 어, 낮잠 동지네. 너도 베개 들고 다녀? 우린 서로 통하는구나. ...끝나면 깨워 줘."
demons.demonlord.belphegor_accepted=다리가 무거워집니다. 한 걸음 한 걸음이 버겁습니다.
demons.demonlord.belphegor_accepted_own=벨페고르는 벌써 코를 골고 있습니다.
demons.demonlord.belphegor_judge="...벌써 돌아왔어? 으. 자, 이거 가져가. 더 쉬어. 아무것도 안 해도 강해질 거야. 날 믿어."
demons.demonlord.belphegor_judge_own="분명 애쓰지도 않고 해냈겠지. 완벽해. 내 인장을 가져가... 낮잠도 같이."
demons.demonlord.belphegor_challenge="싸우자고...? 지금...? ...알았어. 근데 오래 일어나 있진 않을 거야."
demons.demonlord.belphegor_challenge_own="먼저 잠드는 쪽이 지는 거야. ...아니, 이기는 건가?"
demons.demonlord.belphegor_wait="좋아. 모든 일은 나중에 하는 게 최고지."
demons.demonlord.belphegor_wait_own="바로 그거야. 오늘 싸울 이유가 뭐 있어?"
demons.demonlord.belphegor_boss_notice=날 깨웠구나...
demons.demonlord.belphegor_boss_notice_own=빨리 끝내자. 자고 싶어.
demons.demonlord.belphegor_boss_enrage=이제 완전히 깼어... 그리고 짜증 나.
demons.demonlord.belphegor_boss_enrage_own=네가 날 못 자게 하잖아!
demons.demonlord.belphegor_boss_death=드디어... 쉴 수 있겠다...
demons.demonlord.belphegor_boss_death_own=잘 자... 잠꾸러기야...
actors.buffs.demontrial.name=%s의 시련
actors.buffs.demontrial.name_none=마왕의 시련
actors.buffs.demontrial.desc=마왕의 제단에서 %s의 시련을 받았습니다.\n\n%s\n\n감옥의 간수 텐구를 쓰러뜨리면 시련이 끝나고, 마왕이 당신을 심판하러 찾아옵니다.
actors.buffs.demonperk.name=%s의 가호
actors.buffs.demonperk.desc=%s이(가) 당신을 인정했습니다.\n\n%s\n\n마왕 스킬 충전: %d/100.
actors.buffs.demonperk.desc_defeated=마왕의 진정한 모습을 쓰러뜨렸습니다. 가호의 효과가 _50% 강해지고_ 마왕 스킬이 2배 빨리 충전됩니다.
actors.mobs.npcs.demonaltar.name=마왕의 제단
actors.mobs.npcs.demonaltar.desc=구가 쓰러진 점액 속에서 솟아오른 검은 제단입니다. 표면에는 일곱 마왕의 문장이 불타고 있습니다. 손을 대면 마왕의 시련을 받을 수 있습니다.
actors.mobs.npcs.demonaltar.appears=점액 속에서 무언가가 솟아오릅니다... 마왕의 제단입니다!
actors.mobs.npcs.demonlordnpc.name=마왕
actors.mobs.npcs.demonlordnpc.desc=마왕입니다.
actors.mobs.npcs.demonlordnpc.appears=%s이(가) 그림자 속에서 걸어 나와 당신의 시련을 심판하려 합니다.
actors.mobs.npcs.demonlordnpc.empowered=마왕의 힘이 당신에게 흘러듭니다. 가호가 강해졌습니다!
actors.mobs.npcs.demonlordnpc.skill_granted=새로운 힘이 영혼에 새겨졌습니다: _%s_. 스킬 바 위쪽에 추가되었습니다.
actors.mobs.npcs.demonlordnpc.portal_open=영역이 무너져 내립니다. 감옥으로 돌아가는 계단이 열렸습니다.
levels.demonarenalevel.embers_name=지옥불 잔불
demons.demonskill.desc=%s이(가) 내려 준 힘입니다.\n\n%s\n\n가호의 충전(100)을 모두 사용하며, 충전은 매 턴 1씩 찹니다(마왕의 진정한 모습을 쓰러뜨리면 2씩). 충전: _%d/100_.
demons.demonskill.cost=충전 100
actors.mobs.npcs.demonlordnpc.fight=진정한 모습과 싸운다
actors.mobs.npcs.demonlordnpc.later=지금은 아니다
actors.mobs.demonlordboss.name=마왕
actors.mobs.demonlordboss.desc=진정한 모습을 드러낸 마왕입니다. 번지는 지옥불은 한 턴에 한 칸씩 고리를 그리며 바깥으로 퍼져 나갑니다. 불길이 지나간 안쪽으로 들어서세요.
actors.mobs.demonlordboss.notice=...
actors.mobs.demonlordboss.skill_hellfire=지옥불 고리!
actors.mobs.demonlordboss.skill_summon=일어나라, 종복들아!
actors.mobs.demonlordboss.skill_spread=모조리 타올라라!
actors.mobs.demonlordboss.skill_lucifer=새벽별!
actors.mobs.demonlordboss.skill_mammon=내놔라!
actors.mobs.demonlordboss.skill_asmodeus=포옹!
actors.mobs.demonlordboss.skill_leviathan=해일!
actors.mobs.demonlordboss.skill_beelzebub=파리 떼!
actors.mobs.demonlordboss.skill_satan=업화!
actors.mobs.demonlordboss.skill_belphegor=무기력!
actors.mobs.demonlordboss.steal=맘몬이 금화 %d개를 빼앗았습니다!
actors.mobs.leviathanboss.skill_wave=대해일!
actors.mobs.leviathanboss.skill_bite=포식!
actors.mobs.leviathanboss.skill_undertow=역류!
actors.mobs.leviathancoil.name=레비아탄의 똬리
actors.mobs.leviathancoil.desc=벽을 따라 길게 누운 레비아탄의 거대한 몸통 일부입니다. 이곳에 들어간 공격은 레비아탄 본체에 상처를 입힙니다.
actors.mobs.demonfly.name=악마 파리
actors.mobs.demonfly.desc=벨제부브의 무리에서 날아온 살찐 파리입니다. 빠르고 연약하며, 언제나 굶주려 있습니다.
