actors.hero.heroclass.pride=교만
actors.hero.heroclass.pride_desc_short=칠죄종 중 _교만_의 죄를 짊어진 자. 교만은 _한 대도 맞지 않고 적을 쓰러뜨릴 때마다_ 영광을 얻어 _영구적으로 강해지지만_, 맞으면 위엄이 무너집니다.
actors.hero.heroclass.pride_desc=교만은 _멀리서_ 싸웁니다. _투척용 나이프 한 세트_와, 유물 칸에 착용한 _오만의 왕관_을 들고 시작합니다. 왕관을 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다. 왕관은 _위엄_을 써서 _왕명_, _결투 신청_, _행차_, _하명_을 내립니다.\n\n교만에게 _피해를 입힌 적_은 불경한 자가 됩니다. 불경하지 않은 적을 쓰러뜨리면 _영광 점수_를 얻고, 영광에 비례해 투척 무기 피해, 명중, 최대 체력, 방어력, 회피가 끝없이 오릅니다. 피해를 받지 않는 동안에는 _위엄_이 쌓여 투척 무기 피해가 늘어나지만, 맞는 순간 무너집니다. 가까이서는 서툴러서 _근접 공격 피해가 30% 줄어듭니다_. 연금술로 만드는 _투척 무기 주형_으로 투척 무기 세트의 개수를 영구히 늘릴 수 있습니다.\n\n교만은 _레이피어_도 지니고 있으며, _치유 물약_과 _환영의 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.pride_unlock=교만은 처음부터 해금되어 있습니다.

actors.hero.herosubclass.monarch=군주
actors.hero.herosubclass.monarch_short_desc=_군주_의 왕명은 체력이 절반 이하인 적을 _신하_로 굴복시킵니다.
actors.hero.herosubclass.monarch_desc=군주는 무릎 꿇은 자를 거두어 부립니다. 체력이 _절반 이하_인 적에게 왕명을 내리면 기절시키는 대신 영원히 충성하는 _신하_로 삼습니다. 신하는 한 명까지 거느릴 수 있습니다.\n\n신하가 불경하지 않은 적을 쓰러뜨리면 영광의 _절반_을 얻습니다. 전용 특성으로 신하를 늘리거나, 더 강한 적도 굴복시키거나, 신하를 강하게 만들 수 있습니다.
actors.hero.herosubclass.paragon=영웅
actors.hero.herosubclass.paragon_short_desc=_영웅_은 곁에 아군이 없을 때 피해가 _25%_, 회피가 _20%_ 늘고, 자신보다 체력이 많은 적에게 _25%_ 더 큰 피해를 주며, 적을 대신 끌어 줄 _석상_을 세울 수 있습니다.
actors.hero.herosubclass.paragon_desc=영웅은 누구의 도움도 받지 않습니다. 시야 안에 아군이 없으면 주는 피해가 _25%_, 회피가 _20%_ 증가합니다. 또한 현재 체력이 자신보다 많은 적에게 _25%_ 더 큰 피해를 줍니다.\n\n영웅의 왕관에는 _교만의 석상_ 기술이 생깁니다. 주변의 모든 적이 영웅 대신 공격하는 황금 석상을 세워, 홀로 계속 활을 쏠 수 있게 해 줍니다. 석상은 아군으로 치지 않으며, 석상을 때린 적은 불경한 자가 되지 않습니다.\n\n전용 특성으로 홀로 싸울 때의 힘을 키우거나, 강적에게 더 큰 피해를 주거나, 무결한 승리로 위엄을 얻을 수 있습니다.

actors.hero.talent.pride_vanity.title=허영
actors.hero.talent.pride_vanity.desc=_+1:_ 얻는 영광 점수가 _15%_ 증가합니다.\n\n_+2:_ 얻는 영광 점수가 _30%_ 증가합니다.
actors.hero.talent.pride_composure.title=침착
actors.hero.talent.pride_composure.desc=위엄의 최대치가 늘어납니다. (기본 10)\n\n_+1:_ _13_\n\n_+2:_ _16_
actors.hero.talent.pride_poise.title=기품
actors.hero.talent.pride_poise.desc=위엄이 더 빨리 쌓입니다. (기본 3턴마다 1)\n\n_+1:_ _2.5턴_마다\n\n_+2:_ _2턴_마다
actors.hero.talent.pride_grace.title=품위 유지
actors.hero.talent.pride_grace.desc=피해를 받아도 위엄의 일부가 남습니다.\n\n_+1:_ _25%_ 유지\n\n_+2:_ _50%_ 유지
actors.hero.talent.pride_regalia.title=왕의 만찬
actors.hero.talent.pride_regalia.desc=음식을 먹는 데 _3턴_이 아니라 _1턴_이 걸리고, 먹을 때마다 위엄이 쌓입니다.\n\n_+1:_ _3_\n\n_+2:_ _6_
actors.hero.talent.pride_swift_crown.title=왕의 회수
actors.hero.talent.pride_swift_crown.desc=던진 투척 무기가 땅에 떨어지지 않고 가끔 곧바로 손에 돌아옵니다.\n\n_+1:_ _25%_ 확률\n\n_+2:_ _50%_ 확률
pride.pridehooks.swift_return=회수!
actors.hero.talent.pride_procession.title=개선 행진
actors.hero.talent.pride_procession.desc=행차의 이동 거리가 늘어납니다. (기본 4칸)\n\n_+1:_ _5칸_\n\n_+2:_ _6칸_
actors.hero.talent.pride_decree.title=절대 명령
actors.hero.talent.pride_decree.desc=하명이 더 많은 공격을 무효로 만듭니다. (기본 1회)\n\n_+1:_ _2회_\n\n_+2:_ _3회_
actors.hero.talent.pride_scorn.title=경멸
actors.hero.talent.pride_scorn.desc=왕명의 기절 시간이 늘어납니다. (기본 3턴)\n\n_+1:_ _4턴_\n\n_+2:_ _5턴_
actors.hero.talent.pride_majesty.title=위풍당당
actors.hero.talent.pride_majesty.desc=영광 점수로 얻는 모든 스탯 효과가 증가합니다. 이미 쌓은 점수에도 적용됩니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.pride_supremacy.title=압도
actors.hero.talent.pride_supremacy.desc=무결한 승리를 거두면 체력을 회복합니다.\n\n_+1:_ 최대 체력의 _3%_\n\n_+2:_ _6%_\n\n_+3:_ _9%_
actors.hero.talent.monarch_court.title=궁정
actors.hero.talent.monarch_court.desc=거느릴 수 있는 신하의 수가 늘어납니다. (기본 1명)\n\n_+1:_ _2명_\n\n_+2:_ _3명_\n\n_+3:_ _4명_
actors.hero.talent.monarch_dominion.title=지배
actors.hero.talent.monarch_dominion.desc=더 건강한 적도 신하로 굴복시킬 수 있습니다. (기본 체력 50% 이하)\n\n_+1:_ _60%_ 이하\n\n_+2:_ _70%_ 이하\n\n_+3:_ _80%_ 이하
actors.hero.talent.monarch_loyalty.title=충성
actors.hero.talent.monarch_loyalty.desc=신하가 주는 피해가 증가합니다.\n\n_+1:_ _15%_\n\n_+2:_ _30%_\n\n_+3:_ _45%_
actors.hero.talent.paragon_solitude.title=고고함
actors.hero.talent.paragon_solitude.desc=홀로 싸울 때 피해 증가량이 늘어납니다. (기본 25%)\n\n_+1:_ _35%_\n\n_+2:_ _45%_\n\n_+3:_ _55%_
actors.hero.talent.paragon_giantslayer.title=거인 사냥
actors.hero.talent.paragon_giantslayer.desc=자신보다 체력이 많은 적에게 주는 피해 증가량이 늘어납니다. (기본 25%)\n\n_+1:_ _40%_\n\n_+2:_ _55%_\n\n_+3:_ _70%_
actors.hero.talent.paragon_legend.title=전설
actors.hero.talent.paragon_legend.desc=무결한 승리를 거두면 위엄을 얻습니다.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_
actors.hero.talent.reign_reach.title=광대한 영토
actors.hero.talent.reign_reach.desc=군림의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.reign_duration.title=영원한 치세
actors.hero.talent.reign_duration.desc=군림으로 무릎 꿇은 적이 더 오래 기절합니다. (기본 3턴)\n\n_+1:_ _4턴_\n\n_+2:_ _5턴_\n\n_+3:_ _6턴_\n\n_+4:_ _7턴_
actors.hero.talent.reign_humble.title=굴욕
actors.hero.talent.reign_humble.desc=군림으로 무릎 꿇은 적이 _취약_ 상태가 됩니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.aegis_count.title=철벽
actors.hero.talent.aegis_count.desc=불가침이 막아내는 공격 횟수가 늘어납니다. (기본 3회)\n\n_+1:_ _4회_\n\n_+2:_ _5회_\n\n_+3:_ _6회_\n\n_+4:_ _7회_
actors.hero.talent.aegis_riposte.title=응징
actors.hero.talent.aegis_riposte.desc=불가침으로 인접한 적의 공격을 막으면 반격합니다.\n\n_+1:_ 공격력의 _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.aegis_dignity.title=흔들림 없는 위엄
actors.hero.talent.aegis_dignity.desc=불가침으로 공격을 막을 때마다 위엄이 쌓입니다.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_\n\n_+4:_ _4_
actors.hero.talent.judge_power.title=천벌
actors.hero.talent.judge_power.desc=심판의 피해가 증가합니다.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.judge_dignity.title=위엄의 일격
actors.hero.talent.judge_dignity.desc=심판이 쌓인 위엄을 모두 소모해 위엄 1당 추가 피해를 줍니다.\n\n_+1:_ 위엄 1당 _2_\n\n_+2:_ _4_\n\n_+3:_ _6_\n\n_+4:_ _8_
actors.hero.talent.judge_glory.title=신성한 영광
actors.hero.talent.judge_glory.desc=심판으로 불경하지 않은 적을 처치하면 영광을 추가로 얻습니다.\n\n_+1:_ _50%_ 추가\n\n_+2:_ _100%_\n\n_+3:_ _150%_\n\n_+4:_ _200%_

actors.hero.abilities.pride.reign.name=군림
actors.hero.abilities.pride.reign.short_desc=보이는 _모든 적_을 무릎 꿇립니다.
actors.hero.abilities.pride.reign.desc=4칸 안에 보이는 모든 적이 _3턴_ 동안 기절합니다. 보스와 중간 보스는 무릎 꿇지 않습니다.
actors.hero.abilities.pride.aegis.name=불가침
actors.hero.abilities.pride.aegis.short_desc=다음 _3번_의 공격을 완전히 막아냅니다. 막은 공격은 위엄을 무너뜨리지 않습니다.
actors.hero.abilities.pride.aegis.desc=감히 범할 수 없는 기운을 두릅니다. 다음 _3번_ 받는 공격의 피해가 0이 되며, 공격한 적도 불경한 자가 되지 않습니다.
actors.hero.abilities.pride.judgement.name=심판
actors.hero.abilities.pride.judgement.short_desc=보이는 적 하나에게 하늘의 _벼락_을 내립니다. 영광이 높을수록 강해집니다.
actors.hero.abilities.pride.judgement.desc=시야 안의 적 하나에게 레벨에 비례한 큰 피해에 _영광 점수의 50%_를 더해 입힙니다. 거리 제한이 없습니다.
actors.hero.abilities.pride.judgement.prompt=심판할 적을 선택하세요
actors.hero.abilities.pride.judgement.no_target=그곳에는 심판할 대상이 없다.

actors.buffs.prideglory.name=영광
actors.buffs.prideglory.desc_head=영광 점수: _%d_\n위엄: _%d/%d_ (투척 무기 피해 _+%d%%_)
actors.buffs.prideglory.desc_stats=투척 무기 추가 피해: _+%d_\n정확도: _+%d%%_\n최대 체력: _+%d_\n추가 방어력: _0~%d_\n회피: _+%d%%_\n\n근접 공격 피해가 30%% 줄어듭니다.
actors.buffs.prideglory.shattered=위엄 붕괴
actors.buffs.prideglory.flawless=무결
actors.buffs.prideglory.bow_given=교만은 이제 멀리서 싸웁니다. 투척용 나이프 한 세트를 받았습니다!
actors.mobs.npcs.prideeffigy.name=교만의 석상
actors.mobs.npcs.prideeffigy.desc=영웅다운 자세를 취한 영웅의 황금 석상입니다. 근처의 적들은 이 석상을 공격하지 않고는 못 배깁니다.\n\n_%d턴_ 뒤에 무너집니다.
actors.buffs.prideglory$decree.name=하명
actors.buffs.prideglory$decree.desc=교만의 명령에 묶였습니다. 다음 _%d번_의 공격이 무효가 됩니다.
actors.buffs.prideglory$decree.nullified=무효
actors.buffs.prideglory$duel.name=결투
actors.buffs.prideglory$duel.desc=1:1 결투 중입니다. 결투 상대 외에는 누구도 당신을 해칠 수 없고, 결투 상대에게 주는 피해가 20%% 증가합니다.\n\n남은 시간: %s턴
actors.buffs.prideglory$duel.interfere=결투 중
actors.buffs.prideglory$aegis.name=불가침
actors.buffs.prideglory$aegis.desc=감히 범할 수 없는 기운을 두르고 있습니다. 다음 _%d번_의 공격을 막아냅니다.
actors.buffs.prideglory$aegis.blocked=불가침
actors.buffs.prideglory$vassal.name=신하
actors.buffs.prideglory$vassal.desc=교만에게 무릎 꿇고 충성을 맹세했습니다. 이제 아군으로 싸웁니다.
