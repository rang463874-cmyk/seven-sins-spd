actors.hero.heroclass.envy=시기
actors.hero.heroclass.envy_desc_short=칠죄종 중 _시기_의 죄를 짊어진 자. 시기는 공격할 때마다 적의 힘을 _빼앗고_, 특별한 적을 쓰러뜨려 그 능력을 _도감_에 새깁니다.
actors.hero.heroclass.envy_desc=시기는 _질투의 거울_을 유물 칸에 착용한 채 시작합니다. 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다. 거울은 시간이 지나면 충전되며, 충전을 써서 _강탈_, _평준화_, _바꿔치기_, _모방_을 사용합니다.\n\n공격할 때마다 적에게 _강탈_ 스택이 쌓여 적이 약해지고, 강탈당한 적을 쓰러뜨리면 _선망 점수_를 얻어 근접 피해, 명중, 최대 체력, 방어력, 회피가 끝없이 오릅니다. 희귀 변종, 퀘스트 몬스터, 보스를 쓰러뜨리면 _도감_에 등록되어 그 고유 능력을 영원히 얻습니다.\n\n시기는 _낡은 소검_을 들고 시작하며, _치유 물약_과 _변환의 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.envy_unlock=시기는 처음부터 해금되어 있습니다.

actors.hero.herosubclass.usurper=찬탈자
actors.hero.herosubclass.usurper_short_desc=_찬탈자_는 공격마다 강탈 스택을 _2개_씩 쌓고 최대 _10개_까지 빼앗으며, 강탈 스택 1개당 그 적에게 _3%_ 더 큰 피해를 줍니다.
actors.hero.herosubclass.usurper_desc=찬탈자는 남의 것을 남김없이 빼앗습니다. 공격할 때마다 강탈 스택을 _2개_씩 쌓으며, 적 하나에게 최대 _10개_까지 쌓을 수 있습니다. 강탈 스택 1개당 그 적에게 주는 피해가 _3%_ 증가합니다.\n\n전용 특성으로 피해 증가량을 키우거나, 공격으로 체력을 빼앗거나, 크게 강탈한 적을 쓰러뜨려 거울을 충전할 수 있습니다.
actors.hero.herosubclass.copycat=모방자
actors.hero.herosubclass.copycat_short_desc=_모방자_는 도감에 등록된 모든 능력의 효과가 _2배_가 됩니다.
actors.hero.herosubclass.copycat_desc=모방자는 본 것을 그대로, 아니 더 잘 따라 합니다. 도감에 등록된 모든 몬스터 능력의 효과가 _2배_가 됩니다.\n\n전용 특성으로 도감 능력을 더 강하게 하거나, 모방으로 얻는 방어막을 키우거나, 이미 등록한 종류를 다시 쓰러뜨릴 때 선망을 더 얻을 수 있습니다.

actors.hero.talent.envy_covet.title=탐냄
actors.hero.talent.envy_covet.desc=_+1:_ 얻는 선망 점수가 _15%_ 증가합니다.\n\n_+2:_ 얻는 선망 점수가 _30%_ 증가합니다.
actors.hero.talent.envy_grasp.title=움켜쥐기
actors.hero.talent.envy_grasp.desc=적 하나에게 쌓을 수 있는 강탈 스택이 늘어납니다.\n\n_+1:_ _+2_\n\n_+2:_ _+4_
actors.hero.talent.envy_petty.title=옹졸함
actors.hero.talent.envy_petty.desc=강탈 스택 1개당 적의 공격력이 더 크게 줄어듭니다. (기본 5%)\n\n_+1:_ _7%_\n\n_+2:_ _9%_
actors.hero.talent.envy_snatch.title=날치기
actors.hero.talent.envy_snatch.desc=강탈의 지속 시간이 늘어납니다. (기본 8턴)\n\n_+1:_ _12턴_\n\n_+2:_ _16턴_
actors.hero.talent.envy_mirror.title=큰 거울
actors.hero.talent.envy_mirror.desc=거울의 최대 충전 수가 늘어납니다. (기본 3)\n\n_+1:_ _4회_\n\n_+2:_ _5회_
actors.hero.talent.envy_polish.title=거울 닦기
actors.hero.talent.envy_polish.desc=거울의 충전 속도가 빨라집니다.\n\n_+1:_ _20%_ 빨라짐\n\n_+2:_ _40%_ 빨라짐
actors.hero.talent.envy_switch.title=바꿔 끼우기
actors.hero.talent.envy_switch.desc=바꿔치기의 사거리가 늘어납니다. (기본 6칸)\n\n_+1:_ _8칸_\n\n_+2:_ _10칸_
actors.hero.talent.envy_level.title=하향 평준화
actors.hero.talent.envy_level.desc=평준화를 당한 적이 _약화_됩니다.\n\n_+1:_ _3턴_\n\n_+2:_ _5턴_
actors.hero.talent.envy_resent.title=앙갚음
actors.hero.talent.envy_resent.desc=공격받을 때 일정 확률로 공격한 적에게 강탈 스택을 쌓습니다.\n\n_+1:_ _15%_ 확률\n\n_+2:_ _30%_ 확률
actors.hero.talent.envy_jealousy.title=질투
actors.hero.talent.envy_jealousy.desc=선망 점수로 얻는 모든 스탯 효과가 증가합니다. 이미 쌓은 점수에도 적용됩니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.envy_trophy.title=전리품
actors.hero.talent.envy_trophy.desc=도감에 등록된 몬스터 하나당 최대 체력이 늘어납니다.\n\n_+1:_ 하나당 _+2_\n\n_+2:_ _+4_\n\n_+3:_ _+6_
actors.hero.talent.usurp_tyranny.title=폭정
actors.hero.talent.usurp_tyranny.desc=강탈 스택 1개당 추가 피해가 더 늘어납니다. (기본 3%)\n\n_+1:_ _5%_\n\n_+2:_ _7%_\n\n_+3:_ _9%_
actors.hero.talent.usurp_drain.title=착취
actors.hero.talent.usurp_drain.desc=공격할 때마다 체력을 회복합니다.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_
actors.hero.talent.usurp_crown.title=왕좌 찬탈
actors.hero.talent.usurp_crown.desc=강탈 스택이 5개 이상인 적을 쓰러뜨리면 거울이 충전됩니다.\n\n_+1:_ _0.2회분_\n\n_+2:_ _0.4회분_\n\n_+3:_ _0.6회분_
actors.hero.talent.copy_study.title=관찰
actors.hero.talent.copy_study.desc=도감 능력의 효과가 더 커집니다. (기본 2배)\n\n_+1:_ _2.25배_\n\n_+2:_ _2.5배_\n\n_+3:_ _2.75배_
actors.hero.talent.copy_mask.title=가면
actors.hero.talent.copy_mask.desc=모방으로 얻는 방어막이 늘어납니다.\n\n_+1:_ _50%_\n\n_+2:_ _100%_\n\n_+3:_ _150%_
actors.hero.talent.copy_echo.title=복습
actors.hero.talent.copy_echo.desc=이미 도감에 등록한 종류를 다시 쓰러뜨리면 선망을 더 얻습니다.\n\n_+1:_ _50%_ 추가\n\n_+2:_ _100%_\n\n_+3:_ _150%_
actors.hero.talent.plunder_reach.title=약탈 원정
actors.hero.talent.plunder_reach.desc=탈취의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.plunder_stacks.title=싹쓸이
actors.hero.talent.plunder_stacks.desc=탈취가 쌓는 강탈 스택이 늘어납니다. (기본 4)\n\n_+1:_ _6_\n\n_+2:_ _8_\n\n_+3:_ _10_\n\n_+4:_ _12_
actors.hero.talent.plunder_spoils.title=노획물
actors.hero.talent.plunder_spoils.desc=탈취에 맞은 적 하나당 선망을 얻습니다.\n\n_+1:_ _0.5_\n\n_+2:_ _1_\n\n_+3:_ _1.5_\n\n_+4:_ _2_
actors.hero.talent.trans_amplify.title=증폭
actors.hero.talent.trans_amplify.desc=전가로 넘긴 해로운 효과의 지속 시간이 늘어납니다.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.trans_heal.title=후련함
actors.hero.talent.trans_heal.desc=전가를 사용하면 체력을 회복합니다.\n\n_+1:_ 최대 체력의 _5%_\n\n_+2:_ _10%_\n\n_+3:_ _15%_\n\n_+4:_ _20%_
actors.hero.talent.trans_weaken.title=저주 떠넘기기
actors.hero.talent.trans_weaken.desc=전가의 대상이 추가로 _약화_됩니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.fall_power.title=추락
actors.hero.talent.fall_power.desc=끌어내리기가 체력 격차를 더 많이 줄입니다. (기본 50%)\n\n_+1:_ _62%_\n\n_+2:_ _75%_\n\n_+3:_ _87%_\n\n_+4:_ _100%_
actors.hero.talent.fall_reach.title=만인의 적
actors.hero.talent.fall_reach.desc=끌어내리기의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.fall_rob.title=빈털터리
actors.hero.talent.fall_rob.desc=끌어내리기에 맞은 적에게 강탈 스택을 쌓습니다.\n\n_+1:_ _2_\n\n_+2:_ _4_\n\n_+3:_ _6_\n\n_+4:_ _8_

actors.hero.abilities.envy.plunder.name=탈취
actors.hero.abilities.envy.plunder.short_desc=보이는 _모든 적_에게서 한꺼번에 힘을 빼앗습니다.
actors.hero.abilities.envy.plunder.desc=4칸 안에 보이는 모든 적에게 강탈 스택을 _4개_ 쌓고 _5턴_ 동안 약화시킵니다.
actors.hero.abilities.envy.transference.name=전가
actors.hero.abilities.envy.transference.short_desc=내게 걸린 _해로운 효과_를 모두 적 하나에게 떠넘깁니다.
actors.hero.abilities.envy.transference.desc=시야 안의 적 하나를 골라, 내게 걸린 해로운 효과를 모두 해제하고 지속 시간이 있는 것은 그 적에게 그대로 옮깁니다. 배고픔은 옮겨지지 않습니다.
actors.hero.abilities.envy.transference.prompt=불행을 떠넘길 적을 선택하세요
actors.hero.abilities.envy.transference.no_target=그곳에는 대상이 없다.
actors.hero.abilities.envy.transference.moved=해로운 효과 %d개를 떠넘겼다.
actors.hero.abilities.envy.downfall.name=끌어내리기
actors.hero.abilities.envy.downfall.short_desc=나보다 _건강한 적들_의 체력을 내 수준으로 끌어내립니다.
actors.hero.abilities.envy.downfall.desc=4칸 안에 보이는 적 중 체력 비율이 나보다 높은 모든 적에게, 그 격차의 _50%_만큼 피해를 줍니다. 보스는 절반만 받습니다. 이 피해로는 적이 죽지 않습니다.

actors.buffs.envycovet.name=선망
actors.buffs.envycovet.desc_head=선망 점수: _%d_\n거울 충전: _%d/%d_\n도감: _%d/%d_
actors.buffs.envycovet.desc_stats=근접 추가 피해: _+%d_\n정확도: _+%d%%_\n최대 체력: _+%d_\n추가 방어력: _0~%d_\n회피: _+%d%%_
actors.buffs.envycovet.registered=도감 등록: _%s_ - %s
actors.buffs.envycovet.codex_empty=아직 도감에 등록된 몬스터가 없습니다.\n\n각 층의 _희귀 변종_(흰 쥐 등), _퀘스트 몬스터_, _보스_를 쓰러뜨리면 등록되어 그 능력을 영원히 얻습니다.
actors.buffs.envycovet$robbed.name=강탈당함
actors.buffs.envycovet$robbed.desc=시기에게 힘을 빼앗겼습니다. 강탈 _%d_스택: 주는 피해가 _%d%%_ 감소합니다.
actors.buffs.envycovet$stolen.name=빼앗은 힘
actors.buffs.envycovet$stolen.desc=적에게서 빼앗은 힘이 넘칩니다. 주는 피해가 25%% 증가합니다.\n\n남은 시간: %s턴
actors.buffs.envycovet.trait_albino_name=흰 쥐
actors.buffs.envycovet.trait_albino=공격 시 _20%_ 확률로 출혈을 일으킵니다.
actors.buffs.envycovet.trait_gnoll_exile_name=추방된 놀
actors.buffs.envycovet.trait_gnoll_exile=정확도가 _10%_ 증가합니다.
actors.buffs.envycovet.trait_hermit_crab_name=소라게
actors.buffs.envycovet.trait_hermit_crab=방어력이 _2_ 증가합니다.
actors.buffs.envycovet.trait_caustic_slime_name=부식성 슬라임
actors.buffs.envycovet.trait_caustic_slime=공격 시 _20%_ 확률로 산성 점액을 묻힙니다.
actors.buffs.envycovet.trait_bandit_name=도적
actors.buffs.envycovet.trait_bandit=공격 시 _15%_ 확률로 적을 실명시킵니다.
actors.buffs.envycovet.trait_spectral_necro_name=유령 강령술사
actors.buffs.envycovet.trait_spectral_necro=강탈한 적을 쓰러뜨리면 체력을 _3_ 회복합니다.
actors.buffs.envycovet.trait_armored_brute_name=중무장 놀 폭도
actors.buffs.envycovet.trait_armored_brute=방어력이 _3_ 증가합니다.
actors.buffs.envycovet.trait_dm201_name=DM-201
actors.buffs.envycovet.trait_dm201=근접 피해가 _10%_ 증가합니다.
actors.buffs.envycovet.trait_senior_name=고참 수도승
actors.buffs.envycovet.trait_senior=회피가 _10%_ 증가합니다.
actors.buffs.envycovet.trait_chaos_elemental_name=혼돈의 정령
actors.buffs.envycovet.trait_chaos_elemental=공격 시 _15%_ 확률로 적을 불태우거나 얼립니다.
actors.buffs.envycovet.trait_acidic_name=산성 전갈
actors.buffs.envycovet.trait_acidic=인접한 적에게 받은 피해의 _15%_를 되돌려줍니다.
actors.buffs.envycovet.trait_tormented_spirit_name=고통받는 영혼
actors.buffs.envycovet.trait_tormented_spirit=최대 체력이 _10_ 증가합니다.
actors.buffs.envycovet.trait_phantom_piranha_name=유령 피라냐
actors.buffs.envycovet.trait_phantom_piranha=회피가 _10%_ 증가합니다.
actors.buffs.envycovet.trait_golden_mimic_name=황금 미믹
actors.buffs.envycovet.trait_golden_mimic=골드를 주울 때 _20%_ 더 얻습니다.
actors.buffs.envycovet.trait_fetid_rat_name=악취 나는 쥐
actors.buffs.envycovet.trait_fetid_rat=공격 시 _20%_ 확률로 적을 중독시킵니다.
actors.buffs.envycovet.trait_gnoll_trickster_name=놀 사기꾼
actors.buffs.envycovet.trait_gnoll_trickster=투척 무기 피해가 _20%_ 증가합니다.
actors.buffs.envycovet.trait_great_crab_name=거대 게
actors.buffs.envycovet.trait_great_crab=방어력이 _4_ 증가합니다.
actors.buffs.envycovet.trait_newborn_elemental_name=갓 태어난 불의 정령
actors.buffs.envycovet.trait_newborn_elemental=공격 시 _10%_ 확률로 적을 불태웁니다.
actors.buffs.envycovet.trait_rot_heart_name=썩은 심장
actors.buffs.envycovet.trait_rot_heart=_10턴_마다 체력을 1 회복합니다.
actors.buffs.envycovet.trait_gnoll_geomancer_name=놀 지술사
actors.buffs.envycovet.trait_gnoll_geomancer=최대 체력이 _15_ 증가합니다.
actors.buffs.envycovet.trait_crystal_guardian_name=수정 수호자
actors.buffs.envycovet.trait_crystal_guardian=방어력이 _3_ 증가합니다.
actors.buffs.envycovet.trait_fungal_core_name=균류 핵
actors.buffs.envycovet.trait_fungal_core=_10턴_마다 체력을 1 회복합니다.
actors.buffs.envycovet.trait_goo_name=구
actors.buffs.envycovet.trait_goo=체력이 절반 미만일 때 근접 피해가 _25%_ 증가합니다.
actors.buffs.envycovet.trait_tengu_name=텐구
actors.buffs.envycovet.trait_tengu=회피가 _15%_ 증가합니다.
actors.buffs.envycovet.trait_dm300_name=DM-300
actors.buffs.envycovet.trait_dm300=방어력이 _5_ 증가합니다.
actors.buffs.envycovet.trait_dwarf_king_name=드워프 왕
actors.buffs.envycovet.trait_dwarf_king=근접 피해가 _15%_ 증가합니다.
actors.buffs.envycovet.trait_yog_name=요그-즈와
actors.buffs.envycovet.trait_yog=근접 피해가 _15%_, 최대 체력이 _20%_ 증가합니다.
