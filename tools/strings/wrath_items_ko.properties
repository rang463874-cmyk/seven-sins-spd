items.wardrum.name=분노의 전쟁북
items.wardrum.desc=핏빛 가죽을 씌운 전쟁북입니다. 장비 칸을 차지하지 않습니다.\n\n북을 울리면 _충전_을 써서 적들의 분노를 일으킵니다. 충전은 시간이 지나면 차오릅니다. 적끼리 싸울수록 _원한 점수_가 쌓여 영구적으로 강해집니다.
