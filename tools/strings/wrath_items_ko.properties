items.wardrum.name=분노의 전쟁북
items.wardrum.desc=핏빛 가죽을 씌운 전쟁북입니다. 유물/반지 칸에 착용하는 유물이며, 착용해야 기술을 쓸 수 있습니다.\n\n북을 울리면 _충전_을 써서 적들의 분노를 일으킵니다. 충전은 시간이 지나면 차오릅니다. 적끼리 싸울수록 _원한 점수_가 쌓여 영구적으로 강해집니다.
items.wardrum.ac_beat=북 울리기
items.wardrum.beat_prompt=어떤 장단을 칠까요? (충전 %d/%d)
items.wardrum.opt_provoke=도발 (충전 %d)
items.wardrum.opt_discord=이간질 (충전 %d)
items.wardrum.opt_contagion=분노 전염 (충전 %d)
items.wardrum.opt_dash=돌진 (충전 %d)
items.wardrum.prompt_provoke=도발할 적을 선택하세요
items.wardrum.prompt_discord_1=이간질할 첫 번째 적을 선택하세요
items.wardrum.prompt_discord_2=그 적과 싸우게 할 두 번째 적을 선택하세요
items.wardrum.prompt_contagion=분노를 전염시킬 적을 선택하세요
items.wardrum.prompt_dash=돌진할 칸을 선택하세요 (최대 %d칸)
items.wardrum.no_target=그곳에는 대상이 없다.
items.wardrum.immune=이 적은 분노에 휩쓸리지 않는다.
items.wardrum.same_target=서로 다른 두 적을 골라야 한다.
items.wardrum.bad_cell=그곳으로는 돌진할 수 없다.
items.armor.wratharmor.name=분노의 갑주
items.armor.wratharmor.desc=수많은 싸움의 흔적이 새겨진 붉은 갑주입니다. 입은 자의 분노를 주변에 퍼뜨립니다.
items.wardrum.skill_header=충전 %d / %d
items.wardrum.skill_provoke=도발
items.wardrum.skill_provoke_desc=적 하나를 _%d턴_ 동안 광란에 빠뜨립니다. 광란한 적은 가까이 있는 아무나 공격합니다.
items.wardrum.skill_discord=이간질
items.wardrum.skill_discord_desc=적 둘을 차례로 골라 _%d턴_ 동안 서로만 노리게 만듭니다. 한쪽이 죽으면 풀립니다.
items.wardrum.skill_contagion=분노 전염
items.wardrum.skill_contagion_desc=적 하나를 _%d턴_ 동안 광란에 빠뜨리고, 그 적에게 맞은 대상도 광란에 빠집니다.
items.wardrum.skill_dash=돌진
items.wardrum.skill_dash_desc=최대 _%d칸_ 떨어진 빈칸으로 순식간에 돌진합니다.
