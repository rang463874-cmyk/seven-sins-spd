items.sinessence.name=sin essence
items.sinessence.desc=A dark, throbbing shard of sin, left behind by an elite monster. Alchemists can brew it into an _elixir of sin_ (2 essences + any potion) or pack it into a _bomb of seven sins_ (bomb + essence).
items.elite.elixirofsin.name=elixir of sin
items.elite.elixirofsin.desc=A thick crimson elixir distilled from sin essences.\n\nFor one of the seven sins it permanently adds _20 sin points_ and refills your skill resource. Anyone else is healed to full over a few turns and blessed for 30 turns.
items.elite.elixirofsin.ac_drink=DRINK
items.elite.elixirofsin.drink_sin=Sin floods through you, and your power grows!
items.elite.elixirofsin.drink_other=A warm, wicked strength fills you.
items.elite.bandage.name=herbal bandage
items.elite.bandage.desc=A strip of cloth soaked in sungrass sap. Wrapping it takes a turn: it stops _bleeding_ and _crippling_ and heals _35% of your max health_ over time.
items.elite.bandage.ac_apply=APPLY
items.elite.bandage.applied=You wrap the bandage tight.
items.elite.stimulant.name=stimulant
items.elite.stimulant.desc=A syringe of something very bitter. Using it takes no time: you gain _8 turns of haste and adrenaline_ and shake off slow, cripple, weakness and drowsiness.
items.elite.stimulant.ac_inject=INJECT
items.elite.stimulant.used=Your heart pounds!
items.bombs.sinbomb.name=bomb of seven sins
items.bombs.sinbomb.desc=A bomb packed with a sin essence. After the blast, every enemy within 2 tiles suffers one of the seven sins at random: charm, weakness, vulnerability, slow, cripple, terror or a deep sleep.
items.bombs.stickybomb.name=sticky bomb
items.bombs.stickybomb.desc=A bomb filled with earthroot glue instead of powder. It doesn't blast; it splatters glue over a 2-tile radius, rooting everything there except you for 8 turns and leaving webs behind.
items.bombs.caltropbomb.name=caltrop bomb
items.bombs.caltropbomb.desc=A bomb packed with iron caltrops instead of powder. It doesn't blast; it scatters caltrops over a 2-tile radius, and every enemy there takes light damage, _bleeds_ and is _crippled_ for 8 turns. It never hurts you.
items.elite.sininfusion.name=sin infusion
items.elite.sininfusion.desc=A curse infusion steeped in sin essence. Like a curse infusion, it curses a _melee weapon, armor or wand_ (adding a curse if it has none), but its power _stacks_: every infusion grants _+1 level_, with no limit.\n\nIf the curse is ever removed (or replaced by a good enchantment), _every stack is lost_.
items.elite.sininfusion.prompt=Infuse an item
items.elite.sininfusion.infused=Sin seeps into your %s. (sin infusion x%d)
items.elite.sininfusion.info_line=_Sin infusion x%d:_ +1 level per stack, lost if the curse is removed.
items.elite.castingmold.name=casting mold
items.elite.castingmold.desc=An iron mold full of liquid metal, ready to take shape. Pour it over a _set of thrown weapons_ (not darts) to cast _one more_ of them. The set grows for good, so upgrading, repairing and gathering the set all count the extra weapon. There is no limit, but the _spears of conquest_ need _3_ molds per spear.
items.elite.castingmold.prompt=Choose a set of thrown weapons
items.elite.castingmold.cast=You cast another %s. The set now holds %d.
items.elite.castingmold.cast_partial=The mold seeps into the spears of conquest (%d/%d). They need more metal for another spear.
items.elite.castingmold.info_line=This set has been extended with casting molds: it holds _%d_ weapons.
items.elite.decoydoll.name=decoy doll
items.elite.decoydoll.desc=A small straw doll bound with stormvine. _Throw_ it onto an empty tile and it springs up into a full-sized dummy that every enemy within 4 tiles can't help attacking, for 15 turns.
items.elite.decoydoll$decoy.name=decoy dummy
items.elite.decoydoll$decoy.desc=A straw dummy that enemies can't stop attacking.\n\nIt falls apart in _%d turns_.
items.elite.wallacid.name=wall acid
items.elite.wallacid.desc=A sizzling flask of sorrowmoss sap boiled down with firebloom. _Throw_ it at a wall: it eats away every wall around where it lands and bores on in the throw direction, up to 3 walls deep, opening a new passage.\n\nIt has no effect on boss floors or special levels, can't eat through the level's outer edge, and won't touch the walls of locked vaults or quest arenas.
items.elite.wallacid.no_effect=The acid fizzles out harmlessly. These walls are too strong.
items.elite.wallacid.no_wall=The acid hisses, but there's no wall to eat here.
items.elite.stonedust.name=stone dust
items.elite.stonedust.desc=Earthroot bark ground fine with frozen icecap. _Throw_ it onto open ground and a stone wall three tiles wide rises across the throw. The wall crumbles back into whatever was there after 20 turns.\n\nIt only rises on open, empty tiles: not on monsters, items, plants, traps or stairs.
items.elite.stonedust.no_room=The dust settles, but there's no room for a wall here.
items.elite.stonedust$risenwall.desc=A stone wall raised by alchemy. It will crumble soon.
items.elite.dryingpowder.name=drying powder
items.elite.dryingpowder.desc=A hot, thirsty powder of firebloom ash and swiftthistle. _Throw_ it and every water tile within 2 tiles of where it lands dries into bare floor for good.
items.elite.dryingpowder.no_water=The powder puffs up, but there's no water nearby.
