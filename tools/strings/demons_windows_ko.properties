windows.wnddemonaltar.message=제단 위에서 일곱 개의 문장이 불타고 있습니다. 누구의 시련을 받으시겠습니까?\n\n_텐구_를 쓰러뜨릴 때까지 시련의 패널티를 짊어져야 합니다. 그 뒤 마왕이 _마왕 스킬_(스킬 바 위쪽에 표시)과 _패시브 가호_를 내려 주며, 그 진정한 모습에 도전할 수도 있습니다. 한 번의 모험에 한 번만 선택할 수 있습니다.
