items.artifacts.conquestcrown.name=crown of conquest
items.artifacts.conquestcrown.desc=The pure white crown of the first horseman, rider of the white horse. It carries a majesty that demands surrender.\n\nWhen fully charged, it can force a badly wounded enemy to _surrender_ and fight for you for a while. A surrendered enemy grants its exp and loot immediately, and collapses when its time runs out. Bosses are unaffected.\n\nIt charges over time and when you personally defeat enemies, and grows stronger as it is used.
items.artifacts.conquestcrown.stats=Enemies at or below _%d%%_ HP can be made to surrender. They fight for _%d turns_.
items.artifacts.conquestcrown.prompt=Choose an enemy to subjugate
items.artifacts.conquestcrown.no_target=There is no enemy there to subjugate.
items.artifacts.conquestcrown.refuses=This enemy will never surrender.
items.artifacts.conquestcrown.too_strong=It's still too healthy to surrender.
items.artifacts.conquestcrown.kneel=Kneel!
items.artifacts.conquestcrown.collapse=collapses
items.artifacts.conquestcrown$subjugated.name=subjugated
items.artifacts.conquestcrown$subjugated.desc=This creature has knelt before the crown of conquest. It fights for the hero until its strength runs out.\n\nTurns remaining: %d
items.artifacts.warblade.name=blade of war
items.artifacts.warblade.desc=The blood-soaked greatsword of the second horseman, rider of the red horse. While holding it, everything looks like an enemy.\n\nYour attacks grow stronger _the lower your HP_. Taking damage charges it, and when fully charged it drives every nearby enemy into a _frenzy_, making them fight each other.\n\nIt grows stronger as it is used.
items.artifacts.warblade.stats=Damage is increased by up to _%d%%_ at very low HP. The frenzy lasts _%d turns_.
items.artifacts.warblade.no_targets=There are no enemies nearby to set against each other.
items.artifacts.faminescales.name=scales of famine
items.artifacts.faminescales.desc=The scales of the third horseman, rider of the black horse. One pan always holds a loaf of bread, the other a life.\n\nNearby enemies are _weakened_ as if starving, dealing less damage, but the bearer also grows hungry a little faster. When fully charged, it can _turn a full belly into health_.\n\nIt grows stronger as it is used.
items.artifacts.faminescales.stats=Enemies within _%d tiles_ are weakened. Using it heals _%d%%_ of max HP and costs _%d_ satiety.
items.artifacts.faminescales.too_hungry=You're too hungry to put anything on the scales.
items.artifacts.deathscythe.name=scythe of death
items.artifacts.deathscythe.desc=The scythe of the fourth horseman, rider of the pale horse. A cold silence flows from its edge.\n\nIt charges whenever something dies nearby. When fully charged, it _reaps every visible enemy near death_, and deals heavy damage to bosses.\n\nAlso, _once per floor_, it lets its bearer survive a killing blow with 1 HP.\n\nIt grows stronger as it is used.
items.artifacts.deathscythe.stats=Enemies at or below _%d%%_ HP are reaped instantly. Bosses take _%d%%_ of their max HP as damage.
items.artifacts.deathscythe.spare_ready=_Reprieve this floor:_ available
items.artifacts.deathscythe.spare_used=_Reprieve this floor:_ already used
items.artifacts.deathscythe.spared=The scythe of death declined to take your life... this time.
items.artifacts.deathscythe.no_targets=You see no lives ready to reap.
items.quest.sealfragment.name=seal of the apocalypse
items.quest.sealfragment.desc=The violet seal the Seal Warden was guarding. It trembles faintly, like a heartbeat.\n\nBring it to the _prophet of seals_ in the sewers to choose one of the four horsemen's artifacts.
