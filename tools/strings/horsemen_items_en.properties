items.artifacts.conquestcrown.name=gun of conquest
items.artifacts.conquestcrown.desc=The pure white firearm of the first horseman, rider of the white horse. It conquers by devouring: feed it weapons, armor and rings and it turns them into bullets.\n\nLoading a weapon or armor (not equipped) gives bullets equal to its tier plus twice its level (+1 for a good enchantment or glyph). A stack of thrown weapons is loaded whole, giving half that per weapon. A ring gives 4 bullets plus 3 per level. Cursed items give half. Loading an enchanted weapon makes every bullet carry that enchantment. Each shot uses one bullet and hits the first creature in its path.\n\nThe gun grows stronger as it fires, dealing more damage. There is no limit to how many bullets it can hold.
