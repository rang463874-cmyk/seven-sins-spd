items.artifacts.conquestcrown$subjugated.desc=This creature has knelt before the white horseman. It fights for the hero until its strength runs out.\n\nTurns remaining: %d.
items.artifacts.faminescales.name=scales of famine
items.artifacts.faminescales.desc=The scales of the third horseman, rider of the black horse. Hunger is its gift: the emptier your belly, the faster you move and strike and the harder you hit. The effect is full once you're hungry, and a little stronger while starving. You also grow hungry 10% faster.\n\nUsing it burns the food in your belly down to hunger, healing you from what was burned, and drives you into a famished frenzy that acts beyond starving for a while.
items.artifacts.faminescales.stats=At full hunger: attack speed _+%d%%_, move speed _+%d%%_, damage _+%d%%_.\nBurning a full belly heals _%d%%_ of max HP; the frenzy lasts _%d turns_.\nCurrent hunger effect: _%d%%_.
items.artifacts.faminescales$frenzy.name=famished frenzy
items.artifacts.faminescales$frenzy.desc=Hunger drives you beyond your limits. The scales of famine act as if you were starving and then some.\n\nTurns remaining: %s.
items.artifacts.deathscythe.name=scythe of death
items.artifacts.deathscythe.desc=The scythe of the fourth horseman, rider of the pale horse. A cold silence flows from its edge.\n\nEvery hit you land leaves death marks on the enemy. Once its marks reach its remaining HP, it is reaped on the spot. Bosses can't be reaped, but when their marks pile up their marks burst for that much damage.\n\nIt charges whenever something dies nearby. Using it makes the marks on every enemy in sight burst at once. Once per floor, it refuses to let you die.
items.artifacts.deathscythe.stats=Each hit leaves marks equal to _%d%%_ of its damage. Boss marks burst at _%d%%_ of max HP. Using it deals _%d%%_ of the marks as damage.
items.artifacts.deathscythe.spare_ready=_Reprieve this floor:_ available
items.artifacts.deathscythe.spare_used=_Reprieve this floor:_ already used
items.artifacts.deathscythe.spared=The scythe of death declined to take your life... this time.
items.artifacts.deathscythe.no_targets=You see no marked enemies.
items.artifacts.deathscythe.reaped=reaped
items.artifacts.deathscythe$mark.name=death marks
items.artifacts.deathscythe$mark.desc=The pale horseman has marked this creature. When its marks reach its remaining HP, it dies.\n\nMarks: %d.
items.weapon.melee.warsword.name=sword of war
items.weapon.melee.warsword.desc=The blood-soaked sword of the second horseman, rider of the red horse. It grows on its own: every enemy slain with it feeds its edge, without limit.\n\nScrolls of upgrade don't sharpen it directly. Instead, each level makes it drink more from every kill.
items.weapon.melee.warsword.stats_desc=War stacks: _%d_ (kills: %d). Each kill adds _%s_ stacks (bosses x10, minibosses x3).\nBonus damage from stacks: _+%d-%d_.
items.weapon.melee.warsword.grow=The blade grows!
items.artifacts.warblade.name=blade of war
items.artifacts.warblade.desc=The blood-soaked greatsword of the second horseman, rider of the red horse. While holding it, everything looks like an enemy.\n\nYour attacks grow stronger _the lower your HP_. Taking damage charges it, and when fully charged it drives every nearby enemy into a _frenzy_, making them fight each other.\n\nIt grows stronger as it is used.
items.artifacts.warblade.stats=Damage is increased by up to _%d%%_ at very low HP. The frenzy lasts _%d turns_.
items.artifacts.warblade.no_targets=There are no enemies nearby to set against each other.
items.quest.sealfragment.name=seal of the apocalypse
items.quest.sealfragment.desc=The violet seal the Seal Warden was guarding. It trembles faintly, like a heartbeat.\n\nBring it to the _prophet of seals_ in the sewers to choose one of the four horsemen's artifacts.
