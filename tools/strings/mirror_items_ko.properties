items.predatormaw.prompt_more=하나 더 삼킬 수 있다 (취소하면 그만 먹는다)
items.mirrorrelics$goldenmaw.name=황금 아귀
items.mirrorrelics$goldenmaw.desc=순금 이빨이 촘촘히 박힌 아귀입니다. 끝없이 배부른 연회를 기억하는 듯 느긋하게 입맛을 다십니다.
items.mirrorrelics$goldenmaw.bonus=_거울의 축복:_ 모든 소모품에서 얻는 포인트가 _25%_ 늘어납니다.
items.mirrorrelics$blackcard.name=블랙 카드
items.mirrorrelics$blackcard.desc=한도가 없다는 소문의 검은 카드입니다. 손에 쥐면 세상 모든 것이 값싸 보입니다.
items.mirrorrelics$blackcard.bonus=_거울의 축복:_ 모든 결제 비용이 _25%_ 줄고, 전직과 관계없이 새 층마다 소지 골드의 _2%_를 이자로 받습니다. 은행원이라면 이율에 더해집니다.
items.mirrorrelics$blooddrum.name=피의 전쟁북
items.mirrorrelics$blooddrum.desc=검붉게 물든 가죽을 씌운 전쟁북입니다. 두드리지 않아도 심장 소리처럼 울립니다.
items.mirrorrelics$blooddrum.bonus=_거울의 축복:_ 분노의 최대치가 _20_ 늘고, 분노가 _25%_ 빨리 차오릅니다.
items.mirrorrelics$eternalcrown.name=영겁의 왕관
items.mirrorrelics$eternalcrown.desc=희게 빛나는 왕관입니다. 단 한 번도 벗겨진 적이 없는 왕의 것처럼 흠집 하나 없습니다.
items.mirrorrelics$eternalcrown.bonus=_거울의 축복:_ 위엄의 최대치가 _5_ 늘어납니다.
items.mirrorrelics$forbiddenperfume.name=금단의 향수
items.mirrorrelics$forbiddenperfume.desc=짙은 보랏빛 향수입니다. 마개를 열기도 전에 정신이 아득해집니다.
items.mirrorrelics$forbiddenperfume.bonus=_거울의 축복:_ 향수 기술의 체력 비용이 _25%_ 줄고, 매혹 지속 시간이 _25%_ 길어집니다.
items.mirrorrelics$shatteredmirror.name=깨진 거울
items.mirrorrelics$shatteredmirror.desc=금이 간 손거울입니다. 갈라진 조각마다 서로 다른 누군가가 비칩니다.
items.mirrorrelics$shatteredmirror.bonus=_거울의 축복:_ 거울에 담을 수 있는 복사 기술이 _1개_ 늘고, 질투가 _25%_ 빨리 차오르며, 도감 특성이 _25%_ 강해집니다.
items.mirrorrelics$eternalpillow.name=영원의 베개
items.mirrorrelics$eternalpillow.desc=밤하늘처럼 짙푸른 베개입니다. 머리를 대면 다시는 일어나고 싶지 않습니다.
items.mirrorrelics$eternalpillow.bonus=_거울의 축복:_ 꿈 인형을 _1마리_ 더 거느릴 수 있습니다.
