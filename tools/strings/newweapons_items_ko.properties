items.weapon.melee.shiftinghalberd.name=가변 미늘창
items.weapon.melee.shiftinghalberd.desc=자루가 긴 무기로, 찰칵 소리와 함께 머리 부분이 바뀝니다. 적을 멀리 묶어 두는 가는 창날, 혹은 적을 쪼개는 넓은 도끼날이 됩니다.
items.weapon.melee.shiftinghalberd.stats_spear=_창 형태:_ _2칸_ 거리까지 닿고 정확도가 _15%_ 높지만, 피해는 _80%_입니다. 형태 전환에는 시간이 들지 않습니다.
items.weapon.melee.shiftinghalberd.stats_axe=_도끼 형태:_ 바로 옆 칸만 닿고 정확도가 _10%_ 낮지만, 피해가 _120%_입니다. 형태 전환에는 시간이 들지 않습니다.
items.weapon.melee.shiftinghalberd.ac_to_axe=도끼 형태
items.weapon.melee.shiftinghalberd.ac_to_spear=창 형태
items.weapon.melee.shiftinghalberd.form_axe=도끼!
items.weapon.melee.shiftinghalberd.form_spear=창!
items.weapon.melee.shiftinghalberd.ability_name=기술 없음
items.weapon.melee.shiftinghalberd.ability_desc=이 무기에는 결투가의 무기 기술이 없습니다.
items.weapon.melee.thunderflail.name=천둥 도리깨
items.weapon.melee.thunderflail.desc=쇠공이 희미하게 지직거리는 묵직한 도리깨입니다. 오래 휘두를수록 안에 번개가 모여듭니다.
items.weapon.melee.thunderflail.stats_desc=마지막 타격 후 _%5$d턴_ 안에 다시 때릴 때마다 충전이 쌓입니다. 최대 _%1$d_회이고, 충전 하나당 피해가 _+%2$d%%_입니다. 최대 충전 다음 타격은 _천둥벼락_이 되어 피해가 _+%3$d%%_ 늘고, 그중 _%4$d%%_가 대상 옆의 모든 적에게 번개로 튀어 1턴 동안 기절시킵니다. 그 후 충전이 초기화됩니다.
items.weapon.melee.thunderflail.clap=천둥벼락!
items.weapon.melee.thunderflail.ability_name=기술 없음
items.weapon.melee.thunderflail.ability_desc=이 무기에는 결투가의 무기 기술이 없습니다.
items.weapon.melee.thunderflail$momentum.name=천둥 충전
items.weapon.melee.thunderflail$momentum.desc=천둥 도리깨에 번개가 모이고 있습니다.\n\n충전: _%1$d_ (피해 _+%2$d%%_)\n\n_%3$s턴_ 안에 계속 때리지 않으면 충전이 사라집니다.
items.weapon.melee.thunderflail$momentum.desc_ready=천둥 도리깨에 번개가 가득 찼습니다! 다음 타격은 _천둥벼락_이 됩니다.\n\n_%3$s턴_ 뒤에 사라집니다.
items.weapon.melee.chakram.name=차크람
items.weapon.melee.chakram.desc=테두리 전체를 날카롭게 간 강철 고리입니다. 손에 쥐고 싸워도 되지만 본래는 던지는 무기이고, 던지면 언제나 주인에게 돌아옵니다.
items.weapon.melee.chakram.stats_desc=장착한 상태에서 최대 _%1$d칸_까지 _던질_ 수 있습니다(공격 한 번만큼 시간이 듭니다). 지나가는 길의 _모든 적_에게 일반 타격의 _%2$d%%_ 피해를 주고 손으로 돌아옵니다.
items.weapon.melee.chakram.ac_hurl=던지기
items.weapon.melee.chakram.prompt=차크람을 던질 곳을 고르세요
items.weapon.melee.chakram.need_wield=차크람을 장착해야 던질 수 있다.
items.weapon.melee.chakram.ability_name=기술 없음
items.weapon.melee.chakram.ability_desc=이 무기에는 결투가의 무기 기술이 없습니다.
items.weapon.melee.parrysabre.name=패링 세이버
items.weapon.melee.parrysabre.desc=넓은 바구니 손잡이가 달린 가볍고 휜 세이버입니다. 칼날을 정면으로 받기보다 흘려 넘기도록 만들어졌습니다.
items.weapon.melee.parrysabre.stats_desc=장착한 상태에서 _받아치기 자세_를 잡을 수 있습니다(1턴). _%1$d턴_ 동안 옆 칸 적의 다음 근접 공격을 흘려 넘기고, 즉시 _반드시 명중하는 반격_으로 _%2$d%%_ 피해를 줍니다.
items.weapon.melee.parrysabre.ac_parry=받아치기
items.weapon.melee.parrysabre.stance=세이버를 들어 받아칠 자세를 잡았다.
items.weapon.melee.parrysabre.need_wield=세이버를 장착해야 받아칠 수 있다.
items.weapon.melee.parrysabre.parried=받아침
items.weapon.melee.parrysabre.ability_name=기술 없음
items.weapon.melee.parrysabre.ability_desc=이 무기에는 결투가의 무기 기술이 없습니다.
items.weapon.melee.parrysabre$stance.name=받아치기 자세
items.weapon.melee.parrysabre$stance.desc=받아칠 준비가 되었습니다. 옆 칸 적의 다음 근접 공격을 흘려 넘기고, 반드시 명중하는 반격으로 _%1$d%%_ 피해를 줍니다.\n\n남은 턴: %2$s.
