###### Seven Sins: Solomon's items ######
items.solomonring.name=Ring of Solomon
items.solomonring.desc=A golden signet ring engraved with a six-pointed star. They say even the kings of hell knelt before it. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nDraw element symbols and _Cast_ to unleash the spell they make, or _summon_ a demon recorded in your Lemegeton.
items.solomonring.ac_invoke=CIRCLE
items.solomonring.skill_header=Mana %d / %d   Circle: %s
items.solomonring.effects=Level effects: mana refill _+%d%%_, max mana _+%d_
items.solomonring.symbol_desc=Draws the _%s_ symbol into the circle. Drawing a symbol takes _half a turn_.\n\nUp to three symbols are drawn; a fourth wipes out the oldest. _Cast_ uses the spell of the drawn symbols.
items.solomonring.skill_cast=Cast
items.solomonring.skill_cast_desc=Casts the spell of the drawn symbols.\n\nOne symbol: Fire=Fire Bolt, Water=Water Lash, Air=Wind Blade, Earth=Stone Skin\nFire+Fire=Fireball, Water+Water=Healing Spring, Air+Air=Gust Step, Earth+Earth=Earthen Armor\nFire+Water=Steam Burst, Fire+Air=Chain Lightning, Fire+Earth=Magma Spout\nWater+Air=Blizzard, Water+Earth=Binding Vines, Air+Earth=Sandstorm\n\n_Three symbols_: order matters. The _last_ symbol is the family (fire = blasts and firepower, air = ranged, spread and mobility, earth = terrain, walls and control, water = status, cleansing and wide control), the _middle_ one the core spell, the _first_ one the form (fire = amplified, air = spread, earth = lasting, water = cleansing). 64 in all.
items.solomonring.skill_summon=Summon Demon
items.solomonring.skill_summon_desc=Spend _%d_ mana to call one of the demons recorded in this run's Lemegeton as an ally for _%d turns_. Up to _%d_ can serve at once.
items.solomonring.skill_learn=Grasp Principle
items.solomonring.skill_learn_desc=At _level 10_ and _level 20_ you grasp one of the three principles (sulfur, mercury, salt). A grasped principle appears on the skill bar as a symbol and combines only in _pairs_ with an element or the other principle.
items.solomonring.principle_desc=Draws the symbol of the principle of _%s_ into the circle. Principles only combine in pairs of _two_ symbols.
items.solomonring.cost_mana=mana %d
items.armor.solomonarmor.name=Robe of Solomon
items.armor.solomonarmor.desc=A violet robe embroidered in gold thread with constellations and seals. It shows the wisdom of its wearer.
