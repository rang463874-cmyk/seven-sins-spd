actors.mobs.goetia.goetiafiend.name=%1$s %2$s
actors.mobs.goetia.goetiafiend.desc=Demon no. %1$d of the Lesser Key of Solomon, the %2$s _%3$s_. One of the seventy-two spirits King Solomon is said to have bound, now loose in the dungeon. Far stronger than the creatures around it. Slaying it records it in your codex of demons (the essence bag's _Lesser Key_) and leaves behind _demon essence_.
actors.mobs.goetia.goetiafiend.known=You have already recorded this demon.
actors.mobs.goetia.goetiafiend.heals=mends itself
actors.mobs.goetia.goetiafiend.summons=summons!
actors.mobs.goetia.goetialord.desc=Demon no. %1$d of the Lesser Key, the %2$s _%3$s_, one of the kings of hell, called up from its sigil with demon essence. It rains hellfire around itself, thrusts lances of power, sends a tide of brimstone rolling toward you, calls lesser demons, and when badly hurt sweeps a fan of doom toward you.
actors.mobs.goetia.goetialord.notice=Who dares call %1$s %2$s by name?
