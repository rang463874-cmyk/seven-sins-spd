actors.mobs.goetia.goetiafiend.name=%1$s %2$s
actors.mobs.goetia.goetiafiend.desc=Demon no. %1$d of the Lemegeton, the %2$s _%3$s_. One of the seventy-two spirits King Solomon is said to have bound, now loose in the dungeon. Far stronger than the creatures around it. Slaying it records it in your codex of demons (the essence bag's _Lemegeton_) and leaves behind _demon essence_.
actors.mobs.goetia.goetiafiend.known=You have already recorded this demon.
actors.mobs.goetia.goetiafiend.heals=mends itself
actors.mobs.goetia.goetiafiend.summons=summons!
actors.mobs.goetia.goetialord.desc=Demon no. %1$d of the Lemegeton, the %2$s _%3$s_, one of the kings of hell, called up from its sigil with demon essence. It rains hellfire around itself, thrusts lances of power, sends a tide of brimstone rolling toward you, calls lesser demons, and when badly hurt sweeps a fan of doom toward you.
actors.mobs.goetia.goetialord.notice=Who dares call %1$s %2$s by name?
actors.mobs.goetia.goetialord.defeated=The seal... binds me again...
actors.mobs.goetia.goetialord.legion_call=legion!
actors.mobs.goetia.goetialord.skill_hellfire=Hellfire!
actors.mobs.goetia.goetialord.skill_lance=Lance of power!
actors.mobs.goetia.goetialord.skill_legion=Legion!
actors.mobs.goetia.goetialord.skill_spread=Brimstone tide!
actors.mobs.goetia.goetialord.skill_doom=Doom!
goetia.goetiahooks.recorded=Recorded in the Lemegeton: the %1$s %2$s. (%3$d demons)
goetia.goetiahooks.milestone=The Lemegeton grants you a new power: _%s_!
goetia.goetiahooks.power_0=Brand of the Pact
goetia.goetiahooks.power_0_desc=+10 max HP
goetia.goetiahooks.power_1=Demon Sight
goetia.goetiahooks.power_1_desc=you always sense the demons on your floor
goetia.goetiahooks.power_2=Guidance of the Labyrinth
goetia.goetiahooks.power_2_desc=entering a floor shows its stairs, its chests and roughly where its hidden rooms are on the map
goetia.goetiahooks.power_3=Hellward
goetia.goetiahooks.power_3_desc=demons deal 20% less damage to you
goetia.goetiahooks.power_4=Essence Harvest
goetia.goetiahooks.power_4_desc=demons drop 2 essences
goetia.goetiahooks.power_5=Merchant's Blessing
goetia.goetiahooks.power_5_desc=shop prices -15%, and shops stock 2 special consumables
goetia.goetiahooks.power_6=Sovereign's Might
goetia.goetiahooks.power_6_desc=you deal 10% more damage
goetia.goetiahooks.power_7=Gathered Power
goetia.goetiahooks.power_7_desc=artifacts and wands charge 15% faster
goetia.goetiahooks.power_8=Purifying Ward
goetia.goetiahooks.power_8_desc=half of the curses on newly found gear are already lifted, alchemy recipes cost 1 energy less
goetia.goetiahooks.power_9=Slaughter Combo
goetia.goetiahooks.power_9_desc=each enemy that falls gives +20% movement speed and +15% evasion for 6 turns (stacks 3 times)
goetia.goetiahooks.power_10=Safety Net
goetia.goetiahooks.power_10_desc=at 20% health or less you blast nearby enemies back and blink away (once per 300 turns)
goetia.goetiahooks.power_11=Solomon's Authority
goetia.goetiahooks.power_11_desc=artifacts and wands charge another 50% faster, and you are immune to harmful states
goetia.goetiahooks.guided=The Lemegeton shows you the way through this floor.
goetia.goetiahooks.safety_net=Safety net!
goetia.goetiahooks.safety_net_log=The power of the Lemegeton pulls you out of danger!
actors.buffs.demonslaughter.name=Slaughter Combo
actors.buffs.demonslaughter.desc=Enemies falling one after another wake the power of the Lemegeton.\n\nStacks: %1$d\n+%2$d%% movement speed, +%3$d%% evasion\n\nEvery enemy that falls renews it.\n\nTurns remaining: %4$s.
actors.buffs.safetynetcooldown.name=Safety Net Recharging
actors.buffs.safetynetcooldown.desc=The safety net of the Lemegeton is getting ready again.\n\nTurns remaining: %s.
