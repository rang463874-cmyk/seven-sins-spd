###### Seven Sins: Solomon ######
actors.hero.heroclass.solomon=솔로몬
actors.hero.heroclass.solomon_desc_short=72악마를 다스린 지혜의 왕 _솔로몬_. 원소의 _연금술 기호_를 조합해 마법을 쓰고, _레메게톤_에 기록한 악마를 불러내 부립니다.
actors.hero.heroclass.solomon_desc=솔로몬은 _솔로몬의 반지_를 유물 칸에 착용한 채 시작합니다. 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다.\n\n스킬 바의 _불·물·공기·흙_ 기호를 누르면 마법진에 기호가 그려집니다(하나에 0.5턴). 기호는 세 개까지 그릴 수 있고, _발동_을 누르면 그려진 기호에 맞는 마법이 나갑니다. 기호 하나는 기본 마법, 두 개는 조합 마법(14가지), 세 개는 _순서에 따라 달라지는_ 강력한 마법(64가지)입니다. 마법은 천천히 차오르는 _마나_를 씁니다.\n\n_10레벨과 20레벨_에는 세 원질(_유황, 수은, 소금_) 중 하나씩을 깨우칩니다. 원질은 원소나 다른 원질과 _두 개로만_ 조합되며, 각각 영혼, 변화, 수호의 강력한 마법을 엽니다.\n\n_악마 소환_은 이번 판의 레메게톤에 기록한 악마 하나를 잠시 아군으로 불러냅니다.\n\n솔로몬은 쓴 마나와 레메게톤에 기록한 악마로 _지혜_를 쌓아 영원히 강해집니다. 지혜는 마법의 위력, 최대 마나, 최대 체력, 회피를 올립니다.\n\n솔로몬은 _곤봉_을 들고 시작하며, _치유 물약_과 _충전의 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.solomon_unlock=한 판에서 솔로몬의 _72악마를 모두_ 레메게톤에 기록하면 해금됩니다.
actors.hero.herosubclass.arch_magus=대마도사
actors.hero.herosubclass.arch_magus_short_desc=_대마도사_의 마법은 _25%_ 더 강하고, 마나가 _25%_ 더 빨리 찹니다.
actors.hero.herosubclass.arch_magus_desc=대마도사는 연금술 기호를 다루는 데 통달했습니다. 모든 마법의 위력(피해, 회복, 방어막)이 _25%_ 오르고, 마나가 _25%_ 더 빨리 찹니다.
actors.hero.herosubclass.demon_master=마신의 주인
actors.hero.herosubclass.demon_master_short_desc=_마신의 주인_은 악마를 _둘_까지 거느리고, 소환한 악마가 _50%_ 더 오래 머뭅니다.
actors.hero.herosubclass.demon_master_desc=마신의 주인은 솔로몬의 인장으로 악마들을 굴복시킵니다. 소환한 악마를 동시에 _2마리_까지 거느릴 수 있고, 계약이 _50%_ 더 오래 갑니다.
actors.buffs.solomonarcana.name=솔로몬의 비전
actors.buffs.solomonarcana.desc=솔로몬이 쌓은 지혜와 마나입니다.\n\n마나: _%d / %d_\n마법진: _%s_\n\n지혜: _%d_\n마법 위력: _+%d%%_\n최대 체력: _+%d_\n회피: _+%d%%_
solomon.solomonhooks.unlocked=72악마가 모두 레메게톤에 기록되었다! 지혜의 왕 _솔로몬_이 해금되었다.
solomon.solomonspells.el_fire=불
solomon.solomonspells.el_water=물
solomon.solomonspells.el_air=공기
solomon.solomonspells.el_earth=흙
solomon.solomonspells.circle_empty=비어 있음
solomon.solomonspells.no_spell=먼저 원소 기호를 그려야 한다.
solomon.solomonspells.no_mana=마나가 부족하다.
solomon.solomonspells.prompt=마법을 쓸 곳을 고르세요
solomon.solomonspells.bad_cell=그곳에는 쓸 수 없다.
solomon.solomonspells.no_target=그곳에는 적이 없다.
solomon.solomonspells.no_demons=레메게톤에 기록한 악마가 아직 없다. 악마를 쓰러뜨려 기록하자.
solomon.solomonspells.too_many=이미 거느릴 수 있는 만큼 악마를 불러냈다.
solomon.solomonspells.no_room=악마를 부를 자리가 없다.
solomon.solomonspells.summon_title=악마 소환
solomon.solomonspells.summon_msg=레메게톤에 기록한 악마 중 가장 강한 이들입니다. 마나 _%d_를 써서 _%d턴_ 동안 아군으로 부립니다.
solomon.solomonspells.summoned=솔로몬의 인장에 응해 %s %s(이)가 나타났다!
solomon.solomonspells.sp_fire_bolt=화염탄
solomon.solomonspells.sp_fire_bolt_desc=_불_: 불덩이를 날려 피해를 주고, 절반 확률로 불을 붙입니다.
solomon.solomonspells.sp_water_lash=물의 채찍
solomon.solomonspells.sp_water_lash_desc=_물_: 차가운 물줄기로 약한 피해를 주고 _3턴_ 동안 둔화시킵니다.
solomon.solomonspells.sp_wind_blade=바람 칼날
solomon.solomonspells.sp_wind_blade_desc=_공기_: 최대 _6칸_ 직선 위의 모든 적을 베어 약한 피해를 줍니다.
solomon.solomonspells.sp_stone_skin=돌 피부
solomon.solomonspells.sp_stone_skin_desc=_흙_: 레벨에 비례한 방어막을 얻습니다.
solomon.solomonspells.sp_fireball=화염구
solomon.solomonspells.sp_fireball_desc=_불+불_: 터지는 불덩이로 떨어진 곳과 그 주변의 적에게 큰 피해를 주고 불을 붙입니다.
solomon.solomonspells.sp_spring=치유의 샘
solomon.solomonspells.sp_spring_desc=_물+물_: 최대 체력의 _20%_를 회복하고 독, 화상, 점액, 출혈을 씻어 냅니다.
solomon.solomonspells.sp_gust=질풍 이동
solomon.solomonspells.sp_gust_desc=_공기+공기_: 최대 _6칸_ 떨어진 보이는 빈칸으로 순간이동합니다.
solomon.solomonspells.sp_earth_armor=대지의 갑옷
solomon.solomonspells.sp_earth_armor_desc=_흙+흙_: 나무껍질처럼 단단한 피부를 얻어 방어력이 오릅니다. 시간이 지나며 서서히 약해집니다.
solomon.solomonspells.sp_steam=증기 폭발
solomon.solomonspells.sp_steam_desc=_불+물_: 떨어진 곳과 그 주변의 적에게 피해를 주고 _3턴_ 동안 눈을 멀게 합니다.
solomon.solomonspells.sp_chain_lightning=연쇄 번개
solomon.solomonspells.sp_chain_lightning_desc=_불+공기_: 적 하나에게 번개를 내리치고, 근처의 적 _2_명에게 옮겨 갑니다.
solomon.solomonspells.sp_magma=용암 분출
solomon.solomonspells.sp_magma_desc=_불+흙_: 최대 _7칸_ 직선으로 용암을 뿜어 모든 적에게 큰 피해를 주고 불을 붙입니다.
solomon.solomonspells.sp_blizzard=얼음 폭풍
solomon.solomonspells.sp_blizzard_desc=_물+공기_: 주변 _2칸_ 안의 적에게 피해를 주고 얼립니다. 보스와 정예는 둔화됩니다.
solomon.solomonspells.sp_vines=덩굴 속박
solomon.solomonspells.sp_vines_desc=_물+흙_: 고른 곳과 그 주변에 덩굴을 피워 적에게 약한 피해를 주고 _4턴_ 동안 묶습니다.
solomon.solomonspells.sp_sandstorm=모래 폭풍
solomon.solomonspells.sp_sandstorm_desc=_공기+흙_: 주변 _3칸_ 안의 보이는 적을 _4턴_ 동안 눈멀게 하고 불구로 만듭니다.
solomon.solomonspells$summonpact.name=솔로몬의 계약
solomon.solomonspells$summonpact.desc=솔로몬의 인장에 묶여 그를 따르는 악마입니다. 계약이 끝나면 사라집니다.\n\n남은 턴: %d.
solomon.solomontriads.title=%s (%s)
solomon.solomontriads.f_fire=증폭
solomon.solomontriads.f_air=확산
solomon.solomontriads.f_earth=지속
solomon.solomontriads.f_water=정화
solomon.solomontriads.f_fire_desc=_첫 기호 불(증폭)_: 위력(피해, 회복, 중독)이 _40%_ 오르고, 마나가 _3_ 더 듭니다.
solomon.solomontriads.f_air_desc=_첫 기호 공기(확산)_: 범위가 _1칸_ 넓어지고, 대상 수와 사거리가 늘어납니다.
solomon.solomontriads.f_earth_desc=_첫 기호 흙(지속)_: 상태이상, 장벽, 강화 효과가 _50%_ 더 오래 갑니다.
solomon.solomontriads.f_water_desc=_첫 기호 물(정화)_: 마법에 맞은 적은 _5턴_ 동안 취약해지고, 시전할 때 솔로몬의 해로운 상태가 모두 씻겨 나갑니다.
solomon.solomontriads.c_inferno=대폭염
solomon.solomontriads.c_inferno_desc=_불·불 계열(불)_: 거대한 불덩이를 날려 떨어진 곳 주변 _1칸_을 폭발시킵니다. 아주 큰 피해를 주고 불을 붙입니다.
solomon.solomontriads.c_meltdown=용해
solomon.solomontriads.c_meltdown_desc=_물·불 계열(불)_: 적 하나를 녹여 아주 큰 피해를 주고, _6턴_ 동안 취약과 약화를 겁니다.
solomon.solomontriads.c_meteor=유성우
solomon.solomontriads.c_meteor_desc=_공기·불 계열(불)_: 고른 곳 주변 _2칸_에 유성 _4개_를 떨어뜨립니다. 유성마다 주변 _1칸_에 피해를 주고 불을 붙입니다.
solomon.solomontriads.c_volcano=화산 분화
solomon.solomontriads.c_volcano_desc=_흙·불 계열(불)_: 고른 곳 주변 _2칸_을 분화시켜 큰 피해를 주고, 불을 붙이며 _4턴_ 동안 불구로 만듭니다.
solomon.solomontriads.c_phoenix=불사조
solomon.solomontriads.c_phoenix_desc=_불·공기 계열(공기)_: 불사조가 최대 _8칸_을 꿰뚫고 날아가 길 위의 모든 적에게 큰 피해를 주고 불을 붙입니다.
solomon.solomontriads.c_ice_volley=빙창 연사
solomon.solomontriads.c_ice_volley_desc=_물·공기 계열(공기)_: 가장 가까운 적 _3_명에게 얼음 창을 하나씩 쏘아 피해를 주고 _4턴_ 동안 둔화시킵니다.
solomon.solomontriads.c_tailwind=순풍
solomon.solomontriads.c_tailwind_desc=_공기·공기 계열(공기)_: _8턴_ 동안 가속하고 공중에 뜹니다. 확산형이면 _3턴_ 동안 투명해집니다.
solomon.solomontriads.c_skyfall=천공 낙하
solomon.solomontriads.c_skyfall_desc=_흙·공기 계열(공기)_: 최대 _7칸_ 떨어진 빈칸으로 날아올라 내리꽂힙니다. 착지한 곳 주변 _1칸_의 적에게 피해를 주고 _1턴_ 마비시킵니다.
solomon.solomontriads.c_obsidian=흑요석 감옥
solomon.solomontriads.c_obsidian_desc=_불·흙 계열(흙)_: 적 하나에게 피해를 주고 불을 붙인 뒤, 그 주위를 _10턴_ 동안 벽으로 둘러쌉니다.
solomon.solomontriads.c_bog=늪지
solomon.solomontriads.c_bog_desc=_물·흙 계열(흙)_: 고른 곳 주변 _1칸_을 늪으로 만들어 약한 피해를 주고, _5턴_ 동안 묶고 _10턴_ 동안 불구로 만듭니다.
solomon.solomontriads.c_earthquake=대지진
solomon.solomontriads.c_earthquake_desc=_공기·흙 계열(흙)_: 주변 _4칸_ 안에 보이는 적에게 피해를 주고 _2턴_ 동안 마비시킵니다. 보스와 정예는 불구가 됩니다.
solomon.solomontriads.c_great_wall=대지의 성벽
solomon.solomontriads.c_great_wall_desc=_흙·흙 계열(흙)_: 고른 곳에 솔로몬을 가로막는 방향으로 _5칸_ 길이의 벽을 _20턴_ 동안 세웁니다.
solomon.solomontriads.c_fever=열병
solomon.solomontriads.c_fever_desc=_불·물 계열(물)_: 주변 _5칸_ 안에 보이는 적을 강하게 중독시키고 _8턴_ 동안 약화시킵니다.
solomon.solomontriads.c_cleansing_rain=정화의 비
solomon.solomontriads.c_cleansing_rain_desc=_물·물 계열(물)_: 최대 체력의 _30%_를 회복하고 해로운 상태를 모두 씻어 내며, 최대 체력의 _15%_만큼 방어막을 얻습니다. 주변 _4칸_의 아군도 회복합니다.
solomon.solomontriads.c_tidal_wave=해일
solomon.solomontriads.c_tidal_wave_desc=_공기·물 계열(물)_: 주변 _3칸_ 안에 보이는 적에게 약한 피해를 주고 _3칸_ 밀쳐 내며 _4턴_ 동안 둔화시킵니다.
solomon.solomontriads.c_petrify=석화
solomon.solomontriads.c_petrify_desc=_흙·물 계열(물)_: 적 하나를 돌로 만들어 _6턴_ 동안 마비시킵니다. 보스와 정예는 _5턴_ 동안 느려지고 약화됩니다. 확산형이면 주변 _1칸_의 적도 굳힙니다.
solomon.solomonspells.el_sulfur=유황
solomon.solomonspells.el_mercury=수은
solomon.solomonspells.el_salt=소금
solomon.solomonhooks.echo=메아리!
solomon.solomonhooks.circle_kept=마법진 유지!
solomon.solomonprinciples.can_learn=새로운 _원질_을 깨우칠 수 있다! 스킬 바의 _원질 깨우치기_로 고르세요.
solomon.solomonprinciples.choose_title=원질 깨우치기
solomon.solomonprinciples.choose_msg=깨우칠 원질을 하나 고르세요. 한 번 고르면 바꿀 수 없습니다. 원질은 원소나 다른 원질과 _두 개로만_ 조합할 수 있습니다. (오른쪽 버튼으로 설명을 볼 수 있습니다)
solomon.solomonprinciples.learned=원질 _%s_의 이치를 깨우쳤다!
solomon.solomonprinciples.pairs_only=원질은 기호 두 개로만 조합할 수 있다.
solomon.solomonprinciples.no_swap=그 적과는 자리를 바꿀 수 없다.
solomon.solomonprinciples.pr_sulfur_desc=_유황(영혼)_: 연소의 원리입니다. 영혼을 태우고 거두는 마법을 엽니다.\n\n유황+불=영혼 연소, 유황+물=유황천, 유황+공기=영혼 화살, 유황+흙=유황 대지, 유황+유황=영혼 수확\n유황+수은=대업, 유황+소금=영육 분리
solomon.solomonprinciples.pr_mercury_desc=_수은(정유)_: 용융성과 휘발성의 원리입니다. 녹이고, 흐르고, 바꾸는 마법을 엽니다.\n\n수은+불=휘발 폭발, 수은+물=용해, 수은+공기=수은 질주, 수은+흙=등가 교환, 수은+수은=만능약\n수은+유황=대업, 수은+소금=응고
solomon.solomonprinciples.pr_salt_desc=_소금(물질)_: 불연성과 비휘발성의 원리입니다. 굳히고, 지키고, 악을 물리치는 마법을 엽니다.\n\n소금+불=불연의 갑주, 소금+물=소금 결계, 소금+공기=소금 폭풍, 소금+흙=소금 요새, 소금+소금=불변\n소금+유황=영육 분리, 소금+수은=응고
solomon.solomonprinciples.p_soulfire=영혼 연소
solomon.solomonprinciples.p_soulfire_desc=_유황+불_: 적 하나의 영혼을 불태워 아주 큰 피해를 주고 불을 붙입니다. 이 마법으로 쓰러뜨리면 마나 _5_를 돌려받습니다.
solomon.solomonprinciples.p_brimstone=유황천
solomon.solomonprinciples.p_brimstone_desc=_유황+물_: 주변 _3칸_ 안에 보이는 적에게 유황 비를 뿌려 약한 피해를 주고, 강하게 중독시키며 점액을 묻힙니다.
solomon.solomonprinciples.p_soul_arrows=영혼 화살
solomon.solomonprinciples.p_soul_arrows_desc=_유황+공기_: 영혼 화살 _5발_을 시야의 적들에게 나눠 쏩니다. 준 피해의 _20%_만큼 회복합니다.
solomon.solomonprinciples.p_brimstone_field=유황 대지
solomon.solomonprinciples.p_brimstone_field_desc=_유황+흙_: 고른 적 주변 _2칸_의 땅을 불타는 유황으로 덮어 큰 피해를 주고, 불을 붙이며 _2턴_ 동안 묶습니다.
solomon.solomonprinciples.p_soul_harvest=영혼 수확
solomon.solomonprinciples.p_soul_harvest_desc=_유황+유황_: 시야에서 체력이 _30%_ 이하인 일반 적의 영혼을 거둬 즉시 쓰러뜨립니다. 나머지는 피해를 입습니다. 거둔 영혼 하나당 최대 체력의 _10%_를 회복하고 마나 _3_을 얻습니다.
solomon.solomonprinciples.p_volatile=휘발 폭발
solomon.solomonprinciples.p_volatile_desc=_수은+불_: 휘발하는 수은을 던져 떨어진 곳 주변 _2칸_을 폭발시킵니다.
solomon.solomonprinciples.p_dissolve=용해
solomon.solomonprinciples.p_dissolve_desc=_수은+물_: 적 하나를 녹여 피해를 주고 _10턴_ 동안 취약, 약화, 저주를 겁니다.
solomon.solomonprinciples.p_quicksilver=수은 질주
solomon.solomonprinciples.p_quicksilver_desc=_수은+공기_: 최대 _8칸_ 떨어진 빈칸으로 흘러가듯 이동하고 _6턴_ 동안 가속합니다.
solomon.solomonprinciples.p_exchange=등가 교환
solomon.solomonprinciples.p_exchange_desc=_수은+흙_: 적 하나와 자리를 맞바꾸고 _2턴_ 동안 마비시킵니다. 보스와 정예는 불구가 됩니다. 크거나 움직이지 않는 적에게는 쓸 수 없습니다.
solomon.solomonprinciples.p_panacea=만능약
solomon.solomonprinciples.p_panacea_desc=_수은+수은_: 해로운 상태를 모두 풀고 최대 체력의 _15%_를 회복하며, _15턴_ 동안 모든 마법의 마나 소모가 _절반_이 됩니다.
solomon.solomonprinciples.p_fireproof=불연의 갑주
solomon.solomonprinciples.p_fireproof_desc=_소금+불_: 최대 체력의 _25%_만큼 방어막을 얻고, _15턴_ 동안 불에 타지 않으며 공격이 적을 불태웁니다.
solomon.solomonprinciples.p_salt_ward=소금 결계
solomon.solomonprinciples.p_salt_ward_desc=_소금+물_: 해로운 상태를 모두 풀고 최대 체력의 _15%_만큼 방어막을 얻습니다. 주변 _4칸_ 안의 _악마와 언데드_는 큰 피해를 입습니다.
solomon.solomonprinciples.p_salt_storm=소금 폭풍
solomon.solomonprinciples.p_salt_storm_desc=_소금+공기_: 주변 _3칸_ 안에 보이는 적에게 소금 폭풍을 일으켜 피해를 주고 _5턴_ 동안 눈멀게 합니다. 악마와 언데드는 두 배 피해를 입습니다.
solomon.solomonprinciples.p_salt_fortress=소금 요새
solomon.solomonprinciples.p_salt_fortress_desc=_소금+흙_: 솔로몬을 중심으로 _2칸_ 떨어진 곳에 소금 결정 벽을 둘러 _10턴_ 동안 요새를 쌓습니다.
solomon.solomonprinciples.p_immutable=불변
solomon.solomonprinciples.p_immutable_desc=_소금+소금_: _8턴_ 동안 몸이 변하지 않는 소금처럼 굳어, 받는 피해가 _60%_ 줄어듭니다.
solomon.solomonprinciples.p_great_work=대업
solomon.solomonprinciples.p_great_work_desc=_유황+수은_: 연금술의 대업을 적 하나에게 쏟아부어 엄청난 피해를 주고, 불을 붙이며 _8턴_ 동안 취약하게 만듭니다.
solomon.solomonprinciples.p_soul_rend=영육 분리
solomon.solomonprinciples.p_soul_rend_desc=_유황+소금_: 적 하나의 영혼을 몸에서 떼어 내 현재 체력의 _25%_(보스와 정예는 _10%_)에 추가 피해를 더해 주고, 그만큼 회복합니다.
solomon.solomonprinciples.p_coagulate=응고
solomon.solomonprinciples.p_coagulate_desc=_수은+소금_: 시야의 모든 적을 굳혀 _6턴_ 동안 느리게 하고 불구로 만들며, 솔로몬은 _4턴_ 동안 가속합니다.
solomon.solomonprinciples$elixir.name=만능약
solomon.solomonprinciples$elixir.desc=만능약의 효과로 모든 마법의 마나 소모가 절반이 됩니다.\n\n남은 턴: %s.
solomon.solomonprinciples$immutable.name=불변
solomon.solomonprinciples$immutable.desc=소금처럼 굳은 몸이 받는 피해를 60%% 줄여 줍니다.\n\n남은 턴: %s.
actors.hero.talent.sol_insight.title=현자의 통찰
actors.hero.talent.sol_insight.desc=최대 마나가 늘어납니다.\n\n_+1:_ 최대 마나 _+3_\n\n_+2:_ 최대 마나 _+6_
actors.hero.talent.sol_deftness.title=능숙한 손놀림
actors.hero.talent.sol_deftness.desc=원소 기호를 더 빨리 그립니다.\n\n_+1:_ 기호 하나에 _0.4턴_\n\n_+2:_ 기호 하나에 _0.3턴_
actors.hero.talent.sol_lore.title=괴티아 학식
actors.hero.talent.sol_lore.desc=레메게톤에 악마를 기록할 때 지혜를 더 얻습니다.\n\n_+1:_ 악마 하나당 지혜 _+1_\n\n_+2:_ 악마 하나당 지혜 _+2_
actors.hero.talent.sol_ward.title=수호의 인장
actors.hero.talent.sol_ward.desc=마법을 쓸 때마다 레벨에 비례한 방어막을 얻습니다.\n\n_+1:_ _1 + 레벨/5_\n\n_+2:_ _2 + 레벨/5×2_
actors.hero.talent.sol_meditation.title=명상의 식사
actors.hero.talent.sol_meditation.desc=먹는 데 _1턴_만 걸리고, 식사로 마나가 찹니다.\n\n_+1:_ 최대 마나의 _30%_\n\n_+2:_ 최대 마나의 _60%_
actors.hero.talent.sol_focus.title=집중
actors.hero.talent.sol_focus.desc=마나가 더 빨리 찹니다.\n\n_+1:_ _15%_ 빠르게\n\n_+2:_ _30%_ 빠르게
actors.hero.talent.sol_pact.title=견고한 계약
actors.hero.talent.sol_pact.desc=소환한 악마가 더 오래 머물고 더 튼튼해집니다.\n\n_+1:_ _10턴_ 더, 체력 _+20%_\n\n_+2:_ _20턴_ 더, 체력 _+40%_
actors.hero.talent.sol_echo.title=마력의 메아리
actors.hero.talent.sol_echo.desc=마법을 쓸 때 일정 확률로 쓴 마나를 모두 돌려받습니다.\n\n_+1:_ _10%_ 확률\n\n_+2:_ _20%_ 확률
actors.hero.talent.sol_elemental.title=원소 친화
actors.hero.talent.sol_elemental.desc=기호 하나로 쓰는 기본 마법(화염탄, 물의 채찍, 바람 칼날, 돌 피부)이 강해집니다.\n\n_+1:_ 위력 _+25%_\n\n_+2:_ 위력 _+50%_
actors.hero.talent.sol_triad.title=삼위의 진리
actors.hero.talent.sol_triad.desc=기호 세 개로 쓰는 마법의 마나 소모가 줄어듭니다.\n\n_+1:_ _10%_ 감소\n\n_+2:_ _20%_ 감소\n\n_+3:_ _30%_ 감소
actors.hero.talent.sol_legion.title=군단의 부름
actors.hero.talent.sol_legion.desc=악마 소환의 마나 소모가 줄어듭니다.\n\n_+1:_ _15%_ 감소\n\n_+2:_ _30%_ 감소\n\n_+3:_ _45%_ 감소
actors.hero.talent.magus_overload.title=마력 과부하
actors.hero.talent.magus_overload.desc=모든 마법의 위력이 오릅니다.\n\n_+1:_ _8%_\n\n_+2:_ _16%_\n\n_+3:_ _24%_
actors.hero.talent.magus_circle.title=이중 마법진
actors.hero.talent.magus_circle.desc=마법을 쓴 뒤에도 일정 확률로 마법진의 기호가 지워지지 않아, 같은 마법을 바로 다시 쓸 수 있습니다.\n\n_+1:_ _15%_ 확률\n\n_+2:_ _30%_ 확률\n\n_+3:_ _45%_ 확률
actors.hero.talent.magus_siphon.title=마력 흡수
actors.hero.talent.magus_siphon.desc=마법으로 적을 쓰러뜨리면 마나를 돌려받습니다.\n\n_+1:_ 마나 _1_\n\n_+2:_ 마나 _2_\n\n_+3:_ 마나 _3_
actors.hero.talent.master_brand.title=지배의 낙인
actors.hero.talent.master_brand.desc=소환한 악마가 주는 피해가 늘어납니다.\n\n_+1:_ _15%_\n\n_+2:_ _30%_\n\n_+3:_ _45%_
actors.hero.talent.master_offering.title=제물
actors.hero.talent.master_offering.desc=소환한 악마가 쓰러지거나 계약이 끝나면 그 힘이 솔로몬에게 돌아옵니다.\n\n_+1:_ 최대 체력의 _5%_ 회복, 마나 _2_\n\n_+2:_ _10%_, 마나 _4_\n\n_+3:_ _15%_, 마나 _6_
actors.hero.talent.master_kings.title=왕들의 소환
actors.hero.talent.master_kings.desc=소환 목록에 레메게톤의 악마가 더 많이 나옵니다.\n\n_+1:_ 후보 _+3_\n\n_+2:_ 후보 _+6_\n\n_+3:_ 후보 _+9_, 동시에 거느릴 수 있는 악마 _+1_
