items.weapon.melee.sins.sinweapons.sin_active=_%s_의 전용 무기입니다. 특수 효과가 발동합니다.
items.weapon.melee.sins.sinweapons.sin_inactive=_%s_만이 이 무기의 특수 효과를 끌어낼 수 있습니다. 지금은 평범한 무기일 뿐입니다.
items.weapon.melee.sins.gnawingfang.name=굶주린 송곳니
items.weapon.melee.sins.gnawingfang.desc=톱니처럼 날이 선 짧은 검입니다. 베인 상처에서 무언가를 빨아들이는 것 같습니다.
items.weapon.melee.sins.gnawingfang.effect=_전용 효과:_ 이 무기로 적을 처치하면 음식 포식 점수를 _0.5_ 얻습니다.
items.weapon.melee.sins.gluttonscythe.name=대식의 낫
items.weapon.melee.sins.gluttonscythe.desc=거대한 아가리처럼 휘어진 보랏빛 낫입니다. 휘두를 때마다 허기가 느껴집니다.
items.weapon.melee.sins.gluttonscythe.effect=_전용 효과:_ 소모품으로 얻는 포식 점수가 _50%_ 증가하고, 이 무기로 적을 처치하면 음식 포식 점수를 _2_ 얻습니다.
items.weapon.melee.sins.collectorrod.name=수금봉
items.weapon.melee.sins.collectorrod.desc=금박을 입힌 묵직한 곤봉입니다. 빚을 받으러 다니는 사람의 손때가 묻어 있습니다.
items.weapon.melee.sins.collectorrod.effect=_전용 효과:_ 적중 시 _30%_ 확률로 _(1 + 층 수)_ 골드를 얻습니다.
items.weapon.melee.sins.midasaxe.name=미다스의 도끼
items.weapon.melee.sins.midasaxe.desc=날까지 순금으로 만든 거대한 도끼입니다. 베는 것마다 황금빛으로 물듭니다.
items.weapon.melee.sins.midasaxe.effect=_전용 효과:_ 소지 골드 200마다 피해가 _+1_ 증가합니다(최대 10 + 강화 수치×2). 이 무기로 적을 처치하면 _(5 + 층 수×2)_ 골드를 얻습니다.
items.weapon.melee.sins.tauntknuckle.name=도발의 너클
items.weapon.melee.sins.tauntknuckle.desc=붉은 쇠를 덧댄 장갑입니다. 한 대 맞은 상대는 이성을 잃고 달려듭니다.
items.weapon.melee.sins.tauntknuckle.effect=_전용 효과:_ 적중할 때마다 분노를 _2_ 더 얻습니다.
items.weapon.melee.sins.wrathgreatsword.name=분노의 대검
items.weapon.melee.sins.wrathgreatsword.desc=핏빛으로 달아오른 거대한 검입니다. 맞은 자의 머릿속을 분노로 가득 채웁니다.
items.weapon.melee.sins.wrathgreatsword.effect=_전용 효과:_ 적중한 적이 _2턴_ 동안 광란에 빠집니다(보스 제외). 적끼리의 싸움으로 얻는 원한 점수가 _50%_ 증가합니다.
items.weapon.melee.sins.duelingsword.name=결투용 세검
items.weapon.melee.sins.duelingsword.desc=손잡이에 백금 장식을 두른 우아한 세검입니다. 쥐기만 해도 자세가 꼿꼿해집니다.
items.weapon.melee.sins.duelingsword.effect=_전용 효과:_ 위엄이 _1턴_ 더 빨리 쌓입니다.
items.weapon.melee.sins.kingsaegis.name=왕의 방패
items.weapon.melee.sins.kingsaegis.desc=왕가의 문장이 새겨진 거대한 방패입니다. 이 방패 앞에서는 누구도 감히 고개를 들지 못합니다.
items.weapon.melee.sins.kingsaegis.effect=_전용 효과:_ 얻는 영광 점수가 _50%_ 증가하고, 위엄의 최대치가 _5_ 늘어납니다.
items.weapon.melee.sins.rosewhip.name=장미 채찍
items.weapon.melee.sins.rosewhip.desc=장미 덩굴을 꼬아 만든 채찍입니다. 가시에 긁힌 자는 묘하게 넋을 잃습니다. _2칸_ 떨어진 적도 공격할 수 있지만 피해는 조금 낮습니다.
items.weapon.melee.sins.rosewhip.effect=_전용 효과:_ 적중 시 _15%_ 확률로 적을 _4턴_ 동안 매혹합니다.
items.weapon.melee.sins.roseglaive.name=가시장미 창
items.weapon.melee.sins.roseglaive.desc=날 끝까지 장미 가시가 돋은 긴 창입니다. 홀린 자의 피를 달게 마십니다.
items.weapon.melee.sins.roseglaive.effect=_전용 효과:_ 모든 공격이 피해의 _15%_를 추가로 흡혈합니다. 매혹된 적을 공격해도 매혹이 풀리지 않습니다.
items.weapon.melee.sins.pickpocketdagger.name=소매치기 단검
items.weapon.melee.sins.pickpocketdagger.desc=소매 속에 숨기기 좋은 녹빛 단검입니다. 찌를 때마다 무언가를 슬쩍 가져옵니다.
items.weapon.melee.sins.pickpocketdagger.effect=_전용 효과:_ 적중할 때마다 강탈 스택이 _1개_ 더 쌓입니다.
items.weapon.melee.sins.usurpersgauntlets.name=찬탈의 건틀릿
items.weapon.melee.sins.usurpersgauntlets.desc=남의 손에서 빼앗은 듯 손가락마다 모양이 다른 녹색 건틀릿입니다.
items.weapon.melee.sins.usurpersgauntlets.effect=_전용 효과:_ 강탈 스택의 최대치가 _5_ 늘어나고, 적중할 때마다 선망을 _0.1_ 얻습니다.
items.weapon.melee.sins.pillowmace.name=베개 몽둥이
items.weapon.melee.sins.pillowmace.desc=솜을 잔뜩 채운 몽둥이입니다. 이걸로 툭 치기만 하면 나머지는 인형들이 알아서 합니다.
items.weapon.melee.sins.pillowmace.effect=_전용 효과:_ 적중한 적에게 모든 꿈 인형이 _달려들어 집중 공격_합니다.
items.weapon.melee.sins.dreamhammer.name=꿈의 망치
items.weapon.melee.sins.dreamhammer.desc=꿈결처럼 푸른 빛을 내는 거대한 망치입니다. 곁에 꿈 인형이 많을수록 묵직해집니다.
items.weapon.melee.sins.dreamhammer.effect=_전용 효과:_ 나와 있는 꿈 인형과 악몽 하나당 피해가 _10%_ 증가합니다(최대 50%). 이 무기로 적을 처치하면 모든 인형이 체력을 _20%_ 회복합니다.
items.sinsigil.name=대죄의 각인
items.sinsigil.desc=대장장이가 붉은 쇳물로 찍어낸 인장입니다. 무기에 새기면 그 무기를 당신이 짊어진 대죄의 _전용 5티어 무기_로 다시 벼려냅니다.\n\n무기의 _강화 수치와 인챈트_는 그대로 유지됩니다. 저주 상태도 그대로 남습니다.
items.sinsigil.ac_imprint=새기기
items.sinsigil.prompt=각인을 새길 근접 무기를 고르세요
items.sinsigil.no_sin=칠죄종이 아닌 자에게 이 각인은 아무 의미가 없다.
items.sinsigil.imprinted=%s(이)가 %s(으)로 다시 벼려졌다!
