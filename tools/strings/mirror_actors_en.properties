actors.mobs.npcs.vaultmirror.scene_gluttony=You see a _golden maw_ resting on the long table of an empty banquet hall. The scene seems like a memory, but something is different. Every plate is empty, yet the maw bares its teeth in contentment. For the first time in your life, you try to remember what it felt like to be full.
actors.mobs.npcs.vaultmirror.scene_greed=You see a _black card_ lying on a spotless ledger with no debts in it. The scene seems like a memory, but something is different. The vault overflows, and yet no one comes to you begging for a loan. Strangely, it feels a little lonely.
actors.mobs.npcs.vaultmirror.scene_wrath=You see a _drum of blood_ in the middle of a burned-out village square. The scene seems like a memory, but something is different. The square is silent, and everyone who fought there is gone. Only the drum beats on, in time with your heart.
actors.mobs.npcs.vaultmirror.scene_pride=You see an _eternal crown_ resting on an empty throne. The scene seems like a memory, but something is different. The crown is without a single scratch, and only the marks of those who knelt remain on the steps before it. You see yourself as one who never once bowed their head.
actors.mobs.npcs.vaultmirror.scene_lust=You see a _forbidden perfume_ on a vanity where the candles have gone out. The scene seems like a memory, but something is different. The chair before the mirror is empty, but the scent fills the room. It feels as if someone is still waiting for you.
actors.mobs.npcs.vaultmirror.scene_envy=You see a _shattered mirror_ at the end of a hall lined with portraits. The scene seems like a memory, but something is different. Every face in the portraits is your own. In each shard of the broken mirror is someone you once envied.
actors.mobs.npcs.vaultmirror.scene_sloth=You see an _eternal pillow_ in an endless field at dusk. The scene seems like a memory, but something is different. The sun neither sets nor rises, and no one ever comes to wake you. For the first time, you realize there is no reason to hurry.
