items.weapon.melee.mod.modmeleeweapon.ability_name=no technique
items.weapon.melee.mod.modmeleeweapon.ability_desc=This weapon has no duelist technique.
items.weapon.melee.mod.modmeleeweapon.stats_desc=
items.weapon.melee.mod.kukri.name=kukri
items.weapon.melee.mod.kukri.desc=A heavy, forward-curved knife. Quick in the hand and cruel to flesh.
items.weapon.melee.mod.kukri.stats_desc=Attacks _20%% faster_ than normal, and each hit has a _%d%%_ chance to cause bleeding.
items.weapon.melee.mod.morningstar.name=morningstar
items.weapon.melee.mod.morningstar.desc=A spiked iron ball on a stout handle, made for denting plate.
items.weapon.melee.mod.morningstar.stats_desc=Its spikes ignore _%d%%_ of the target's armor.
items.weapon.melee.mod.sling.name=sling
items.weapon.melee.mod.sling.desc=A forked stick with a leather band. A poor club, but in practiced hands it sends stones and blades flying much harder.
items.weapon.melee.mod.sling.stats_desc=While wielded, _thrown weapons_ deal _+%1$d%%_ damage (+%2$d%% per level, now _+%3$d%%_).
items.weapon.melee.mod.flamberge.name=flamberge
items.weapon.melee.mod.flamberge.desc=A sword with a wavy, flame-like blade. Its wounds are ragged and slow to close.
items.weapon.melee.mod.flamberge.stats_desc=Each hit has a _%d%%_ chance to cause bleeding.
items.weapon.melee.mod.warpick.name=war pick
items.weapon.melee.mod.warpick.desc=A narrow, heavy spike on a haft, made to punch through armor.
items.weapon.melee.mod.warpick.stats_desc=Deals _bonus damage_ equal to a roll of the target's armor, so armored foes take more.
items.weapon.melee.mod.coinsack.name=sack of coins
items.weapon.melee.mod.coinsack.desc=A bulging sack of gold swung like a club. Every blow jingles.
items.weapon.melee.mod.coinsack.stats_desc=Enemies killed with it spill _%d gold_ (more on deeper floors).
items.weapon.melee.mod.battlescythe.name=battle scythe
items.weapon.melee.mod.battlescythe.desc=A long, curved blade on a war pole, swung in wide arcs.
items.weapon.melee.mod.battlescythe.stats_desc=Its sweep also hits enemies next to _both you and the target_ for _%d%%_ of the damage.
items.weapon.melee.mod.executionersword.name=executioner's sword
items.weapon.melee.mod.executionersword.desc=A broad, blunt-tipped blade made for one purpose: the finishing blow.
items.weapon.melee.mod.executionersword.stats_desc=Deals more damage the more wounded the target is, up to _+%d%%_ against a nearly dead foe.
items.weapon.melee.mod.crescentaxe.name=crescent axe
items.weapon.melee.mod.crescentaxe.desc=An axe with a moon-shaped blade that bites deep when it lands just right.
items.weapon.melee.mod.crescentaxe.stats_desc=Each hit has a _%1$d%%_ chance to be a _critical hit_ dealing _%2$d%%_ damage.
items.weapon.melee.mod.crescentaxe.crit=critical!
items.weapon.melee.mod.crusadermace.name=crusader's mace
items.weapon.melee.mod.crusadermace.desc=A flanged mace blessed by a forgotten order. The dead and the damned fear its touch.
items.weapon.melee.mod.crusadermace.stats_desc=Deals _+%d%%_ damage to _undead and demons_.
items.weapon.melee.mod.runespear.name=rune spear
items.weapon.melee.mod.runespear.desc=A spear etched with glowing runes along its whole length. Its point cuts with magic rather than steel.
items.weapon.melee.mod.runespear.stats_desc=Reaches _2 tiles_, and its hits are _magical_: they _ignore armor_. Grows with upgrades like the runic blade.
items.weapon.melee.mod.giantslayer.name=giantslayer
items.weapon.melee.mod.giantslayer.desc=A massive sword forged for felling things much bigger than its wielder.
items.weapon.melee.mod.giantslayer.stats_desc=Deals _+%d%%_ damage to _large enemies, minibosses and bosses_.
items.weapon.melee.mod.abyssscythe.name=abyssal scythe
items.weapon.melee.mod.abyssscythe.desc=A black scythe that drinks the life of what it reaps.
items.weapon.melee.mod.abyssscythe.stats_desc=Each kill _heals_ you for _%d%%_ of your max HP plus the weapon's level.
items.weapon.melee.mod.heavenlyspear.name=heavenly spear
items.weapon.melee.mod.heavenlyspear.desc=A radiant spear whose thrust doesn't stop at the first foe.
items.weapon.melee.mod.heavenlyspear.stats_desc=Reaches _2 tiles_, and each thrust _pierces_: the enemy right behind the target takes the same hit.
items.weapon.melee.mod.ruinhammer.name=warhammer of ruin
items.weapon.melee.mod.ruinhammer.desc=A colossal hammer that shakes the ground with every blow.
items.weapon.melee.mod.ruinhammer.stats_desc=Every hit sends out a _shockwave_: enemies next to the target take _%d%%_ of the damage.
items.weapon.melee.mod.apocalypseweapon.ac_infuse=infuse (%d essences)
items.weapon.melee.mod.apocalypseweapon.need_essence=You need %1$d demon essences for this (you have %2$d).
items.weapon.melee.mod.apocalypseweapon.infused=The demon essences sink into your %s. It grows stronger!
items.weapon.melee.mod.apocalypseweapon.infuse_info=_Tier 6 weapon._ Scrolls of upgrade have no effect on it: it is strengthened by feeding it _demon essences_ instead. The next level costs _%d essences_.
items.weapon.melee.mod.doomblade.name=blade of doom
items.weapon.melee.mod.doomblade.desc=A blade of ruin that starts out almost dull. Every blow it lands feeds it, and it never forgets.
items.weapon.melee.mod.doomblade.stats_desc=Every hit stores _ruin energy_ for good (more per level, x5 against bosses); each %3$d energy adds _+1_ to its minimum and maximum damage.\n\nRuin energy: _%1$d_ (bonus damage: _+%2$d_).
items.weapon.melee.mod.voidscythe.name=scythe of the void
items.weapon.melee.mod.voidscythe.desc=A scythe whose edge seems to cut a hole in the air itself.
items.weapon.melee.mod.voidscythe.stats_desc=Each hit has a _%s%%_ chance to _seal a non-boss enemy in the void_, killing it instantly (+1%% per level).
items.weapon.melee.mod.voidscythe.voided=voided!
items.weapon.melee.mod.sunjudgment.name=judgment of the sun
items.weapon.melee.mod.sunjudgment.desc=A golden spear that soaks up light with every strike, until it can hold no more.
items.weapon.melee.mod.sunjudgment.stats_desc=Every hit charges it by _%1$d%%_ (+1%% per level). At _100%%_ it can unleash _judgment_: a beam of light up to _%3$d tiles_ that strikes every enemy in its path for _%2$d%%_ damage, ignoring armor (x1.5 against undead and demons), and blinds them.\n\nCharge: _%4$d%%_.
items.weapon.melee.mod.sunjudgment.ac_smite=judgment
items.weapon.melee.mod.sunjudgment.prompt=Choose where to unleash judgment
items.weapon.melee.mod.sunjudgment.need_wield=You have to be wielding it to unleash judgment.
items.weapon.melee.mod.sunjudgment.not_ready=The spear isn't fully charged yet (%d%%).
items.weapon.melee.mod.sunjudgment.ready=The judgment of the sun is fully charged!
items.weapon.melee.mod.worldsend.name=end of the world
items.weapon.melee.mod.worldsend.desc=A hammer said to be made for the day the world ends. The ground cracks wherever it falls.
items.weapon.melee.mod.worldsend.stats_desc=Every hit is a _quake_: enemies within _2 tiles_ of the target (5x5) take _%d%%_ of the damage.
items.weapon.melee.mod.apocalypseweapon$recipe.name=forge tier 6 weapon
