items.goldencard.pay_guard=황금 장벽 (%d)
items.goldencard.pay_express=급행료 (%d)
items.goldencard.pay_bribe=매수 (적 체력×2 한도)
items.goldencard.pay_loan=강제 대출 (적 체력×3 골드)
items.goldencard.prompt_coinshot=금화를 던질 대상을 선택하세요
items.goldencard.prompt_express=이동할 칸을 선택하세요 (최대 %d칸)
items.goldencard.prompt_bribe=매수할 적을 선택하세요
items.goldencard.prompt_loan=돈을 빌려줄 적을 선택하세요
items.goldencard.no_target=그곳에는 대상이 없다.
items.goldencard.bad_cell=그곳으로는 이동할 수 없다.
items.goldencard.bribe_refused=이 적은 돈으로 움직이지 않는다.
items.goldencard.too_expensive=결제 한도가 부족하다. (%d 필요)
items.goldencard.loan_no_gold=빌려줄 골드가 부족하다. (%d 골드 필요)
items.goldencard.already_indebted=이미 빚을 지고 있다.
items.goldencard.loaned=%s에게 %d 골드를 강제로 빌려주었다.
items.goldencard.sell_prompt=판매할 물건을 선택하세요 (한도 %d 소모)
items.goldencard.sell_confirm=상점가로 판매합니다. 결제 한도를 _%d_ 사용합니다. (현재 %d)
items.goldencard.sell_one=1개 판매 (%d 골드)
items.goldencard.sell_all=판매 (%d 골드)
items.armor.greedarmor.name=탐욕의 예복
items.armor.greedarmor.desc=금실로 수를 놓은 화려한 예복입니다. 입은 자의 재력을 과시하는 데 쓰입니다.
items.goldencard.skill_header=결제 한도 %d / %d · 소지 골드 %d
items.goldencard.skill_coinshot=금화 세례
items.goldencard.skill_coinshot_desc=금화를 던져 _%d~%d_ 피해를 줍니다.
items.goldencard.skill_guard=황금 장벽
items.goldencard.skill_guard_desc=_%d_만큼 황금 방어막을 얻습니다.
items.goldencard.skill_express=급행료
items.goldencard.skill_express_desc=최대 _%d칸_ 떨어진 곳으로 순간이동합니다.
items.goldencard.skill_bribe=매수
items.goldencard.skill_bribe_desc=적 최대 체력의 2배만큼 한도를 써서 _%d턴_ 동안 매혹합니다. 보스는 매수되지 않습니다.
items.goldencard.skill_loan=강제 대출
items.goldencard.skill_loan_desc=적 최대 체력의 3배만큼 골드를 빌려주어 채무자로 만듭니다. 채무자를 처치하면 2배로 돌려받습니다.
items.goldencard.skill_sell=원격 판매
items.goldencard.skill_sell_desc=상점이 없어도 물건을 상점가 그대로 팝니다.
items.goldencard.skill_shop=통신 판매
items.goldencard.skill_shop_desc=상점이 없어도 소모품을 상점가로 삽니다. 물건값은 골드로 내고, 주문할 때마다 결제 한도를 씁니다. 목록은 층마다 바뀝니다.
items.goldencard.shop_title=통신 판매 카탈로그
items.goldencard.shop_msg=주문마다 결제 한도를 _%d_ 씁니다. 보유 골드: _%d_
items.goldencard.shop_no_gold=골드가 부족하다.
items.goldencard.shop_bought=%s(을)를 %d골드에 샀다.
items.goldencard.shop_empty=이번 층의 카탈로그는 모두 팔렸다.
items.goldencard.skill_gild=황금 도금
items.goldencard.skill_gild_desc=결제 한도를 크게 써서 장비 하나를 _+1_ 강화합니다. 쓸 때마다 비용이 _150_씩 늘어나며, 최대 _600_입니다. (지금까지 %d번)
items.goldencard.skill_treasuremap=보물 지도
items.goldencard.skill_treasuremap_desc=이 층의 지도를 삽니다. 층 전체의 구조와 놓여 있는 아이템, 숨겨진 문과 함정이 모두 드러납니다.
items.goldencard.treasuremap_done=지도에 이 층의 구석구석과 보물이 있는 곳이 드러났다.
items.goldencard.skill_replicate=위조
items.goldencard.skill_replicate_desc=강화 주문서, 힘의 물약, 마법 부여 주문서 중 하나를 완벽하게 위조합니다. 결제 한도 게이지를 _전부_ 씁니다(가득 차 있어야 합니다). 사용 횟수 제한은 없습니다.
items.goldencard.gild_prompt=도금할 장비를 고르세요 (결제 한도 %d)
items.goldencard.gilded=%s에 황금빛이 스며들었다!
