items.goldencard.name=황금 체크카드
items.goldencard.desc=번쩍이는 황금으로 만든 체크카드입니다. 유물/반지 칸에 착용하는 유물이며, 착용해야 기술을 쓸 수 있습니다.\n\n_가진 골드_가 많을수록 강해집니다. 골드를 주우면 그만큼 _결제 한도_가 차오르고, 한도를 써서 _결제 기술_을 사용하거나 어디서든 물건을 _판매_할 수 있습니다.
items.goldencard.ac_pay=결제
items.goldencard.ac_sell=판매
items.goldencard.no_balance=결제 한도가 부족하다.
items.goldencard.pay_prompt=어떤 결제를 할까요? (결제 한도: %d / %d)
