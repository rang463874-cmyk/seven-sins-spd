actors.hero.heroclass.envy=envy
actors.hero.heroclass.envy_desc_short=Bearer of the sin of _Envy_. Envy's own power is meagre, but it _copies other sins' skills and monster abilities_ and even imitates how others grow.
actors.hero.heroclass.envy_desc=Envy starts with the _Mirror of Envy_, worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn.\n\nEnvy has no skills of its own. Each level up lets it copy one of _another sin's skills_, and registering rare variants, quest monsters and bosses in the _bestiary_ lets it copy that _monster's ability_ too. Copies go into the mirror's slots and are paid for with a very slowly filling _jealousy gauge_, which fills twice as fast while a strong enemy is in sight.\n\nEnvy's own growth is meagre: it only gains envy when it registers a new monster in the bestiary. Instead it can _imitate another sin's way of growing_ at half efficiency.\n\nEnvy starts with a _worn shortsword_ and knows _potions of healing_ and _scrolls of transmutation_.
actors.hero.heroclass.envy_unlock=Envy is unlocked from the start.

actors.hero.herosubclass.usurper=doppelganger
actors.hero.herosubclass.usurper_short_desc=The _Doppelganger_ imitates _two_ sins' growth at once and uses copied sin skills for _25%_ less.
actors.hero.herosubclass.usurper_desc=The Doppelganger wears others' shapes whole. It can imitate up to _two_ sins' growth, the second at half efficiency, and copied sin skills cost _25%_ less jealousy.\n\nIts talents raise the second growth's efficiency, make sin skills cheaper still, or grant envy whenever a sin skill is used.
actors.hero.herosubclass.copycat=copycat
actors.hero.herosubclass.copycat_short_desc=The _Copycat_ doubles every bestiary trait and can hold _one more_ copied skill.
actors.hero.herosubclass.copycat_desc=The Copycat copies what it sees, only better. Every bestiary trait is _doubled_, and the mirror gains _1_ more slot.\n\nIts talents strengthen bestiary traits, power up copied monster abilities, or grant more envy for defeating kinds already registered.

actors.hero.talent.envy_covet.title=covetous
actors.hero.talent.envy_covet.desc=_+1:_ Envy gained is increased by _15%_.\n\n_+2:_ Envy gained is increased by _30%_.
actors.hero.talent.envy_grasp.title=grasping
actors.hero.talent.envy_grasp.desc=Defeating a kind of monster listed in the bestiary fills the jealousy gauge.\n\n_+1:_ _10_\n\n_+2:_ _20_
actors.hero.talent.envy_petty.title=petty
actors.hero.talent.envy_petty.desc=After using a copied skill, your next melee hit within _10 turns_ deals more damage.\n\n_+1:_ _15%_\n\n_+2:_ _30%_
actors.hero.talent.envy_snatch.title=covetous eye
actors.hero.talent.envy_snatch.desc=The jealousy gauge fills even faster while a strong enemy is in sight. (2x by default)\n\n_+1:_ _2.5x_\n\n_+2:_ _3x_
actors.hero.talent.envy_mirror.title=someone else's meal
actors.hero.talent.envy_mirror.desc=Eating takes _1 turn_ instead of 3, and each meal fills the jealousy gauge.\n\n_+1:_ _15_\n\n_+2:_ _30_
actors.hero.talent.envy_polish.title=wide mirror
actors.hero.talent.envy_polish.desc=Raises the jealousy gauge's maximum. (100 by default)\n\n_+1:_ _+25_\n\n_+2:_ _+50_
actors.hero.talent.envy_switch.title=practiced imitation
actors.hero.talent.envy_switch.desc=Imitated growth becomes more efficient. (50% by default)\n\n_+1:_ _65%_\n\n_+2:_ _80%_
actors.hero.talent.envy_level.title=cheap knockoff
actors.hero.talent.envy_level.desc=Copied skills cost less jealousy.\n\n_+1:_ _10%_ less\n\n_+2:_ _20%_ less
actors.hero.talent.envy_resent.title=resentment
actors.hero.talent.envy_resent.desc=Getting hit fills the jealousy gauge.\n\n_+1:_ _1_\n\n_+2:_ _2_
actors.hero.talent.envy_jealousy.title=jealousy
actors.hero.talent.envy_jealousy.desc=All stat bonuses from envy are increased, including envy already earned.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.envy_trophy.title=trophies
actors.hero.talent.envy_trophy.desc=Each registered bestiary monster increases max HP.\n\n_+1:_ _+2_ each\n\n_+2:_ _+4_\n\n_+3:_ _+6_
actors.hero.talent.usurp_tyranny.title=perfect disguise
actors.hero.talent.usurp_tyranny.desc=The second imitated growth becomes more efficient. (50% of your growth efficiency by default)\n\n_+1:_ _65%_\n\n_+2:_ _80%_\n\n_+3:_ _95%_
actors.hero.talent.usurp_drain.title=familiar hands
actors.hero.talent.usurp_drain.desc=Copied sin skills cost even less.\n\n_+1:_ _30%_ less in total\n\n_+2:_ _35%_ less\n\n_+3:_ _40%_ less
actors.hero.talent.usurp_crown.title=borrowed strength
actors.hero.talent.usurp_crown.desc=Gain envy every time you use a copied sin skill.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_
actors.hero.talent.copy_study.title=observation
actors.hero.talent.copy_study.desc=Bestiary abilities are even stronger. (base 2x)\n\n_+1:_ _2.25x_\n\n_+2:_ _2.5x_\n\n_+3:_ _2.75x_
actors.hero.talent.copy_mask.title=mask
actors.hero.talent.copy_mask.desc=Copied monster abilities are more powerful.\n\n_+1:_ _20%_\n\n_+2:_ _40%_\n\n_+3:_ _60%_
actors.hero.talent.copy_echo.title=review
actors.hero.talent.copy_echo.desc=Defeating a kind already in the bestiary grants part of the envy you got for registering it.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_
actors.hero.talent.plunder_reach.title=raiding party
actors.hero.talent.plunder_reach.desc=Plunder reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.plunder_stacks.title=clean sweep
actors.hero.talent.plunder_stacks.desc=Plunder grants more jealousy per enemy. (5 by default)\n\n_+1:_ _7.5_\n\n_+2:_ _10_\n\n_+3:_ _12.5_\n\n_+4:_ _15_
actors.hero.talent.plunder_spoils.title=spoils
actors.hero.talent.plunder_spoils.desc=Each enemy hit by Plunder grants envy.\n\n_+1:_ _0.5_\n\n_+2:_ _1_\n\n_+3:_ _1.5_\n\n_+4:_ _2_
actors.hero.talent.trans_amplify.title=amplify
actors.hero.talent.trans_amplify.desc=Debuffs passed on by Transference last longer.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.trans_heal.title=relief
actors.hero.talent.trans_heal.desc=Using Transference heals you.\n\n_+1:_ _5%_ of max HP\n\n_+2:_ _10%_\n\n_+3:_ _15%_\n\n_+4:_ _20%_
actors.hero.talent.trans_weaken.title=passing the curse
actors.hero.talent.trans_weaken.desc=Transference's target is also _weakened_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.fall_power.title=plummet
actors.hero.talent.fall_power.desc=Downfall closes more of the health gap. (base 50%)\n\n_+1:_ _62%_\n\n_+2:_ _75%_\n\n_+3:_ _87%_\n\n_+4:_ _100%_
actors.hero.talent.fall_reach.title=enemy of all
actors.hero.talent.fall_reach.desc=Downfall reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.fall_rob.title=penniless
actors.hero.talent.fall_rob.desc=Each enemy hit by Downfall fills the jealousy gauge.\n\n_+1:_ _3_\n\n_+2:_ _6_\n\n_+3:_ _9_\n\n_+4:_ _12_

actors.hero.abilities.envy.plunder.name=plunder
actors.hero.abilities.envy.plunder.short_desc=Drain jealousy from _every visible enemy_, damaging them and filling your gauge.
actors.hero.abilities.envy.plunder.desc=Deal level-based damage to every visible enemy within 4 tiles and weaken them for _5 turns_. Each enemy hit fills the jealousy gauge by _5_.
actors.hero.abilities.envy.transference.name=transference
actors.hero.abilities.envy.transference.short_desc=Passes all your _harmful effects_ onto one enemy.
actors.hero.abilities.envy.transference.desc=Choose an enemy in sight. All harmful effects on you are removed, and those with a duration are moved onto that enemy as they were. Hunger is not transferred.
actors.hero.abilities.envy.transference.prompt=Choose an enemy to pass your misfortune to
actors.hero.abilities.envy.transference.no_target=There is no target there.
actors.hero.abilities.envy.transference.moved=Passed on %d harmful effects.
actors.hero.abilities.envy.downfall.name=downfall
actors.hero.abilities.envy.downfall.short_desc=Drags _healthier enemies'_ health down to your level.
actors.hero.abilities.envy.downfall.desc=Every visible enemy within 4 tiles with a higher health ratio than yours takes damage equal to _50% of the gap_. Bosses take half. This damage can't kill.

