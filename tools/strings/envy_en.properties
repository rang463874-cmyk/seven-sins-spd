actors.hero.heroclass.envy=envy
actors.hero.heroclass.envy_desc_short=Bearer of the sin of _Envy_. Envy _robs_ enemies of their strength with every hit, and etches the abilities of special foes into a _bestiary_.
actors.hero.heroclass.envy_desc=Envy starts with the _Mirror of Envy_, worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn. The mirror recharges over time, and its charges power _Snatch_, _Equalize_, _Swap_ and _Mimic_.\n\nEvery attack piles _robbed_ stacks on the enemy, weakening it. Defeating a robbed enemy grants _envy_, which raises melee damage, accuracy, max HP, armor and evasion without limit. Defeating rare variants, quest monsters and bosses registers them in the _bestiary_, granting their unique ability forever.\n\nEnvy starts with a _worn shortsword_ and knows _potions of healing_ and _scrolls of transmutation_.
actors.hero.heroclass.envy_unlock=Envy is unlocked from the start.

actors.hero.herosubclass.usurper=usurper
actors.hero.herosubclass.usurper_short_desc=The _Usurper_ piles on _2_ robbed stacks per hit, up to _10_, and deals _3%_ more damage per stack.
actors.hero.herosubclass.usurper_desc=The Usurper takes everything. Each attack adds _2_ robbed stacks, up to _10_ on a single enemy, and each stack increases the Usurper's damage against that enemy by _3%_.\n\nThe Usurper's talents increase this bonus, steal health with each hit, or recharge the mirror by defeating heavily robbed enemies.
actors.hero.herosubclass.copycat=copycat
actors.hero.herosubclass.copycat_short_desc=The _Copycat_ gets _double_ the effect from every bestiary ability.
actors.hero.herosubclass.copycat_desc=The Copycat imitates what they see, only better. Every monster ability in the bestiary has _twice_ the effect.\n\nThe Copycat's talents make bestiary abilities even stronger, enlarge the shield from Mimic, or grant extra envy for defeating already registered monsters.

actors.hero.talent.envy_covet.title=covetous
actors.hero.talent.envy_covet.desc=_+1:_ Envy gained is increased by _15%_.\n\n_+2:_ Envy gained is increased by _30%_.
actors.hero.talent.envy_grasp.title=grasping
actors.hero.talent.envy_grasp.desc=Increases the maximum robbed stacks on one enemy.\n\n_+1:_ _+2_\n\n_+2:_ _+4_
actors.hero.talent.envy_petty.title=petty
actors.hero.talent.envy_petty.desc=Each robbed stack lowers enemy damage further. (base 5%)\n\n_+1:_ _7%_\n\n_+2:_ _9%_
actors.hero.talent.envy_snatch.title=pickpocket
actors.hero.talent.envy_snatch.desc=Snatch lasts longer. (base 8 turns)\n\n_+1:_ _12 turns_\n\n_+2:_ _16 turns_
actors.hero.talent.envy_mirror.title=larger mirror
actors.hero.talent.envy_mirror.desc=Increases the mirror's maximum charges. (base 3)\n\n_+1:_ _4_\n\n_+2:_ _5_
actors.hero.talent.envy_polish.title=polish
actors.hero.talent.envy_polish.desc=The mirror recharges faster.\n\n_+1:_ _20%_ faster\n\n_+2:_ _40%_ faster
actors.hero.talent.envy_switch.title=switcheroo
actors.hero.talent.envy_switch.desc=Swap reaches farther. (base 6 tiles)\n\n_+1:_ _8 tiles_\n\n_+2:_ _10 tiles_
actors.hero.talent.envy_level.title=leveling down
actors.hero.talent.envy_level.desc=Enemies hit by Equalize are _weakened_.\n\n_+1:_ _3 turns_\n\n_+2:_ _5 turns_
actors.hero.talent.envy_resent.title=resentment
actors.hero.talent.envy_resent.desc=When attacked, there's a chance to add a robbed stack to the attacker.\n\n_+1:_ _15%_ chance\n\n_+2:_ _30%_ chance
actors.hero.talent.envy_jealousy.title=jealousy
actors.hero.talent.envy_jealousy.desc=All stat bonuses from envy are increased, including envy already earned.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.envy_trophy.title=trophies
actors.hero.talent.envy_trophy.desc=Each registered bestiary monster increases max HP.\n\n_+1:_ _+2_ each\n\n_+2:_ _+4_\n\n_+3:_ _+6_
actors.hero.talent.usurp_tyranny.title=tyranny
actors.hero.talent.usurp_tyranny.desc=Bonus damage per robbed stack is increased. (base 3%)\n\n_+1:_ _5%_\n\n_+2:_ _7%_\n\n_+3:_ _9%_
actors.hero.talent.usurp_drain.title=exploitation
actors.hero.talent.usurp_drain.desc=Each attack heals you.\n\n_+1:_ _1 HP_\n\n_+2:_ _2 HP_\n\n_+3:_ _3 HP_
actors.hero.talent.usurp_crown.title=seize the throne
actors.hero.talent.usurp_crown.desc=Defeating an enemy with 5 or more robbed stacks recharges the mirror.\n\n_+1:_ _0.2 charges_\n\n_+2:_ _0.4 charges_\n\n_+3:_ _0.6 charges_
actors.hero.talent.copy_study.title=observation
actors.hero.talent.copy_study.desc=Bestiary abilities are even stronger. (base 2x)\n\n_+1:_ _2.25x_\n\n_+2:_ _2.5x_\n\n_+3:_ _2.75x_
actors.hero.talent.copy_mask.title=mask
actors.hero.talent.copy_mask.desc=Mimic grants more shielding.\n\n_+1:_ _50%_ more\n\n_+2:_ _100%_\n\n_+3:_ _150%_
actors.hero.talent.copy_echo.title=review
actors.hero.talent.copy_echo.desc=Defeating a monster type already in the bestiary grants extra envy.\n\n_+1:_ _50%_ extra\n\n_+2:_ _100%_\n\n_+3:_ _150%_
actors.hero.talent.plunder_reach.title=raiding party
actors.hero.talent.plunder_reach.desc=Plunder reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.plunder_stacks.title=clean sweep
actors.hero.talent.plunder_stacks.desc=Plunder adds more robbed stacks. (base 4)\n\n_+1:_ _6_\n\n_+2:_ _8_\n\n_+3:_ _10_\n\n_+4:_ _12_
actors.hero.talent.plunder_spoils.title=spoils
actors.hero.talent.plunder_spoils.desc=Each enemy hit by Plunder grants envy.\n\n_+1:_ _0.5_\n\n_+2:_ _1_\n\n_+3:_ _1.5_\n\n_+4:_ _2_
actors.hero.talent.trans_amplify.title=amplify
actors.hero.talent.trans_amplify.desc=Debuffs passed on by Transference last longer.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.trans_heal.title=relief
actors.hero.talent.trans_heal.desc=Using Transference heals you.\n\n_+1:_ _5%_ of max HP\n\n_+2:_ _10%_\n\n_+3:_ _15%_\n\n_+4:_ _20%_
actors.hero.talent.trans_weaken.title=passing the curse
actors.hero.talent.trans_weaken.desc=Transference's target is also _weakened_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.fall_power.title=plummet
actors.hero.talent.fall_power.desc=Downfall closes more of the health gap. (base 50%)\n\n_+1:_ _62%_\n\n_+2:_ _75%_\n\n_+3:_ _87%_\n\n_+4:_ _100%_
actors.hero.talent.fall_reach.title=enemy of all
actors.hero.talent.fall_reach.desc=Downfall reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.fall_rob.title=penniless
actors.hero.talent.fall_rob.desc=Enemies hit by Downfall gain robbed stacks.\n\n_+1:_ _2_\n\n_+2:_ _4_\n\n_+3:_ _6_\n\n_+4:_ _8_

actors.hero.abilities.envy.plunder.name=plunder
actors.hero.abilities.envy.plunder.short_desc=Robs _every visible enemy_ at once.
actors.hero.abilities.envy.plunder.desc=Adds _4_ robbed stacks to every visible enemy within 4 tiles and weakens them for _5 turns_.
actors.hero.abilities.envy.transference.name=transference
actors.hero.abilities.envy.transference.short_desc=Passes all your _harmful effects_ onto one enemy.
actors.hero.abilities.envy.transference.desc=Choose an enemy in sight. All harmful effects on you are removed, and those with a duration are moved onto that enemy as they were. Hunger is not transferred.
actors.hero.abilities.envy.transference.prompt=Choose an enemy to pass your misfortune to
actors.hero.abilities.envy.transference.no_target=There is no target there.
actors.hero.abilities.envy.transference.moved=Passed on %d harmful effects.
actors.hero.abilities.envy.downfall.name=downfall
actors.hero.abilities.envy.downfall.short_desc=Drags _healthier enemies'_ health down to your level.
actors.hero.abilities.envy.downfall.desc=Every visible enemy within 4 tiles with a higher health ratio than yours takes damage equal to _50% of the gap_. Bosses take half. This damage can't kill.

