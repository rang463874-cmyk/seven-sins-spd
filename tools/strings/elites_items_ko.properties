items.sinessence.name=죄의 정수
items.sinessence.desc=엘리트 몬스터가 남긴, 어둡게 고동치는 죄의 결정입니다. 연금술로 _죄악의 영약_(정수 2개 + 아무 물약)을 만들거나 _칠죄의 폭탄_(폭탄 + 정수)에 채워 넣을 수 있습니다.
items.elite.elixirofsin.name=죄악의 영약
items.elite.elixirofsin.desc=죄의 정수를 증류해 만든 걸쭉한 진홍빛 영약입니다.\n\n칠죄종이 마시면 _죄악 포인트 20_을 영구히 얻고 스킬 자원이 가득 찹니다. 그 외의 영웅은 몇 턴에 걸쳐 체력이 가득 회복되고 30턴 동안 축복을 받습니다.
items.elite.elixirofsin.ac_drink=마시기
items.elite.elixirofsin.drink_sin=죄가 온몸을 휘감으며 힘이 자라납니다!
items.elite.elixirofsin.drink_other=따뜻하고도 사악한 힘이 차오릅니다.
items.elite.bandage.name=약초 붕대
items.elite.bandage.desc=태양초 수액을 머금은 천 조각입니다. 감는 데 1턴이 걸리며, _출혈_과 _불구_를 멈추고 시간에 걸쳐 _최대 체력의 35%_를 회복합니다.
items.elite.bandage.ac_apply=감기
items.elite.bandage.applied=붕대를 단단히 감았다.
items.elite.stimulant.name=각성제
items.elite.stimulant.desc=아주 쓴 무언가가 든 주사기입니다. 쓰는 데 시간이 들지 않으며, _8턴 동안 가속과 아드레날린_을 얻고 둔화, 불구, 약화, 졸음을 떨쳐냅니다.
items.elite.stimulant.ac_inject=주사
items.elite.stimulant.used=심장이 쿵쾅거린다!
items.bombs.sinbomb.name=칠죄의 폭탄
items.bombs.sinbomb.desc=죄의 정수를 채운 폭탄입니다. 폭발한 뒤, 2칸 안의 모든 적이 일곱 가지 죄 중 하나를 무작위로 겪습니다. 매혹, 약화, 취약, 둔화, 불구, 공포, 깊은 잠 중 하나입니다.
items.bombs.stickybomb.name=끈끈이 폭탄
items.bombs.stickybomb.desc=화약 대신 땅뿌리풀 접착제를 채운 폭탄입니다. 폭발하지 않고 2칸 범위에 접착제를 흩뿌려, 당신을 제외한 모두를 8턴 동안 속박하고 거미줄을 남깁니다.
