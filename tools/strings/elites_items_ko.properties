items.sinessence.name=죄의 정수
items.sinessence.desc=엘리트 몬스터가 남긴, 어둡게 고동치는 죄의 결정입니다. 연금술로 _죄악의 영약_(정수 2개 + 아무 물약)을 만들거나 _칠죄의 폭탄_(폭탄 + 정수)에 채워 넣을 수 있습니다.
items.elite.elixirofsin.name=죄악의 영약
items.elite.elixirofsin.desc=죄의 정수를 증류해 만든 걸쭉한 진홍빛 영약입니다.\n\n칠죄종이 마시면 _죄악 포인트 20_을 영구히 얻고 스킬 자원이 가득 찹니다. 그 외의 영웅은 몇 턴에 걸쳐 체력이 가득 회복되고 30턴 동안 축복을 받습니다.
items.elite.elixirofsin.ac_drink=마시기
items.elite.elixirofsin.drink_sin=죄가 온몸을 휘감으며 힘이 자라납니다!
items.elite.elixirofsin.drink_other=따뜻하고도 사악한 힘이 차오릅니다.
items.elite.bandage.name=약초 붕대
items.elite.bandage.desc=태양초 수액을 머금은 천 조각입니다. 감는 데 1턴이 걸리며, _출혈_과 _불구_를 멈추고 시간에 걸쳐 _최대 체력의 35%_를 회복합니다.
items.elite.bandage.ac_apply=감기
items.elite.bandage.applied=붕대를 단단히 감았다.
items.elite.stimulant.name=각성제
items.elite.stimulant.desc=아주 쓴 무언가가 든 주사기입니다. 쓰는 데 시간이 들지 않으며, _8턴 동안 가속과 아드레날린_을 얻고 둔화, 불구, 약화, 졸음을 떨쳐냅니다.
items.elite.stimulant.ac_inject=주사
items.elite.stimulant.used=심장이 쿵쾅거린다!
items.bombs.sinbomb.name=칠죄의 폭탄
items.bombs.sinbomb.desc=죄의 정수를 채운 폭탄입니다. 폭발한 뒤, 2칸 안의 모든 적이 일곱 가지 죄 중 하나를 무작위로 겪습니다. 매혹, 약화, 취약, 둔화, 불구, 공포, 깊은 잠 중 하나입니다.
items.bombs.stickybomb.name=끈끈이 폭탄
items.bombs.stickybomb.desc=화약 대신 땅뿌리풀 접착제를 채운 폭탄입니다. 폭발하지 않고 2칸 범위에 접착제를 흩뿌려, 당신을 제외한 모두를 8턴 동안 속박하고 거미줄을 남깁니다.
items.bombs.caltropbomb.name=마름쇠 폭탄
items.bombs.caltropbomb.desc=화약 대신 쇠 마름쇠를 채운 폭탄입니다. 폭발하지 않고 2칸 범위에 마름쇠를 흩뿌려, 그 안의 모든 적이 약한 피해를 입고 8턴 동안 _출혈_과 _불구_에 걸립니다. 당신은 다치지 않습니다.
items.elite.sininfusion.name=죄악 융합
items.elite.sininfusion.desc=죄의 정수에 담가 둔 저주 융합입니다. 저주 융합처럼 _근접 무기, 방어구, 마법 막대_에 저주를 걸지만(저주가 없으면 새로 붙습니다), 그 힘이 _중첩_됩니다. 융합할 때마다 _강화 수치 +1_을 얻으며, 제한이 없습니다.\n\n저주가 풀리거나 좋은 마법 부여로 바뀌면 _모든 중첩이 사라집니다_.
items.elite.sininfusion.prompt=융합할 장비를 선택하세요
items.elite.sininfusion.infused=%s에 죄가 스며듭니다. (죄악 융합 x%d)
items.elite.sininfusion.info_line=_죄악 융합 x%d:_ 중첩마다 강화 수치 +1. 저주가 풀리면 사라집니다.
items.elite.castingmold.name=투척 무기 주형
items.elite.castingmold.desc=모양을 잡을 준비가 된 액체 금속이 가득 찬 쇠 주형입니다. _투척 무기 세트_(다트 제외)에 부으면 같은 무기를 _하나 더_ 주조합니다. 세트 자체가 영구히 커지므로 강화, 수리, 회수할 때도 늘어난 개수가 유지됩니다. 제한은 없지만 _정복의 창_은 _3개_를 부어야 한 자루가 늘어납니다.
items.elite.castingmold.prompt=투척 무기 세트를 선택하세요
items.elite.castingmold.cast=%s 하나를 더 주조했습니다. 이제 세트는 %d개입니다.
items.elite.castingmold.cast_partial=주형이 정복의 창에 스며듭니다 (%d/%d). 창을 하나 더 만들려면 금속이 더 필요합니다.
items.elite.castingmold.info_line=투척 무기 주형으로 늘린 세트입니다. 세트 크기: _%d개_
items.elite.decoydoll.name=미끼 인형
items.elite.decoydoll.desc=폭풍덩굴로 묶은 작은 짚 인형입니다. 빈칸에 _던지면_ 커다란 허수아비로 부풀어 올라, 15턴 동안 주위 4칸의 모든 적이 공격하지 않고는 못 배깁니다.
items.elite.decoydoll$decoy.name=미끼 허수아비
items.elite.decoydoll$decoy.desc=적들이 공격을 멈출 수 없는 짚 허수아비입니다.\n\n_%d턴_ 뒤에 부서집니다.
items.elite.wallacid.name=벽 부식액
items.elite.wallacid.desc=슬픔이끼 수액을 화염초로 졸여 만든, 지글거리는 플라스크입니다. 벽을 향해 _던지면_ 떨어진 곳 주변의 벽을 모두 녹이고, 던진 방향으로 최대 3칸 깊이까지 파고들어 새 통로를 엽니다.\n\n보스 층과 특수한 층에서는 효과가 없고, 층의 가장 바깥 벽은 녹일 수 없으며, 잠긴 보물실과 퀘스트 방의 벽은 건드리지 않습니다.
items.elite.wallacid.no_effect=부식액이 힘없이 거품만 냅니다. 이곳의 벽은 너무 단단합니다.
items.elite.wallacid.no_wall=부식액이 쉭쉭거리지만, 녹일 벽이 없습니다.
items.elite.stonedust.name=석벽 가루
items.elite.stonedust.desc=뱀뿌리 껍질과 얼린 눈꽃송이를 곱게 간 가루입니다. 빈 바닥에 _던지면_ 던진 방향을 가로막는 3칸 너비의 돌벽이 솟아오릅니다. 벽은 20턴 뒤 무너지고 원래 지형으로 돌아갑니다.\n\n비어 있는 바닥에만 솟아나며, 몬스터·아이템·식물·함정·계단 위에는 생기지 않습니다.
items.elite.stonedust.no_room=가루가 가라앉았지만, 벽이 솟을 자리가 없습니다.
items.elite.stonedust$risenwall.desc=연금술로 세운 돌벽입니다. 곧 무너질 것 같습니다.
items.elite.dryingpowder.name=건조 가루
items.elite.dryingpowder.desc=화염초 재와 신속엉겅퀴로 만든, 뜨겁고 메마른 가루입니다. _던지면_ 떨어진 곳에서 2칸 이내의 물을 모두 말려 영구히 맨바닥으로 바꿉니다.
items.elite.dryingpowder.no_water=가루가 피어오르지만, 근처에 물이 없습니다.
