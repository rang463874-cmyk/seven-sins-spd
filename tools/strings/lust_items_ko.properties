items.perfume.name=유혹의 향수
items.perfume.desc=달콤하고 아찔한 향이 나는 붉은 향수병입니다. 유물/반지 칸에 착용하는 유물이며, 착용해야 기술을 쓸 수 있습니다.\n\n향수의 기술은 충전 대신 _자신의 체력_을 대가로 씁니다. 매혹된 적의 피를 마셔 잃은 체력을 되찾으세요.
items.perfume.ac_spray=뿌리기
items.perfume.prompt=무엇을 할까요? (체력 %d / %d)
items.perfume.opt_kiss=피의 키스 (체력 %d)
items.perfume.opt_step=스텝 (체력 %d)
items.perfume.opt_drain=생기 흡수 (무료)
items.perfume.opt_rapture=도취 (체력 %d)
items.perfume.prompt_kiss=입맞출 적을 선택하세요 (최대 %d칸)
items.perfume.no_target=그곳에는 입맞출 적이 없다.
items.perfume.no_room=그 적의 곁에 설 자리가 없다.
items.perfume.no_blood=대가로 치를 체력이 부족하다.
items.perfume.no_charmed=곁에 매혹된 적이 없다.
items.armor.lustarmor.name=색욕의 드레스
items.armor.lustarmor.desc=붉은 비단으로 지은 우아한 옷입니다. 보는 이의 눈을 떼지 못하게 만듭니다.
items.perfume.skill_header=체력 %d / %d
items.perfume.skill_kiss=피의 키스
items.perfume.skill_kiss_desc=_%d칸_ 안의 적 옆으로 순간이동해 반드시 맞는 공격을 하고 _%d턴_ 동안 매혹합니다.
items.perfume.skill_step=스텝
items.perfume.skill_step_desc=_%d턴_ 동안 회피가 크게 늘어납니다.
items.perfume.skill_drain=생기 흡수
items.perfume.skill_drain_desc=곁에 있는 매혹된 적들의 매혹을 모두 소모해 피해를 주고, 준 피해만큼 체력을 빼앗습니다. 남은 매혹이 길수록 강합니다.
items.perfume.skill_rapture=도취
items.perfume.skill_rapture_desc=_%d턴_ 동안 모든 근접 공격이 흡혈하고, 잠시 빨라집니다.
items.perfume.skill_replicate=피의 서약
items.perfume.skill_replicate_desc=강화 주문서, 힘의 물약, 마법 부여 주문서 중 하나에 자신의 피로 서약을 새기면, 쌍둥이가 응답합니다. 하나를 더 얻습니다. _최대 체력의 절반_을 씁니다. 사용 횟수 제한은 없습니다.
