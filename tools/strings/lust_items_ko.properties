items.perfume.name=유혹의 향수
items.perfume.desc=달콤하고 아찔한 향이 나는 분홍빛 향수병입니다. 장비 칸을 차지하지 않습니다.\n\n향수의 _충전_을 써서 적을 매혹하고 그 생기를 빼앗습니다. 충전은 시간이 지나면 차오릅니다. 매혹된 적에게서 생기를 흡수할수록 _갈망_이 쌓여 영구적으로 강해집니다.
