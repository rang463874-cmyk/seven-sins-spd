items.artifacts.sinartifact.awakened_name=각성한 %s
items.artifacts.sinartifact.awakened_info=_죄의 시련을 이겨 냈습니다._ 레벨 상한이 _+20_으로 늘었고, 새 고유 기술을 쓸 수 있습니다. (+10을 넘는 레벨은 효과가 절반씩 오릅니다.)
items.artifacts.sinartifact.trial_hint=도시 계층 어딘가의 어두운 성소에서 _자신의 죄의 그림자_를 이겨 내면, 이 유물은 한 번 더 깨어납니다.
sins.trialhooks.no_item=고유 유물이 없어 깨어날 것이 없습니다.
sins.trialhooks.awakened=죄의 그림자가 유물에 스며듭니다. _%s_(으)로 깨어났다! 레벨 상한이 +20이 되고 새 기술을 얻었습니다.
sins.trialhooks.no_target=그곳에는 대상이 없다.
sins.trialhooks.prompt=대상을 고르세요.
sins.trialhooks.bound=%s이(가) 솔로몬의 인장에 영원히 묶였다!
sins.trialhooks$cooldown.name=시련 기술 재사용 대기
sins.trialhooks$cooldown.desc=죄의 시련으로 얻은 기술을 다시 쓰려면 기다려야 합니다.\n\n남은 턴: %s
sins.trialhooks.skill_trial_gluttony=포식
sins.trialhooks.skill_trial_gluttony_desc=_(죄의 시련 · 단일 대상)_ 적 하나를 크게 물어뜯어 _강한 피해_를 주고, 준 피해의 _절반_만큼 회복합니다. 대상은 _8턴_ 동안 약화됩니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_greed=미다스의 손
sins.trialhooks.skill_trial_greed_desc=_(죄의 시련 · 단일 대상)_ 적 하나에 피해를 주고 황금으로 굳힙니다. _6턴_ 동안 마비(보스는 _2턴_)되고 _10턴_ 동안 취약해지며, 발밑에 금화를 쏟아 냅니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_wrath=분노의 일격
sins.trialhooks.skill_trial_wrath_desc=_(죄의 시련 · 단일 대상)_ 쌓인 분노를 _전부_(최소 50) 한 번에 실어 _분노 + 레벨의 2배_만큼 피해를 줍니다. 대상은 _6턴_ 동안 불구가 되고 _2턴_(보스는 _1턴_) 마비됩니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_pride=참수령
sins.trialhooks.skill_trial_pride_desc=_(죄의 시련 · 단일 대상)_ 적 하나에게 처형을 명합니다. 대상이 잃은 체력 비율만큼 피해가 늘어나 _최대 2배_가 됩니다. _4턴_ 동안 마비(보스는 _1턴_)되고 _8턴_ 동안 약화됩니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_lust=치명적 입맞춤
sins.trialhooks.skill_trial_lust_desc=_(죄의 시련 · 단일 대상)_ 적 하나의 생명력을 빨아들여 피해를 주고 _준 피해 전부_를 회복합니다. 대상은 _6턴_ 동안 매혹(보스는 _2턴_)됩니다. 최대 체력의 _15%_를 대가로 치릅니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_envy=시샘의 저주
sins.trialhooks.skill_trial_envy_desc=_(죄의 시련 · 단일 대상)_ 적 하나가 가진 것을 시샘해, 피해에 더해 대상 현재 체력의 _12%_(상한 있음)를 빼앗습니다. 대상은 _10턴_ 동안 저주·약화·취약에 걸립니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_sloth=악몽
sins.trialhooks.skill_trial_sloth_desc=_(죄의 시련 · 단일 대상)_ 적 하나에게 아픈 꿈을 꾸게 해 피해를 줍니다. 보스가 아닌 적은 _마법의 잠_에 빠지고, 보스는 _8턴_ 동안 둔화되고 _1턴_ 마비됩니다. 그 뒤 당신도 꾸벅꾸벅 졸며 턴을 잃습니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_solomon=속박의 인장
sins.trialhooks.skill_trial_solomon_desc=_(죄의 시련 · 단일 대상)_ 적 하나를 솔로몬의 인장으로 묶습니다. 보스가 아닌 적은 _영원히_ 당신을 따르는 동료가 됩니다. 보스나 묶을 수 없는 적은 마법 위력이 실린 _강한 피해_를 입고 _4턴_ 동안 속박, _8턴_ 동안 저주에 걸립니다.\n\n재사용 대기 _40턴_.
