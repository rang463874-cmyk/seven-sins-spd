items.artifacts.sinartifact.awakened_name=각성한 %s
items.artifacts.sinartifact.awakened_info=_죄의 시련을 이겨 냈습니다._ 레벨 상한이 _+20_으로 늘었고, 새 고유 기술을 쓸 수 있습니다. (+10을 넘는 레벨은 효과가 절반씩 오릅니다.)
items.artifacts.sinartifact.trial_hint=도시 계층 어딘가의 어두운 성소에서 _자신의 죄의 그림자_를 이겨 내면, 이 유물은 한 번 더 깨어납니다.
sins.trialhooks.no_item=고유 유물이 없어 깨어날 것이 없습니다.
sins.trialhooks.awakened=죄의 그림자가 유물에 스며듭니다. _%s_(으)로 깨어났다! 레벨 상한이 +20이 되고 새 기술을 얻었습니다.
sins.trialhooks.no_target=그곳에는 대상이 없다.
sins.trialhooks.prompt=대상을 고르세요.
sins.trialhooks.bound=%s이(가) 솔로몬의 인장에 영원히 묶였다!
sins.trialhooks$cooldown.name=시련 기술 재사용 대기
sins.trialhooks$cooldown.desc=죄의 시련으로 얻은 기술을 다시 쓰려면 기다려야 합니다.\n\n남은 턴: %s
sins.trialhooks.skill_trial_gluttony=만찬
sins.trialhooks.skill_trial_gluttony_desc=_(죄의 시련)_ 주변 _2칸_ 안의 모든 적을 물어뜯어 큰 피해를 주고, 준 피해의 _절반_만큼 체력을 회복합니다. 보스가 아닌 적이 체력의 _25%_ 아래로 떨어지면 통째로 삼켜 버리고, 삼킬 때마다 포만감이 조금 찹니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_greed=미다스의 손
sins.trialhooks.skill_trial_greed_desc=_(죄의 시련)_ 적 하나를 황금으로 바꿉니다. _8턴_ 동안 마비되고 취약해지며, 발밑에 금화를 쏟아 냅니다. 보스는 마비 대신 _4턴_ 둔화됩니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_wrath=대격변
sins.trialhooks.skill_trial_wrath_desc=_(죄의 시련)_ 쌓인 분노를 _전부_(최소 50) 한꺼번에 터뜨려 주변 _3칸_ 안의 적에게 _분노의 절반 + 레벨_만큼 피해를 주고 _5턴_ 동안 불구로 만듭니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_pride=왕명
sins.trialhooks.skill_trial_pride_desc=_(죄의 시련)_ 시야의 모든 적이 무릎을 꿇습니다. 보스가 아닌 적은 _4턴_ 동안 마비되고, 보스는 _6턴_ 동안 약화되고 취약해집니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_lust=치명적 유혹
sins.trialhooks.skill_trial_lust_desc=_(죄의 시련)_ 주변 _4칸_ 안의 모든 적을 _8턴_ 동안 매혹하고 생명력을 빨아들여, 준 피해만큼 회복합니다. 최대 체력의 _15%_를 대가로 치릅니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_envy=도플갱어
sins.trialhooks.skill_trial_envy_desc=_(죄의 시련)_ 당신을 꼭 닮은 거울 분신 _3체_를 불러냅니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_sloth=영원한 잠
sins.trialhooks.skill_trial_sloth_desc=_(죄의 시련)_ 시야의 모든 적이 _마법의 잠_에 빠집니다. 보스는 _5턴_ 동안 둔화됩니다. 그 뒤 당신도 꾸벅꾸벅 졸며 턴을 잃습니다.\n\n재사용 대기 _40턴_.
sins.trialhooks.skill_trial_solomon=속박의 인장
sins.trialhooks.skill_trial_solomon_desc=_(죄의 시련)_ 적 하나를 솔로몬의 인장으로 묶습니다. 보스가 아닌 적은 _영원히_ 당신을 따르는 동료가 됩니다. 보스나 묶을 수 없는 적은 큰 마법 피해를 입고 _8턴_ 동안 저주받습니다.\n\n재사용 대기 _40턴_.
