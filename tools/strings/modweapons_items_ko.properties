items.weapon.melee.mod.modmeleeweapon.ability_name=기술 없음
items.weapon.melee.mod.modmeleeweapon.ability_desc=이 무기에는 결투가의 무기 기술이 없습니다.
items.weapon.melee.mod.modmeleeweapon.stats_desc=
items.weapon.melee.mod.kukri.name=쿠크리
items.weapon.melee.mod.kukri.desc=앞으로 휜 묵직한 칼입니다. 손에 빠르게 익고 살을 잔인하게 가릅니다.
items.weapon.melee.mod.kukri.stats_desc=공격 속도가 _20%% 빠르고_, 타격마다 _%d%%_ 확률로 출혈을 일으킵니다.
items.weapon.melee.mod.morningstar.name=모닝스타
items.weapon.melee.mod.morningstar.desc=튼튼한 자루 끝에 가시 박힌 쇠공이 달려 있습니다. 판금을 찌그러뜨리려고 만든 무기입니다.
items.weapon.melee.mod.morningstar.stats_desc=가시가 대상 방어력의 _%d%%_를 무시합니다.
items.weapon.melee.mod.sling.name=슬링
items.weapon.melee.mod.sling.desc=가죽 끈을 단 Y자 나무입니다. 몽둥이로는 형편없지만, 익숙한 손에서는 돌과 칼날을 훨씬 세게 날려 보냅니다.
items.weapon.melee.mod.sling.stats_desc=장착한 동안 _투척 무기_의 피해가 _+%1$d%%_ 늘어납니다(강화당 +%2$d%%, 현재 _+%3$d%%_).
items.weapon.melee.mod.flamberge.name=플랑베르주
items.weapon.melee.mod.flamberge.desc=불꽃처럼 물결치는 칼날을 가진 검입니다. 상처가 너덜너덜해 잘 아물지 않습니다.
items.weapon.melee.mod.flamberge.stats_desc=타격마다 _%d%%_ 확률로 출혈을 일으킵니다.
items.weapon.melee.mod.warpick.name=워픽
items.weapon.melee.mod.warpick.desc=자루에 가늘고 무거운 쇠못을 단 무기로, 갑옷을 뚫으려고 만들었습니다.
items.weapon.melee.mod.warpick.stats_desc=대상의 방어력 굴림만큼 _추가 피해_를 줍니다. 단단한 적일수록 더 아픕니다.
items.weapon.melee.mod.coinsack.name=금화 자루
items.weapon.melee.mod.coinsack.desc=금화가 불룩하게 든 자루를 몽둥이처럼 휘두릅니다. 때릴 때마다 짤랑거립니다.
items.weapon.melee.mod.coinsack.stats_desc=이 무기로 처치한 적은 _%d 골드_를 흘립니다(깊은 층일수록 많아집니다).
items.weapon.melee.mod.battlescythe.name=전투 낫
items.weapon.melee.mod.battlescythe.desc=전투용 장대에 길게 휜 날을 단 무기로, 넓게 휘둘러 벱니다.
items.weapon.melee.mod.battlescythe.stats_desc=휘두르면 _나와 대상 모두에게 인접한_ 적도 피해의 _%d%%_를 받습니다.
items.weapon.melee.mod.executionersword.name=처형자의 검
items.weapon.melee.mod.executionersword.desc=끝이 뭉툭하고 넓은 칼날입니다. 오직 마지막 일격을 위해 만들어졌습니다.
items.weapon.melee.mod.executionersword.stats_desc=대상이 많이 다쳤을수록 피해가 커지며, 빈사 상태의 적에게는 최대 _+%d%%_입니다.
items.weapon.melee.mod.crescentaxe.name=초승달 도끼
items.weapon.melee.mod.crescentaxe.desc=초승달 모양 날이 달린 도끼로, 제대로 맞으면 깊숙이 파고듭니다.
items.weapon.melee.mod.crescentaxe.stats_desc=타격마다 _%1$d%%_ 확률로 _치명타_가 되어 _%2$d%%_ 피해를 줍니다.
items.weapon.melee.mod.crescentaxe.crit=치명타!
items.weapon.melee.mod.crusadermace.name=성전사의 철퇴
items.weapon.melee.mod.crusadermace.desc=잊혀진 기사단이 축복한 날개 철퇴입니다. 죽은 자와 저주받은 자들이 그 손길을 두려워합니다.
items.weapon.melee.mod.crusadermace.stats_desc=_언데드와 악마_에게 피해가 _+%d%%_ 늘어납니다.
items.weapon.melee.mod.runespear.name=룬 창
items.weapon.melee.mod.runespear.desc=창대 전체에 빛나는 룬이 새겨진 창입니다. 창끝이 쇠가 아니라 마법으로 벱니다.
items.weapon.melee.mod.runespear.stats_desc=_2칸_까지 닿고, 타격이 _마법 피해_라서 _방어력을 무시_합니다. 룬검과 같은 비율로 강화됩니다.
items.weapon.melee.mod.giantslayer.name=거인살해자
items.weapon.melee.mod.giantslayer.desc=자기보다 훨씬 큰 것을 쓰러뜨리려고 벼려 낸 거대한 검입니다.
items.weapon.melee.mod.giantslayer.stats_desc=_거대한 적, 미니보스, 보스_에게 피해가 _+%d%%_ 늘어납니다.
items.weapon.melee.mod.abyssscythe.name=심연의 낫
items.weapon.melee.mod.abyssscythe.desc=베어 낸 것의 생명을 들이마시는 검은 낫입니다.
items.weapon.melee.mod.abyssscythe.stats_desc=적을 처치할 때마다 최대 체력의 _%d%%_ + 무기 강화 수치만큼 _체력을 회복_합니다.
items.weapon.melee.mod.heavenlyspear.name=천상의 창
items.weapon.melee.mod.heavenlyspear.desc=찌르기가 첫 번째 적에서 멈추지 않는 빛나는 창입니다.
items.weapon.melee.mod.heavenlyspear.stats_desc=_2칸_까지 닿고, 찌를 때마다 _관통_해서 대상 바로 뒤의 적도 같은 피해를 받습니다.
items.weapon.melee.mod.ruinhammer.name=파멸의 전쟁망치
items.weapon.melee.mod.ruinhammer.desc=내려칠 때마다 땅을 뒤흔드는 거대한 망치입니다.
items.weapon.melee.mod.ruinhammer.stats_desc=타격마다 _충격파_가 퍼져 대상 옆의 적들이 피해의 _%d%%_를 받습니다.
items.weapon.melee.mod.apocalypseweapon.ac_infuse=정수 주입 (%d개)
items.weapon.melee.mod.apocalypseweapon.need_essence=악마의 정수가 %1$d개 필요하다 (현재 %2$d개).
items.weapon.melee.mod.apocalypseweapon.infused=악마의 정수가 %s에 스며들었다. 더 강해졌다!
items.weapon.melee.mod.apocalypseweapon.infuse_info=_6티어 무기._ 강화의 주문서는 통하지 않고, 대신 _악마의 정수_를 먹여서 강화합니다. 다음 강화에는 정수 _%d개_가 필요합니다.
items.weapon.melee.mod.doomblade.name=멸망의 검
items.weapon.melee.mod.doomblade.desc=처음에는 거의 무딘 파멸의 칼날입니다. 적을 벨 때마다 그것을 먹고 자라며, 결코 잊지 않습니다.
items.weapon.melee.mod.doomblade.stats_desc=타격할 때마다 _파멸 에너지_가 영구히 쌓입니다(강화할수록 많이, 보스에게는 5배). 에너지 %3$d마다 최소/최대 피해가 _+1_ 늘어납니다.\n\n파멸 에너지: _%1$d_ (추가 피해: _+%2$d_)
items.weapon.melee.mod.voidscythe.name=공허의 낫
items.weapon.melee.mod.voidscythe.desc=날이 허공 자체에 구멍을 내는 듯한 낫입니다.
items.weapon.melee.mod.voidscythe.stats_desc=타격마다 _%s%%_ 확률로 보스가 아닌 적을 _공허에 가두어_ 즉사시킵니다(강화당 +1%%).
items.weapon.melee.mod.voidscythe.voided=공허!
items.weapon.melee.mod.sunjudgment.name=태양의 심판
items.weapon.melee.mod.sunjudgment.desc=타격할 때마다 빛을 머금는 황금 창입니다. 더는 담을 수 없을 때까지.
items.weapon.melee.mod.sunjudgment.stats_desc=타격마다 _%1$d%%_씩 충전됩니다(강화당 +1%%). _100%%_가 되면 _심판_을 내릴 수 있습니다: 최대 _%3$d칸_ 뻗는 빛줄기가 길 위의 모든 적에게 방어력을 무시하는 _%2$d%%_ 피해를 주고(언데드와 악마에게는 1.5배) 눈을 멀게 합니다.\n\n충전: _%4$d%%_
items.weapon.melee.mod.sunjudgment.ac_smite=심판
items.weapon.melee.mod.sunjudgment.prompt=심판을 내릴 곳을 고르세요
items.weapon.melee.mod.sunjudgment.need_wield=장착해야 심판을 내릴 수 있다.
items.weapon.melee.mod.sunjudgment.not_ready=아직 충전이 다 되지 않았다 (%d%%).
items.weapon.melee.mod.sunjudgment.ready=태양의 심판이 가득 충전되었다!
items.weapon.melee.mod.worldsend.name=세계의 종말
items.weapon.melee.mod.worldsend.desc=세상이 끝나는 날을 위해 만들어졌다는 망치입니다. 내려치는 곳마다 땅이 갈라집니다.
items.weapon.melee.mod.worldsend.stats_desc=타격마다 _지진_이 일어나 대상 주변 _2칸_(5×5) 안의 적들이 피해의 _%d%%_를 받습니다.
items.weapon.melee.mod.apocalypseweapon$recipe.name=6티어 무기 단조
