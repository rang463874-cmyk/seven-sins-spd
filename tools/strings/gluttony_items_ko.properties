items.predatormaw.desc=날카로운 이빨이 촘촘히 박힌 살아있는 아귀입니다. 유물/반지 칸에 착용하는 유물이며, 착용해야 기술을 쓸 수 있습니다.\n\n식탐은 _소모품_으로 성장합니다. 물약을 마시고, 음식과 씨앗을 먹고, 주문서와 룬석을 쓸 때마다 포식 점수가 쌓입니다. 처음 먹어 보는 종류는 _미식 도감_에 등록되며 보너스 점수를 주고, 도감이 일정 수만큼 채워지면 새 능력이 열립니다.\n\n아귀의 기술은 대부분 _포만감_을 대가로 씁니다.
items.predatormaw.ac_feed=포식
items.predatormaw.skill_header=쓸 수 있는 포만감: _%d_
items.predatormaw.ac_bite=물어뜯기
items.predatormaw.bite_prompt=물어뜯을 적을 선택하세요 (인접한 적)
items.predatormaw.bite_target=물어뜯으려면 바로 옆의 적을 골라야 한다.
items.predatormaw.bite_hungry=너무 배가 고파서 그럴 힘이 없다.
items.predatormaw.bite_weak=물어뜯을 힘도 없다.
items.predatormaw.bite_fed=갓 잡은 먹잇감이다! 배가 든든해진다.
items.predatormaw.skill_bite=물어뜯기
items.predatormaw.skill_bite_desc=인접한 적을 _%d%%_ 피해로 물고, 입힌 피해의 _%d%%_만큼 회복합니다. 포만감 대신 _체력_을 소모하며, 물어뜯기로 적을 죽이면 포만감이 _%d_ 찹니다.
items.predatormaw.skill_dash=허기 질주
items.predatormaw.skill_dash_desc=허기를 태워 _%d턴_ 동안 _신속_ 상태가 됩니다.
items.predatormaw.skill_acid=위산 분사
items.predatormaw.skill_acid_desc=주변 _%d칸_ 안에 보이는 모든 적에게 위산을 뿜어 _%d~%d_ 피해를 주고, _약화_와 _불구_를 겁니다.
items.predatormaw.acid_none=위산을 뿜을 적이 주변에 없다.
items.predatormaw.skill_swallow=통째로 삼키기
items.predatormaw.skill_swallow_desc=소모품 하나를 효과 없이 통째로 삼켜 평소의 _%d배_ 포식 점수를 얻습니다. 미확인 물약이나 쓸모없는 주문서를 처리할 때 좋습니다.
items.predatormaw.prompt_swallow=통째로 삼킬 소모품을 고르세요
items.predatormaw.swallowed=%s(을)를 통째로 삼켰다.
items.predatormaw.skill_ruminate=되새김질
items.predatormaw.skill_ruminate_desc=마지막으로 쓴 물약이나 주문서를 게워 내 효과를 _한 번 더_ 발동합니다. 지금 되새길 수 있는 것: _%s_\n\n힘·경험·강화·변환처럼 성장에 관여하는 것은 되새길 수 없습니다.
items.predatormaw.nothing=없음
items.predatormaw.ruminate_none=되새길 것이 없다.
items.predatormaw.ruminated=%s의 맛을 되새겼다.
items.artifacts.sinartifact.effects_maw=레벨 효과: 포만감 비용 _-%d%%_, 포식 점수 _+%d%%_
