items.predatormaw.desc=날카로운 이빨이 촘촘히 박힌 살아있는 아귀입니다. 착용하지 않은 _무기, 방어구, 반지, 아티팩트, 트링킷_을 삼키게 하면 그 힘이 영구히 몸에 스며듭니다.\n\n장비의 _등급_이 높을수록, _강화 수치_가 높을수록 더 많은 점수를 얻습니다. 저주받은 장비는 절반만 흡수됩니다.\n\n포만감을 _60_ 써서 바로 옆의 적을 _물어뜯을_ 수도 있습니다. 물어뜯기는 _150%_ 피해를 주고, 준 피해의 _30%_만큼 체력을 회복합니다. 굶주림 상태에 빠질 만큼 배고프면 쓸 수 없습니다.
items.predatormaw.cant=그건 삼킬 수 없다.
items.predatormaw.ac_bite=물어뜯기
items.predatormaw.bite_prompt=물어뜯을 적을 선택하세요 (인접한 적)
items.predatormaw.bite_target=물어뜯으려면 바로 옆의 적을 골라야 한다.
items.predatormaw.bite_hungry=너무 배가 고파서 물어뜯을 힘이 없다.
