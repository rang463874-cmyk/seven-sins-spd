items.pridecrown.name=crown of hubris
items.pridecrown.desc=A jewelled golden crown. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nThe crown spends _dignity_ to issue orders to lesser beings. Dignity builds while you go unhurt and raises your ranged damage, but shatters the moment you are hit. Whether to hoard it or spend it is up to you. Defeating enemies without taking a hit builds _glory_, making you permanently stronger.
items.pridecrown.ac_command=command
items.pridecrown.prompt=Which order will you give? (charges %d/%d)
items.pridecrown.opt_command=Command (%d charge)
items.pridecrown.opt_duel=Duel (%d charges)
items.pridecrown.opt_procession=Procession (%d charge)
items.pridecrown.opt_decree=Decree (%d charge)
items.pridecrown.prompt_command=Choose an enemy to make kneel
items.pridecrown.skill_disdain=Disdain
items.pridecrown.skill_disdain_desc=Cast a contemptuous glance at a distant enemy, dealing _%d-%d_ damage. Only _half_ of your dignity bonus applies. Enemies felled without ever touching you count as _flawless victories_.
items.pridecrown.skill_repel=Kneel Back
items.pridecrown.skill_repel_desc=A royal rebuke: every enemy within _%d tiles_ is thrown _%d tiles_ away from you (slamming into walls hurts) and staggered for 2 turns. Keeps the rabble at a respectful distance.
items.pridecrown.repel_none=No one dares to stand that close.
items.pridecrown.prompt_disdain=Choose an enemy to scorn
items.pridecrown.prompt_duel=Choose an enemy to challenge
items.pridecrown.prompt_procession=Choose where to proceed (up to %d tiles)
items.pridecrown.prompt_decree=Choose an enemy to forbid from attacking
items.pridecrown.no_target=There is no target there.
items.pridecrown.defiant=This one will not bow to your command.
items.pridecrown.bad_cell=You can't proceed there.
items.pridecrown.vassal=The %s kneels and swears loyalty!
items.pridecrown.duel=You challenged the %s to a duel!
items.armor.pridearmor.name=mantle of pride
items.armor.pridearmor.desc=A lavish mantle trimmed with ermine. It raises its wearer's dignity to new heights.
items.pridecrown.skill_header=Dignity %d / %d
items.pridecrown.skill_command=Command
items.pridecrown.skill_command_desc=Paralyzes one enemy for _%d turns_. A Monarch takes badly wounded enemies as vassals instead. Doesn't work on bosses.
items.pridecrown.skill_duel=Duel
items.pridecrown.skill_duel_desc=Duels one enemy for _12 turns_. Only your opponent can hurt you, and you deal 20% more damage to it.
items.pridecrown.skill_procession=Procession
items.pridecrown.skill_procession_desc=Strides majestically to an empty tile up to _%d tiles_ away.
items.pridecrown.skill_decree=Decree
items.pridecrown.skill_decree_desc=Nullifies one enemy's next _%d_ attacks.
items.pridecrown.skill_effigy=Effigy of Pride
items.pridecrown.skill_effigy_desc=Paragon only. Raises a golden statue (_%d HP_, _%d turns_) on an empty tile within 4 tiles. Every enemy within _%d tiles_ of it attacks the statue instead of you; it doesn't count as an ally, and enemies that hit it don't become insolent. Only one statue stands at a time.
items.pridecrown.skill_replicate=Royal Grant
items.pridecrown.skill_replicate_desc=By royal decree, a scroll of upgrade, potion of strength or scroll of enchantment is granted again: you gain a copy. Costs _10 dignity_. No limit on uses.
items.pridecrown.prompt_effigy=Choose an empty tile within %d tiles for your statue
