items.pridecrown.name=crown of hubris
items.pridecrown.desc=A jewelled golden crown. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nIts _charges_ let you issue orders to lesser beings. Charges refill over time. Defeating enemies without taking a hit builds _glory_, making you permanently stronger.
