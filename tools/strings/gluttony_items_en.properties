items.predatormaw.desc=A living maw lined with sharp teeth. Feed it unequipped _weapons, armor, rings, artifacts or trinkets_ and their power permanently seeps into you.\n\nHigher _tier_ and _upgrades_ give more points. Cursed gear is only half absorbed.\n\nIt can also spend _60 satiety_ to _bite_ an adjacent enemy for _150%_ damage, healing _30%_ of the damage dealt. It can't be used if it would leave you starving.
items.predatormaw.cant=You can't devour that.
items.predatormaw.ac_bite=bite
items.predatormaw.bite_prompt=Choose an adjacent enemy to bite
items.predatormaw.bite_target=You need to pick an enemy right next to you to bite.
items.predatormaw.bite_hungry=You're too hungry to muster a bite.
