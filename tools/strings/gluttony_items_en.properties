items.predatormaw.desc=A living maw lined with razor-sharp teeth. It's worn in an artifact/ring slot, and its skills only work while it's worn.\n\nThe Glutton grows by _consuming_. Every potion drunk, every food or seed eaten and every scroll or runestone used adds devour points. A kind you've never tasted goes into your _gourmet codex_ for bonus points, and filling the codex unlocks new perks.\n\nMost of the maw's skills are paid for with _satiety_.
items.predatormaw.ac_feed=FEAST
items.predatormaw.ac_codex=CODEX
items.predatormaw.codex_title=Gourmet codex (%d/%d)
items.predatormaw.skill_header=Satiety to spend: _%d_
items.predatormaw.ac_bite=BITE
items.predatormaw.bite_prompt=Choose an adjacent enemy to bite
items.predatormaw.bite_target=You need to pick an enemy right next to you.
items.predatormaw.bite_hungry=You're too hungry to do that.
items.predatormaw.bite_weak=You are too weak to bite.
items.predatormaw.bite_fed=A fresh kill! Your belly fills up.
items.predatormaw.skill_bite=Bite
items.predatormaw.skill_bite_desc=Bite an adjacent enemy for _%d%%_ damage and heal _%d%%_ of the damage dealt. Costs _health_ instead of satiety, and killing the enemy with it fills _%d satiety_.
items.predatormaw.skill_dash=Hunger Dash
items.predatormaw.skill_dash_desc=Burn your hunger to gain _haste_ for _%d turns_.
items.predatormaw.skill_acid=Acid Spray
items.predatormaw.skill_acid_desc=Spew stomach acid on every visible enemy within _%d tiles_, dealing _%d-%d_ damage and inflicting _weakness_ and _cripple_.
items.predatormaw.acid_none=There are no enemies nearby to spray.
items.predatormaw.skill_swallow=Swallow Whole
items.predatormaw.skill_swallow_desc=Swallow one consumable whole, without its effect, for _%dx_ the usual devour points. Handy for unknown potions and useless scrolls.
items.predatormaw.prompt_swallow=Choose a consumable to swallow whole
items.predatormaw.swallowed=You swallowed %s whole.
items.predatormaw.skill_ruminate=Ruminate
items.predatormaw.skill_ruminate_desc=Bring up the last potion or scroll you used and trigger its effect _once more_. Ready to ruminate: _%s_\n\nThings tied to growth (strength, experience, upgrades, transmutation...) can't be ruminated; use _Regurgitate Growth_ for those.
items.predatormaw.skill_regurgitate=Regurgitate
items.predatormaw.skill_regurgitate_desc=Spit the last potion you drank back up and _hurl it_ at a tile: it shatters there as if thrown. Harmful potions make fine weapons. Ready to spit: _%s_
items.predatormaw.prompt_regurgitate=Choose where to spit it
items.predatormaw.regurgitated=You spit up a %s!
items.predatormaw.skill_replicate=Regurgitate Growth
items.predatormaw.skill_replicate_desc=Swallow a scroll of upgrade, potion of strength or scroll of enchantment and bring it back up _twice over_: you keep the original and gain a copy. Costs a whole stomach's worth of satiety. No limit on uses.
items.predatormaw.nothing=nothing
items.predatormaw.ruminate_none=There's nothing to ruminate.
items.predatormaw.ruminate_debt=Your stomach caves in on itself! Hunger debt: %d
items.predatormaw.ruminated=You savor %s once more.
