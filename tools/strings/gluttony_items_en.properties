items.predatormaw.desc=A living maw lined with sharp teeth. It is worn in an artifact or ring slot, and its skills only work while it is worn. Feed it unequipped _weapons, armor, rings, artifacts or trinkets_ and their power permanently seeps into you.\n\nHigher _tier_ and _upgrades_ give more points. Cursed gear is only half absorbed.\n\nIt can also spend _60 satiety_ to _bite_ an adjacent enemy for _150%_ damage, healing _30%_ of the damage dealt. It can't be used if it would leave you starving.
items.predatormaw.cant=You can't devour that.
items.predatormaw.ac_bite=bite
items.predatormaw.bite_prompt=Choose an adjacent enemy to bite
items.predatormaw.bite_target=You need to pick an enemy right next to you to bite.
items.predatormaw.bite_hungry=You're too hungry to muster a bite.
items.predatormaw.skill_devour=Devour
items.predatormaw.skill_devour_desc=Devours equipment for permanent stats.
items.predatormaw.skill_bite=Bite
items.predatormaw.skill_bite_desc=Spends _%d_ satiety to bite an adjacent enemy for _%d%%_ damage, healing _%d%%_ of the damage dealt.
