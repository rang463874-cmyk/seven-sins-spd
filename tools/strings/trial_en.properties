actors.mobs.sinshadow.name=shadow of %s
actors.mobs.sinshadow.desc=Your own sin given shape: a black shadow that looks exactly like you and mimics the powers you use. Overcome it and your signature artifact will awaken once more.\n\nOnce you step into its sanctum the doorway closes, and the shadow never leaves the sanctum.
actors.mobs.sinshadow.desc_skills_gluttony=It uses _Devour_ (cross lines, heals on a hit) and _Acid_ (scattered, caustic ooze).
actors.mobs.sinshadow.desc_skills_greed=It uses _Coin Shower_ (scattered) and _Levy_ (an X, steals gold).
actors.mobs.sinshadow.desc_skills_wrath=It uses _Wrathful Slam_ (a ring around it, cripples) and _Fury_ (cross lines, vulnerable).
actors.mobs.sinshadow.desc_skills_pride=It uses _Dagger Storm_ (long cross lines) and _Kneel_ (a checkerboard, vertigo).
actors.mobs.sinshadow.desc_skills_lust=It uses _Kiss_ (an X, weakens, heals on a hit) and _Alluring Scent_ (scattered, charms).
actors.mobs.sinshadow.desc_skills_envy=It uses _Mirror Curse_ (cross lines, hex) and _Spite_ (a checkerboard, vulnerable).
actors.mobs.sinshadow.desc_skills_sloth=It uses _Lullaby_ (a far ring, drowsy) and _Nightmare_ (scattered, slow).
actors.mobs.sinshadow.desc_skills_solomon=It uses _Black Flame_ (an X, burning) and _Binding Seal_ (a checkerboard, roots).
actors.mobs.sinshadow.arrives=Your sin seethes. The %s has come for you!
actors.mobs.sinshadow.awaits=Your sin seethes. Somewhere on this floor, in a dark sanctum, the %s waits for you. Overcome it and your signature artifact will awaken once more.
actors.mobs.sinshadow.sealed=The shadow swallows the doorway. You can't leave until you overcome your own sin!
actors.mobs.sinshadow.unsealed=The shadow covering the doorway lifts.
actors.mobs.sinshadow.notice=I am you. Everything you have looked away from.
actors.mobs.sinshadow.death=Yes... now accept me...
actors.mobs.sinshadow.stolen=-%d gold
