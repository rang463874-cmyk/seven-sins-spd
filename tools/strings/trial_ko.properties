actors.mobs.sinshadow.name=%s의 그림자
actors.mobs.sinshadow.desc=당신의 죄가 그대로 형체를 얻은 검은 그림자입니다. 당신과 똑같이 생겼고, 당신이 쓰는 힘을 흉내 냅니다. 이 그림자를 이겨 내면 고유 유물이 한 번 더 깨어납니다.\n\n성소에 들어서면 출입구가 막히고, 그림자는 성소 밖으로 나오지 않습니다.
actors.mobs.sinshadow.desc_skills_gluttony=_집어삼키기_(십자 줄, 맞힌 만큼 회복)와 _위산_(흩뿌림, 산성 점액)을 씁니다.
actors.mobs.sinshadow.desc_skills_greed=_금화 세례_(흩뿌림)와 _징수_(X자, 골드를 빼앗음)를 씁니다.
actors.mobs.sinshadow.desc_skills_wrath=_분노의 강타_(주변 고리, 불구)와 _격노_(십자 줄, 취약)를 씁니다.
actors.mobs.sinshadow.desc_skills_pride=_단검 세례_(긴 십자 줄)와 _무릎 꿇어라_(체크무늬, 현기증)를 씁니다.
actors.mobs.sinshadow.desc_skills_lust=_입맞춤_(X자, 약화, 맞힌 만큼 회복)과 _유혹의 향_(흩뿌림, 매혹)을 씁니다.
actors.mobs.sinshadow.desc_skills_envy=_거울 저주_(십자 줄, 저주)와 _시샘_(체크무늬, 취약)을 씁니다.
actors.mobs.sinshadow.desc_skills_sloth=_자장가_(먼 고리, 졸음)와 _악몽_(흩뿌림, 둔화)을 씁니다.
actors.mobs.sinshadow.desc_skills_solomon=_검은 불꽃_(X자, 화상)과 _속박의 인_(체크무늬, 속박)을 씁니다.
actors.mobs.sinshadow.arrives=당신의 죄가 들끓습니다. %s이(가) 당신을 찾아왔습니다!
actors.mobs.sinshadow.awaits=당신의 죄가 들끓습니다. 이 층 어딘가의 어두운 성소에서 %s이(가) 당신을 기다립니다. 이겨 내면 고유 유물이 한 번 더 깨어날 것입니다.
actors.mobs.sinshadow.sealed=그림자가 출입구를 삼켜 버립니다. 자신의 죄를 이겨 내기 전에는 나갈 수 없습니다!
actors.mobs.sinshadow.unsealed=출입구를 덮고 있던 그림자가 걷힙니다.
actors.mobs.sinshadow.notice=나는 너다. 네가 외면해 온 모든 것이다.
actors.mobs.sinshadow.death=그래... 이제 나를 받아들여라...
actors.mobs.sinshadow.stolen=-%d 골드
