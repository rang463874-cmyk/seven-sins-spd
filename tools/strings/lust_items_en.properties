items.perfume.name=alluring perfume
items.perfume.desc=A red bottle of sweet, dizzying perfume. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nIts skills are paid for with _your own HP_ instead of charges. Drink the blood of the charmed to win it back.
