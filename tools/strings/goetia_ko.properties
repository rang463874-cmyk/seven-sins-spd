actors.mobs.goetia.goetiafiend.desc=솔로몬의 소열쇠에 기록된 %1$d번째 악마, %2$s _%3$s_입니다. 솔로몬 왕이 봉인했다는 72악마 중 하나가 던전을 떠돌고 있습니다. 주변 몬스터보다 훨씬 강합니다. 쓰러뜨리면 악마 도감(정수 가방의 _솔로몬의 소열쇠_)에 기록되고 _악마의 정수_를 남깁니다.
