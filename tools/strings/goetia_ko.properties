actors.mobs.goetia.goetialord.desc=솔로몬의 소열쇠에 기록된 %1$d번째 악마, 지옥의 왕 중 하나인 %2$s _%3$s_입니다. 악마의 정수로 마법진에서 불러냈습니다. 주위에 지옥불을 퍼붓고, 권능의 창을 내지르고, 당신 쪽으로 밀려오는 유황의 파도를 보내고, 하급 악마들을 부르며, 큰 상처를 입으면 당신 쪽으로 부채꼴의 파멸을 휩쓸어 보냅니다.
