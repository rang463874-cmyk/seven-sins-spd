actors.mobs.virtues.archangelboss.humility_notice=한때 나는 샛별을 떨어뜨렸다. 오늘은 너를 떨어뜨리겠다.
actors.mobs.virtues.archangelboss.humility_notice_own=왕관이 새 주인을 찾았군. 첫 번째 주인처럼 떨어지게 될 것이다.
actors.mobs.virtues.archangelboss.humility_phase=누가 신과 같은가? 너는 아니다!
actors.mobs.virtues.archangelboss.humility_phase_own=고개를 숙여라, 작은 왕이여!
actors.mobs.virtues.archangelboss.humility_death=부적은... 네가 짊어질 몫이다... 겸허히...
actors.mobs.virtues.archangelboss.humility_death_own=교만한 자도... 언젠가는 무릎 꿇는 법을 배우겠지...
actors.mobs.virtues.archangelboss.sig_humility=_고유 기술, 낮추는 빛:_ 넓은 십자 범위의 빛이 쇠약하게 만들고 모든 축복을 벗겨 냅니다.
actors.mobs.virtues.archangelboss.skill_humility=낮추는 빛!
actors.mobs.virtues.archangelboss.charity_notice=네가 가진 모든 것은 받은 것이다. 거두러 왔다.
actors.mobs.virtues.archangelboss.charity_notice_own=금화 더미 위의 용이로구나. 그 아래의 너는 얼마나 작은지.
actors.mobs.virtues.archangelboss.charity_phase=주어라, 그리하면 받으리라!
actors.mobs.virtues.archangelboss.charity_phase_own=손을 펴라!
actors.mobs.virtues.archangelboss.charity_death=나의 패배를... 네게 주마...
actors.mobs.virtues.archangelboss.charity_death_own=그럼 전부 가져라... 그리고 영원히 가난하라...
actors.mobs.virtues.archangelboss.sig_charity=_고유 기술, 대십일조:_ 스스로를 치유하고 당신의 칸과 그 주변 곳곳에 빛을 쏟아 금화의 5분의 1을 가져갑니다.
actors.mobs.virtues.archangelboss.skill_charity=대십일조!
actors.mobs.virtues.archangelboss.chastity_notice=소식을 전하러 왔다, 죄인이여. 너의 여정은 여기서 끝난다.
actors.mobs.virtues.archangelboss.chastity_notice_own=너의 향기는 하늘에 닿지 않는다.
actors.mobs.virtues.archangelboss.chastity_phase=순결한 빛을 보라!
actors.mobs.virtues.archangelboss.chastity_phase_own=나는 너에게 흔들리지 않는다!
actors.mobs.virtues.archangelboss.chastity_death=나의 소식은... 닿지 않았구나...
actors.mobs.virtues.archangelboss.chastity_death_own=지금도... 나는 욕망을 느끼지 않는다...
actors.mobs.virtues.archangelboss.sig_chastity=_고유 기술, 순결한 광휘:_ 주변 2칸 전체를 정화하여 실명시키고 축복을 벗겨 냅니다.
actors.mobs.virtues.archangelboss.skill_chastity=순결한 광휘!
actors.mobs.virtues.archangelboss.patience_notice=태초부터 문을 지켜 왔다. 너의 끝도 기다릴 수 있다.
actors.mobs.virtues.archangelboss.patience_notice_own=원하는 만큼 뜨겁게 타라. 신의 불꽃은 더 오래 탄다.
actors.mobs.virtues.archangelboss.patience_phase=나는 아직 서 있다.
actors.mobs.virtues.archangelboss.patience_phase_own=너의 분노는 내 불꽃을 키울 뿐이다!
actors.mobs.virtues.archangelboss.patience_death=나의 파수가... 마침내 끝나는구나...
actors.mobs.virtues.archangelboss.patience_death_own=너의 분노가... 하늘마저 넘어섰구나...
actors.mobs.virtues.archangelboss.sig_patience=_고유 기술, 불의 벽:_ 보호막을 얻고 주변 2칸의 모든 것을 날려 보냅니다.
actors.mobs.virtues.archangelboss.skill_patience=불의 벽!
actors.mobs.virtues.archangelboss.temperance_notice=나는 병든 자와 다친 자를 고친다. 너는 모든 것에서 낫게 해 주마.
actors.mobs.virtues.archangelboss.temperance_notice_own=던전을 통째로 먹어 치웠구나. 이제 금식할 차례다.
actors.mobs.virtues.archangelboss.temperance_phase=이제 그만!
actors.mobs.virtues.archangelboss.temperance_phase_own=더 이상의 만찬은 없다!
actors.mobs.virtues.archangelboss.temperance_death=너의 굶주림이... 낫기를...
actors.mobs.virtues.archangelboss.temperance_death_own=천사마저... 삼키려 들다니...
actors.mobs.virtues.archangelboss.sig_temperance=_고유 기술, 대금식:_ 넓은 십자 범위가 허기를 150 비우고 다리를 절게 합니다.
actors.mobs.virtues.archangelboss.skill_temperance=대금식!
actors.mobs.virtues.archangelboss.kindness_notice=자비를 베풀러 왔다. 자비처럼 느껴지지는 않겠지만.
actors.mobs.virtues.archangelboss.kindness_notice_own=모두가 가진 것을 원하는구나. 네가 받아야 할 것을 주마.
actors.mobs.virtues.archangelboss.kindness_phase=자비는 약함이 아니다!
actors.mobs.virtues.archangelboss.kindness_phase_own=나는 너를 시기하지 않는다. 가엾게 여길 뿐!
actors.mobs.virtues.archangelboss.kindness_death=평안히 가거라...
actors.mobs.virtues.archangelboss.kindness_death_own=나는 네가 가진 것을... 원한 적 없다...
actors.mobs.virtues.archangelboss.sig_kindness=_고유 기술, 자비로운 포옹:_ 스스로를 치유하고 당신 주변을 체스판 모양으로 속박합니다(옆으로 곧장 한 칸 피하면 안전합니다).
actors.mobs.virtues.archangelboss.skill_kindness=자비로운 포옹!
actors.mobs.virtues.archangelboss.diligence_notice=창조 이래 한 번도 눈을 감지 않았다. 네가 한 모든 일을 보았다.
actors.mobs.virtues.archangelboss.diligence_notice_own=일어나라. 너의 긴 꿈은 여기서 끝난다.
actors.mobs.virtues.archangelboss.diligence_phase=나는 지치지 않는다!
actors.mobs.virtues.archangelboss.diligence_phase_own=너에게 더 이상의 잠은 없다!
actors.mobs.virtues.archangelboss.diligence_death=드디어... 눈을 감을 수 있겠구나...
actors.mobs.virtues.archangelboss.diligence_death_own=잠만 자던 자에게... 지다니...
actors.mobs.virtues.archangelboss.sig_diligence=_고유 기술, 멈추지 않는 돌진:_ 당신을 꿰뚫고 돌진해 다리를 절게 하고, 스스로 가속합니다.
actors.mobs.virtues.archangelboss.skill_diligence=멈추지 않는 돌진!
actors.mobs.virtues.archangelboss.name=대천사 %s
actors.mobs.virtues.archangelboss.desc=%s, %s의 대천사가 당신과 옌더의 부적 사이에 내려섰습니다. 대천사가 서 있는 한 부적을 손에 넣을 수 없습니다.\n\n기술을 쓰기 전에 표식을 띄웁니다. _심판_(당신의 가로·세로줄을 따라 십자로 내리는 빛, 실명), _성창_(긴 직선), 그리고 고유 기술이 있습니다. 체력이 3분의 2와 3분의 1이 될 때마다 _승천_하여 성스러운 보호막을 얻고, 두 번째 승천 뒤에는 더 빠르게 싸웁니다.
actors.mobs.virtues.archangelboss.skill_judgment=심판!
actors.mobs.virtues.archangelboss.skill_lance=성창!
actors.mobs.virtues.archangelboss.amulet_guarded=성스러운 기운이 부적에 손대지 못하게 막습니다. 대천사를 먼저 쓰러뜨려야 합니다.
actors.mobs.virtues.archangelboss.amulet_free=성스러운 기운이 사라집니다. 이제 부적을 가질 수 있습니다.
actors.mobs.virtues.virtuechampion.name_humility=겸손의 성녀
actors.mobs.virtues.virtuechampion.desc_humility=한 번도 누군가를 내려다본 적 없는, 옅은 금빛 옷을 입은 성녀입니다. 낮추는 일격은 교만한 자의 힘을 빼앗고, 빛의 베일이 공격을 막아 냅니다.
actors.mobs.virtues.virtuechampion.humility_notice=무릎을 꿇으세요, 죄인이여. 제게가 아니라, 진실 앞에.
actors.mobs.virtues.virtuechampion.humility_notice_own=아무도 씌워 주지 않은 왕관을 쓰고 계시군요. 그것을 벗기러 왔습니다.
actors.mobs.virtues.virtuechampion.humility_death=이것마저도... 겸허히 받아들이겠습니다...
actors.mobs.virtues.virtuechampion.humility_death_own=당신의 교만이 이겼군요... 이번만은. 결국엔 언제나 무너지지만.
actors.mobs.virtues.virtuechampion.name_charity=자선의 성녀
actors.mobs.virtues.virtuechampion.desc_charity=모든 것을 나눠 주는 성녀입니다. 괴물에게까지 자비를 베풉니다. 주변의 모든 적을 치유하고, 십일조로 당신의 금화 10분의 1을 가난한 이들에게 가져갑니다.
actors.mobs.virtues.virtuechampion.charity_notice=당신이 움켜쥔 것을, 제가 나눠 드리겠습니다.
actors.mobs.virtues.virtuechampion.charity_notice_own=그 많은 금화 중 한 닢도 베푼 적이 없으시군요. 나누는 법을 가르쳐 드리지요.
actors.mobs.virtues.virtuechampion.charity_death=가져가세요... 제가 가진 모든 것을...
actors.mobs.virtues.virtuechampion.charity_death_own=제 죽음마저... 당신께 드립니다...
actors.mobs.virtues.virtuechampion.name_chastity=순결의 성녀
actors.mobs.virtues.virtuechampion.desc_chastity=티 없이 새하얀 옷의 성녀입니다. 어떤 매혹도 그녀의 마음에 닿지 못합니다. 정화의 빛은 지나는 길의 모든 축복을 벗겨 내고, 후광은 가까이 온 자의 눈을 멀게 합니다.
actors.mobs.virtues.virtuechampion.chastity_notice=당신의 죄가 공기마저 더럽히는군요.
actors.mobs.virtues.virtuechampion.chastity_notice_own=당신의 달콤한 말은 제게 통하지 않습니다. 단 한 마디도.
actors.mobs.virtues.virtuechampion.chastity_death=저는... 순결한 채로...
actors.mobs.virtues.virtuechampion.chastity_death_own=지금도... 당신에게 아무것도 느끼지 않아요...
actors.mobs.virtues.virtuechampion.name_patience=인내의 성기사
actors.mobs.virtues.virtuechampion.desc_patience=거대한 탑방패 뒤의 성기사입니다. 기다리고, 견디고, 준비가 되면 주변의 모든 것을 되받아칩니다.
actors.mobs.virtues.virtuechampion.patience_notice=오래도록 당신을 기다렸습니다.
actors.mobs.virtues.virtuechampion.patience_notice_own=마음껏 분노하십시오. 저는 여전히 서 있을 겁니다.
actors.mobs.virtues.virtuechampion.patience_death=저의 파수는... 여기까지...
actors.mobs.virtues.virtuechampion.patience_death_own=당신의 분노가... 제 인내를 넘었군요...
actors.mobs.virtues.virtuechampion.name_temperance=절제의 성기사
actors.mobs.virtues.virtuechampion.desc_temperance=하루 한 끼만 먹는 마른 성기사입니다. 금식의 일격은 배 속을 비우고, 절제된 일격은 다리를 절게 합니다.
actors.mobs.virtues.virtuechampion.temperance_notice=충분합니다. 당신은 충분히 가졌어요.
actors.mobs.virtues.virtuechampion.temperance_notice_own=끝없이 삼키는군요. 금식을 시키러 왔습니다.
actors.mobs.virtues.virtuechampion.temperance_death=언제나... 적당히...
actors.mobs.virtues.virtuechampion.temperance_death_own=당신도... 언젠가는 배가 부르겠지요...
actors.mobs.virtues.virtuechampion.name_kindness=친절의 성녀
actors.mobs.virtues.virtuechampion.desc_kindness=싸우면서도 미소를 잃지 않는 다정한 성녀입니다. 스스로의 상처를 치유하고 축복하며, 따뜻한 포옹으로 당신을 그 자리에 묶어 둡니다.
actors.mobs.virtues.virtuechampion.kindness_notice=당신을 다치게 하고 싶지 않아요. 하지만 멈추게 할 거예요.
actors.mobs.virtues.virtuechampion.kindness_notice_own=왜 남의 것을 원하나요? 대신 당신에게 필요한 걸 드릴게요.
actors.mobs.virtues.virtuechampion.kindness_death=당신이... 평안을 찾기를...
actors.mobs.virtues.virtuechampion.kindness_death_own=저는 당신을 부러워한 적 없어요... 지금도...
actors.mobs.virtues.virtuechampion.name_diligence=근면의 성기사
actors.mobs.virtues.virtuechampion.desc_diligence=수년째 잠들지 않은 성기사입니다. 무엇도 그를 재우거나 멈춰 세우지 못합니다. 당신을 꿰뚫고 돌진하며, 필요하면 걸음을 재촉합니다.
actors.mobs.virtues.virtuechampion.diligence_notice=악인에게 휴식은 없습니다. 저에게도.
actors.mobs.virtues.virtuechampion.diligence_notice_own=일어나십시오, 게으름뱅이여. 심판의 때가 왔습니다.
actors.mobs.virtues.virtuechampion.diligence_death=드디어... 쉴 수 있겠군요...
actors.mobs.virtues.virtuechampion.diligence_death_own=잠만 자고... 이겼다고...? 믿을 수 없군...
actors.mobs.virtues.virtuechampion.desc_common=당신을 심판하러 온 칠미덕의 대리자입니다. 사냥하는 층에 걸맞게 강해지며, 기술을 쓰기 전에 표식을 띄웁니다(표시된 칸에서 벗어나세요). 쓰러뜨리면 죄악의 정수 2개와 축복받은 장비를 얻습니다.
actors.mobs.virtues.virtuechampion.desc_nemesis=_천적:_ 이 미덕은 당신의 죄와 정반대입니다. 서로에게 주는 피해가 _25% 증가_하고, 쓰러뜨리면 _죄악 50_과 _강화 주문서_를 얻습니다.
actors.mobs.virtues.virtuechampion.arrives=성스러운 기척이 느껴집니다. %s이(가) 당신을 심판하러 이 층에 왔습니다!
actors.mobs.virtues.virtuechampion.arrives_nemesis=당신의 죄가 떨립니다. 천적인 %s이(가) 당신을 찾아왔습니다!
actors.mobs.virtues.virtuechampion.awaits=성스러운 기척이 느껴집니다. %s이(가) 이 층의 성소에서 당신을 기다리고 있습니다.
actors.mobs.virtues.virtuechampion.awaits_nemesis=당신의 죄가 떨립니다. 천적인 %s이(가) 이 층의 성소에서 당신을 기다리고 있습니다!
actors.mobs.virtues.virtuechampion.sealed=빛이 출입구를 뒤덮더니 돌처럼 굳어 버립니다. 심판이 끝나기 전에는 나갈 수 없습니다!
actors.mobs.virtues.virtuechampion.unsealed=출입구를 막고 있던 빛이 사라집니다.
actors.mobs.virtues.virtuechampion.nemesis_slain=천적을 쓰러뜨렸습니다! 당신의 죄가 더욱 깊어집니다.
actors.mobs.virtues.virtuechampion.tithe_taken=성녀가 십일조로 금화 %d개를 가져갔습니다.
actors.mobs.virtues.humilitychampion.skill_humble=낮아지세요!
actors.mobs.virtues.humilitychampion.skill_veil=겸손의 베일!
actors.mobs.virtues.charitychampion.skill_alms=모두에게 자비를!
actors.mobs.virtues.charitychampion.skill_tithe=십일조를!
actors.mobs.virtues.chastitychampion.skill_purify=정화되세요!
actors.mobs.virtues.chastitychampion.skill_halo=성스러운 후광!
actors.mobs.virtues.patiencechampion.skill_endure=견디리라!
actors.mobs.virtues.patiencechampion.skill_retribution=응보!
actors.mobs.virtues.temperancechampion.skill_fast=금식!
actors.mobs.virtues.temperancechampion.skill_measure=절제의 일격!
actors.mobs.virtues.kindnesschampion.skill_mercy=자비를!
actors.mobs.virtues.kindnesschampion.skill_embrace=다정한 포옹!
actors.mobs.virtues.diligencechampion.skill_charge=전진!
actors.mobs.virtues.diligencechampion.skill_vigil=영원한 파수!
actors.mobs.virtues.archangelboss.heaven_opens=앰뮬릿 너머의 바닥이 빛으로 갈라지며, 천상으로 내려가는 계단이 드러납니다.
actors.mobs.heaven.believer.name=신도
actors.mobs.heaven.believer.desc=소박한 흰 옷을 입은 천상의 신실한 영혼입니다. 신도들은 작은 무리를 지어 다니며, 하나가 쓰러지면 그 단말마가 가까이 있는 다른 적들을 곧장 당신에게 불러들입니다.
actors.mobs.heaven.believer.death_cry=신도의 단말마가 신자들을 당신에게 불러 모읍니다!
actors.mobs.heaven.priest.name=사제
actors.mobs.heaven.priest.desc=언제나 무리와 함께 다니는 천상의 사제입니다. 주변 몬스터의 상처를 치유하고 빛의 방어막을 둘러 줍니다. 싸움 중에 홀로 남으면 스스로의 목숨을 제물로 바치고, 그 자리에 하급 천사가 강림합니다.
actors.mobs.heaven.priest.bless=사제의 기도가 무리를 치유하고 방어막을 둘러 줍니다!
actors.mobs.heaven.priest.sacrifice=홀로 남은 사제가 스스로를 제물로 바치자... 하급 천사가 강림합니다!
actors.mobs.heaven.lesserangel.name=하급 천사
actors.mobs.heaven.lesserangel.desc=사제의 희생으로 불려 내려온 작은 천사입니다. 나타난 자리에서 움직이지 못하지만, 던지는 흰 창은 제법 아픕니다. 처음에는 광휘가 몸을 지켜 주지만 매 턴 조금씩 깎여 나가고, 머지않아 빛 속으로 사라집니다.
actors.mobs.heaven.seraph.name=치천사
actors.mobs.heaven.seraph.desc=성스러운 불길에 휩싸인 거대한 치천사로, 네 칸을 차지할 만큼 큽니다. 자신이 지키는 방을 결코 떠나지 않습니다. 곁에 서 있는 자는 매 턴 불타고, 창은 두 칸 떨어진 곳까지 닿으며, 한 번은 빛의 사슬로 적을 끌어당길 수 있습니다.
actors.mobs.heaven.seraph.chain=이리 와서 심판을 받으라!
actors.mobs.heaven.seraph.burned=치천사의 성스러운 불길에 타 버렸습니다...
actors.mobs.heaven.seraphpart.name=치천사
actors.mobs.heaven.seraphpart.desc=치천사의 거대한 몸의 일부입니다.
actors.mobs.heaven.holygiant.name=신성 거인
actors.mobs.heaven.holygiant.desc=허리까지 공허 위로 솟아오른 천상의 거인으로, 번개가 몸을 휘감고 있습니다. 몸통은 상처 입힐 수 없지만, 내려치는 팔은 공격할 수 있습니다. 두 팔을 모두 부수면 거인을 쓰러뜨릴 수 있습니다.\n\n당신이 있는 쪽으로 팔 전체를 내려쳐(난간에서부터 너비 3칸, 길이 8칸) 몇 턴 동안 그대로 놓아두고, 투기장 전체로 갈라져 퍼지며 마비시키는 번개를 부르고, 큰 상처를 입으면 보이는 모든 곳을 내리치는 심판을 준비합니다. 그때는 벽 뒤로 숨으세요.
actors.mobs.heaven.holygiant.notice=죄인의 발걸음으로 천상을 걷는 자는 누구냐?
actors.mobs.heaven.holygiant.skill_slam=팔 내려치기!
actors.mobs.heaven.holygiant.skill_bolt=갈래 번개!
actors.mobs.heaven.holygiant.immune=면역
actors.mobs.heaven.holygiant.arm_lost=내 팔이...!
actors.mobs.heaven.holygiant.judgment_start=천상의 심판 앞에 무릎 꿇어라!
actors.mobs.heaven.holygiant.judgment_warn=신성 거인이 층 전체를 내리칠 심판의 빛을 모읍니다! 벽 뒤로 숨으세요!
actors.mobs.heaven.holygiant.judgment_count=심판: %d
actors.mobs.heaven.holygiant.judgment_release=심판을 받아라!
actors.mobs.heaven.holygiant.judgment_kill=신성 거인의 심판에 쓰러졌습니다...
actors.mobs.heaven.holygiant.collapse=천상은... 무너지지... 않는다...
actors.mobs.heaven.holygiant.gem_appears=거인이 무너지며 홀 한가운데에 푸른 보석이 떨어집니다. 가장자리에서 천상의 군세가 몰려옵니다. 보석에 닿으세요!
actors.mobs.heaven.holygiant.death=...그리하라. 내 심장을 가져가라, 죄인이여.
actors.mobs.heaven.giantfist.name_left=거인의 왼팔
actors.mobs.heaven.giantfist.name_right=거인의 오른팔
actors.mobs.heaven.giantfist.desc=내려친 자리에 길게 놓여 있는 신성 거인의 팔입니다. 끝에 주먹이 있고, 몇 턴 뒤 다시 들어 올려집니다. 팔 어디를 공격해도 거인에게 그대로 들어가고, 충분히 공격하면 팔이 부서집니다.
levels.holygiantlevel.void_name=공허
levels.holygiantlevel.void_desc=천상의 끝 너머에 펼쳐진 어두운 공허입니다. 저 아래에서 거대한 무언가가 꿈틀거립니다.
