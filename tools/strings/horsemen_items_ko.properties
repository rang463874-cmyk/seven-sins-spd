items.artifacts.horsemanartifact.ac_use=사용
items.artifacts.horsemanartifact.cursed=저주받은 유물의 힘을 끌어낼 수 없다.
items.artifacts.horsemanartifact.no_charge=유물이 아직 충전되지 않았다.
items.artifacts.horsemanartifact.full=기사의 유물이 힘으로 가득 찼다!
items.artifacts.horsemanartifact.levelup=%s의 힘이 더 강해졌다!
items.artifacts.conquestcrown.name=정복의 왕관
items.artifacts.conquestcrown.desc=흰 말을 탄 첫째 기사의 순백 왕관입니다. 쓰는 이에게 굴복을 강요하는 위엄이 서려 있습니다.\n\n충전이 가득 차면, 크게 다친 적 하나를 _굴복_시켜 잠시 아군으로 부릴 수 있습니다. 굴복한 적은 즉시 경험치와 전리품을 주고, 시간이 다 되면 쓰러집니다. 보스에게는 통하지 않습니다.\n\n충전은 시간이 지나거나 적을 직접 처치하면 찹니다. 사용할수록 강해집니다.
items.artifacts.conquestcrown.stats=체력이 _%d%%_ 이하인 적을 굴복시킵니다. 굴복한 적은 _%d턴_ 동안 싸웁니다.
items.artifacts.conquestcrown.prompt=굴복시킬 적을 선택하세요
items.artifacts.conquestcrown.no_target=그곳에는 굴복시킬 적이 없다.
items.artifacts.conquestcrown.refuses=이 적은 결코 굴복하지 않는다.
items.artifacts.conquestcrown.too_strong=아직 굴복시키기엔 너무 멀쩡하다.
items.artifacts.conquestcrown.kneel=굴복!
items.artifacts.conquestcrown.collapse=탈진
items.artifacts.conquestcrown$subjugated.name=굴복
items.artifacts.conquestcrown$subjugated.desc=정복의 왕관 앞에 무릎 꿇었습니다. 영웅을 위해 싸우다가 힘이 다하면 쓰러집니다.\n\n남은 시간: %d턴
items.artifacts.warblade.name=전쟁의 대검
items.artifacts.warblade.desc=붉은 말을 탄 둘째 기사의 피에 젖은 대검입니다. 쥐고 있으면 세상 모든 것이 적으로 보입니다.\n\n_체력이 낮을수록_ 공격이 강해집니다. 피해를 받으면 충전이 차오르며, 충전이 가득 차면 주변 적 모두를 _광란_에 빠뜨려 서로 싸우게 만듭니다.\n\n사용할수록 강해집니다.
items.artifacts.warblade.stats=체력이 바닥일 때 피해가 최대 _%d%%_ 증가합니다. 광란은 _%d턴_ 동안 지속됩니다.
items.artifacts.warblade.no_targets=주변에 싸움을 붙일 적이 없다.
items.artifacts.faminescales.name=기근의 저울
items.artifacts.faminescales.desc=검은 말을 탄 셋째 기사의 저울입니다. 한쪽 접시엔 언제나 빵 한 덩이가, 다른 쪽엔 목숨이 놓여 있습니다.\n\n주변의 적이 굶주린 듯 _약해져_ 주는 피해가 줄어듭니다. 대신 착용자도 조금 더 빨리 배고파집니다. 충전이 가득 차면 _포만감을 체력으로 바꿀_ 수 있습니다.\n\n사용할수록 강해집니다.
items.artifacts.faminescales.stats=주변 _%d칸_ 안의 적이 약해집니다. 사용하면 최대 체력의 _%d%%_를 회복하고 포만감을 _%d_ 소모합니다.
items.artifacts.faminescales.too_hungry=너무 배가 고파서 저울에 올릴 것이 없다.
items.artifacts.deathscythe.name=죽음의 낫
items.artifacts.deathscythe.desc=창백한 말을 탄 넷째 기사의 낫입니다. 날 끝에서 차가운 침묵이 흘러나옵니다.\n\n주변에서 무언가 죽을 때마다 충전이 찹니다. 충전이 가득 차면 시야 안의 _빈사 상태인 적을 모두 거둬_ 가며, 보스는 큰 피해를 받습니다.\n\n또한 _층마다 한 번_, 착용자가 죽을 피해를 받으면 체력 1로 버티게 해 줍니다.\n\n사용할수록 강해집니다.
items.artifacts.deathscythe.stats=체력이 _%d%%_ 이하인 적을 즉사시킵니다. 보스는 최대 체력의 _%d%%_ 피해를 받습니다.
items.artifacts.deathscythe.spare_ready=_이번 층의 유예:_ 남아 있음
items.artifacts.deathscythe.spare_used=_이번 층의 유예:_ 이미 사용함
items.artifacts.deathscythe.spared=죽음의 낫이 당신의 목숨을 거두지 않았다... 이번만은.
items.artifacts.deathscythe.no_targets=거둘 목숨이 보이지 않는다.
items.quest.sealfragment.name=묵시록의 봉인
items.quest.sealfragment.desc=봉인의 파수꾼이 지키던 보랏빛 봉인입니다. 희미하게 맥박치듯 떨리고 있습니다.\n\n하수도의 _봉인의 예언자_에게 가져가면 네 기사 중 하나의 유물을 고를 수 있습니다.
