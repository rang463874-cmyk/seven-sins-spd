items.artifacts.horsemanartifact.ac_use=사용
items.artifacts.horsemanartifact.cursed=저주받은 유물의 힘을 끌어낼 수 없다.
items.artifacts.horsemanartifact.no_charge=유물이 아직 충전되지 않았다.
items.artifacts.horsemanartifact.full=기사의 유물이 힘으로 가득 찼다!
items.artifacts.horsemanartifact.levelup=%s의 힘이 더 강해졌다!
items.artifacts.conquestcrown.name=정복의 총
items.artifacts.conquestcrown.desc=흰 말을 탄 첫째 기사의 순백 총입니다. 이 총은 집어삼키며 정복합니다. 무기, 방어구, 반지를 먹이면 탄환으로 바꿔 줍니다.\n\n착용하지 않은 무기나 방어구를 장전하면 _티어 + 강화 수치×2_ 만큼 탄환을 얻습니다. 좋은 마법 부여나 각인이 있으면 +1입니다. 투척 무기는 한 묶음을 통째로 장전하며 개당 그 절반을, 반지는 _4 + 강화 수치×3_ 만큼 탄환을 줍니다. 저주받은 장비는 절반입니다. 마법이 부여된 무기를 장전하면 모든 탄환에 그 마법이 깃듭니다. 한 발에 탄환 하나를 쓰며, 탄도 위의 첫 번째 대상에 맞습니다.\n\n쏠수록 성장해 피해량이 늘어납니다. 장전할 수 있는 탄환 수에는 제한이 없습니다.
items.artifacts.conquestcrown.ac_use=사격
items.artifacts.conquestcrown.ac_load=장전
items.artifacts.conquestcrown.stats=탄환: _%d발_. 한 발당 피해: _%d-%d_.
items.artifacts.conquestcrown.stats_enchant=탄환에 깃든 마법: _%s_
items.artifacts.conquestcrown.prompt=사격할 곳을 선택하세요
items.artifacts.conquestcrown.prompt_load=장전할 무기, 투척 무기, 방어구, 반지를 선택하세요
items.artifacts.conquestcrown.empty=총이 비었다. 무기나 방어구로 장전하자.
items.artifacts.conquestcrown.full_mag=탄창이 이미 가득 찼다.
items.weapon.missiles.conquestspear.name=정복의 창
items.weapon.missiles.conquestspear.desc=이기고 또 이기려고 나아간 첫 번째 기사의 새하얀 창입니다. 투창처럼 던져 쓰며, 끝없이 더 많은 것을 원합니다.\n\n착용하지 않은 무기, 투척 무기, 갑옷, 반지를 _정복_하면 창에 먹일 수 있습니다. 창은 내구도가 가득 회복되고, 잃어버린 창이 다시 벼려지며, 영구히 강해집니다. 정복한 무기에 좋은 마법이 걸려 있으면 그 마법이 창으로 옮겨옵니다.\n\n주형은 _3개_를 부어야 창이 한 자루 늘어납니다.
items.weapon.missiles.conquestspear.ac_conquer=정복
items.weapon.missiles.conquestspear.prompt=정복할 무기, 투척 무기, 갑옷, 반지를 고르세요
items.weapon.missiles.conquestspear.enchanted=창이 %s의 힘을 얻었습니다.
items.weapon.missiles.conquestspear.conquered=정복 +%d
items.weapon.missiles.conquestspear.reforged=정복한 금속으로 잃어버린 창을 다시 벼렸습니다.
items.weapon.missiles.conquestspear.stats=정복: _%d_ (추가 피해 _+%d / +%d_).
items.weapon.missiles.conquestspear.molds=부은 주형: _%d/%d_.
items.artifacts.conquestcrown.loaded=탄환 +%d
items.artifacts.conquestcrown.enchanted=탄환에 %s의 힘이 깃들었다.
items.artifacts.conquestcrown.collapse=탈진
items.artifacts.conquestcrown$subjugated.name=굴복
items.artifacts.conquestcrown$subjugated.desc=흰 말의 기사 앞에 무릎 꿇었습니다. 영웅을 위해 싸우다가 힘이 다하면 쓰러집니다.\n\n남은 턴: %d.
items.artifacts.faminescales.name=기근의 저울
items.artifacts.faminescales.desc=검은 말을 탄 셋째 기사의 저울입니다. 굶주림이 곧 축복입니다. 배가 비어 있을수록 더 빠르게 움직이고, 더 빠르게 공격하고, 더 강하게 때립니다. 배고픔 상태에서 효과가 최대가 되고, 굶주림 상태에서는 조금 더 강해집니다. 대신 10% 더 빨리 배고파집니다.\n\n사용하면 뱃속의 음식을 배고픔 상태까지 태워 없애고, 태운 만큼 체력을 회복하며, 잠시 굶주림 이상의 광란 상태가 됩니다.
items.artifacts.faminescales.stats=최대 효과: 공격 속도 _+%d%%_, 이동 속도 _+%d%%_, 피해 _+%d%%_.\n배가 가득 찬 상태에서 사용하면 최대 체력의 _%d%%_ 회복, 광란 _%d턴_.\n현재 굶주림 효과: _%d%%_.
items.artifacts.faminescales$frenzy.name=기아의 광란
items.artifacts.faminescales$frenzy.desc=굶주림이 한계를 넘어서게 합니다. 기근의 저울이 굶주림 상태보다도 강하게 작용합니다.\n\n남은 턴: %s.
items.artifacts.deathscythe.name=죽음의 낫
items.artifacts.deathscythe.desc=창백한 말을 탄 넷째 기사의 낫입니다. 날 끝에서 차가운 침묵이 흘러나옵니다.\n\n공격을 맞힐 때마다 적에게 _사신의 표식_이 쌓입니다. 표식이 적의 남은 체력 이상이 되면 그 자리에서 즉사합니다. 보스는 즉사하지 않지만, 표식이 충분히 쌓이면 표식만큼 큰 피해를 받습니다.\n\n주변에서 무언가 죽을 때마다 충전됩니다. 사용하면 시야 안 모든 적의 표식을 한꺼번에 터뜨립니다. 층마다 한 번, 당신의 죽음을 거부합니다.
items.artifacts.deathscythe.stats=적중 시 피해의 _%d%%_만큼 표식이 쌓입니다. 보스는 표식이 최대 체력의 _%d%%_에 이르면 터집니다. 사용하면 표식의 _%d%%_만큼 피해를 줍니다.
items.artifacts.deathscythe.spare_ready=_이번 층의 유예:_ 남아 있음
items.artifacts.deathscythe.spare_used=_이번 층의 유예:_ 이미 사용함
items.artifacts.deathscythe.spared=죽음의 낫이 당신의 목숨을 거두지 않았다... 이번만은.
items.artifacts.deathscythe.no_targets=표식이 새겨진 적이 보이지 않는다.
items.artifacts.deathscythe.reaped=수확
items.artifacts.deathscythe$mark.name=사신의 표식
items.artifacts.deathscythe$mark.desc=창백한 말의 기사가 이 존재에 표식을 새겼습니다. 표식이 남은 체력 이상이 되면 죽습니다.\n\n표식: %d.
items.weapon.melee.warsword.name=전쟁의 검
items.weapon.melee.warsword.desc=붉은 말을 탄 둘째 기사의 피에 젖은 검입니다. 스스로 성장합니다. 이 검으로 적을 벨 때마다 칼날이 끝없이 강해집니다.\n\n강화 주문서로는 피해량이 직접 오르지 않습니다. 대신 강화 수치마다 처치 한 번에 얻는 스택이 늘어납니다.
items.weapon.melee.warsword.stats_desc=전쟁 스택: _%d_ (처치 %d). 처치당 스택 _%s_ (보스 x10, 미니보스 x3).\n스택에 의한 추가 피해: _+%d-%d_.
items.weapon.melee.warsword.grow=칼날이 자라난다!
items.artifacts.warblade.name=전쟁의 대검
items.artifacts.warblade.desc=붉은 말을 탄 둘째 기사의 피에 젖은 대검입니다. 쥐고 있으면 세상 모든 것이 적으로 보입니다.\n\n_체력이 낮을수록_ 공격이 강해집니다. 피해를 받으면 충전이 차오르며, 충전이 가득 차면 주변 적 모두를 _광란_에 빠뜨려 서로 싸우게 만듭니다.\n\n사용할수록 강해집니다.
items.artifacts.warblade.stats=체력이 바닥일 때 피해가 최대 _%d%%_ 증가합니다. 광란은 _%d턴_ 동안 지속됩니다.
items.artifacts.warblade.no_targets=주변에 싸움을 붙일 적이 없다.
items.quest.sealfragment.name=묵시록의 봉인
items.quest.sealfragment.desc=봉인의 파수꾼이 지키던 보랏빛 봉인입니다. 희미하게 맥박치듯 떨리고 있습니다.\n\n하수도의 _봉인의 예언자_에게 가져가면 네 기사 중 하나의 유물을 고를 수 있습니다.
