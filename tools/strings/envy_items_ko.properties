items.envymirror.name=질투의 거울
items.envymirror.desc=녹빛 테두리의 손거울입니다. 들여다보면 늘 남의 모습이 비칩니다. 장비 칸을 차지하지 않습니다.\n\n거울의 _충전_을 써서 남이 가진 것을 빼앗습니다. 충전은 시간이 지나면 차오릅니다. 공격으로 강탈한 적을 쓰러뜨리면 _선망_이 쌓이고, 특별한 적은 _도감_에 새겨집니다.
items.envymirror.ac_gaze=비추기
items.envymirror.ac_codex=도감
items.envymirror.codex_title=시기의 도감 (%d/%d)
items.envymirror.prompt=무엇을 빼앗을까요? (충전 %d/%d)
items.envymirror.opt_snatch=강탈 (충전 %d)
items.envymirror.opt_equalize=평준화 (충전 %d)
items.envymirror.opt_swap=바꿔치기 (충전 %d)
items.envymirror.opt_mimic=모방 (충전 %d)
items.envymirror.prompt_snatch=힘을 빼앗을 적을 선택하세요
items.envymirror.prompt_equalize=끌어내릴 적을 선택하세요
items.envymirror.prompt_swap=자리를 바꿀 적을 선택하세요 (최대 %d칸)
items.envymirror.prompt_mimic=흉내 낼 적을 선택하세요
items.envymirror.no_target=그곳에는 대상이 없다.
items.envymirror.not_envious=그 적은 당신보다 나을 게 없다.
items.envymirror.cant_swap=그 적과는 자리를 바꿀 수 없다.
items.envymirror.snatched=강탈
items.envymirror.equalized=%s의 체력을 끌어내렸다!
items.envymirror.mimicked=적의 이로운 효과 %d개를 빼앗았다!
items.armor.envyarmor.name=시기의 외투
items.armor.envyarmor.desc=남의 옷을 이리저리 기워 만든 듯한 녹색 외투입니다. 볼 때마다 조금씩 다른 사람의 것처럼 보입니다.
items.envymirror.skill_header=충전 %d / %d
items.envymirror.skill_snatch=강탈
items.envymirror.skill_snatch_desc=적 하나의 힘을 빼앗습니다. _%d턴_ 동안 그 적은 약해지고, 당신이 주는 피해는 25%% 늘어납니다.
items.envymirror.skill_equalize=끌어내리기
items.envymirror.skill_equalize_desc=적의 체력 비율을 당신의 체력 비율까지 끌어내립니다. 보스는 그 차이의 절반만 받습니다. 적이 당신보다 더 다쳤으면 쓸 수 없습니다.
items.envymirror.skill_swap=자리 바꾸기
items.envymirror.skill_swap_desc=최대 _%d칸_ 안의 적과 자리를 바꿉니다. 보스와 움직이지 않는 적과는 바꿀 수 없습니다.
items.envymirror.skill_mimic=흉내
items.envymirror.skill_mimic_desc=적에게 걸린 이로운 효과를 모두 빼앗고, 그 적의 체력 일부만큼 방어막을 얻습니다.
