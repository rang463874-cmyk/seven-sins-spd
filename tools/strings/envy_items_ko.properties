items.envymirror.name=질투의 거울
items.envymirror.desc=흐릿한 녹색 유리가 끼워진 손거울입니다. 유물/반지 칸에 착용하는 유물이며, 착용해야 기술을 쓸 수 있습니다.\n\n거울에는 남의 것을 베낀 기술이 몇 개 담깁니다. _다른 칠죄종의 기술_은 레벨이 오를 때마다 하나씩, _몬스터의 능력_은 그 몬스터를 도감에 등록하면 베낄 수 있습니다. 베낀 기술은 아주 천천히 차는 _질투 게이지_로 씁니다. 시야에 강한 적이 있으면 게이지가 더 빨리 찹니다.\n\n다른 칠죄종 하나의 _성장 방식_을 흉내 내 절반의 효율로 강해질 수도 있습니다.
items.envymirror.ac_gaze=비추기
items.envymirror.ac_codex=도감
items.envymirror.codex_title=시기의 도감 (%d/%d)
items.envymirror.skill_header=질투 %d / %d · 슬롯 %d / %d · 성장 모방: %s
items.envymirror.skill_copy=모방 고르기
items.envymirror.skill_copy_desc=거울에 담을 기술을 고릅니다. 최대 _%d개_까지 담을 수 있습니다.
items.envymirror.skill_growth=성장 모방
items.envymirror.skill_growth_desc=다른 칠죄종 하나의 성장 방식을 흉내 내 _%d%%_의 효율로 선망 점수를 얻습니다. 지금 흉내 내는 것: _%s_
items.envymirror.copy_title=모방 고르기
items.envymirror.copy_msg=거울에 담을 기술의 종류를 고르세요. (슬롯 %d / %d)
items.envymirror.copy_sins=칠죄종의 기술
items.envymirror.copy_monsters=몬스터의 능력
items.envymirror.copy_all_sins=모든 칠죄종의 기술을 베꼈습니다.
items.envymirror.copy_next_sin=다음 기술: _%d레벨_에 _%s_
items.envymirror.copy_monsters_msg=도감에 몬스터를 등록하면 그 능력을 베낄 수 있습니다. 아직 모르는 능력: _%d개_
items.envymirror.copy_toggle=눌러서 담거나 빼세요. (슬롯 %d / %d)
items.envymirror.copy_cost=질투 비용: _%d_
items.envymirror.slots_full=거울이 가득 찼다. 먼저 하나를 빼야 한다.
items.envymirror.growth_title=성장 모방
items.envymirror.growth_msg=흉내 낼 칠죄종을 고르세요. 그 칠죄종이 강해지는 방식으로 _%d%%_만큼 선망 점수를 얻습니다. 언제든 바꿀 수 있습니다.
items.envymirror.growth_set=이제 %s의 성장을 흉내 낸다.
items.envymirror.skill_m_bite=물어뜯기
items.envymirror.skill_m_bite_desc=_(식탐)_ 인접한 적을 _150%_ 피해로 물고, 준 피해의 _30%_만큼 회복합니다.
items.envymirror.skill_m_coin=동전 던지기
items.envymirror.skill_m_coin_desc=_(탐욕)_ 금화를 던져 _%d~%d_ 피해를 줍니다.
items.envymirror.skill_m_provoke=도발
items.envymirror.skill_m_provoke_desc=_(분노)_ 적 하나를 _8턴_ 동안 광란에 빠뜨립니다. 보스에게는 통하지 않습니다.
items.envymirror.skill_m_command=왕명
items.envymirror.skill_m_command_desc=_(교만)_ 적 하나를 _3턴_ 동안 마비시킵니다. 보스에게는 통하지 않습니다.
items.envymirror.skill_m_kiss=피의 입맞춤
items.envymirror.skill_m_kiss_desc=_(색욕)_ 최대 _3칸_ 떨어진 적에게 순식간에 다가가 공격하고 _4턴_ 동안 매혹합니다.
items.envymirror.skill_m_puppet=꿈 인형
items.envymirror.skill_m_puppet_desc=_(나태)_ _30턴_ 동안 함께 싸우는 악몽 인형을 부릅니다.
items.envymirror.skill_m_acid=위산 분사
items.envymirror.skill_m_acid_desc=_(식탐)_ 주변 _2칸_ 안에 보이는 적에게 약한 피해를 주고 _약화_와 _불구_를 겁니다.
items.envymirror.skill_m_guard=황금 방어막
items.envymirror.skill_m_guard_desc=_(탐욕)_ _%d_만큼 방어막을 얻습니다.
items.envymirror.skill_m_contagion=분노 전염
items.envymirror.skill_m_contagion_desc=_(분노)_ 고른 적과 그 주변 _2칸_ 안의 적들을 _6턴_ 동안 광란에 빠뜨립니다.
items.envymirror.skill_m_procession=행차
items.envymirror.skill_m_procession_desc=_(교만)_ 최대 _5칸_ 떨어진 빈칸으로 순식간에 이동합니다.
items.envymirror.skill_m_step=스텝
items.envymirror.skill_m_step_desc=_(색욕)_ _6턴_ 동안 회피가 크게 오릅니다.
items.envymirror.skill_m_yawn=하품
items.envymirror.skill_m_yawn_desc=_(나태)_ 주변 _2칸_ 안에 보이는 적을 깊이 잠재웁니다. 보스에게는 통하지 않습니다.
items.envymirror.skill_m_rock=바위 투척
items.envymirror.skill_m_rock_desc=_(몬스터)_ 바위를 던져 _%d~%d_ 피해를 주고 _1턴_ 기절시킵니다.
items.envymirror.skill_m_gas=독가스
items.envymirror.skill_m_gas_desc=_(몬스터)_ 최대 _6칸_ 떨어진 곳에 독가스를 퍼뜨립니다. 당신도 휘말릴 수 있습니다.
items.envymirror.skill_m_leap=그림자 도약
items.envymirror.skill_m_leap_desc=_(몬스터)_ 최대 _6칸_ 떨어진 빈칸으로 뛰어들고 _3턴_ 동안 투명해집니다.
items.envymirror.skill_m_drain=영혼 흡수
items.envymirror.skill_m_drain_desc=_(몬스터)_ 보이는 적에게서 _%d~%d_의 생명을 빨아들여 그만큼 회복합니다.
items.envymirror.skill_m_fire=화염
items.envymirror.skill_m_fire_desc=_(몬스터)_ 보이는 적 하나에게 불을 붙입니다.
items.envymirror.skill_m_ooze=점액 폭발
items.envymirror.skill_m_ooze_desc=_(몬스터)_ 인접한 모든 적에게 약한 피해를 주고 _점액_을 묻힙니다.
items.envymirror.skill_m_shell=강철 껍질
items.envymirror.skill_m_shell_desc=_(몬스터)_ _%d_만큼 방어막을 얻습니다.
items.envymirror.skill_m_gaze=신의 시선
items.envymirror.skill_m_gaze_desc=_(몬스터)_ 최대 _8칸_까지 뻗는 광선을 쏘아, 길 위의 모든 적에게 _%d~%d_ 피해를 줍니다.
items.artifacts.sinartifact.effects_jealousy=레벨 효과: 질투 게이지 충전 속도 _+%d%%_
