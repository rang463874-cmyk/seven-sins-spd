items.envymirror.skill_m_bite=Bite
items.envymirror.skill_m_bite_desc=_(Gluttony)_ Bite an adjacent enemy for _150%_ damage and heal _30%_ of the damage dealt.
items.envymirror.skill_m_coin=Coin Shot
items.envymirror.skill_m_coin_desc=_(Greed)_ Throw a gold coin for _%d-%d_ damage.
items.envymirror.skill_m_provoke=Provoke
items.envymirror.skill_m_provoke_desc=_(Wrath)_ Drive an enemy into a frenzy for _8 turns_. Doesn't work on bosses.
items.envymirror.skill_m_command=Command
items.envymirror.skill_m_command_desc=_(Pride)_ Paralyze an enemy for _3 turns_. Doesn't work on bosses.
items.envymirror.skill_m_kiss=Blood Kiss
items.envymirror.skill_m_kiss_desc=_(Lust)_ Close in on an enemy up to _3 tiles_ away, attack it and charm it for _4 turns_.
items.envymirror.skill_m_puppet=Dream Puppet
items.envymirror.skill_m_puppet_desc=_(Sloth)_ Summon a nightmare puppet that fights beside you for _30 turns_.
items.envymirror.skill_m_acid=Acid Spray
items.envymirror.skill_m_acid_desc=_(Gluttony)_ Deal light damage to visible enemies within _2 tiles_ and inflict _weakness_ and _cripple_.
items.envymirror.skill_m_guard=Golden Guard
items.envymirror.skill_m_guard_desc=_(Greed)_ Gain _%d_ shielding.
items.envymirror.skill_m_contagion=Contagion
items.envymirror.skill_m_contagion_desc=_(Wrath)_ Drive the chosen enemy and every enemy within _2 tiles_ of it into a frenzy for _6 turns_.
items.envymirror.skill_m_procession=Procession
items.envymirror.skill_m_procession_desc=_(Pride)_ Move instantly to an empty tile up to _5 tiles_ away.
items.envymirror.skill_m_step=Step
items.envymirror.skill_m_step_desc=_(Lust)_ Greatly raise your evasion for _6 turns_.
items.envymirror.skill_m_yawn=Yawn
items.envymirror.skill_m_yawn_desc=_(Sloth)_ Put visible enemies within _2 tiles_ into a deep sleep. Doesn't work on bosses.
items.envymirror.skill_m_rock=Rock Throw
items.envymirror.skill_m_rock_desc=_(Monster)_ Hurl a rock for _%d-%d_ damage, stunning for _1 turn_.
items.envymirror.skill_m_gas=Toxic Gas
items.envymirror.skill_m_gas_desc=_(Monster)_ Release toxic gas up to _6 tiles_ away. It can catch you too.
items.envymirror.skill_m_leap=Shadow Leap
items.envymirror.skill_m_leap_desc=_(Monster)_ Leap to an empty tile up to _6 tiles_ away and turn invisible for _3 turns_.
items.envymirror.skill_m_drain=Soul Drain
items.envymirror.skill_m_drain_desc=_(Monster)_ Drain _%d-%d_ life from a visible enemy and heal that much.
items.envymirror.skill_m_fire=Flame
items.envymirror.skill_m_fire_desc=_(Monster)_ Set a visible enemy on fire.
items.envymirror.skill_m_ooze=Ooze Burst
items.envymirror.skill_m_ooze_desc=_(Monster)_ Deal light damage to every adjacent enemy and cover them in _ooze_.
items.envymirror.skill_m_shell=Iron Shell
items.envymirror.skill_m_shell_desc=_(Monster)_ Gain _%d_ shielding.
items.envymirror.skill_m_gaze=Divine Gaze
items.envymirror.skill_m_gaze_desc=_(Monster)_ Fire a beam up to _8 tiles_ long that deals _%d-%d_ damage to every enemy in its path.
