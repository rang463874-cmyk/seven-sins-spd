items.armor.envyarmor.name=coat of envy
items.armor.envyarmor.desc=A green coat that looks stitched together from other people's clothes. It seems to belong to someone different every time you look.
items.envymirror.skill_header=Charges %d / %d
items.envymirror.skill_snatch=Snatch
items.envymirror.skill_snatch_desc=Steals an enemy's strength. For _%d turns_ it is weakened and you deal 25%% more damage.
items.envymirror.skill_equalize=Drag Down
items.envymirror.skill_equalize_desc=Drags an enemy's HP ratio down to yours. Bosses only lose half the difference. Unusable if the enemy is more hurt than you.
items.envymirror.skill_swap=Swap
items.envymirror.skill_swap_desc=Swaps places with an enemy within _%d tiles_. Not bosses or immovable enemies.
items.envymirror.skill_mimic=Mimic
items.envymirror.skill_mimic_desc=Takes every beneficial effect on an enemy, and gains shielding based on its HP.
