items.envymirror.name=mirror of envy
items.envymirror.desc=A green-rimmed hand mirror. Whoever looks into it always sees someone else. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nIts _charges_ let you take what others have. Charges refill over time. Defeating robbed enemies builds _envy_, and special foes are etched into the _bestiary_.
