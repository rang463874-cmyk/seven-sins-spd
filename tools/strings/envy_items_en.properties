items.envymirror.name=mirror of envy
items.envymirror.desc=A hand mirror set with cloudy green glass. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nThe mirror holds a few skills copied from others. _Other sins' skills_ can be copied one by one as you level up, and _monster abilities_ once that monster is registered in your bestiary. Copied skills are paid for with a very slowly filling _jealousy gauge_, which fills faster while a strong enemy is in sight.\n\nYou can also imitate another sin's _way of growing_, at half efficiency.
