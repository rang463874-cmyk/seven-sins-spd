sins.sinawakening.control_gluttony_desc=master your hunger: play as before, with solid advantages.
sins.sinawakening.control_greed_desc=master your greed: play as before, with solid advantages.
sins.sinawakening.control_wrath_desc=master your rage: play as before, with solid advantages.
sins.sinawakening.control_pride_desc=master your pride: play as before, with solid advantages.
sins.sinawakening.control_lust_desc=master your desire: play as before, with solid advantages.
sins.sinawakening.control_envy_desc=master your envy: play as before, with solid advantages.
sins.sinawakening.control_sloth_desc=master your sloth: play as before, with solid advantages.
sins.sinawakening.monster_gluttony_desc=swallow your bags for a huge burst of growth; items of a swallowed bag's kind take effect the moment you pick them up. Move and attack 50% faster, and your bite reaches one tile further.
sins.sinawakening.monster_greed_desc=no more shopping and 25% less max HP, for great power drawn from your gold.
sins.sinawakening.monster_wrath_desc=armor protects half as well and healing is halved, for unstoppable fury.
sins.sinawakening.monster_pride_desc=take 20% more damage unless at full health, for overwhelming power.
sins.sinawakening.monster_lust_desc=natural regeneration and healing potions are halved, for a thirst that feeds on every blow.
sins.sinawakening.monster_envy_desc=20% less max HP, and an empty jealousy gauge hurts you, for power stolen from every kill.
sins.sinawakening.monster_sloth_desc=your own blows deal half damage, for a host of nightmares.
