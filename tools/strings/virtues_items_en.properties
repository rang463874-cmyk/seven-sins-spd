sins.sinawakening.control_gluttony_desc=master your hunger: play as before, with solid advantages.
sins.sinawakening.control_greed_desc=master your greed: play as before, with solid advantages.
sins.sinawakening.control_wrath_desc=master your rage: play as before, with solid advantages.
sins.sinawakening.control_pride_desc=master your pride: play as before, with solid advantages.
sins.sinawakening.control_lust_desc=master your desire: play as before, with solid advantages.
sins.sinawakening.control_envy_desc=master your envy: play as before, with solid advantages.
sins.sinawakening.control_sloth_desc=master your sloth: play as before, with solid advantages.
sins.sinawakening.monster_gluttony_desc=swallow your bags for a huge burst of growth; items of a swallowed bag's kind take effect the moment you pick them up. Move and attack 50% faster, and your bite reaches one tile further.
sins.sinawakening.monster_greed_desc=no more shopping and 25% less max HP, for great power drawn from your gold.
sins.sinawakening.monster_wrath_desc=armor protects half as well and healing is halved, for unstoppable fury.
sins.sinawakening.monster_pride_desc=take 20% more damage unless at full health, for overwhelming power.
sins.sinawakening.monster_lust_desc=natural regeneration and healing potions are halved, for a thirst that feeds on every blow.
sins.sinawakening.monster_envy_desc=20% less max HP, and an empty jealousy gauge hurts you, for power stolen from every kill.
sins.sinawakening.monster_sloth_desc=your own blows deal half damage, for a host of nightmares.
sins.awakeningtalent.g_digestion.title=perfect digestion
sins.awakeningtalent.g_digestion.desc=Consumables give _+20/40/60%_ growth points.
sins.awakeningtalent.g_restraint.title=measured hunger
sins.awakeningtalent.g_restraint.desc=The predator's maw skills cost _15/30/45%_ less satiety.
sins.awakeningtalent.g_nourish.title=nourishment
sins.awakeningtalent.g_nourish.desc=Eating food grants a barrier of _10/20/30%_ of max HP.
sins.awakeningtalent.g_stomach.title=stretched stomach
sins.awakeningtalent.g_stomach.desc=Items used the moment you pick them up give _+25/50/75%_ growth points.
sins.awakeningtalent.g_acid.title=digestive juices
sins.awakeningtalent.g_acid.desc=Each item used on pickup heals _3/6/9%_ of max HP.
sins.awakeningtalent.g_dash.title=feeding frenzy
sins.awakeningtalent.g_dash.desc=Each item used on pickup grants _2/3/4_ turns of haste.
sins.awakeningtalent.r_interest.title=compound interest
sins.awakeningtalent.r_interest.desc=Each new floor pays _2/4/6%_ of the gold you carry as interest.
sins.awakeningtalent.r_discount.title=haggler
sins.awakeningtalent.r_discount.desc=Shop prices (and remote sale / mail order) are _10/20/30%_ lower.
sins.awakeningtalent.r_goldshield.title=golden shield
sins.awakeningtalent.r_goldshield.desc=Picking up gold grants a barrier of _10/20/30%_ of the amount (up to 25% of max HP).
sins.awakeningtalent.r_goldskin.title=golden skin
sins.awakeningtalent.r_goldskin.desc=_+1/2/3_ armor for every 1000 gold you carry.
sins.awakeningtalent.r_plunder.title=plunder
sins.awakeningtalent.r_plunder.desc=Every kill drops an extra _50/100/150%_ of a normal gold pile.
sins.awakeningtalent.r_goldfist.title=golden fist
sins.awakeningtalent.r_goldfist.desc=_+1/2/3_ melee damage for every 500 gold you carry.
sins.awakeningtalent.w_simmer.title=simmering rage
sins.awakeningtalent.w_simmer.desc=Rage cools _50/75/100%_ slower when no enemy is in view.
sins.awakeningtalent.w_precise.title=precise fury
sins.awakeningtalent.w_precise.desc=War drum skills cost _10/20/30%_ less rage.
sins.awakeningtalent.w_temper.title=tempered rage
sins.awakeningtalent.w_temper.desc=While you have 50+ rage, damage taken is reduced by _8/16/24%_.
sins.awakeningtalent.w_bloodlust.title=bloodlust
sins.awakeningtalent.w_bloodlust.desc=Melee damage _+0.3/0.6/0.9%_ per point of rage.
sins.awakeningtalent.w_undying.title=undying rage
sins.awakeningtalent.w_undying.desc=A lethal blow leaves you at 1 HP instead, for 100 rage (_1/2/3_ times per floor).
sins.awakeningtalent.w_slaughter.title=slaughter
sins.awakeningtalent.w_slaughter.desc=Each kill grants _10/20/30_ rage.
sins.awakeningtalent.p_poise.title=unshaken poise
sins.awakeningtalent.p_poise.desc=When hit, _20/40/60%_ chance to keep all your dignity.
sins.awakeningtalent.p_royalshot.title=royal shot
sins.awakeningtalent.p_royalshot.desc=Thrown weapons deal _+10/20/30%_ damage.
sins.awakeningtalent.p_glory.title=radiant glory
sins.awakeningtalent.p_glory.desc=Flawless kills give _+25/50/75%_ glory.
sins.awakeningtalent.p_absolute.title=the absolute
sins.awakeningtalent.p_absolute.desc=At full HP, you deal _+20/40/60%_ damage.
sins.awakeningtalent.p_reign.title=reign
sins.awakeningtalent.p_reign.desc=Max dignity _+1/2/3_ for every enemy in view.
sins.awakeningtalent.p_divineeye.title=divine eye
sins.awakeningtalent.p_divineeye.desc=Your first _1/2/3_ thrown hits on each foe never miss.
sins.awakeningtalent.l_price.title=measured price
sins.awakeningtalent.l_price.desc=Perfume skills cost _15/30/45%_ less HP.
sins.awakeningtalent.l_deepcharm.title=deep charm
sins.awakeningtalent.l_deepcharm.desc=Your charms last _25/50/75%_ longer.
sins.awakeningtalent.l_elegant.title=elegant thirst
sins.awakeningtalent.l_elegant.desc=Lifesteal from charmed enemies _+20/40/60%_.
sins.awakeningtalent.l_feast.title=feast of blood
sins.awakeningtalent.l_feast.desc=Every attack, thrown ones too, drinks _6/12/18%_ of its damage.
sins.awakeningtalent.l_nightdance.title=night dance
sins.awakeningtalent.l_nightdance.desc=Evasion _+5/10/15%_.
sins.awakeningtalent.l_aura.title=bewitching aura
sins.awakeningtalent.l_aura.desc=Each turn, enemies within 2 tiles have a _10/20/30%_ chance to be charmed.
sins.awakeningtalent.e_slots.title=perfect copy
sins.awakeningtalent.e_slots.desc=Mimic slots _+1/1/2_.
sins.awakeningtalent.e_thrift.title=thrifty envy
sins.awakeningtalent.e_thrift.desc=Mimicked skills cost _10/20/30%_ less jealousy.
sins.awakeningtalent.e_growth.title=seamless mimicry
sins.awakeningtalent.e_growth.desc=Imitated growth efficiency _+5/10/15%_.
sins.awakeningtalent.e_steal.title=stolen strength
sins.awakeningtalent.e_steal.desc=Damage permanently _+0.1/0.2/0.3_ for every enemy you have killed since awakening.
sins.awakeningtalent.e_rivalry.title=rivalry
sins.awakeningtalent.e_rivalry.desc=Damage _+10/20/30%_ while a strong enemy (rival) is in view.
sins.awakeningtalent.e_takeform.title=take its form
sins.awakeningtalent.e_takeform.desc=Kills have a _5/10/15%_ chance to fill a quarter of your jealousy gauge.
sins.awakeningtalent.s_nap.title=short nap
sins.awakeningtalent.s_nap.desc=Skills make you doze _20/40/60%_ shorter.
sins.awakeningtalent.s_puppets.title=vivid dreams
sins.awakeningtalent.s_puppets.desc=Dream puppets' HP and damage _+15/30/45%_.
sins.awakeningtalent.s_more.title=crowded dreams
sins.awakeningtalent.s_more.desc=Max dream puppets _+1/1/2_.
sins.awakeningtalent.s_legion.title=nightmare legion
sins.awakeningtalent.s_legion.desc=When a puppet kills an enemy, _10/20/30%_ chance a nightmare rises.
sins.awakeningtalent.s_veil.title=veil of sleep
sins.awakeningtalent.s_veil.desc=While dozing or asleep, damage taken _-20/40/60%_.
sins.awakeningtalent.s_sleepwalk.title=deep sleepwalk
sins.awakeningtalent.s_sleepwalk.desc=Automatic (sleepwalk) attacks deal _+30/60/90%_ damage.
