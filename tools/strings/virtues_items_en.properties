items.heavenlyhalo.name=halo of the archangel
items.heavenlyhalo.desc=The ring of light that crowned the fallen archangel. It still hums softly, as if waiting for a new head to rest on.\n\nTaking it up adds _one more shared artifact/ring slot_ for the rest of the run. It works alongside the mirror jewel case. Only one can be used per run.
items.heavenlyhalo.ac_open=take up
items.heavenlyhalo.already=You already wear one halo. Another does nothing.
items.heavenlyhalo.opened=The halo dissolves into light around you, and you can now wear one more trinket!
items.bags.essencebag.name=essence bag
items.bags.essencebag.desc=A heavy crimson pouch stitched with sigils that keep what it holds from leaking away. It is made to carry essences: those of the sins now, and perhaps darker ones later.
items.artifactshard.name=shard of the %s
items.artifactshard.desc=A splinter of a broken artifact, still carrying a sliver of its power. Using it releases that power once, and the shard crumbles.\n\nShards come from breaking one of the dungeon's own artifacts in an alchemy pot (1 shard, +1 per 3 levels of the artifact).
items.artifactshard.ac_use=use
items.artifactshard.prompt=Choose a target
items.artifactshard.invalid=Nothing happens there.
items.artifactshard.too_heavy=It is too heavy to pull!
items.artifactshard.no_space=There is no room for the spirits to appear.
items.artifactshard.spirit=bound spirit
items.artifactshard.effect_alchemiststoolkit=_Alchemist's toolkit:_ gain 12 alchemical energy.
items.artifactshard.effect_capeofthorns=_Cape of thorns:_ a barrier worth a quarter of your max HP (plus the floor's depth).
items.artifactshard.effect_chaliceofblood=_Chalice of blood:_ heal half your max HP over a few turns.
items.artifactshard.effect_cloakofshadows=_Cloak of shadows:_ become invisible for 12 turns.
items.artifactshard.effect_driedrose=_Dried rose:_ two allied spirits appear next to you and fight for 30 turns.
items.artifactshard.effect_etherealchains=_Ethereal chains:_ pull an enemy (not a boss) to you, or pull yourself up to 8 tiles toward a spot.
items.artifactshard.effect_holytome=_Holy tome:_ blessed for a while and healed by a quarter of your max HP.
items.artifactshard.effect_hornofplenty=_Horn of plenty:_ fills you up like a hearty meal.
items.artifactshard.effect_masterthievesarmband=_Master thieves' armband:_ drops a pile of gold and a random potion, scroll or runestone at your feet.
items.artifactshard.effect_sandalsofnature=_Sandals of nature:_ tall grass springs up around you, nearby enemies are rooted for 5 turns, and your skin hardens like bark.
items.artifactshard.effect_skeletonkey=_Skeleton key:_ opens a locked door or a locked chest without its key.
items.artifactshard.effect_talismanofforesight=_Talisman of foresight:_ reveals the floor's layout and secrets, and gives 5 turns of mind vision.
items.artifactshard.effect_timekeepershourglass=_Timekeeper's hourglass:_ stops time around you for 5 turns.
items.artifactshard.effect_unstablespellbook=_Unstable spellbook:_ reads a random scroll (never transmutation).
items.artifactshard.used_alchemiststoolkit=The shard dissolves into alchemical energy.
items.artifactshard.used_capeofthorns=A barrier of thorns wraps around you.
items.artifactshard.used_chaliceofblood=Warm blood surges through your veins.
items.artifactshard.used_cloakofshadows=You melt into the shadows.
items.artifactshard.used_driedrose=Faithful spirits answer the shard's call!
items.artifactshard.used_holytome=A holy light settles over you.
items.artifactshard.used_hornofplenty=You feel well fed.
items.artifactshard.used_masterthievesarmband=Loot spills out of nowhere!
items.artifactshard.used_sandalsofnature=Nature rises to your call!
items.artifactshard.used_skeletonkey=The lock clicks open.
items.artifactshard.used_talismanofforesight=The floor's secrets unfold before you.
items.artifactshard.used_timekeepershourglass=Time grinds to a halt around you.
items.artifactshard.used_unstablespellbook=The shard flares and reads itself as a %s!
