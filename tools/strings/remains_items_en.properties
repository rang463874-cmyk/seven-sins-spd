items.remains.mawfang.name=broken maw fang
items.remains.mawfang.desc=A fang that fell out of a former glutton's maw. It still seems to want to chew on something.\n\nChewing it restores _150 satiety_ and _5%_ of your max HP.
items.remains.meltedcard.name=melted card shard
items.remains.meltedcard.desc=The remains of a golden card, melted into a lump by fire. Still, gold is gold.\n\nMelting it down gives _(depth x 20)_ gold.
items.remains.torndrumhead.name=torn drumhead
items.remains.torndrumhead.desc=The hide of a war drum, torn from countless beatings. It looks like it can sound one more time.\n\nBeating it makes enemies within _3 tiles_ fight each other for _3 turns_.
items.remains.crackedgem.name=cracked crown gem
items.remains.crackedgem.desc=A gem fallen from the crown of pride. Cracked, yet its arrogant gleam remains.\n\nUsing it blocks the _next attack_ you take within _30 turns_ completely.
items.remains.brokenperfume.name=broken perfume bottle
items.remains.brokenperfume.desc=A few last drops remain at the bottom of this broken perfume bottle. The sweet scent is still strong.\n\nShattering it charms enemies within _3 tiles_ for _5 turns_.
items.remains.mirrorshard.name=shard of envy
items.remains.mirrorshard.desc=A sharp shard broken off the mirror of envy. It still covets whatever it reflects.\n\nUsing it steals life equal to _15%_ of your max HP from the nearest enemy within _4 tiles_.
items.remains.mirrorshard.nothing=There's no enemy for the shard to reflect.
items.remains.pillowstuffing.name=burst pillow stuffing
items.remains.pillowstuffing.desc=A tuft of stuffing poking out of an old pillow. Just looking at it makes your eyelids heavy.\n\nScattering it makes enemies within _3 tiles_ _drowsy_ and restores _5%_ of your max HP.
items.remains.crackedgem$ward.name=flawless dignity
items.remains.crackedgem$ward.desc=The next attack you take will be blocked completely.\n\nTurns remaining: %s
items.remains.crackedgem$ward.blocked=Blocked!
