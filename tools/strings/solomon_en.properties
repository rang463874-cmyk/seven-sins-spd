###### Seven Sins: Solomon ######
actors.hero.heroclass.solomon=Solomon
actors.hero.heroclass.solomon_desc_short=_Solomon_, the wise king who ruled the 72 demons. He casts spells by combining _alchemical symbols_ of the elements and summons the demons recorded in his _Lemegeton_.
actors.hero.heroclass.solomon_desc=Solomon starts with the _Ring of Solomon_, worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn.\n\nTapping the _fire, water, air and earth_ symbols on the skill bar draws them into the circle (half a turn each). Up to three symbols can be drawn, and _Cast_ fires the spell they make: one symbol is a basic spell, two a combined one (14), three a powerful spell that _depends on the order_ (64). Spells spend slowly refilling _mana_.\n\n_Summon Demon_ calls one of the demons recorded in this run's Lemegeton as a temporary ally.\n\nSolomon gains _wisdom_ forever from the mana he spends and the demons he records. Wisdom raises spell power, max mana, max HP and evasion.\n\nSolomon starts with a _cudgel_ and knows _potions of healing_ and _scrolls of recharging_.
actors.hero.heroclass.solomon_unlock=Unlocked by recording _all 72 demons_ of Solomon in the Lemegeton in a single run.
actors.hero.herosubclass.arch_magus=Arch Magus
actors.hero.herosubclass.arch_magus_short_desc=The _Arch Magus's_ spells are _25%_ stronger and mana refills _25%_ faster.
actors.hero.herosubclass.arch_magus_desc=The Arch Magus has mastered the alchemical symbols. Every spell's power (damage, healing, shields) rises by _25%_, and mana refills _25%_ faster.
actors.hero.herosubclass.demon_master=Master of Demons
actors.hero.herosubclass.demon_master_short_desc=The _Master of Demons_ keeps up to _two_ demons, and they stay _50%_ longer.
actors.hero.herosubclass.demon_master_desc=The Master of Demons bends the demons with Solomon's seal. Up to _2_ summoned demons can serve at once, and their pacts last _50%_ longer.
actors.buffs.solomonarcana.name=Solomon's arcana
actors.buffs.solomonarcana.desc=The wisdom and mana Solomon has gathered.\n\nMana: _%d / %d_\nCircle: _%s_\n\nWisdom: _%d_\nSpell power: _+%d%%_\nMax HP: _+%d_\nEvasion: _+%d%%_
solomon.solomonhooks.unlocked=All 72 demons are recorded in the Lemegeton! _Solomon_, the wise king, is unlocked.
