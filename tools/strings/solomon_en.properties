solomon.solomonspells.summon_title=Summon Demon
solomon.solomonspells.summon_msg=The strongest demons recorded in your Lemegeton. Spend _%d_ mana to bind one as an ally for _%d turns_.
solomon.solomonspells.summoned=%s %s answers Solomon's seal!
solomon.solomonspells.sp_fire_bolt=Fire Bolt
solomon.solomonspells.sp_fire_bolt_desc=_Fire_: hurls a ball of flame for damage, setting the target on fire half of the time.
solomon.solomonspells.sp_water_lash=Water Lash
solomon.solomonspells.sp_water_lash_desc=_Water_: a cold jet deals light damage and chills for _3 turns_.
solomon.solomonspells.sp_wind_blade=Wind Blade
solomon.solomonspells.sp_wind_blade_desc=_Air_: cuts every enemy on a straight line of up to _6 tiles_ for light damage.
solomon.solomonspells.sp_stone_skin=Stone Skin
solomon.solomonspells.sp_stone_skin_desc=_Earth_: gives a shield that grows with your level.
solomon.solomonspells.sp_fireball=Fireball
solomon.solomonspells.sp_fireball_desc=_Fire+Fire_: an exploding fireball deals heavy damage where it lands and around it, setting enemies on fire.
solomon.solomonspells.sp_spring=Healing Spring
solomon.solomonspells.sp_spring_desc=_Water+Water_: heals _20%_ of your max HP and washes off poison, burning, ooze and bleeding.
solomon.solomonspells.sp_gust=Gust Step
solomon.solomonspells.sp_gust_desc=_Air+Air_: teleports to a visible empty tile up to _6 tiles_ away.
solomon.solomonspells.sp_earth_armor=Earthen Armor
solomon.solomonspells.sp_earth_armor_desc=_Earth+Earth_: your skin hardens like bark, raising your armor. It fades slowly over time.
solomon.solomonspells.sp_steam=Steam Burst
solomon.solomonspells.sp_steam_desc=_Fire+Water_: damages enemies where it lands and around it and blinds them for _3 turns_.
solomon.solomonspells.sp_chain_lightning=Chain Lightning
solomon.solomonspells.sp_chain_lightning_desc=_Fire+Air_: strikes an enemy with lightning that jumps to _2_ more enemies nearby.
solomon.solomonspells.sp_magma=Magma Spout
solomon.solomonspells.sp_magma_desc=_Fire+Earth_: spews magma along a line of up to _7 tiles_, dealing heavy damage to every enemy and setting them on fire.
solomon.solomonspells.sp_blizzard=Blizzard
solomon.solomonspells.sp_blizzard_desc=_Water+Air_: damages and freezes enemies within _2 tiles_. Bosses and elites are chilled instead.
solomon.solomonspells.sp_vines=Binding Vines
solomon.solomonspells.sp_vines_desc=_Water+Earth_: vines sprout on the chosen tile and around it, dealing light damage and rooting enemies for _4 turns_.
solomon.solomonspells.sp_sandstorm=Sandstorm
solomon.solomonspells.sp_sandstorm_desc=_Air+Earth_: visible enemies within _3 tiles_ are blinded and crippled for _4 turns_.
solomon.solomonspells$summonpact.name=Solomon's pact
solomon.solomonspells$summonpact.desc=A demon bound by Solomon's seal, serving him. It vanishes when the pact ends.\n\nTurns remaining: %d.
solomon.solomontriads.title=%s (%s)
solomon.solomontriads.f_fire=amplified
solomon.solomontriads.f_air=spread
solomon.solomontriads.f_earth=lasting
solomon.solomontriads.f_water=cleansing
solomon.solomontriads.f_fire_desc=_First symbol fire (amplified)_: power (damage, healing, poison) +_40%_, costs _3_ more mana.
solomon.solomontriads.f_air_desc=_First symbol air (spread)_: _1 tile_ wider, with more targets and more range.
solomon.solomontriads.f_earth_desc=_First symbol earth (lasting)_: status effects, walls and boons last _50%_ longer.
solomon.solomontriads.f_water_desc=_First symbol water (cleansing)_: enemies it touches are vulnerable for _5 turns_, and casting washes every harmful state off Solomon.
solomon.solomontriads.c_inferno=Inferno
solomon.solomontriads.c_inferno_desc=_Fire-Fire, fire family_: a huge fireball explodes over _1 tile_ around where it lands, dealing very heavy damage and setting enemies on fire.
solomon.solomontriads.c_meltdown=Meltdown
solomon.solomontriads.c_meltdown_desc=_Water-Fire, fire family_: melts one enemy for very heavy damage and leaves it vulnerable and weakened for _6 turns_.
solomon.solomontriads.c_meteor=Meteor Shower
solomon.solomontriads.c_meteor_desc=_Air-Fire, fire family_: _4_ meteors fall within _2 tiles_ of the chosen tile, each hurting and burning everything within _1 tile_.
solomon.solomontriads.c_volcano=Eruption
solomon.solomontriads.c_volcano_desc=_Earth-Fire, fire family_: the ground erupts within _2 tiles_ of the chosen tile: heavy damage, burning and _4 turns_ of crippling.
solomon.solomontriads.c_phoenix=Phoenix
solomon.solomontriads.c_phoenix_desc=_Fire-Air, air family_: a phoenix pierces a line of up to _8 tiles_, dealing heavy damage to every enemy on it and setting them on fire.
solomon.solomontriads.c_ice_volley=Ice Volley
solomon.solomontriads.c_ice_volley_desc=_Water-Air, air family_: fires an ice spear at each of the _3_ nearest enemies, dealing damage and chilling for _4 turns_.
solomon.solomontriads.c_tailwind=Tailwind
solomon.solomontriads.c_tailwind_desc=_Air-Air, air family_: haste and levitation for _8 turns_. The spread form also turns you invisible for _3 turns_.
solomon.solomontriads.c_skyfall=Skyfall
solomon.solomontriads.c_skyfall_desc=_Earth-Air, air family_: soar to an empty tile up to _7 tiles_ away and crash down, hurting enemies within _1 tile_ and paralysing them for _1 turn_.
solomon.solomontriads.c_obsidian=Obsidian Prison
solomon.solomontriads.c_obsidian_desc=_Fire-Earth, earth family_: damages and burns one enemy, then walls it in for _10 turns_.
solomon.solomontriads.c_bog=Bog
solomon.solomontriads.c_bog_desc=_Water-Earth, earth family_: turns the ground within _1 tile_ of the chosen tile into a bog: light damage, rooted for _5 turns_ and crippled for _10_.
solomon.solomontriads.c_earthquake=Earthquake
solomon.solomontriads.c_earthquake_desc=_Air-Earth, earth family_: visible enemies within _4 tiles_ take damage and are paralysed for _2 turns_. Bosses and elites are crippled instead.
solomon.solomontriads.c_great_wall=Great Wall
solomon.solomontriads.c_great_wall_desc=_Earth-Earth, earth family_: raises a _5 tile_ wall across your line of sight at the chosen tile for _20 turns_.
solomon.solomontriads.c_fever=Fever
solomon.solomontriads.c_fever_desc=_Fire-Water, water family_: visible enemies within _5 tiles_ are badly poisoned and weakened for _8 turns_.
solomon.solomontriads.c_cleansing_rain=Cleansing Rain
solomon.solomontriads.c_cleansing_rain_desc=_Water-Water, water family_: heals _30%_ of your max HP, washes off every harmful state and gives a shield of _15%_ of your max HP. Allies within _4 tiles_ are healed too.
solomon.solomontriads.c_tidal_wave=Tidal Wave
solomon.solomontriads.c_tidal_wave_desc=_Air-Water, water family_: visible enemies within _3 tiles_ take light damage, are pushed back _3 tiles_ and chilled for _4 turns_.
solomon.solomontriads.c_petrify=Petrify
solomon.solomontriads.c_petrify_desc=_Earth-Water, water family_: turns one enemy to stone, paralysing it for _6 turns_. Bosses and elites are slowed and weakened for _5 turns_. The spread form also petrifies enemies within _1 tile_.
solomon.solomonspells.el_sulfur=Sulfur
solomon.solomonspells.el_mercury=Mercury
solomon.solomonspells.el_salt=Salt
solomon.solomonhooks.echo=echo!
solomon.solomonhooks.circle_kept=circle kept!
solomon.solomonprinciples.can_learn=You can grasp a new _principle_! Pick it with _Grasp Principle_ on the skill bar.
solomon.solomonprinciples.choose_title=Grasp a Principle
solomon.solomonprinciples.choose_msg=Choose one principle to grasp. The choice is permanent. A principle only combines in _pairs_ with an element or another principle. (The button on the right shows its description.)
solomon.solomonprinciples.learned=You grasp the principle of _%s_!
solomon.solomonprinciples.pairs_only=A principle only works in a pair of two symbols.
solomon.solomonprinciples.no_swap=You can't swap places with that enemy.
solomon.solomonprinciples.pr_sulfur_desc=_Sulfur (soul)_: the principle of combustion. Opens spells that burn and harvest souls.\n\nSulfur+Fire=Soulfire, Sulfur+Water=Brimstone Rain, Sulfur+Air=Soul Arrows, Sulfur+Earth=Brimstone Field, Sulfur+Sulfur=Soul Harvest\nSulfur+Mercury=Great Work, Sulfur+Salt=Soul Rend
solomon.solomonprinciples.pr_mercury_desc=_Mercury (spirit)_: the principle of melting and volatility. Opens spells that dissolve, flow and change.\n\nMercury+Fire=Volatile Burst, Mercury+Water=Dissolve, Mercury+Air=Quicksilver, Mercury+Earth=Exchange, Mercury+Mercury=Panacea\nMercury+Sulfur=Great Work, Mercury+Salt=Coagulate
solomon.solomonprinciples.pr_salt_desc=_Salt (body)_: the principle of the incombustible and the fixed. Opens spells that harden, protect and drive off evil.\n\nSalt+Fire=Fireproof Mail, Salt+Water=Salt Ward, Salt+Air=Salt Storm, Salt+Earth=Salt Fortress, Salt+Salt=Immutable\nSalt+Sulfur=Soul Rend, Salt+Mercury=Coagulate
solomon.solomonprinciples.p_soulfire=Soulfire
solomon.solomonprinciples.p_soulfire_desc=_Sulfur+Fire_: burns one enemy's soul for very heavy damage and sets it on fire. A kill with it returns _5_ mana.
solomon.solomonprinciples.p_brimstone=Brimstone Rain
solomon.solomonprinciples.p_brimstone_desc=_Sulfur+Water_: visible enemies within _3 tiles_ take light damage, are badly poisoned and covered in ooze.
solomon.solomonprinciples.p_soul_arrows=Soul Arrows
solomon.solomonprinciples.p_soul_arrows_desc=_Sulfur+Air_: _5_ soul arrows are shared out among the enemies in sight. Heals _20%_ of the damage dealt.
solomon.solomonprinciples.p_brimstone_field=Brimstone Field
solomon.solomonprinciples.p_brimstone_field_desc=_Sulfur+Earth_: burning brimstone covers the ground within _2 tiles_ of the chosen enemy: heavy damage, burning and _2 turns_ of rooting.
solomon.solomonprinciples.p_soul_harvest=Soul Harvest
solomon.solomonprinciples.p_soul_harvest_desc=_Sulfur+Sulfur_: reaps the souls of regular enemies in sight at _30%_ HP or less, felling them at once; the rest take damage. Each soul heals _10%_ of your max HP and gives _3_ mana.
solomon.solomonprinciples.p_volatile=Volatile Burst
solomon.solomonprinciples.p_volatile_desc=_Mercury+Fire_: throws volatile mercury that explodes within _2 tiles_ of where it lands.
solomon.solomonprinciples.p_dissolve=Dissolve
solomon.solomonprinciples.p_dissolve_desc=_Mercury+Water_: dissolves one enemy, dealing damage and leaving it vulnerable, weakened and hexed for _10 turns_.
solomon.solomonprinciples.p_quicksilver=Quicksilver
solomon.solomonprinciples.p_quicksilver_desc=_Mercury+Air_: flow to an empty tile up to _8 tiles_ away and gain haste for _6 turns_.
solomon.solomonprinciples.p_exchange=Exchange
solomon.solomonprinciples.p_exchange_desc=_Mercury+Earth_: swaps places with one enemy and paralyses it for _2 turns_; bosses and elites are crippled. Doesn't work on large or immovable enemies.
solomon.solomonprinciples.p_panacea=Panacea
solomon.solomonprinciples.p_panacea_desc=_Mercury+Mercury_: cures every harmful state, heals _15%_ of your max HP, and for _15 turns_ every spell costs _half_ its mana.
solomon.solomonprinciples.p_fireproof=Fireproof Mail
solomon.solomonprinciples.p_fireproof_desc=_Salt+Fire_: a shield of _25%_ of your max HP; for _15 turns_ you can't burn and your attacks set enemies on fire.
solomon.solomonprinciples.p_salt_ward=Salt Ward
solomon.solomonprinciples.p_salt_ward_desc=_Salt+Water_: cures every harmful state and gives a shield of _15%_ of your max HP. _Demons and undead_ within _4 tiles_ take heavy damage.
solomon.solomonprinciples.p_salt_storm=Salt Storm
solomon.solomonprinciples.p_salt_storm_desc=_Salt+Air_: visible enemies within _3 tiles_ take damage and are blinded for _5 turns_. Demons and undead take double damage.
solomon.solomonprinciples.p_salt_fortress=Salt Fortress
solomon.solomonprinciples.p_salt_fortress_desc=_Salt+Earth_: a ring of salt crystal walls rises _2 tiles_ around you for _10 turns_.
solomon.solomonprinciples.p_immutable=Immutable
solomon.solomonprinciples.p_immutable_desc=_Salt+Salt_: for _8 turns_ your body is as fixed as salt and takes _60%_ less damage.
solomon.solomonprinciples.p_great_work=Great Work
solomon.solomonprinciples.p_great_work_desc=_Sulfur+Mercury_: pours the alchemical Great Work into one enemy: enormous damage, burning and _8 turns_ of vulnerability.
solomon.solomonprinciples.p_soul_rend=Soul Rend
solomon.solomonprinciples.p_soul_rend_desc=_Sulfur+Salt_: tears one enemy's soul from its body, dealing _25%_ of its current HP (_10%_ for bosses and elites) plus extra damage, and heals as much.
solomon.solomonprinciples.p_coagulate=Coagulate
solomon.solomonprinciples.p_coagulate_desc=_Mercury+Salt_: every enemy in sight is slowed and crippled for _6 turns_, and you gain haste for _4 turns_.
solomon.solomonprinciples$elixir.name=Panacea
solomon.solomonprinciples$elixir.desc=The panacea halves the mana every spell costs.\n\nTurns remaining: %s.
solomon.solomonprinciples$immutable.name=Immutable
solomon.solomonprinciples$immutable.desc=Your body, fixed like salt, takes 60%% less damage.\n\nTurns remaining: %s.
actors.hero.talent.sol_insight.title=Sage's Insight
actors.hero.talent.sol_insight.desc=Raises your max mana.\n\n_+1:_ max mana _+3_\n\n_+2:_ max mana _+6_
actors.hero.talent.sol_deftness.title=Deft Hands
actors.hero.talent.sol_deftness.desc=You draw symbols faster.\n\n_+1:_ _0.4 turns_ per symbol\n\n_+2:_ _0.3 turns_ per symbol
actors.hero.talent.sol_lore.title=Goetic Lore
actors.hero.talent.sol_lore.desc=Recording a demon in the Lemegeton gives more wisdom.\n\n_+1:_ _+1_ wisdom per demon\n\n_+2:_ _+2_ wisdom per demon
actors.hero.talent.sol_ward.title=Warding Seal
actors.hero.talent.sol_ward.desc=Every spell gives a shield that grows with your level.\n\n_+1:_ _1 + level/5_\n\n_+2:_ twice that
actors.hero.talent.sol_meditation.title=Meditative Meal
actors.hero.talent.sol_meditation.desc=Eating takes _1 turn_ and refills mana.\n\n_+1:_ _30%_ of your max mana\n\n_+2:_ _60%_ of your max mana
actors.hero.talent.sol_focus.title=Focus
actors.hero.talent.sol_focus.desc=Mana refills faster.\n\n_+1:_ _15%_ faster\n\n_+2:_ _30%_ faster
actors.hero.talent.sol_pact.title=Binding Pact
actors.hero.talent.sol_pact.desc=Summoned demons stay longer and are tougher.\n\n_+1:_ _10_ more turns, _+20%_ HP\n\n_+2:_ _20_ more turns, _+40%_ HP
actors.hero.talent.sol_echo.title=Mana Echo
actors.hero.talent.sol_echo.desc=Casting a spell has a chance to give back all the mana it cost.\n\n_+1:_ _10%_ chance\n\n_+2:_ _20%_ chance
actors.hero.talent.sol_elemental.title=Elemental Affinity
actors.hero.talent.sol_elemental.desc=The one-symbol basic spells (Fire Bolt, Water Lash, Wind Blade, Stone Skin) get stronger.\n\n_+1:_ _+25%_ power\n\n_+2:_ _+50%_ power
actors.hero.talent.sol_triad.title=Truth of Three
actors.hero.talent.sol_triad.desc=Three-symbol spells cost less mana.\n\n_+1:_ _10%_ less\n\n_+2:_ _20%_ less\n\n_+3:_ _30%_ less
actors.hero.talent.sol_legion.title=Call of the Legion
actors.hero.talent.sol_legion.desc=Summoning a demon costs less mana.\n\n_+1:_ _15%_ less\n\n_+2:_ _30%_ less\n\n_+3:_ _45%_ less
actors.hero.talent.magus_overload.title=Overload
actors.hero.talent.magus_overload.desc=Raises the power of every spell.\n\n_+1:_ _8%_\n\n_+2:_ _16%_\n\n_+3:_ _24%_
actors.hero.talent.magus_circle.title=Twin Circle
actors.hero.talent.magus_circle.desc=After a spell the symbols sometimes stay in the circle, so the same spell can be cast again at once.\n\n_+1:_ _15%_ chance\n\n_+2:_ _30%_ chance\n\n_+3:_ _45%_ chance
actors.hero.talent.magus_siphon.title=Mana Siphon
actors.hero.talent.magus_siphon.desc=Felling an enemy with a spell returns mana.\n\n_+1:_ _1_ mana\n\n_+2:_ _2_ mana\n\n_+3:_ _3_ mana
actors.hero.talent.master_brand.title=Brand of Dominion
actors.hero.talent.master_brand.desc=Summoned demons deal more damage.\n\n_+1:_ _15%_\n\n_+2:_ _30%_\n\n_+3:_ _45%_
actors.hero.talent.master_offering.title=Offering
actors.hero.talent.master_offering.desc=When a summoned demon falls or its pact ends, its power returns to Solomon.\n\n_+1:_ heal _5%_ of max HP, _2_ mana\n\n_+2:_ _10%_, _4_ mana\n\n_+3:_ _15%_, _6_ mana
actors.hero.talent.master_kings.title=Summoning of Kings
actors.hero.talent.master_kings.desc=More of the Lemegeton's demons appear in the summoning list.\n\n_+1:_ _+3_ choices\n\n_+2:_ _+6_ choices\n\n_+3:_ _+9_ choices and _+1_ demon at once
