items.predatormaw.prompt_more=You can swallow one more (cancel to stop eating)
items.mirrorrelics$goldenmaw.name=golden maw
items.mirrorrelics$goldenmaw.desc=A maw lined with teeth of pure gold. It smacks its lips lazily, as if remembering a feast that never ended.
items.mirrorrelics$goldenmaw.bonus=_Mirror's blessing:_ Devour points are increased by _25%_, and it can swallow up to _2_ items per use.
items.mirrorrelics$blackcard.name=black card
items.mirrorrelics$blackcard.desc=A black card said to have no limit. Holding it makes everything in the world look cheap.
items.mirrorrelics$blackcard.bonus=_Mirror's blessing:_ All payments cost _25%_ less, and you earn _2%_ interest on carried gold every new floor regardless of subclass. For a Banker, this adds to the rate.
items.mirrorrelics$blooddrum.name=drum of blood
items.mirrorrelics$blooddrum.desc=A war drum stretched with darkened, blood-soaked hide. It beats like a heart even when untouched.
items.mirrorrelics$blooddrum.bonus=_Mirror's blessing:_ Maximum charges are increased by _1_, and it recharges _25%_ faster.
items.mirrorrelics$eternalcrown.name=eternal crown
items.mirrorrelics$eternalcrown.desc=A crown shining white. It is flawless, like that of a king who was never once dethroned.
items.mirrorrelics$eternalcrown.bonus=_Mirror's blessing:_ Maximum charges are increased by _1_, and maximum dignity by _5_.
items.mirrorrelics$forbiddenperfume.name=forbidden perfume
items.mirrorrelics$forbiddenperfume.desc=A deep violet perfume. Your head swims before you even open it.
items.mirrorrelics$forbiddenperfume.bonus=_Mirror's blessing:_ Maximum charges are increased by _1_, and charms last _25%_ longer.
items.mirrorrelics$shatteredmirror.name=shattered mirror
items.mirrorrelics$shatteredmirror.desc=A cracked hand mirror. Every shard reflects someone different.
items.mirrorrelics$shatteredmirror.bonus=_Mirror's blessing:_ Maximum charges are increased by _1_, and bestiary abilities are _25%_ stronger.
items.mirrorrelics$eternalpillow.name=eternal pillow
items.mirrorrelics$eternalpillow.desc=A pillow as deep blue as the night sky. Once your head is on it, you never want to get up again.
items.mirrorrelics$eternalpillow.bonus=_Mirror's blessing:_ The pillow holds _1_ more charge, and you can command _1_ more dream puppet.
