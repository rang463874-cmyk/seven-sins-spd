actors.hero.heroclass.sloth=sloth
actors.hero.heroclass.sloth_desc_short=Bearer of the sin of _Sloth_. Sloth builds torpor _the longer they stay put_, growing sturdier, and defeating enemies in that state makes them _permanently stronger_.
actors.hero.heroclass.sloth_desc=Sloth starts with the _Cozy Pillow_, which takes no equipment slot. The pillow recharges over time, and its charges power _Nap_, _Shoo_, _Yawn_ and _Roll_.\n\nEvery turn without moving builds 1 _torpor_ (up to 20), raising armor and regenerating health at 10 or more. Moving clears it. Defeating an enemy with _5 or more_ torpor grants _sloth points_, which raise melee damage, accuracy, max HP, armor and evasion without limit.\n\nSloth starts with a _cudgel_ and knows _potions of healing_ and _scrolls of recharging_.
actors.hero.heroclass.sloth_unlock=Sloth is unlocked from the start.

actors.hero.herosubclass.hibernator=hibernator
actors.hero.herosubclass.hibernator_short_desc=The _Hibernator_ builds up to _40_ torpor, gets _50%_ more armor from it, and regenerates faster.
actors.hero.herosubclass.hibernator_desc=The Hibernator endures like a bear in winter. Maximum torpor is increased by _20_, armor from torpor is increased by _50%_, and regeneration is faster.\n\nThe Hibernator's talents further boost armor and regeneration, or raise maximum torpor even more.
actors.hero.herosubclass.sleeping_lion=sleeping lion
actors.hero.herosubclass.sleeping_lion_short_desc=The _Sleeping Lion's_ melee attacks with 5 or more torpor deal _5%_ more damage per torpor, unleashing it all at once.
actors.hero.herosubclass.sleeping_lion_desc=The Sleeping Lion lies still, then pounces. A melee attack with _5 or more_ torpor deals _5%_ more damage per torpor and spends all of it. Defeating an enemy with that blow grants sloth points for the torpor spent.\n\nThe Sleeping Lion's talents strengthen the pounce, keep some torpor afterward, or terrify enemies near a victim.

actors.hero.talent.sloth_idle.title=idling
actors.hero.talent.sloth_idle.desc=_+1:_ Sloth points gained are increased by _15%_.\n\n_+2:_ Sloth points gained are increased by _30%_.
actors.hero.talent.sloth_comfy.title=comfy position
actors.hero.talent.sloth_comfy.desc=Increases maximum torpor.\n\n_+1:_ _+5_\n\n_+2:_ _+10_
actors.hero.talent.sloth_snore.title=snoring
actors.hero.talent.sloth_snore.desc=Regeneration from torpor is faster. (base 1 per 6 turns)\n\n_+1:_ every _5 turns_\n\n_+2:_ every _4 turns_
actors.hero.talent.sloth_linger.title=dawdling
actors.hero.talent.sloth_linger.desc=Some torpor remains after moving.\n\n_+1:_ keep _25%_\n\n_+2:_ keep _50%_
actors.hero.talent.sloth_pillow.title=fluffy pillow
actors.hero.talent.sloth_pillow.desc=Increases the pillow's maximum charges. (base 3)\n\n_+1:_ _4_\n\n_+2:_ _5_
actors.hero.talent.sloth_restful.title=sound sleep
actors.hero.talent.sloth_restful.desc=The pillow recharges faster.\n\n_+1:_ _20%_ faster\n\n_+2:_ _40%_ faster
actors.hero.talent.sloth_roll.title=roly-poly
actors.hero.talent.sloth_roll.desc=Roll goes farther. (base 3 tiles)\n\n_+1:_ _4 tiles_\n\n_+2:_ _5 tiles_
actors.hero.talent.sloth_yawn.title=contagious yawn
actors.hero.talent.sloth_yawn.desc=Yawn covers a larger area. (base 2 tiles)\n\n_+1:_ _3 tiles_\n\n_+2:_ _4 tiles_
actors.hero.talent.sloth_shove.title=can't be bothered
actors.hero.talent.sloth_shove.desc=Shoo pushes enemies farther and harder.\n\n_+1:_ _+1_ distance, _2x_ damage\n\n_+2:_ _+2_ distance, _3x_ damage
actors.hero.talent.sloth_apathy.title=apathy
actors.hero.talent.sloth_apathy.desc=All stat bonuses from sloth points are increased, including points already earned.\n\n_+1:_ _10%_\n\n_+2:_ _20%_\n\n_+3:_ _30%_
actors.hero.talent.sloth_snooze.title=five more minutes
actors.hero.talent.sloth_snooze.desc=Napping removes harmful effects. Hunger is not removed.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_
actors.hero.talent.hib_thick.title=thick blubber
actors.hero.talent.hib_thick.desc=Armor from torpor is increased further. (base 50%)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_
actors.hero.talent.hib_dream.title=long dreams
actors.hero.talent.hib_dream.desc=Regeneration is even faster.\n\n_+1:_ _-1 turn_ between heals\n\n_+2:_ _-2 turns_\n\n_+3:_ _-3 turns_
actors.hero.talent.hib_deep.title=deep hibernation
actors.hero.talent.hib_deep.desc=Maximum torpor is increased further.\n\n_+1:_ _+10_\n\n_+2:_ _+20_\n\n_+3:_ _+30_
actors.hero.talent.lion_pounce.title=pounce
actors.hero.talent.lion_pounce.desc=The Sleeping Lion's pounce is stronger.\n\n_+1:_ _6%_ per torpor\n\n_+2:_ _7%_\n\n_+3:_ _8%_
actors.hero.talent.lion_wake.title=light sleeper
actors.hero.talent.lion_wake.desc=Some torpor remains after a pounce.\n\n_+1:_ _20%_\n\n_+2:_ _40%_\n\n_+3:_ _60%_
actors.hero.talent.lion_roar.title=roar
actors.hero.talent.lion_roar.desc=Defeating an enemy with a pounce _terrifies_ enemies within 3 tiles.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_
actors.hero.talent.slumber_reach.title=dreamland
actors.hero.talent.slumber_reach.desc=Eternal Slumber reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.slumber_deep.title=coma
actors.hero.talent.slumber_deep.desc=Enemies put to sleep by Eternal Slumber stay unable to act briefly even when hit.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.slumber_rest.title=serenity
actors.hero.talent.slumber_rest.desc=Each enemy put to sleep by Eternal Slumber heals you.\n\n_+1:_ _5%_ of max HP\n\n_+2:_ _10%_\n\n_+3:_ _15%_\n\n_+4:_ _20%_
actors.hero.talent.stag_reach.title=stagnant time
actors.hero.talent.stag_reach.desc=Stagnation reaches farther. (base 4 tiles)\n\n_+1:_ _6 tiles_\n\n_+2:_ _8 tiles_\n\n_+3:_ _10 tiles_\n\n_+4:_ _12 tiles_
actors.hero.talent.stag_duration.title=endless afternoon
actors.hero.talent.stag_duration.desc=Stagnation lasts longer. (base 6 turns)\n\n_+1:_ _8 turns_\n\n_+2:_ _10 turns_\n\n_+3:_ _12 turns_\n\n_+4:_ _14 turns_
actors.hero.talent.stag_cripple.title=bog
actors.hero.talent.stag_cripple.desc=Enemies hit by Stagnation are _crippled_.\n\n_+1:_ _2 turns_\n\n_+2:_ _4 turns_\n\n_+3:_ _6 turns_\n\n_+4:_ _8 turns_
actors.hero.talent.nap_shield.title=under the covers
actors.hero.talent.nap_shield.desc=Fortified Nap grants more shielding.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.nap_heal.title=refreshed
actors.hero.talent.nap_heal.desc=Fortified Nap heals you.\n\n_+1:_ _10%_ of max HP\n\n_+2:_ _20%_\n\n_+3:_ _30%_\n\n_+4:_ _40%_
actors.hero.talent.nap_dreams.title=sweet dreams
actors.hero.talent.nap_dreams.desc=Fortified Nap recharges the pillow.\n\n_+1:_ _0.5 charges_\n\n_+2:_ _1 charge_\n\n_+3:_ _1.5 charges_\n\n_+4:_ _2 charges_

actors.hero.abilities.sloth.eternalslumber.name=eternal slumber
actors.hero.abilities.sloth.eternalslumber.short_desc=Puts _every visible enemy_ into a deep sleep.
actors.hero.abilities.sloth.eternalslumber.desc=Every visible enemy within 4 tiles falls into a _magical sleep_. Sleeping enemies wake when attacked. Bosses don't fall asleep.
actors.hero.abilities.sloth.stagnation.name=stagnation
actors.hero.abilities.sloth.stagnation.short_desc=Brings the world down to Sloth's pace. Every visible enemy is _slowed_.
actors.hero.abilities.sloth.stagnation.desc=Every visible enemy within 4 tiles is slowed for _6 turns_. Works on bosses too.
actors.hero.abilities.sloth.fortifiednap.name=fortified nap
actors.hero.abilities.sloth.fortifiednap.short_desc=Curls up for a nap, gaining a _large shield_ and _instantly maxing_ torpor.
actors.hero.abilities.sloth.fortifiednap.desc=Fills torpor to its maximum and grants shielding equal to _10 + level + torpor_.

actors.buffs.slothrepose.name=torpor
actors.buffs.slothrepose.desc_head=Sloth points: _%d_\nTorpor: _%d/%d_ (armor _+%d_)\nPillow charges: _%d/%d_
actors.buffs.slothrepose.desc_stats=Bonus melee damage: _+%d_\nAccuracy: _+%d%%_\nMax HP: _+%d_\nBonus armor: _0-%d_\nEvasion: _+%d%%_
actors.buffs.slothrepose.pounce=pounce
