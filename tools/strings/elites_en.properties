elites.sinelite.desc_0=Possessed by _gluttony_. Its hits steal your satiety and heal it, and it shrugs off a little of every blow.
elites.sinelite.desc_1=Possessed by _greed_. Every hit steals some of your gold, and it is a little keener than its kind. Kill it to get back twice what it took.
elites.sinelite.desc_2=Possessed by _wrath_. It hits harder the more it is hurt, and when it spots you it riles up the monsters around it.
elites.sinelite.desc_3=Possessed by _pride_. A barrier of pride (20% of its health) returns whenever it goes 4 turns without being hit.
elites.sinelite.desc_4=Possessed by _lust_. Its hits drink a little of your life and may charm you.
elites.sinelite.desc_5=Possessed by _envy_. It is much keener than its kind, and its hits strip one of your positive effects.
elites.sinelite.desc_6=Possessed by _sloth_. It is found asleep, but once woken it moves and strikes in a frenzy for a while.
elites.sinelite.desc_common=Sin elites have 50% more health, give double experience and drop a _sin essence_. Slaying an elite of your own sin also feeds your sin.
elites.sinelite.greed_steal=It snatched %d gold from you!
elites.sinelite.wrath_roar=Roar!
elites.sinelite.pride_shield=Pride!
elites.sinelite.envy_steal=Mine!
elites.sinelite.sloth_wake=Frenzy!
elites.sinelite.own_sin=Devouring the %s sin feeds your own.
actors.mobs.elites.regionelite.skill_kill=Killed by the %s...
actors.mobs.elites.ratchieftain.name=rat chieftain
actors.mobs.elites.ratchieftain.desc=A huge, scarred rat that rules the sewers. It squeals for its brood and rushes in straight lines, and its bites leave bleeding wounds.\n\nIts techniques are marked on the ground a moment before they land.
actors.mobs.elites.ratchieftain.notice=Skreeee!
actors.mobs.elites.ratchieftain.skill_squeal=Squeal!
actors.mobs.elites.ratchieftain.skill_rush=Rush!
actors.mobs.elites.chainwarden.name=escaped chief jailer
actors.mobs.elites.chainwarden.desc=The prison's chief jailer, who broke his own chains. He hurls a chain down a marked line to drag his prey close, and slams the ground around himself.\n\nHis techniques are marked on the ground a moment before they land.
actors.mobs.elites.chainwarden.notice=Back in your cell, prisoner!
actors.mobs.elites.chainwarden.skill_chain=Chain!
actors.mobs.elites.chainwarden.skill_slam=Slam!
actors.mobs.elites.gnollforeman.name=gnoll foreman
actors.mobs.elites.gnollforeman.desc=The overseer of the gnoll mines, armed with a satchel of bombs. He lobs clusters of bombs at marked tiles and brings the ceiling down on intruders.\n\nHis techniques are marked on the ground a moment before they land.
actors.mobs.elites.gnollforeman.notice=Intruder! Fire in the hole!
actors.mobs.elites.gnollforeman.skill_bomb=Bomb!
actors.mobs.elites.gnollforeman.skill_cavein=Cave-in!
actors.mobs.elites.fallenpriest.name=fallen priest
actors.mobs.elites.fallenpriest.desc=A priest of the dwarven city who now serves the demons. He blesses every monster around him and curses the ground in an X through his foes.\n\nHis curses are marked on the ground a moment before they land.
actors.mobs.elites.fallenpriest.notice=Kneel before the new gods!
actors.mobs.elites.fallenpriest.skill_bless=Blessing!
actors.mobs.elites.fallenpriest.skill_curse=Curse!
actors.mobs.elites.hellhound.name=hellhound
actors.mobs.elites.hellhound.desc=One of a pair of demonic hounds that hunt the halls together. It pounces onto marked ground and breathes fire down marked lines. If its twin falls, it flies into a rage.\n\nIts techniques are marked on the ground a moment before they land.
actors.mobs.elites.hellhound.desc_enraged=_Enraged:_ its twin is dead. It hits 50% harder and attacks faster.
actors.mobs.elites.hellhound.notice=Grrrrr...
actors.mobs.elites.hellhound.skill_pounce=Pounce!
actors.mobs.elites.hellhound.skill_breath=Hellfire!
actors.mobs.elites.hellhound.enraged=Enraged!
actors.mobs.elites.hellhound.yell_enraged=AWOOOOOOO!
