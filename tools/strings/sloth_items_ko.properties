items.slothpillow.name=안락한 베개
items.slothpillow.desc=폭신폭신한 푸른 베개입니다. 끌어안고 있으면 아무것도 하기 싫어집니다. 유물/반지 칸에 착용하는 유물이며, 착용해야 기술을 쓸 수 있습니다.\n\n베개로 대신 싸워줄 _꿈 인형_을 부르고, 쉬고, 인형과 자리를 바꾸고, 적을 재우고, 인형들에게 적을 지목하고, 꿈속에서 장비를 강화하기까지 합니다. 대가는 시간입니다. 기술을 쓸 때마다 _낮잠_에 빠져 몇 턴 동안 아무것도 할 수 없습니다. 그동안 싸우는 건 인형의 몫입니다.
items.slothpillow.ac_laze=빈둥대기
items.slothpillow.prompt=무엇을 할까요? (충전 %d / %d, 꿈 인형 %d / %d)
items.slothpillow.opt_summon=꿈 인형 소환 (%d)
items.slothpillow.opt_mend=꿈 인형 완전 회복 (%d)
items.slothpillow.opt_nap=낮잠 (%d)
items.slothpillow.opt_swap=바꿔치기 (%d)
items.slothpillow.opt_yawn=하품 (%d)
items.slothpillow.prompt_swap=자리를 바꿀 꿈 인형을 선택하세요
items.slothpillow.not_puppet=그곳에는 꿈 인형이 없다.
items.slothpillow.no_room=인형을 부를 자리가 없다.
items.slothpillow.yawn_none=하품이 나왔지만 아무도 따라 하지 않았다.
items.armor.slotharmor.name=나태의 잠옷
items.armor.slotharmor.desc=두툼하고 포근한 잠옷입니다. 갑옷이라기엔 너무 편해서 좀처럼 벗고 싶지 않습니다.
items.slothpillow.skill_header=꿈 인형 %d / %d
items.slothpillow.skill_summon=꿈 인형 소환
items.slothpillow.skill_mend=꿈 인형 회복
items.slothpillow.skill_summon_desc=곁에 꿈 인형을 소환합니다. 최대 _%d마리_까지 거느릴 수 있고, 모두 나와 있으면 대신 인형들을 완전히 회복합니다. 인형이 하나 나와 있을 때마다 사라질 때까지 최대 체력의 _%d%%_를 빌려 갑니다.
items.slothpillow.skill_nap=낮잠
items.slothpillow.skill_nap_desc=최대 체력의 10%를 회복하고, 모든 꿈 인형이 체력 25%를 회복합니다.
items.slothpillow.skill_swap=바꿔치기
items.slothpillow.skill_swap_desc=보이는 꿈 인형과 자리를 바꿉니다.
items.slothpillow.skill_yawn=하품
items.slothpillow.skill_yawn_desc=주변 _%d칸_ 안의 적을 잠재웁니다. 보스는 잠들지 않습니다.
items.slothpillow.skill_order=꿈의 지령
items.slothpillow.skill_order_desc=보이는 적 하나를 꿈 인형들에게 지목합니다. 층 어디에 있든 모든 인형이 하던 일을 멈추고 그 적을 쫓으며, _%2$d턴_ 동안 또는 적이 쓰러질 때까지 그 적에게 주는 피해가 _%1$d%%_ 늘어납니다. 한 번에 한 적만 지목할 수 있습니다.
items.slothpillow.skill_forge=꿈의 대장간
items.slothpillow.skill_forge_desc=_200턴(강화 수치당 +25, 최대 300턴)_ 동안 깊은 잠에 빠져, 장착한 무기나 갑옷이 _1단계 강해지는_ 꿈을 꿉니다. 적이 보일 때는 잠들 수 없고, 자는 동안 조금이라도 피해를 입으면 깨어나며 꿈은 사라집니다. 자는 동안에도 꿈 인형들은 곁을 지킵니다. 층마다 한 번만 쓸 수 있습니다.\n\n%s
items.slothpillow.forge_ready=_이번 층에서 아직 쓰지 않았습니다._
items.slothpillow.forge_used=_이번 층에서 이미 썼습니다._
items.slothpillow.prompt_order=인형들이 쫓을 적을 선택하세요
items.slothpillow.not_enemy=그곳에는 적이 없다.
items.slothpillow.order_shout=물어!
items.slothpillow.forge_enemies=적이 보이는 곳에서는 잠들 수 없다.
items.slothpillow.forge_prompt=어떤 장비의 꿈을 꿀까요? 피해를 입으면 깨어납니다.
items.slothpillow.forge_option=%s (%d턴)
items.slothpillow.forge_start=베개를 끌어안고 %s의 꿈속으로 깊이 빠져듭니다... (%d턴)
