items.slothpillow.name=안락한 베개
items.slothpillow.desc=폭신폭신한 푸른 베개입니다. 끌어안고 있으면 아무것도 하기 싫어집니다. 장비 칸을 차지하지 않습니다.\n\n베개의 _충전_을 써서 대신 싸워줄 _꿈 인형_을 부르고, 쉬고, 인형과 자리를 바꾸고, 적을 재웁니다. 충전은 시간이 지나면 차오릅니다.
items.slothpillow.ac_laze=빈둥대기
items.slothpillow.prompt=무엇을 할까요? (충전 %d / %d, 꿈 인형 %d / %d)
items.slothpillow.opt_summon=꿈 인형 소환 (%d)
items.slothpillow.opt_mend=꿈 인형 완전 회복 (%d)
items.slothpillow.opt_nap=낮잠 (%d)
items.slothpillow.opt_swap=바꿔치기 (%d)
items.slothpillow.opt_yawn=하품 (%d)
items.slothpillow.prompt_swap=자리를 바꿀 꿈 인형을 선택하세요
items.slothpillow.not_puppet=그곳에는 꿈 인형이 없다.
items.slothpillow.no_room=인형을 부를 자리가 없다.
items.slothpillow.yawn_none=하품이 나왔지만 아무도 따라 하지 않았다.
items.armor.slotharmor.name=나태의 잠옷
items.armor.slotharmor.desc=두툼하고 포근한 잠옷입니다. 갑옷이라기엔 너무 편해서 좀처럼 벗고 싶지 않습니다.
items.slothpillow.skill_header=충전 %d / %d · 꿈 인형 %d / %d
items.slothpillow.skill_summon=꿈 인형 소환
items.slothpillow.skill_mend=꿈 인형 회복
items.slothpillow.skill_summon_desc=곁에 꿈 인형을 소환합니다. 최대 _%d마리_까지 거느릴 수 있고, 모두 나와 있으면 대신 인형들을 완전히 회복합니다.
items.slothpillow.skill_nap=낮잠
items.slothpillow.skill_nap_desc=최대 체력의 10%를 회복하고, 모든 꿈 인형이 체력 25%를 회복합니다.
items.slothpillow.skill_swap=바꿔치기
items.slothpillow.skill_swap_desc=보이는 꿈 인형과 자리를 바꿉니다.
items.slothpillow.skill_yawn=하품
items.slothpillow.skill_yawn_desc=주변 _%d칸_ 안의 적을 잠재웁니다. 보스는 잠들지 않습니다.
