items.slothpillow.name=안락한 베개
items.slothpillow.desc=폭신폭신한 푸른 베개입니다. 끌어안고 있으면 아무것도 하기 싫어집니다. 장비 칸을 차지하지 않습니다.\n\n베개의 _충전_을 써서 쉬고, 귀찮은 것들을 쫓아내고, 재웁니다. 충전은 시간이 지나면 차오릅니다. 제자리에서 _무기력_을 쌓은 채로 적을 쓰러뜨리면 _나태 점수_가 쌓여 영구적으로 강해집니다.
items.slothpillow.ac_laze=뒹굴기
items.slothpillow.prompt=뭘 할까요... (충전 %d/%d)
items.slothpillow.opt_nap=낮잠 (충전 %d)
items.slothpillow.opt_shoo=저리 가 (충전 %d)
items.slothpillow.opt_yawn=하품 (충전 %d)
items.slothpillow.opt_roll=굴러가기 (충전 %d)
items.slothpillow.prompt_roll=굴러갈 칸을 선택하세요 (최대 %d칸, 무기력 유지)
items.slothpillow.nobody_near=주변에 쫓아낼 적이 없다.
items.slothpillow.yawn_none=하품을 했지만 따라 조는 적은 없다.
items.slothpillow.bad_cell=그곳으로는 굴러갈 수 없다.
items.armor.slotharmor.name=나태의 잠옷
items.armor.slotharmor.desc=두툼하고 포근한 잠옷입니다. 갑옷이라기엔 너무 편해서 좀처럼 벗고 싶지 않습니다.
