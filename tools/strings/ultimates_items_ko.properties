###### Seven Sins: ultimates ######
sins.ultimateskills.can_learn=%d레벨에 도달했다! 스킬 바의 _궁극기 배우기_로 궁극기를 하나 고를 수 있다.
sins.ultimateskills.learn=궁극기 배우기
sins.ultimateskills.learn_desc=_%d레벨_과 _%d레벨_에 칠죄종의 궁극기 세 가지 중 하나를 골라 배웁니다. 한 번 고르면 바꿀 수 없습니다.\n\n궁극기는 자원을 쓰지 않고, 쓰고 나면 재사용 대기시간이 지나야 다시 쓸 수 있습니다.
sins.ultimateskills.choose_title=%d레벨 궁극기
sins.ultimateskills.choose_msg=배울 궁극기를 하나 고르세요. 한 번 고르면 바꿀 수 없습니다. (오른쪽 버튼으로 설명을 볼 수 있습니다)
sins.ultimateskills.learned=궁극기 _%s_(을)를 배웠다!
sins.ultimateskills.cooldown=재사용 대기 %d턴 (남은 %d턴)
sins.ultimateskills.cooldown_info=재사용 대기시간: _%d턴_
sins.ultimateskills.prompt=대상을 고르세요
sins.ultimateskills.no_target=그곳에는 대상이 없다.
sins.ultimateskills.not_adjacent=바로 옆의 적에게만 쓸 수 있다.
sins.ultimateskills.no_boss=보스에게는 통하지 않는다.
sins.ultimateskills.no_charmed=시야에 매혹된 적이 없다.
sins.ultimateskills.no_room=소환할 자리가 없다.
sins.ultimateskills.blocked=막았다!
actors.buffs.ultimatebook.effect_desc=%s\n\n남은 턴: %s.
actors.buffs.ultimatebook.effect_count=남은 방어 횟수: _%d번_
sins.ultimate.devour=대식
sins.ultimate.devour_desc=바로 옆의 적 하나를 집어삼킵니다. 체력이 _35%%_ 이하인 일반 적은 즉시 먹어 치우고 최대 체력의 _20%%_를 회복하며 포만감을 채웁니다. 그렇지 않으면 _%d~%d_ 피해를 줍니다.
sins.ultimate.acid_rain=위액 폭우
sins.ultimate.acid_rain_desc=주변 _3칸_ 안에 보이는 적들에게 _%d~%d_ 피해를 주고 _점액_과 _약화_(10턴)를 겁니다.
sins.ultimate.iron_stomach=강철 위장
sins.ultimate.iron_stomach_desc=_20턴_ 동안 받는 피해가 _35%_ 줄어듭니다.
sins.ultimate.iron_stomach_buff=받는 피해가 35% 줄어듭니다.
sins.ultimate.abyss_maw=심연의 아가리
sins.ultimate.abyss_maw_desc=주변 _5칸_ 안에 보이는 적들을 곁으로 끌어당기고 _%d~%d_ 피해를 줍니다. 그 뒤 체력이 _25%%_ 이하로 남은 일반 적은 삼켜 버립니다.
sins.ultimate.feast=대만찬
sins.ultimate.feast_desc=포만감과 체력을 모두 채우고, 해로운 상태를 모두 풀며, 최대 체력의 _25%_만큼 방어막을 얻습니다.
sins.ultimate.glutton_avatar=탐식의 화신
sins.ultimate.glutton_avatar_desc=_20턴_ 동안 주는 피해가 _50%_ 늘고, 공격으로 준 피해의 _25%_만큼 회복합니다.
sins.ultimate.glutton_avatar_buff=주는 피해 +50%, 공격 피해의 25%를 흡수합니다.
sins.ultimate.gold_storm=황금 폭풍
sins.ultimate.gold_storm_desc=주변 _4칸_ 안에 보이는 적들에게 금화를 퍼부어 _%d~%d_ 피해를 줍니다. 지닌 금화 100골드당 피해가 1씩 늘어납니다. (최대 레벨의 3배)
sins.ultimate.bounty=현상금
sins.ultimate.bounty_desc=적 하나에게 _30턴_ 동안 현상금을 겁니다. 그 적은 받는 피해가 _30%%_ 늘고, 죽으면 금화 _%d_골드를 떨어뜨리며 결제 한도가 최대치의 _25%%_만큼 찹니다.
sins.ultimate.bounty_buff=받는 피해가 30% 늘고, 죽으면 금화를 떨어뜨립니다.
sins.ultimate.gold_armor=황금 갑주
sins.ultimate.gold_armor_desc=_20턴_ 동안 받는 피해를 먼저 _결제 한도_로 막습니다. (피해 1당 한도 1)
sins.ultimate.gold_armor_buff=받는 피해를 결제 한도로 대신 냅니다.
sins.ultimate.midas=미다스의 손
sins.ultimate.midas_desc=보이는 적 하나를 황금으로 바꿉니다. 일반 적은 즉시 죽고 금화 _%d_골드가 됩니다. 보스와 정예는 최대 체력의 _15%%_ 피해를 입습니다.
sins.ultimate.compound=복리
sins.ultimate.compound_desc=결제 한도를 가득 채우고, 지닌 금화의 _10%%_를 이자로 얻습니다. (최대 _%d_골드)
sins.ultimate.golden_age=황금 시대
sins.ultimate.golden_age_desc=_25턴_ 동안 모든 결제 기술을 _공짜로_ 쓰고, 주는 피해가 _30%_ 늘어납니다.
sins.ultimate.golden_age_buff=결제 기술이 공짜이고 주는 피해가 30% 늘어납니다.
sins.ultimate.quake=대지 강타
sins.ultimate.quake_desc=땅을 내리쳐 주변 _2칸_ 안의 적들에게 _%d~%d_ 피해를 주고 _2턴_ 동안 마비시킵니다. (보스는 마비되지 않습니다)
sins.ultimate.blood_rage=피의 분노
sins.ultimate.blood_rage_desc=분노를 가득 채우고, _20턴_ 동안 주는 피해가 _40%_ 늘어납니다. 대신 받는 피해도 _15%_ 늘어납니다.
sins.ultimate.blood_rage_buff=주는 피해 +40%, 받는 피해 +15%.
sins.ultimate.vendetta=복수의 낙인
sins.ultimate.vendetta_desc=적 하나에게 _25턴_ 동안 낙인을 찍습니다. 그 적은 모든 피해를 _50%_ 더 받고, 죽으면 분노가 가득 찹니다.
sins.ultimate.vendetta_buff=모든 피해를 50% 더 받습니다.
sins.ultimate.berserk=광전사
sins.ultimate.berserk_desc=_15턴_ 동안 체력이 _1_ 아래로 떨어지지 않고, 주는 피해가 _50%_ 늘어납니다.
sins.ultimate.berserk_buff=쓰러지지 않고, 주는 피해가 50% 늘어납니다.
sins.ultimate.eruption=분노 폭발
sins.ultimate.eruption_desc=쌓인 분노를 모두 터뜨려 주변 _6칸_ 안에 보이는 적들에게 _%d~%d_ + _분노의 60%%_만큼 피해를 줍니다.
sins.ultimate.war_drums=전쟁의 북소리
sins.ultimate.war_drums_desc=주변 _8칸_ 안에 보이는 일반 적들을 _15턴_ 동안 광란에 빠뜨려 서로 싸우게 합니다.
sins.ultimate.judgment=왕의 심판
sins.ultimate.judgment_desc=적 하나에게 심판의 빛을 쏘아 _%d~%d_ 피해를 줍니다. 위엄의 피해 보너스가 붙습니다.
sins.ultimate.kneel=부복하라
sins.ultimate.kneel_desc=시야의 모든 일반 적을 _3턴_ 동안 마비시킵니다. 보스와 정예는 _5턴_ 동안 약화됩니다.
sins.ultimate.aegis=불가침
sins.ultimate.aegis_desc=_30턴_ 동안 적에게 받는 다음 공격 _3번_을 완전히 막아 냅니다.
sins.ultimate.aegis_buff=적에게 받는 공격을 완전히 막아 냅니다.
sins.ultimate.blade_rain=칼날의 비
sins.ultimate.blade_rain_desc=시야의 모든 적에게 칼날을 쏟아부어 각각 _%d~%d_ 피해를 줍니다.
sins.ultimate.absolute=절대 왕정
sins.ultimate.absolute_desc=위엄을 가득 채우고, _25턴_ 동안 피해를 입어도 위엄이 깨지지 않습니다.
sins.ultimate.absolute_buff=피해를 입어도 위엄이 깨지지 않습니다.
sins.ultimate.divine_right=신성한 왕권
sins.ultimate.divine_right_desc=_20턴_ 동안 공격이 반드시 명중하고, 주는 피해가 _40%_ 늘어납니다.
sins.ultimate.divine_right_buff=공격이 반드시 명중하고, 주는 피해가 40% 늘어납니다.
sins.ultimate.dance=매혹의 춤
sins.ultimate.dance_desc=주변 _3칸_ 안에 보이는 일반 적들을 _6턴_ 동안 매혹합니다.
sins.ultimate.blood_feast=피의 향연
sins.ultimate.blood_feast_desc=시야의 매혹된 적들에게서 각각 _%d~%d_의 생명을 빨아들이고, 빼앗은 만큼 회복합니다.
sins.ultimate.shadow_dance=그림자 무도
sins.ultimate.shadow_dance_desc=_15턴_ 동안 회피가 _2배_가 됩니다.
sins.ultimate.shadow_dance_buff=회피가 2배가 됩니다.
sins.ultimate.thrall=사랑의 노예
sins.ultimate.thrall_desc=일반 적 하나를 영원히 당신을 따르는 아군으로 만듭니다. 보스와 정예에게는 통하지 않습니다.
sins.ultimate.crimson_night=진홍의 밤
sins.ultimate.crimson_night_desc=_20턴_ 동안 공격으로 준 피해의 _30%_만큼 회복합니다.
sins.ultimate.crimson_night_buff=공격 피해의 30%를 흡수합니다.
sins.ultimate.fatal_kiss=치명적 입맞춤
sins.ultimate.fatal_kiss_desc=바로 옆의 적에게 입을 맞춰 최대 체력의 _40%%_(_%d_)만큼 피해를 주고, 빼앗은 만큼 회복합니다.
sins.ultimate.flood=질투의 범람
sins.ultimate.flood_desc=질투 게이지를 가득 채웁니다.
sins.ultimate.mirror_images=거울상
sins.ultimate.mirror_images_desc=_25턴_ 동안 함께 싸우는 거울 속 분신(악몽 인형) _2개_를 부릅니다.
sins.ultimate.evil_eye=사악한 눈
sins.ultimate.evil_eye_desc=적 하나를 노려보아 _15턴_ 동안 _약화_, _취약_, _저주_를 겁니다.
sins.ultimate.usurp=강탈
sins.ultimate.usurp_desc=보이는 적 하나의 생명을 빼앗습니다. 일반 적은 즉시 죽고, 그 최대 체력의 절반만큼 방어막을 얻습니다. (최대 당신의 최대 체력의 절반) 보스와 정예는 최대 체력의 _15%_ 피해를 입습니다.
sins.ultimate.reflection=반사
sins.ultimate.reflection_desc=_15턴_ 동안 적에게 받는 피해의 _50%_를 그 적에게 되돌려 줍니다.
sins.ultimate.reflection_buff=받는 피해의 50%를 공격한 적에게 되돌려 줍니다.
sins.ultimate.envy_storm=질투의 폭풍
sins.ultimate.envy_storm_desc=시야의 모든 적에게 _%d~%d_ 피해를 줍니다. 도감에 등록한 몬스터 하나당 피해가 _3%%_ 늘어납니다.
sins.ultimate.slumber=깊은 잠
sins.ultimate.slumber_desc=시야의 모든 일반 적을 깊은 잠에 빠뜨립니다.
sins.ultimate.legion=꿈의 군단
sins.ultimate.legion_desc=_30턴_ 동안 함께 싸우는 악몽 인형 _3개_를 부릅니다.
sins.ultimate.reverie=몽상
sins.ultimate.reverie_desc=최대 체력의 _40%_를 회복하고 _20%_만큼 방어막을 얻은 뒤, _3턴_ 동안 꾸벅꾸벅 좁니다.
sins.ultimate.eternal_sleep=영원한 잠
sins.ultimate.eternal_sleep_desc=적 하나를 영원한 잠에 빠뜨립니다. 잠든 일반 적은 즉시 죽고, 그 밖의 적은 _%d~%d_ 피해를 입습니다.
sins.ultimate.nightmare=악몽
sins.ultimate.nightmare_desc=시야의 모든 적에게 _%d~%d_ 피해를 주고, 일반 적은 _10턴_ 동안 공포에 질립니다.
sins.ultimate.daydream=백일몽
sins.ultimate.daydream_desc=_25턴_ 동안 아군이 주는 피해가 _2배_가 되고, 아군이 받는 피해는 _절반_이 됩니다.
sins.ultimate.daydream_buff=아군의 피해 2배, 아군이 받는 피해 절반.
