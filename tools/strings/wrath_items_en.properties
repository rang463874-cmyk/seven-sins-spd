items.wardrum.name=war drum
items.wardrum.desc=A war drum stretched with blood-red hide. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nBeating it spends _rage_ to stir up enemies' rage. Rage builds whenever you hit or get hit, faster the harder you are hit, and slowly cools when no enemies are around. The more enemies fight each other, the more _grudge points_ you earn, making you permanently stronger.
