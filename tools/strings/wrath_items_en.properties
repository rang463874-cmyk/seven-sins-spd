items.armor.wratharmor.name=wrath plate
items.armor.wratharmor.desc=Red plate scarred by countless fights. It spreads its wearer's fury to those nearby.
items.wardrum.skill_header=Rage %d / %d
items.wardrum.skill_provoke=Provoke
items.wardrum.skill_provoke_desc=Drives one enemy into a frenzy for _%d turns_. A frenzied enemy attacks whoever is nearby.
items.wardrum.skill_discord=Discord
items.wardrum.skill_discord_desc=Pick two enemies one after the other; for _%d turns_ they only target each other. It ends if one dies.
items.wardrum.skill_contagion=Contagion
items.wardrum.skill_contagion_desc=Drives one enemy into a frenzy for _%d turns_, and anything it hits is driven into a frenzy too.
items.wardrum.skill_dash=Dash
items.wardrum.skill_dash_desc=Dashes to an empty tile up to _%d tiles_ away in an instant.
