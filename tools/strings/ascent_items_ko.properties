ascent.ascenthooks.t_chastity=정결의 빛이 깃든다.
ascent.ascenthooks.t_kindness=친절의 빛이 깃든다.
ascent.ascenthooks.t_diligence=근면의 빛이 깃든다.
ascent.ascenthooks.gamble=운명의 주사위가 굴러간다...
ascent.ascenthooks.shade_reward=그림자를 깨뜨리자 힘이 흘러든다.
ascent.ascenthooks.charity_gold=베푸는 손은 금화를 탐하지 않는다.
ascent.ascenthooks.martyr=순교
ascent.ascenthooks.martyr_saved=순교자의 의지가 너를 쓰러지지 않게 붙잡았다!
ascent.ascenthooks.no_potions=금욕의 길에서는 물약을 마실 수 없다.
ascent.ascenthooks.no_scrolls=침묵의 길에서는 주문서를 읽을 수 없다.
ascent.ascenthooks.end_god_of_sin=결말: 죄의 신
ascent.ascenthooks.end_god_of_sin_text=너는 죄를 버리지 않은 채 신의 자리에 올랐다. 지상의 빛 아래, 일곱 개의 죄가 너를 섬기는 새로운 시대가 시작된다.
ascent.ascenthooks.end_god_of_dawn=결말: 새벽의 신
ascent.ascenthooks.end_god_of_dawn_text=죄에서 태어났지만 미덕으로 올라선 너는 새로운 새벽의 신이 되었다. 지옥의 문은 닫히고, 지상에 첫 햇살이 비친다.
ascent.ascenthooks.end_heir=결말: 마왕의 계승자
ascent.ascenthooks.end_heir_text=천사들의 심판을 모두 뿌리치고 너는 죄악 그 자체로 지상에 섰다. 일곱 마왕의 왕관이 이제 너의 것이다.
ascent.ascenthooks.end_penitent=결말: 속죄자
ascent.ascenthooks.end_penitent_text=죄악으로 남기로 했지만, 너는 올라오는 내내 미덕을 지켰다. 천사들은 마침내 칼을 거두고 너의 속죄를 받아들인다.
ascent.ascenthooks.end_wanderer=결말: 회색의 방랑자
ascent.ascenthooks.end_wanderer_text=죄도 미덕도 너를 붙잡지 못했다. 너는 신도 마왕도 아닌 채, 회색 하늘 아래를 홀로 걸어간다.
ascent.ascenthooks.end_scores=죄 _%d_ · 미덕 _%d_
ascent.ascenthooks.end_go=지상으로
ascent.ascenthooks.scale_name=역행의 저울
ascent.ascenthooks.scale_desc=역행 중 고른 길과 행동이 저울에 쌓인다. 지상에 도착하면 첫 선택과 저울이 기운 쪽에 따라 결말이 정해진다.\n\n첫 선택: _%s_\n죄 _%d_ · 미덕 _%d_\n\n행동 점수는 같은 종류마다 층당 최대 3점까지 쌓인다.
ascent.ascenthooks.boss_arrives=%s이(가) 내려와 길을 막는다! 쓰러뜨리기 전에는 계단이 잠긴다.
ascent.ascenthooks.boss_slain_virtue=%s을(를) 쓰러뜨렸다. 악마를 물리친 일이 미덕으로 저울에 올랐다.
ascent.ascenthooks.boss_slain_sin=%s을(를) 쓰러뜨렸다. 천사를 벤 일이 죄로 저울에 올랐다.
ascent.ascenthooks.chaser_rises=땅이 흔들린다... %s이(가) 아래층에서 솟아올라 너를 쫓는다! 지상까지 달아나라!
