ascent.ascentcard.greed_vault_reward=층마다 보물상자가 2개 놓입니다.
ascent.ascentcard.wrath_fire=분노 · 불타는 길
ascent.ascentcard.wrath_fire_risk=바닥 곳곳에서 계속 불길이 솟습니다.
ascent.ascentcard.wrath_fire_reward=적이 불에 50% 더 약해지고, 처치할 때 경험치를 50% 더 얻습니다.
ascent.ascentcard.wrath_legion=분노 · 군단
ascent.ascentcard.wrath_legion_risk=층마다 적이 무리 지어 더 나타납니다.
ascent.ascentcard.wrath_legion_reward=처치할 때 경험치를 2배로 얻습니다.
ascent.ascentcard.pride_road=교만 · 왕의 길
ascent.ascentcard.pride_road_risk=피해를 받을 때마다 다음에 받는 피해가 10%씩 커집니다(최대 100%, 층마다 초기화).
ascent.ascentcard.pride_road_reward=피해를 받지 않고 적을 처치할 때마다 금화가 떨어집니다.
ascent.ascentcard.lust_blood=색욕 · 피의 계약
ascent.ascentcard.lust_blood_risk=체력이 자연 회복되지 않습니다.
ascent.ascentcard.lust_blood_reward=모든 공격이 준 피해의 15%를 흡혈합니다.
ascent.ascentcard.envy_mirror=시기 · 거울 미로
ascent.ascentcard.envy_mirror_risk=층마다 영웅의 그림자(약화판)가 하나씩 나타나 쫓아옵니다.
ascent.ascentcard.envy_mirror_reward=그림자를 처치하면 무작위 강화 효과와 보호막을 얻습니다.
ascent.ascentcard.sloth_fog=나태 · 깊은 안개
ascent.ascentcard.sloth_fog_risk=이동 속도가 25% 느려집니다.
ascent.ascentcard.sloth_fog_reward=층의 적이 잠든 채 시작하고, 휴식할 때 회복이 3배가 됩니다.
ascent.ascentcard.sin_parade=죄의 행렬
ascent.ascentcard.sin_parade_risk=모든 적이 죄의 정예가 됩니다.
ascent.ascentcard.sin_parade_reward=죄 포인트(솔로몬은 지혜)를 2배로 얻습니다.
ascent.ascentcard.humility_pilgrim=겸손 · 순례자
ascent.ascentcard.humility_pilgrim_risk=장착한 무기와 방어구의 강화 수치가 1씩 덜 적용됩니다.
ascent.ascentcard.humility_pilgrim_reward=층마다 치유의 샘이 솟습니다.
ascent.ascentcard.charity_hand=자선 · 베푸는 손
ascent.ascentcard.charity_hand_risk=금화를 주울 수 없습니다.
ascent.ascentcard.charity_hand_reward=상점이 모두 무료이고, 층마다 떠돌이 상인이 물건을 펼쳐 둡니다.
ascent.ascentcard.chastity_abstain=정결 · 금욕
ascent.ascentcard.chastity_abstain_risk=물약을 마실 수 없습니다(던지기는 됩니다).
ascent.ascentcard.chastity_abstain_reward=최대 체력이 30% 늘어납니다.
ascent.ascentcard.patience_endure=인내 · 버티는 자
ascent.ascentcard.patience_endure_risk=적의 체력이 50% 늘어납니다.
ascent.ascentcard.patience_endure_reward=받는 피해가 25% 줄어듭니다.
ascent.ascentcard.temperance_silence=절제 · 침묵
ascent.ascentcard.temperance_silence_risk=주문서를 읽을 수 없습니다.
ascent.ascentcard.temperance_silence_reward=고유 스킬과 주문의 비용이 절반이 됩니다.
ascent.ascentcard.kindness_trial=친절 · 투사의 시험
ascent.ascentcard.kindness_trial_risk=층마다 미덕의 투사가 하나씩 나타나 쫓아옵니다.
ascent.ascentcard.kindness_trial_reward=투사를 처치하면 업그레이드 주문서를 남깁니다.
ascent.ascentcard.diligence_time=근면 · 시간의 시련
ascent.ascentcard.diligence_time_risk=층마다 300턴이 지나면 세력의 무리가 계속 몰려옵니다.
ascent.ascentcard.diligence_time_reward=300턴 안에 층을 올라가면 물약이나 주문서를 하나 받습니다.
ascent.ascentcard.martyr=순교자의 길
ascent.ascentcard.martyr_risk=최대 체력이 20% 줄어듭니다.
ascent.ascentcard.martyr_reward=이 지역에서 한 번, 죽을 피해를 받아도 체력 1로 버팁니다.
ascent.ascentcard.quiet=고요한 길
ascent.ascentcard.quiet_risk=줍는 금화와 적의 전리품이 절반으로 줄어듭니다.
ascent.ascentcard.quiet_reward=층의 적이 절반으로 줄어듭니다.
ascent.ascentcard.dark=어둠의 길
ascent.ascentcard.dark_risk=시야가 절반으로 줄어듭니다.
ascent.ascentcard.dark_reward=눈치채지 못한 적에게 주는 피해가 50% 늘어납니다.
ascent.ascentcard.flood=홍수
ascent.ascentcard.flood_risk=층의 바닥 곳곳이 물에 잠깁니다.
ascent.ascentcard.flood_reward=물 위에 서 있으면 회피가 20% 늘어납니다.
ascent.ascentcard.alchemist=연금술사의 길
ascent.ascentcard.alchemist_risk=층마다 강력한 함정이 4개 숨겨집니다.
ascent.ascentcard.alchemist_reward=층마다 연금 솥과 죄의 정수 2개가 놓입니다.
ascent.ascentcard.gambler=도박꾼의 길
ascent.ascentcard.gambler_risk=층에 들어설 때마다 40턴짜리 무작위 저주를 받습니다.
ascent.ascentcard.gambler_reward=층에 들어설 때마다 40턴짜리 무작위 축복도 받습니다.
ascent.ascenthooks.faction_title=첫 번째 갈림길
ascent.ascenthooks.faction_msg=부적이 손안에서 맥동한다. 지상까지 올라가는 길은 네가 무엇이 되기로 했는지에 따라 달라질 것이다.\n\n이 선택은 역행 내내 던전 전체에 깃든다.
ascent.ascenthooks.faction_divinity=새로운 신성이 되다
ascent.ascenthooks.faction_divinity_desc=죄를 딛고 새로운 신이 되기로 한다. 옛 신의 자리를 노리는 _악마들_이 역행 내내 던전 곳곳에 나타나 너를 쫓는다. 위로 올라갈수록 더 많이 나타나고, 마지막 하수도에서 가장 거세진다.
ascent.ascenthooks.faction_sinner=죄악으로 남는다
ascent.ascenthooks.faction_sinner_desc=죄 그 자체로 남기로 한다. 너를 심판하려는 _천사들_(신자, 사제, 하급 천사)이 역행 내내 던전 곳곳에 나타나 너를 쫓는다. 위로 올라갈수록 더 많이 나타나고, 마지막 하수도에서 가장 거세진다.
ascent.ascenthooks.chose_divinity=너는 새로운 신성이 되기로 했다. 지옥의 문이 열리는 소리가 들린다...
ascent.ascenthooks.chose_sinner=너는 죄악으로 남기로 했다. 천상의 나팔 소리가 울려 퍼진다...
ascent.ascenthooks.cards_title=갈림길
ascent.ascenthooks.cards_msg=%s의 문턱에 섰다. 이 지역 다섯 층을 어떤 길로 오를지 하나를 고른다. 고른 길은 바꿀 수 없다.\n\n죄와 미덕 카드는 결말에 영향을 준다. 길 이름 옆의 ⓘ로 자세히 볼 수 있다.
