###### Seven Sins: Solomon's items ######
items.solomonring.name=솔로몬의 반지
items.solomonring.desc=육각별이 새겨진 황금 인장 반지입니다. 이 반지 앞에서는 지옥의 왕들도 무릎을 꿇었다고 합니다. 유물/반지 칸에 착용하는 유물이며, 착용해야 기술을 쓸 수 있습니다.\n\n원소 기호를 그려 _발동_하면 그 조합에 맞는 마법이 나가고, 레메게톤에 기록한 악마를 _소환_할 수 있습니다.
items.solomonring.ac_invoke=마법진
items.solomonring.skill_header=마나 %d / %d   마법진: %s
items.solomonring.effects=레벨 효과: 마나 충전 속도 _+%d%%_, 최대 마나 _+%d_
items.solomonring.symbol_desc=마법진에 _%s_ 기호를 그립니다. 턴을 쓰지 않습니다.\n\n기호는 두 개까지 그려지며, 세 번째를 그리면 가장 오래된 기호가 지워집니다. _발동_으로 그려진 기호의 마법을 씁니다.
items.solomonring.skill_cast=발동
items.solomonring.skill_cast_desc=그려진 기호의 마법을 씁니다.\n\n기호 하나: 불=화염탄, 물=물의 채찍, 공기=바람 칼날, 흙=돌 피부\n불+불=화염구, 물+물=치유의 샘, 공기+공기=질풍 이동, 흙+흙=대지의 갑옷\n불+물=증기 폭발, 불+공기=연쇄 번개, 불+흙=용암 분출\n물+공기=얼음 폭풍, 물+흙=덩굴 속박, 공기+흙=모래 폭풍
items.solomonring.skill_summon=악마 소환
items.solomonring.skill_summon_desc=이번 판의 레메게톤에 기록한 악마 중 하나를 마나 _%d_로 불러내 _%d턴_ 동안 아군으로 부립니다. 동시에 _%d마리_까지 거느릴 수 있습니다.
items.solomonring.cost_mana=마나 %d
items.armor.solomonarmor.name=솔로몬의 예복
items.armor.solomonarmor.desc=금실로 별자리와 인장이 수놓인 보랏빛 예복입니다. 입은 이의 지혜를 드러냅니다.
