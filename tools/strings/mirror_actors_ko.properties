actors.mobs.npcs.vaultmirror.scene_gluttony=당신에게 텅 빈 연회장의 긴 식탁 위에 놓인 _황금 아귀_가 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 접시는 모두 비어 있는데도 아귀는 만족스럽게 이를 드러내고 있습니다. 당신은 평생 처음으로 배가 부르다는 게 어떤 느낌인지 떠올려 봅니다.
actors.mobs.npcs.vaultmirror.scene_greed=당신에게 빚 하나 없이 깨끗한 장부 위에 놓인 _검은 카드_가 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 금고는 넘쳐나는데 그 누구도 당신에게 돈을 빌려 달라 하지 않습니다. 이상하게도, 그것이 조금 외롭게 느껴집니다.
actors.mobs.npcs.vaultmirror.scene_wrath=당신에게 불타 버린 마을 광장 한가운데에 놓인 _피의 전쟁북_이 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 광장은 고요하고, 서로 싸우던 사람들은 모두 사라졌습니다. 북소리만이 당신의 심장 박동에 맞춰 울리고 있습니다.
actors.mobs.npcs.vaultmirror.scene_pride=당신에게 아무도 없는 옥좌 위에 놓인 _영겁의 왕관_이 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 왕관에는 흠집 하나 없고, 옥좌 앞의 계단에는 무릎 꿇은 이들의 자국만 남아 있습니다. 당신은 단 한 번도 고개를 숙인 적이 없는 자신의 모습을 봅니다.
actors.mobs.npcs.vaultmirror.scene_lust=당신에게 촛불이 꺼진 화장대 위에 놓인 _금단의 향수_가 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 거울 앞의 의자는 비어 있지만, 향기만은 방을 가득 채우고 있습니다. 누군가 아직도 당신을 기다리고 있는 것 같습니다.
actors.mobs.npcs.vaultmirror.scene_envy=당신에게 수많은 초상화가 걸린 복도 끝에 놓인 _깨진 거울_이 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 초상화 속 인물들은 모두 당신의 얼굴을 하고 있습니다. 갈라진 거울 조각에는 당신이 부러워했던 모든 이의 모습이 비칩니다.
actors.mobs.npcs.vaultmirror.scene_sloth=당신에게 끝없이 이어지는 해 질 녘 들판 위에 놓인 _영원의 베개_가 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히 보면 다른 점이 있습니다. 해는 지지도 않고 뜨지도 않으며, 그 누구도 당신을 깨우러 오지 않습니다. 당신은 처음으로 서두를 이유가 없다는 것을 깨닫습니다.
