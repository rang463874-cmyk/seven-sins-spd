actors.mobs.npcs.vaultmirror.scene_gluttony=당신에게 텅 빈 연회장의 긴 식탁 위에 놓인 작은 _거울 장식함_이 보입니다. 뚜껑 안쪽의 거울에는 당신이 지금보다 하나 더 많은 장신구를 걸친 모습이 비칩니다.
