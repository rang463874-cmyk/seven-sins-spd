items.weapon.melee.shiftinghalberd.name=shifting halberd
items.weapon.melee.shiftinghalberd.desc=A long-hafted weapon whose head unfolds with a click: a slender spear point for keeping foes at bay, or a broad axe blade for cleaving through them.
items.weapon.melee.shiftinghalberd.stats_spear=_Spear form:_ reaches _2 tiles_, _+15%_ accuracy, but deals _80%_ damage. Switching forms takes no time.
items.weapon.melee.shiftinghalberd.stats_axe=_Axe form:_ reaches only adjacent tiles and is _10%_ less accurate, but deals _120%_ damage. Switching forms takes no time.
items.weapon.melee.shiftinghalberd.ac_to_axe=axe form
items.weapon.melee.shiftinghalberd.ac_to_spear=spear form
items.weapon.melee.shiftinghalberd.form_axe=axe!
items.weapon.melee.shiftinghalberd.form_spear=spear!
items.weapon.melee.shiftinghalberd.ability_name=no technique
items.weapon.melee.shiftinghalberd.ability_desc=This weapon has no duelist technique.
items.weapon.melee.thunderflail.name=thunder flail
items.weapon.melee.thunderflail.desc=A heavy flail whose iron ball crackles faintly. The longer it keeps swinging, the more lightning gathers inside it.
items.weapon.melee.thunderflail.stats_desc=Each hit within _%5$d turns_ of the last builds a charge, up to _%1$d_ (each charge: _+%2$d%%_ damage). The hit after the last charge is a _thunderclap_: _+%3$d%%_ damage, and _%4$d%%_ of it arcs into every enemy next to the target, stunning them for a turn. Then the charges reset.
items.weapon.melee.thunderflail.clap=thunderclap!
items.weapon.melee.thunderflail.ability_name=no technique
items.weapon.melee.thunderflail.ability_desc=This weapon has no duelist technique.
items.weapon.melee.thunderflail$momentum.name=Thunder charge
items.weapon.melee.thunderflail$momentum.desc=The thunder flail is building up lightning.\n\nCharges: _%1$d_ (damage _+%2$d%%_)\n\nKeep hitting within _%3$s turns_ or the charge fades.
items.weapon.melee.thunderflail$momentum.desc_ready=The thunder flail is full of lightning! Your next hit will be a _thunderclap_.\n\nIt fades in _%3$s turns_.
items.weapon.melee.chakram.name=chakram
items.weapon.melee.chakram.desc=A steel ring sharpened all the way around. It works fine in the hand, but it's meant to be thrown, and it always finds its way back.
items.weapon.melee.chakram.stats_desc=While wielded, it can be _hurled_ up to _%1$d tiles_ (this takes as long as an attack). It cuts _every enemy_ along its path for _%2$d%%_ of a normal hit, then returns to your hand.
items.weapon.melee.chakram.ac_hurl=hurl
items.weapon.melee.chakram.prompt=Choose where to hurl the chakram
items.weapon.melee.chakram.need_wield=You have to be wielding the chakram to hurl it.
items.weapon.melee.chakram.ability_name=no technique
items.weapon.melee.chakram.ability_desc=This weapon has no duelist technique.
items.weapon.melee.parrysabre.name=parrying sabre
items.weapon.melee.parrysabre.desc=A light, curved sabre with a wide basket guard, made for turning blades aside rather than meeting them head on.
items.weapon.melee.parrysabre.stats_desc=While wielded, you can _parry_ (1 turn): for _%1$d turns_, the next melee attack from an adjacent enemy is turned aside, and you answer at once with a _sure riposte_ dealing _%2$d%%_ damage.
items.weapon.melee.parrysabre.ac_parry=parry
items.weapon.melee.parrysabre.stance=You raise your sabre, ready to parry.
items.weapon.melee.parrysabre.need_wield=You have to be wielding the sabre to parry.
items.weapon.melee.parrysabre.parried=parried
items.weapon.melee.parrysabre.ability_name=no technique
items.weapon.melee.parrysabre.ability_desc=This weapon has no duelist technique.
items.weapon.melee.parrysabre$stance.name=Parrying stance
items.weapon.melee.parrysabre$stance.desc=You are ready to parry. The next melee attack from an adjacent enemy is turned aside and answered with a sure riposte dealing _%1$d%%_ damage.\n\nTurns remaining: %2$s.
