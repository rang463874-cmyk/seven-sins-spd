actors.mobs.ascent.ascentchaser.staggered=휘청!
actors.mobs.ascent.moloch.name=몰록
actors.mobs.ascent.moloch.desc=제물을 삼키던 황소 머리의 화로 신. 가슴 속 화로가 붉게 타오르고, 그 주위로 불타는 제물들이 몰려든다.\n\n일직선으로 돌진하고, 화로가 달아오르면 주변을 불길로 휘감으며, 불타는 제물을 불러낸다.
actors.mobs.ascent.moloch.notice=더 많은 제물을! 너를 화로에 던져 넣겠다!
actors.mobs.ascent.moloch.skill_charge=돌진
actors.mobs.ascent.moloch.skill_furnace=화로
actors.mobs.ascent.moloch.skill_offering=제물
actors.mobs.ascent.lilith.name=릴리스
actors.mobs.ascent.lilith.desc=밤의 여왕이자 첫 번째 마녀. 그녀가 지나간 자리에는 달빛조차 남지 않는다.\n\n바둑판 무늬로 저주를 뿌려 매혹하고, 밤의 망령을 부르며, 입맞춤으로 생명을 빨아들인다.
actors.mobs.ascent.lilith.notice=새로운 신이라고? 밤은 누구의 것도 아니란다.
actors.mobs.ascent.lilith.skill_night=밤의 저주
actors.mobs.ascent.lilith.skill_spirits=망령
actors.mobs.ascent.lilith.skill_kiss=죽음의 입맞춤
actors.mobs.ascent.azazel.name=아자젤
actors.mobs.ascent.azazel.desc=인간에게 칼을 벼리는 법을 가르친 타락천사, 속죄의 염소. 그의 등 뒤에서 무기고가 쉼 없이 칼날을 토해낸다.\n\n칼날을 흩뿌리고, 사슬로 끌어당기며, 체력이 절반 아래로 떨어지면 무기고를 폭주시킨다.
actors.mobs.ascent.azazel.notice=내가 벼린 칼로 신이 되겠다니, 우스운 일이군.
actors.mobs.ascent.azazel.skill_blades=칼날 비
actors.mobs.ascent.azazel.skill_chains=사슬
actors.mobs.ascent.azazel.skill_armory=무기고 폭주
actors.mobs.ascent.abaddon.name=아바돈
actors.mobs.ascent.abaddon.desc=무저갱의 왕, 메뚜기 떼의 군주. 그의 날갯짓마다 하늘이 메뚜기로 뒤덮인다.\n\n메뚜기 떼를 띠처럼 휩쓸게 하고, 발밑의 땅을 꺼뜨려 묶으며, 껍질을 굳혀 보호막을 두르고 벌레를 부른다.
actors.mobs.ascent.abaddon.notice=무저갱의 문은 닫히지 않는다. 너도 그 아래로 돌아가라!
actors.mobs.ascent.abaddon.skill_locusts=메뚜기 떼
actors.mobs.ascent.abaddon.skill_pit=무저갱
actors.mobs.ascent.abaddon.skill_carapace=껍질
actors.mobs.ascent.cherubim.name=케루빔
actors.mobs.ascent.cherubim.desc=에덴의 문을 지키는 천사. 사자, 황소, 독수리, 사람의 네 얼굴을 지녔고, 사방으로 도는 불칼을 들고 있다.\n\n불칼을 휘둘러 주위를 차례로 쓸고, 네 얼굴로 X자 모양의 빛을 쏘며, 십자 모양의 불기둥으로 길을 막는다.
actors.mobs.ascent.cherubim.notice=죄인이여, 이 문은 너를 위해 열리지 않는다.
actors.mobs.ascent.cherubim.skill_sword=회전하는 불칼
actors.mobs.ascent.cherubim.skill_faces=네 얼굴
actors.mobs.ascent.cherubim.skill_guard=문지기
actors.mobs.ascent.ophanim.name=오파님
actors.mobs.ascent.ophanim.desc=바퀴 속에 바퀴가 맞물려 도는, 온몸이 눈으로 뒤덮인 천사. 그 눈은 단 하나의 죄도 놓치지 않는다.\n\n바퀴를 굴려 띠처럼 휩쓸고, 일직선의 응시 광선을 쏘며, 바둑판 무늬로 눈을 떠 저주를 내린다.
actors.mobs.ascent.ophanim.notice=모든 눈이 너를 본다.
actors.mobs.ascent.ophanim.skill_wheel=구르는 바퀴
actors.mobs.ascent.ophanim.skill_gaze=응시
actors.mobs.ascent.ophanim.skill_eyes=천 개의 눈
actors.mobs.ascent.azrael.name=아즈라엘
actors.mobs.ascent.azrael.desc=죽음의 천사. 그의 두루마리에 이름이 적힌 자는 정해진 때에 숨을 거둔다.\n\n이름을 적어 죽음의 표식을 남기고(시간이 다 됐을 때 가까이 있으면 큰 피해), 주위를 낫으로 베어 생명을 거두며, 부채꼴로 낫을 휘두른다.
actors.mobs.ascent.azrael.notice=네 이름은 이미 적혀 있다.
actors.mobs.ascent.azrael.skill_mark=죽음의 표식
actors.mobs.ascent.azrael.skill_harvest=영혼 수확
actors.mobs.ascent.azrael.skill_scythe=낫
actors.mobs.ascent.azrael.marked=아즈라엘이 네 이름을 적었다! 시간이 다 되기 전에 %d칸보다 멀리 떨어져야 한다.
actors.mobs.ascent.azrael.escaped=죽음의 표식이 허공에서 흩어졌다.
actors.mobs.ascent.azrael$deathmark.name=죽음의 표식
actors.mobs.ascent.azrael$deathmark.desc=아즈라엘의 두루마리에 이름이 적혔다. 표식이 끝날 때 아즈라엘과 %d칸 안에 있으면 큰 피해를 받는다.\n\n남은 턴: %s
actors.mobs.ascent.sandalphon.name=산달폰
actors.mobs.ascent.sandalphon.desc=사람들의 기도를 노래로 엮어 바치는 거대한 천사, 메타트론의 쌍둥이. 그의 노래는 땅을 울린다.\n\n노래의 고리를 퍼뜨리고, 찬송으로 신자들을 부르며 보호막을 두르고, 십자로 메타트론의 목소리를 울린다.
actors.mobs.ascent.sandalphon.notice=들어라, 이것이 너를 위한 마지막 찬송이다.
actors.mobs.ascent.sandalphon.skill_song=노래의 고리
actors.mobs.ascent.sandalphon.skill_hymn=찬송
actors.mobs.ascent.sandalphon.skill_voice=쌍둥이의 목소리
actors.mobs.ascent.behemoth.name=베헤모스
actors.mobs.ascent.behemoth.desc=땅의 거대한 짐승. 걸음마다 하수도가 무너져 내린다. 이 짐승은 쓰러뜨릴 수 없다. 때리면 잠시 휘청일 뿐이니, 지상까지 달아나야 한다.\n\n일직선으로 짓밟으며 돌진하고, 발을 굴러 땅을 뒤흔든다.
actors.mobs.ascent.behemoth.notice=그르르르...!
actors.mobs.ascent.behemoth.skill_stampede=짓밟기
actors.mobs.ascent.behemoth.skill_quake=지진
actors.mobs.ascent.metatron.name=메타트론
actors.mobs.ascent.metatron.desc=신의 목소리, 하늘만큼 거대한 천사. 그는 쓰러뜨릴 수 없다. 때리면 잠시 휘청일 뿐이니, 지상까지 달아나야 한다.\n\n하늘에서 빛기둥을 내리꽂고, 목소리의 충격파를 퍼뜨린다.
actors.mobs.ascent.metatron.notice=죄인이여, 빛 아래로 나아갈 수 없으리라.
actors.mobs.ascent.metatron.skill_pillars=빛기둥
actors.mobs.ascent.metatron.skill_voice=신의 목소리
