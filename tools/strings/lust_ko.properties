actors.hero.heroclass.lust=색욕
actors.hero.heroclass.lust_desc_short=칠죄종 중 _색욕_의 죄를 짊어진 자. 색욕은 적을 _매혹_해 무력하게 만들고, 그 _생기를 흡수_해 영구적으로 강해집니다.
actors.hero.heroclass.lust_desc=색욕은 장비 칸을 차지하지 않는 _유혹의 향수_를 가지고 시작합니다. 향수는 시간이 지나면 충전되며, 충전을 써서 _눈짓_, _향기_, _생기 흡수_, _이끌림_을 사용합니다.\n\n매혹된 적에게서 _생기를 흡수_하거나 _매혹된 적을 쓰러뜨리면_ 갈망 점수가 쌓이고, 갈망에 비례해 근접 피해, 명중, 최대 체력, 방어력, 회피가 끝없이 오릅니다. 생기 흡수는 매혹을 풀지 않습니다. 보스와 중간 보스는 매혹되지 않습니다.\n\n색욕은 _단검_을 들고 시작하며, _치유 물약_과 _자장가의 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.lust_unlock=색욕은 처음부터 해금되어 있습니다.

actors.hero.herosubclass.siren=세이렌
actors.hero.herosubclass.siren_short_desc=_세이렌_에게 매혹된 적은 _다른 적을 공격_합니다. 그 싸움으로도 갈망이 쌓입니다.
actors.hero.herosubclass.siren_desc=세이렌의 노래에 홀린 자는 제 동료에게 칼끝을 돌립니다. 세이렌에게 매혹된 적은 근처의 매혹되지 않은 적을 찾아 공격하고, 매혹된 적이 주는 피해만큼 갈망이 쌓입니다.\n\n전용 특성으로 매혹된 적의 공격을 강하게 하거나, 싸울수록 매혹이 길어지게 하거나, 얻는 갈망을 늘릴 수 있습니다.
actors.hero.herosubclass.dreamweaver=몽환술사
actors.hero.herosubclass.dreamweaver_short_desc=_몽환술사_에게 매혹된 적은 _잠들고_, 잠든 적에게서 _50% 더 많은 생기_를 흡수합니다.
actors.hero.herosubclass.dreamweaver_desc=몽환술사는 꿈속에서 생기를 거둡니다. 매혹된 적은 그대로 잠에 빠지며, 잠든 적에게 생기 흡수를 사용하면 _50%_ 더 많이 흡수하고 적은 깨어나지 않습니다.\n\n전용 특성으로 흡수량을 더 늘리거나, 매혹을 길게 하거나, 잠든 적을 흡수할 때 향수를 충전할 수 있습니다.

actors.hero.talent.lust_yearning.title=그리움
actors.hero.talent.lust_yearning.desc=_+1:_ 얻는 갈망 점수가 _15%_ 증가합니다.\n\n_+2:_ 얻는 갈망 점수가 _30%_ 증가합니다.
actors.hero.talent.lust_linger.title=잔향
actors.hero.talent.lust_linger.desc=향수로 거는 매혹이 오래 지속됩니다.\n\n_+1:_ _25%_ 증가\n\n_+2:_ _50%_ 증가
actors.hero.talent.lust_sweet.title=달콤한 생기
actors.hero.talent.lust_sweet.desc=생기 흡수로 회복하는 체력이 늘어납니다.\n\n_+1:_ _20%_ 증가\n\n_+2:_ _40%_ 증가
actors.hero.talent.lust_blush.title=두근거림
actors.hero.talent.lust_blush.desc=매혹된 적에게 주는 공격 피해가 증가합니다.\n\n_+1:_ _10%_\n\n_+2:_ _20%_
actors.hero.talent.lust_bottle.title=큰 향수병
actors.hero.talent.lust_bottle.desc=향수의 최대 충전 수가 늘어납니다. (기본 3)\n\n_+1:_ _4회_\n\n_+2:_ _5회_
actors.hero.talent.lust_refill.title=리필
actors.hero.talent.lust_refill.desc=향수의 충전 속도가 빨라집니다.\n\n_+1:_ _20%_ 빨라짐\n\n_+2:_ _40%_ 빨라짐
actors.hero.talent.lust_waft.title=흩날리는 향기
actors.hero.talent.lust_waft.desc=향기의 범위가 늘어납니다. (기본 2칸)\n\n_+1:_ _3칸_\n\n_+2:_ _4칸_
actors.hero.talent.lust_thirst.title=갈증
actors.hero.talent.lust_thirst.desc=생기 흡수의 흡수량이 늘어납니다.\n\n_+1:_ _20%_ 증가\n\n_+2:_ _40%_ 증가
actors.hero.talent.lust_embrace.title=포옹
actors.hero.talent.lust_embrace.desc=이끌림으로 이동하면 방어막을 얻습니다.\n\n_+1:_ 최대 체력의 _10%_\n\n_+2:_ 최대 체력의 _20%_
actors.hero.talent.lust_obsession.title=집착
actors.hero.talent.lust_obsession.desc=갈망 점수로 얻는 모든 스탯 효과가 증가합니다. 이미 쌓은 점수에도 적용됩니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.lust_heartstrings.title=심금
actors.hero.talent.lust_heartstrings.desc=매혹된 적을 쓰러뜨리면 향수가 충전됩니다.\n\n_+1:_ _0.2회분_\n\n_+2:_ _0.4회분_\n\n_+3:_ _0.6회분_
actors.hero.talent.siren_song.title=유혹의 노래
actors.hero.talent.siren_song.desc=세이렌에게 매혹된 적이 다른 적에게 주는 피해가 증가합니다.\n\n_+1:_ _15%_\n\n_+2:_ _30%_\n\n_+3:_ _45%_
actors.hero.talent.siren_echo.title=메아리
actors.hero.talent.siren_echo.desc=매혹된 적이 다른 적을 공격할 때마다 매혹이 길어집니다.\n\n_+1:_ _1턴_\n\n_+2:_ _2턴_\n\n_+3:_ _3턴_
actors.hero.talent.siren_devotion.title=헌신
actors.hero.talent.siren_devotion.desc=매혹된 적의 싸움으로 얻는 갈망이 늘어납니다.\n\n_+1:_ _50%_ 증가\n\n_+2:_ _100%_ 증가\n\n_+3:_ _150%_ 증가
actors.hero.talent.dream_deep.title=깊은 잠
actors.hero.talent.dream_deep.desc=잠든 적에게서 흡수하는 생기가 더 늘어납니다. (기본 50%)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_
actors.hero.talent.dream_lullaby.title=자장가
actors.hero.talent.dream_lullaby.desc=몽환술사가 거는 매혹이 길어집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_
actors.hero.talent.dream_reverie.title=몽상
actors.hero.talent.dream_reverie.desc=잠든 적에게서 생기를 흡수하면 향수가 충전됩니다.\n\n_+1:_ _0.15회분_\n\n_+2:_ _0.3회분_\n\n_+3:_ _0.45회분_
actors.hero.talent.dance_reach.title=넓은 무대
actors.hero.talent.dance_reach.desc=매혹의 춤의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.dance_encore.title=앙코르
actors.hero.talent.dance_encore.desc=매혹의 춤으로 거는 매혹이 길어집니다. (기본 6턴)\n\n_+1:_ _8턴_\n\n_+2:_ _10턴_\n\n_+3:_ _12턴_\n\n_+4:_ _14턴_
actors.hero.talent.dance_daze.title=현기증
actors.hero.talent.dance_daze.desc=매혹의 춤을 본 적이 _어지러움_에 빠집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.siphon_power.title=탐닉
actors.hero.talent.siphon_power.desc=영혼 흡수의 흡수량이 늘어납니다.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.siphon_shield.title=넘치는 생기
actors.hero.talent.siphon_shield.desc=영혼 흡수로 넘친 회복량이 방어막이 됩니다.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.siphon_charm.title=사로잡힌 영혼
actors.hero.talent.siphon_charm.desc=영혼 흡수를 당한 적의 매혹이 길어집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.break_power.title=산산조각
actors.hero.talent.break_power.desc=상심의 피해가 증가합니다.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_\n\n_+4:_ _100%_
actors.hero.talent.break_fear.title=배신감
actors.hero.talent.break_fear.desc=상심에서 살아남은 적이 _공포_에 빠집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.break_desire.title=상처의 기억
actors.hero.talent.break_desire.desc=상심으로 마음을 깨뜨린 적 하나당 갈망을 얻습니다.\n\n_+1:_ _1_\n\n_+2:_ _2_\n\n_+3:_ _3_\n\n_+4:_ _4_

actors.hero.abilities.lust.enchantingdance.name=매혹의 춤
actors.hero.abilities.lust.enchantingdance.short_desc=보이는 _모든 적_을 매혹합니다.
actors.hero.abilities.lust.enchantingdance.desc=4칸 안에 보이는 모든 적을 _6턴_ 동안 매혹합니다. 향수 관련 특성과 전직 효과도 함께 적용됩니다. 보스는 매혹되지 않습니다.
actors.hero.abilities.lust.soulsiphon.name=영혼 흡수
actors.hero.abilities.lust.soulsiphon.short_desc=보이는 _매혹된 적 전부_에게서 한꺼번에 생기를 흡수합니다.
actors.hero.abilities.lust.soulsiphon.desc=시야 안의 매혹된 모든 적에게 생기 흡수를 _1.5배_ 위력으로 사용합니다. 매혹은 풀리지 않습니다.
actors.hero.abilities.lust.soulsiphon.no_targets=매혹된 적이 보이지 않는다.
actors.hero.abilities.lust.heartbreak.name=상심
actors.hero.abilities.lust.heartbreak.short_desc=보이는 _매혹된 적 전부_의 매혹을 깨뜨려 피해를 줍니다. 남은 매혹이 길수록 아픕니다.
actors.hero.abilities.lust.heartbreak.desc=시야 안의 매혹된 모든 적의 매혹을 풀며, 레벨에 비례한 피해에 _남은 매혹 1턴당 3_의 피해를 더해 입힙니다.
actors.hero.abilities.lust.heartbreak.no_targets=매혹된 적이 보이지 않는다.

actors.buffs.lustdesire.name=갈망
actors.buffs.lustdesire.desc_head=갈망 점수: _%d_\n향수 충전: _%d/%d_
actors.buffs.lustdesire.desc_stats=근접 추가 피해: _+%d_\n정확도: _+%d%%_\n최대 체력: _+%d_\n추가 방어력: _0~%d_\n회피: _+%d%%_
