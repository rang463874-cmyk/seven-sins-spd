actors.hero.heroclass.lust=색욕
actors.hero.heroclass.lust_desc_short=칠죄종 중 _색욕_의 죄를 짊어진 자. 색욕은 춤추듯 공격을 피해 적을 _매혹_하고, 매혹된 적의 _피를 마셔_ 영구적으로 강해집니다. 향수의 기술은 _자신의 체력_을 대가로 씁니다.
actors.hero.heroclass.lust_desc=색욕은 _유혹의 향수_를 유물 칸에 착용한 채 시작합니다. 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다. 향수의 기술은 충전 대신 _체력_을 써서 _피의 키스_, _스텝_, _생기 흡수_, _도취_를 사용합니다.\n\n_매혹의 춤:_ 적의 공격을 _회피_하면 그 적이 매혹됩니다.\n_흡혈:_ 매혹된 적을 근접 공격하면 피해의 _25%_만큼 체력을 빼앗습니다. 빼앗은 체력은 _갈망_이 되어 근접 피해, 명중, 최대 체력, 방어력, 회피를 끝없이 올립니다.\n\n색욕은 _단검_을 들고 시작하며, _치유 물약_과 _자장가의 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.lust_unlock=색욕은 처음부터 해금되어 있습니다.

actors.hero.herosubclass.night_dancer=밤의 무희
actors.hero.herosubclass.night_dancer_short_desc=_밤의 무희_는 공격을 회피할 때마다 _공짜 반격_을 합니다.
actors.hero.herosubclass.night_dancer_desc=밤의 무희는 칼날 사이를 춤추듯 누빕니다. 적의 공격을 회피할 때마다 그 적에게 _75%_ 피해의 _반격_을 합니다. 반격도 흡혈과 무기 효과가 적용됩니다.\n\n전용 특성으로 반격을 강화하거나, 회피를 높이거나, 회피할 때 체력을 회복할 수 있습니다.
actors.hero.herosubclass.crimson_noble=진홍의 귀족
actors.hero.herosubclass.crimson_noble_short_desc=_진홍의 귀족_은 향수 기술의 체력 비용이 _절반_이고, _체력이 낮을수록_ 흡혈이 강해지며, 넘치는 흡혈은 _방어막_이 됩니다.
actors.hero.herosubclass.crimson_noble_desc=진홍의 귀족은 피를 다루는 법을 압니다. 향수 기술의 체력 비용이 _절반_으로 줄어듭니다.\n\n체력이 낮을수록 흡혈량이 늘어나 체력이 바닥일 때 _50%_ 더 많이 빼앗고, 최대 체력을 넘어 빼앗은 체력은 그 _절반_만큼 _방어막_이 됩니다.\n\n전용 특성으로 방어막과 저체력 흡혈을 강화하거나, 기술에 쓴 체력 일부를 방어막으로 돌려받을 수 있습니다.

actors.hero.talent.lust_yearning.title=그리움
actors.hero.talent.lust_yearning.desc=_+1:_ 갈망을 _15%_ 더 얻습니다.\n\n_+2:_ 갈망을 _30%_ 더 얻습니다.
actors.hero.talent.lust_linger.title=잔향
actors.hero.talent.lust_linger.desc=모든 매혹의 지속 시간이 늘어납니다.\n\n_+1:_ _25%_ 증가\n\n_+2:_ _50%_ 증가
actors.hero.talent.lust_sweet.title=달콤한 피
actors.hero.talent.lust_sweet.desc=매혹된 적에게서 빼앗는 체력이 늘어납니다. (기본 피해의 25%)\n\n_+1:_ _30%_\n\n_+2:_ _35%_
actors.hero.talent.lust_blush.title=두근거림
actors.hero.talent.lust_blush.desc=매혹된 적에게 주는 피해가 늘어납니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가
actors.hero.talent.lust_bottle.title=값싼 대가
actors.hero.talent.lust_bottle.desc=향수 기술의 체력 비용이 줄어듭니다.\n\n_+1:_ _15%_ 감소\n\n_+2:_ _30%_ 감소
actors.hero.talent.lust_refill.title=먼 곳의 입술
actors.hero.talent.lust_refill.desc=피의 키스의 사거리가 늘어납니다. (기본 3칸)\n\n_+1:_ _4칸_\n\n_+2:_ _5칸_
actors.hero.talent.lust_waft.title=가벼운 발걸음
actors.hero.talent.lust_waft.desc=스텝의 지속 시간이 늘어납니다. (기본 5턴)\n\n_+1:_ _7턴_\n\n_+2:_ _9턴_
actors.hero.talent.lust_thirst.title=갈증
actors.hero.talent.lust_thirst.desc=생기 흡수로 빼앗는 체력이 늘어납니다.\n\n_+1:_ _25%_ 증가\n\n_+2:_ _50%_ 증가
actors.hero.talent.lust_embrace.title=깊은 입맞춤
actors.hero.talent.lust_embrace.desc=피의 키스의 매혹 지속 시간이 늘어납니다. (기본 3턴)\n\n_+1:_ _5턴_\n\n_+2:_ _7턴_
actors.hero.talent.lust_obsession.title=집착
actors.hero.talent.lust_obsession.desc=갈망으로 얻는 모든 스탯 효과가 증가합니다. 이미 쌓인 갈망에도 적용됩니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.lust_heartstrings.title=심금
actors.hero.talent.lust_heartstrings.desc=매혹의 춤(회피 시 매혹)의 지속 시간이 늘어납니다. (기본 2턴)\n\n_+1:_ _3턴_\n\n_+2:_ _4턴_\n\n_+3:_ _5턴_
actors.hero.talent.dancer_counter.title=칼날의 춤
actors.hero.talent.dancer_counter.desc=반격의 피해가 늘어납니다. (기본 75%)\n\n_+1:_ _90%_\n\n_+2:_ _105%_\n\n_+3:_ _120%_
actors.hero.talent.dancer_grace.title=우아함
actors.hero.talent.dancer_grace.desc=회피가 늘어납니다.\n\n_+1:_ _4%_ 증가\n\n_+2:_ _8%_ 증가\n\n_+3:_ _12%_ 증가
actors.hero.talent.dancer_tempo.title=템포
actors.hero.talent.dancer_tempo.desc=회피할 때마다 체력을 회복합니다.\n\n_+1:_ _2 + 레벨/10_\n\n_+2:_ _4 + 레벨/10_\n\n_+3:_ _6 + 레벨/10_
actors.hero.talent.noble_blood.title=고귀한 피
actors.hero.talent.noble_blood.desc=넘치는 흡혈이 더 큰 방어막이 됩니다. (기본 50%)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_
actors.hero.talent.noble_thirst.title=핏빛 갈증
actors.hero.talent.noble_thirst.desc=체력이 낮을 때의 흡혈 증가량이 커집니다. (체력이 바닥일 때 기본 50%)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_
actors.hero.talent.noble_price.title=귀족의 대가
actors.hero.talent.noble_price.desc=향수 기술에 쓴 체력의 일부를 방어막으로 돌려받습니다.\n\n_+1:_ _20%_\n\n_+2:_ _40%_\n\n_+3:_ _60%_
actors.hero.talent.dance_reach.title=넓은 무대
actors.hero.talent.dance_reach.desc=매혹의 춤의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.dance_encore.title=앙코르
actors.hero.talent.dance_encore.desc=매혹의 춤으로 거는 매혹이 길어집니다. (기본 6턴)\n\n_+1:_ _8턴_\n\n_+2:_ _10턴_\n\n_+3:_ _12턴_\n\n_+4:_ _14턴_
actors.hero.talent.dance_daze.title=현기증
actors.hero.talent.dance_daze.desc=매혹의 춤을 본 적이 _어지러움_에 빠집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.pact_shield.title=피의 방패
actors.hero.talent.pact_shield.desc=피의 계약의 방어막이 커집니다. (기본 바친 체력의 150%)\n\n_+1:_ _175%_\n\n_+2:_ _200%_\n\n_+3:_ _225%_\n\n_+4:_ _250%_
actors.hero.talent.pact_duration.title=긴 계약
actors.hero.talent.pact_duration.desc=피의 계약의 흡혈이 더 오래 지속됩니다. (기본 10턴)\n\n_+1:_ _13턴_\n\n_+2:_ _16턴_\n\n_+3:_ _19턴_\n\n_+4:_ _22턴_
actors.hero.talent.pact_thirst.title=탐식
actors.hero.talent.pact_thirst.desc=피의 계약 중 흡혈량이 늘어납니다. (기본 피해의 25%)\n\n_+1:_ _35%_\n\n_+2:_ _45%_\n\n_+3:_ _55%_\n\n_+4:_ _65%_
actors.hero.talent.macabre_count.title=끝없는 춤
actors.hero.talent.macabre_count.desc=죽음의 무도가 베는 적의 수가 늘어납니다. (기본 3)\n\n_+1:_ _4_\n\n_+2:_ _5_\n\n_+3:_ _6_\n\n_+4:_ _7_
actors.hero.talent.macabre_power.title=마지막 춤
actors.hero.talent.macabre_power.desc=죽음의 무도의 피해가 늘어납니다.\n\n_+1:_ _15%_ 증가\n\n_+2:_ _30%_ 증가\n\n_+3:_ _45%_ 증가\n\n_+4:_ _60%_ 증가
actors.hero.talent.macabre_charm.title=매혹의 칼날
actors.hero.talent.macabre_charm.desc=죽음의 무도에 베이고 살아남은 적이 매혹됩니다.\n\n_+1:_ _1턴_\n\n_+2:_ _2턴_\n\n_+3:_ _3턴_\n\n_+4:_ _4턴_

actors.hero.abilities.lust.enchantingdance.name=매혹의 무대
actors.hero.abilities.lust.enchantingdance.short_desc=보이는 _모든 적_을 매혹합니다.
actors.hero.abilities.lust.enchantingdance.desc=4칸 안에 보이는 모든 적을 _6턴_ 동안 매혹합니다. 매혹 지속 시간 특성도 함께 적용됩니다. 보스는 매혹되지 않습니다.
actors.hero.abilities.lust.bloodpact.name=피의 계약
actors.hero.abilities.lust.bloodpact.short_desc=최대 체력의 _30%_를 바쳐 _큰 방어막_과 _강한 흡혈_을 얻습니다.
actors.hero.abilities.lust.bloodpact.desc=최대 체력의 _30%_를 바칩니다(이것으로 죽지는 않습니다). 바친 체력의 _150%_만큼 방어막을 얻고, _10턴_ 동안 모든 근접 공격이 피해의 _25%_를 추가로 흡혈합니다.
actors.hero.abilities.lust.dansemacabre.name=죽음의 무도
actors.hero.abilities.lust.dansemacabre.short_desc=보이는 적들 사이를 _순간이동하며_ 하나씩 벱니다.
actors.hero.abilities.lust.dansemacabre.desc=6칸 안에 보이는 적 중 가까운 _3명_에게 차례로 순간이동해 반드시 적중하는 공격을 합니다. 흡혈과 무기 효과가 모두 적용됩니다.
actors.hero.abilities.lust.dansemacabre.no_targets=춤을 출 상대가 보이지 않는다.

actors.buffs.lustdesire.name=갈망
actors.buffs.lustdesire.desc_head=갈망: _%d_\n\n매혹된 적을 근접 공격하면 체력을 빼앗고, 공격을 회피하면 그 적을 매혹합니다.
actors.buffs.lustdesire.desc_stats=근접 추가 피해: _+%d_\n정확도: _+%d%%_\n최대 체력: _+%d_\n추가 방어력: _0~%d_\n회피: _+%d%%_
actors.buffs.lustdesire$sway.name=스텝
actors.buffs.lustdesire$sway.desc=가벼운 발놀림으로 공격을 흘려냅니다. 회피가 크게 늘어납니다.\n\n남은 시간: %s턴
actors.buffs.lustdesire$rapture.name=도취
actors.buffs.lustdesire$rapture.desc=피의 맛에 취했습니다. 모든 근접 공격이 피해의 25%%를 흡혈합니다.\n\n남은 시간: %s턴
actors.buffs.lustdesire$bloodpact.name=피의 계약
actors.buffs.lustdesire$bloodpact.desc=피로 맺은 계약이 유효합니다. 모든 근접 공격이 강하게 흡혈합니다.\n\n남은 시간: %s턴
