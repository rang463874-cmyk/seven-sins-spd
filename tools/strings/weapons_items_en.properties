items.weapon.melee.sins.sinweapons.sin_active=This is a weapon of _%s_. Its special effect is active.
items.weapon.melee.sins.sinweapons.sin_inactive=Only _%s_ can draw out this weapon's special effect. For now it is an ordinary weapon.
items.weapon.melee.sins.gnawingfang.name=gnawing fang
items.weapon.melee.sins.gnawingfang.desc=A short, serrated blade. It seems to drink something from the wounds it opens.
items.weapon.melee.sins.gnawingfang.effect=_Sin effect:_ Kills with this weapon grant _0.5_ weapon devour points.
items.weapon.melee.sins.gluttonscythe.name=glutton's scythe
items.weapon.melee.sins.gluttonscythe.desc=A violet scythe curved like a huge maw. Every swing brings a pang of hunger.
items.weapon.melee.sins.gluttonscythe.effect=_Sin effect:_ Devouring gear grants _50%_ more points, and kills with this weapon grant _2_ weapon devour points.
items.weapon.melee.sins.collectorrod.name=collector's rod
items.weapon.melee.sins.collectorrod.desc=A heavy gilded cudgel, worn smooth by the hands of debt collectors.
items.weapon.melee.sins.collectorrod.effect=_Sin effect:_ Hits have a _30%_ chance to pay _(1 + depth)_ gold into the card.
items.weapon.melee.sins.midasaxe.name=midas axe
items.weapon.melee.sins.midasaxe.desc=A huge axe of solid gold down to its edge. Everything it cuts takes on a golden sheen.
items.weapon.melee.sins.midasaxe.effect=_Sin effect:_ Deals _+1_ damage per 200 gold in the card (up to 10 + 2 per upgrade). Kills with this weapon pay _(5 + 2 x depth)_ gold into the card.
items.weapon.melee.sins.tauntknuckle.name=taunting knuckles
items.weapon.melee.sins.tauntknuckle.desc=Gloves reinforced with red iron. Anyone they strike loses their temper and charges.
items.weapon.melee.sins.tauntknuckle.effect=_Sin effect:_ Each hit recharges the War Drum by _0.08 charges_.
items.weapon.melee.sins.wrathgreatsword.name=greatsword of wrath
items.weapon.melee.sins.wrathgreatsword.desc=A massive sword glowing blood red. It fills the minds of those it strikes with rage.
items.weapon.melee.sins.wrathgreatsword.effect=_Sin effect:_ Struck enemies go amok for _2 turns_ (not bosses). Grudge from infighting is increased by _50%_.
items.weapon.melee.sins.duelingsword.name=dueling sword
items.weapon.melee.sins.duelingsword.desc=An elegant rapier with a platinum hilt. Just holding it straightens your posture.
items.weapon.melee.sins.duelingsword.effect=_Sin effect:_ Dignity builds _1 turn_ faster.
items.weapon.melee.sins.kingsaegis.name=king's aegis
items.weapon.melee.sins.kingsaegis.desc=A huge shield bearing a royal crest. No one dares raise their head before it.
items.weapon.melee.sins.kingsaegis.effect=_Sin effect:_ Glory gained is increased by _50%_, and maximum dignity is increased by _5_.
items.weapon.melee.sins.rosewhip.name=rose whip
items.weapon.melee.sins.rosewhip.desc=A whip braided from rose vines. Those scratched by its thorns grow strangely entranced. It can strike enemies _2 tiles_ away, at the cost of some damage.
items.weapon.melee.sins.rosewhip.effect=_Sin effect:_ Hits have a _15%_ chance to charm the enemy for _4 turns_.
items.weapon.melee.sins.roseglaive.name=thorned rose glaive
items.weapon.melee.sins.roseglaive.desc=A long glaive sprouting rose thorns up to its tip. It drinks deeply of the enthralled.
items.weapon.melee.sins.roseglaive.effect=_Sin effect:_ Attacking charmed enemies doesn't break the charm, heals you for _30%_ of the damage and builds desire.
items.weapon.melee.sins.pickpocketdagger.name=pickpocket's dagger
items.weapon.melee.sins.pickpocketdagger.desc=A green dagger easily hidden in a sleeve. Every stab quietly takes something.
items.weapon.melee.sins.pickpocketdagger.effect=_Sin effect:_ Each hit adds _1_ extra robbed stack.
items.weapon.melee.sins.usurpersgauntlets.name=usurper's gauntlets
items.weapon.melee.sins.usurpersgauntlets.desc=Green gauntlets with mismatched fingers, as if each was taken from someone else's hand.
items.weapon.melee.sins.usurpersgauntlets.effect=_Sin effect:_ Maximum robbed stacks are increased by _5_, and each hit grants _0.1_ envy.
items.weapon.melee.sins.pillowmace.name=pillow mace
items.weapon.melee.sins.pillowmace.desc=A club stuffed full of cotton. Both the wielder and the victim start to feel drowsy.
items.weapon.melee.sins.pillowmace.effect=_Sin effect:_ Each hit builds _1_ torpor.
items.weapon.melee.sins.dreamhammer.name=dream hammer
items.weapon.melee.sins.dreamhammer.desc=A huge hammer glowing a dreamy blue. The longer you wait, the heavier it gets.
items.weapon.melee.sins.dreamhammer.effect=_Sin effect:_ Deals _3%_ more damage per torpor.
items.sinsigil.name=sigil of sin
items.sinsigil.desc=A seal the blacksmith stamped in red-hot iron. Pressed into a weapon, it reforges it into the _tier 5 weapon_ of the sin you bear.\n\nThe weapon's _upgrades and enchantment_ are kept. Curses remain as well.
items.sinsigil.ac_imprint=imprint
items.sinsigil.prompt=Choose a melee weapon to imprint
items.sinsigil.no_sin=This sigil means nothing to one who bears no sin.
items.sinsigil.imprinted=Your %s was reforged into a %s!
