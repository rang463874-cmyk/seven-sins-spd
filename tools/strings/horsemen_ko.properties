actors.mobs.npcs.prophet.name=봉인의 예언자
actors.mobs.npcs.prophet.desc=두건을 깊이 눌러쓴 예언자입니다. 묵시록의 봉인이 깨질 날을 기다리며 하수도에 숨어 지내고 있습니다.
actors.mobs.npcs.prophet.intro=왔구나, %s. 기다리고 있었다.\n\n이 층 어딘가에서 _봉인의 파수꾼_이 _묵시록의 봉인_을 지키고 있다. 네 기사의 힘을 빌려 쓰는 강한 녀석이지. 상처를 입을 때마다 정복, 전쟁, 기근, 죽음의 모습으로 바뀌니 조심해라.\n\n녀석을 쓰러뜨리고 봉인을 가져오면, 봉인 너머에서 기다리는 _네 기사_ 중 하나의 힘을 네게 나눠 주마.
actors.mobs.npcs.prophet.reminder=아직 봉인을 가져오지 못했구나. _봉인의 파수꾼_은 이 층 어딘가를 떠돌고 있다. 녀석이 모습을 바꿀 때마다 싸우는 법도 바뀐다는 것을 잊지 마라.
actors.mobs.sealwarden.name=봉인의 파수꾼
actors.mobs.sealwarden.desc=묵시록의 봉인을 지키는 갑옷 차림의 파수꾼입니다. 네 기사의 힘을 빌려 쓰며, 체력이 4분의 1씩 줄어들 때마다 다음 기사의 모습으로 바뀝니다.
actors.mobs.sealwarden.desc_conquest=_정복의 모습:_ 두꺼운 갑옷이 공격을 막아냅니다.
actors.mobs.sealwarden.desc_war=_전쟁의 모습:_ 1.5배 빠르게 공격합니다.
actors.mobs.sealwarden.desc_famine=_기근의 모습:_ 공격에 맞으면 약해지고 포만감을 빼앗깁니다.
actors.mobs.sealwarden.desc_death=_죽음의 모습:_ 체력이 절반 아래인 상대에게 훨씬 강하게 공격합니다.
actors.mobs.sealwarden.aspect_war=전쟁!
actors.mobs.sealwarden.aspect_famine=기근!
actors.mobs.sealwarden.aspect_death=죽음!
actors.mobs.sealwarden.aspect_conquest=정복!
actors.mobs.sealwarden.notice=봉인에 손대려는 자여... 네 기사의 이름으로 너를 막겠다!
actors.mobs.sealwarden.yell_war=붉은 말이 달려온다! 칼날이 멈추지 않으리라!
actors.mobs.sealwarden.yell_famine=검은 저울이 기운다... 네 힘을 거두어 가마.
actors.mobs.sealwarden.yell_death=창백한 말이 왔다. 그 뒤를 지옥이 따르리라...
actors.mobs.sealwarden.yell_conquest=흰 말 위의 자는 이기고 또 이기리라!
actors.mobs.sealwarden.defeated=봉인이... 풀린다...
actors.mobs.npcs.prophet$sealbearer.name=봉인 조각 보유
actors.mobs.npcs.prophet$sealbearer.desc=묵시록의 봉인 조각을 품고 있습니다. 쓰러뜨리면 조각을 떨어뜨립니다.
