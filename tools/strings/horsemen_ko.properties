actors.mobs.npcs.prophet.name=봉인의 예언자
actors.mobs.npcs.prophet.desc=두건을 깊이 눌러쓴 예언자입니다. 묵시록의 봉인이 깨질 날을 기다리며 하수도에 숨어 지내고 있습니다.
actors.mobs.npcs.prophet.intro=왔구나, %s. 기다리고 있었다.\n\n이 층 어딘가에 _묵시록의 봉인 조각_ 네 개가 흩어져 있다. 봉인의 기운에 취한 _강한 짐승들_이 하나씩 품고 돌아다니지.\n\n조각 네 개를 모두 가져오면, 봉인 너머에서 기다리는 _네 기사_ 중 하나의 힘을 네게 나눠 주마.
actors.mobs.npcs.prophet.reminder=봉인 조각은 아직 _%d / %d_개뿐이구나. 기운에 취한 짐승들을 찾아라. 몸에 봉인의 표식이 있을 것이다.
actors.mobs.npcs.prophet$sealbearer.name=봉인 조각 보유
actors.mobs.npcs.prophet$sealbearer.desc=묵시록의 봉인 조각을 품고 있습니다. 쓰러뜨리면 조각을 떨어뜨립니다.
