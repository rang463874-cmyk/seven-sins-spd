items.goldencard.name=golden card
items.goldencard.desc=A debit card of gleaming gold. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nThe more _gold you carry_, the stronger you are. Picking up gold fills the _payment limit_, which pays for _payment skills_ and lets you _sell_ items anywhere.
