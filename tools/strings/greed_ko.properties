actors.hero.heroclass.greed=탐욕
actors.hero.heroclass.greed_desc_short=칠죄종 중 _탐욕_의 죄를 짊어진 자. 탐욕은 _가진 골드가 많을수록 강해지고_, 골드를 주워 채운 _결제 한도_로 결제 기술을 사용합니다.
actors.hero.heroclass.greed_desc=탐욕은 _황금 체크카드_를 유물 칸에 착용한 채 시작합니다. 벗어도 성장은 유지되지만, 기술은 착용해야 쓸 수 있습니다. _현재 소지한 골드_에 비례해 근접 피해, 명중, 최대 체력, 방어력, 회피가 끝없이 오릅니다. 대신 상점에서 골드를 쓰면 그만큼 스탯도 내려갑니다.\n\n골드를 주우면 주운 양만큼 _결제 한도_가 차오르며(골드는 그대로 지갑에 들어갑니다), 한도를 써서 _금화 세례_, _황금 장벽_, _급행료_(순간 이동), _매수_ 같은 결제 기술을 사용합니다. _원격 판매_로 상점이 없어도 상점가 그대로 물건을 팔 수 있습니다.\n\n탐욕은 _단검_을 들고 시작하며, _치유 물약_과 _지도 작성 주문서_를 알아볼 수 있습니다.
actors.hero.heroclass.greed_unlock=탐욕은 처음부터 해금되어 있습니다.

actors.hero.herosubclass.banker=은행원
actors.hero.herosubclass.banker_short_desc=_은행원_은 새 층에 내려갈 때마다 _소지 골드_에 _복리 이자_를 받습니다.
actors.hero.herosubclass.banker_desc=은행원은 돈이 돈을 버는 법을 압니다. 처음 방문하는 층에 도착할 때마다 소지한 골드의 _5%_를 이자로 받으며, 이자는 지갑에 더해져 _복리_로 불어납니다. 골드를 아껴둘수록 스탯과 이자가 함께 커집니다.\n\n전용 특성으로 이율을 높이거나, 이자로 결제 한도까지 채우거나, 층 이동 없이도 배당금을 받을 수 있습니다.
actors.hero.herosubclass.usurer=고리대금업자
actors.hero.herosubclass.usurer_short_desc=_고리대금업자_는 적에게 _강제로 골드를 빌려주고_, 채무자를 공격할 때 큰 추가 피해를 입히며 처치하면 _원금의 2배_를 회수합니다.
actors.hero.herosubclass.usurer_desc=고리대금업자는 결제 기술에 _강제 대출_이 추가됩니다. 적의 최대 체력의 3배에 해당하는 골드를 _지갑에서_ 빌려주면 그 적은 _채무자_가 됩니다.\n\n채무자를 공격할 때마다 _원금의 8%_만큼 추가 피해를 주고, 채무자가 죽으면 _원금의 2배_가 지갑으로 돌아옵니다. 채무자를 놓치면 원금은 돌아오지 않습니다.

actors.hero.talent.greed_penny.title=짠돌이
actors.hero.talent.greed_penny.desc=_+1:_ 골드를 주울 때 _10%_를 더 얻습니다.\n\n_+2:_ 골드를 주울 때 _20%_를 더 얻습니다.
actors.hero.talent.greed_loot.title=전리품 감각
actors.hero.talent.greed_loot.desc=_+1:_ 적을 처치할 때마다 _(2 + 층 수)_ 골드를 얻습니다.\n\n_+2:_ 적을 처치할 때마다 그 _2배_를 얻습니다.
actors.hero.talent.greed_gilded_skin.title=금박 피부
actors.hero.talent.greed_gilded_skin.desc=골드를 주우면 주운 양에 비례한 방어막을 얻습니다.\n\n_+1:_ 주운 골드의 _4%_ (최대 체력의 15%까지)\n\n_+2:_ 주운 골드의 _8%_ (최대 체력의 30%까지)
actors.hero.talent.greed_discount.title=할인 쿠폰
actors.hero.talent.greed_discount.desc=_+1:_ 모든 결제 기술 비용이 _15%_ 줄어듭니다.\n\n_+2:_ 모든 결제 기술 비용이 _30%_ 줄어듭니다.
actors.hero.talent.greed_hoard.title=금빛 만찬
actors.hero.talent.greed_hoard.desc=음식을 먹는 데 _3턴_이 아니라 _1턴_이 걸리고, 먹을 때마다 결제 게이지가 찹니다.\n\n_+1:_ 최대치의 _15%_\n\n_+2:_ 최대치의 _30%_
actors.hero.talent.greed_compensation.title=손해배상
actors.hero.talent.greed_compensation.desc=피해를 받으면 받은 피해에 비례해 결제 한도가 찹니다.\n\n_+1:_ 피해의 _50%_\n\n_+2:_ 피해의 _100%_
actors.hero.talent.greed_express.title=특급 배송
actors.hero.talent.greed_express.desc=급행료의 이동 거리가 늘어납니다. (기본 4칸)\n\n_+1:_ _5칸_\n\n_+2:_ _6칸_
actors.hero.talent.greed_bribery.title=검은 거래
actors.hero.talent.greed_bribery.desc=매수의 지속 시간이 늘어납니다. (기본 10턴)\n\n_+1:_ _15턴_\n\n_+2:_ _20턴_
actors.hero.talent.greed_coinshot.title=동전 폭탄
actors.hero.talent.greed_coinshot.desc=_+1:_ 금화 세례의 피해가 _25%_ 증가합니다.\n\n_+2:_ 금화 세례의 피해가 _50%_ 증가합니다.
actors.hero.talent.greed_prestige.title=VIP 등급
actors.hero.talent.greed_prestige.desc=소지 골드로 얻는 모든 스탯 효과가 증가합니다.\n\n_+1:_ _10%_ 증가\n\n_+2:_ _20%_ 증가\n\n_+3:_ _30%_ 증가
actors.hero.talent.greed_midas.title=미다스의 손
actors.hero.talent.greed_midas.desc=근접 공격이 적중하면 일정 확률로 _(5 + 층 수)_ 골드를 얻습니다.\n\n_+1:_ _5%_ 확률\n\n_+2:_ _10%_ 확률\n\n_+3:_ _15%_ 확률
actors.hero.talent.banker_rate.title=우대 금리
actors.hero.talent.banker_rate.desc=층 이자율이 높아집니다. (기본 5%)\n\n_+1:_ _8%_\n\n_+2:_ _11%_\n\n_+3:_ _14%_
actors.hero.talent.banker_capitalize.title=이자 적립
actors.hero.talent.banker_capitalize.desc=이자를 받을 때 이자에 비례해 _결제 한도_도 찹니다.\n\n_+1:_ 이자의 _50%_\n\n_+2:_ 이자의 _100%_\n\n_+3:_ 이자의 _150%_
actors.hero.talent.banker_dividend.title=배당금
actors.hero.talent.banker_dividend.desc=층을 이동하지 않아도 일정 턴마다 _이자의 절반_을 받습니다.\n\n_+1:_ _300턴_마다\n\n_+2:_ _200턴_마다\n\n_+3:_ _100턴_마다
actors.hero.talent.usurer_gouge.title=폭리
actors.hero.talent.usurer_gouge.desc=채무자를 처치할 때 회수하는 금액이 늘어납니다. (기본 원금의 2배)\n\n_+1:_ _2.5배_\n\n_+2:_ _3배_\n\n_+3:_ _3.5배_
actors.hero.talent.usurer_collector.title=빚 독촉
actors.hero.talent.usurer_collector.desc=채무자에게 주는 추가 피해가 늘어납니다.\n\n_+1:_ _25%_ 증가\n\n_+2:_ _50%_ 증가\n\n_+3:_ _75%_ 증가
actors.hero.talent.usurer_lien.title=압류
actors.hero.talent.usurer_lien.desc=채무자에게 받는 피해가 줄어듭니다.\n\n_+1:_ _10%_ 감소\n\n_+2:_ _20%_ 감소\n\n_+3:_ _30%_ 감소
actors.hero.talent.rain_radius.title=폭우
actors.hero.talent.rain_radius.desc=황금비의 범위가 늘어납니다. (기본 2칸)\n\n_+1:_ _3칸_\n\n_+2:_ _3칸_\n\n_+3:_ _4칸_\n\n_+4:_ _4칸_
actors.hero.talent.rain_dazzle.title=눈부신 광채
actors.hero.talent.rain_dazzle.desc=황금비에 맞은 적이 _실명_됩니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_
actors.hero.talent.rain_refund.title=환급
actors.hero.talent.rain_refund.desc=황금비가 적을 맞힐 때마다 결제 한도가 찹니다. 깊은 층일수록 많아집니다.\n\n_+1:_ 적 하나당 _5_ 기준\n\n_+2:_ _10_ 기준\n\n_+3:_ _15_ 기준\n\n_+4:_ _20_ 기준
actors.hero.talent.ins_coverage.title=보장 확대
actors.hero.talent.ins_coverage.desc=보험금으로 회복하는 체력이 늘어납니다. (기본 30%)\n\n_+1:_ _40%_\n\n_+2:_ _50%_\n\n_+3:_ _60%_\n\n_+4:_ _70%_
actors.hero.talent.ins_term.title=장기 계약
actors.hero.talent.ins_term.desc=보험 기간이 늘어납니다. (기본 50턴)\n\n_+1:_ _75턴_\n\n_+2:_ _100턴_\n\n_+3:_ _125턴_\n\n_+4:_ _150턴_
actors.hero.talent.ins_payout.title=특약
actors.hero.talent.ins_payout.desc=보험금을 받으면 잠시 _무적_이 됩니다.\n\n_+1:_ _2턴_\n\n_+2:_ _3턴_\n\n_+3:_ _4턴_\n\n_+4:_ _5턴_
actors.hero.talent.bankrupt_reach.title=전국 추심망
actors.hero.talent.bankrupt_reach.desc=파산 선고의 범위가 늘어납니다. (기본 4칸)\n\n_+1:_ _6칸_\n\n_+2:_ _8칸_\n\n_+3:_ _10칸_\n\n_+4:_ _12칸_
actors.hero.talent.bankrupt_seize.title=전액 압류
actors.hero.talent.bankrupt_seize.desc=파산 선고가 채무자에게 주는 추가 피해가 늘어납니다. (기본 원금의 50%)\n\n_+1:_ _75%_\n\n_+2:_ _100%_\n\n_+3:_ _125%_\n\n_+4:_ _150%_
actors.hero.talent.bankrupt_dread.title=빚쟁이의 공포
actors.hero.talent.bankrupt_dread.desc=파산 선고에서 살아남은 적이 _공포_에 빠집니다.\n\n_+1:_ _2턴_\n\n_+2:_ _4턴_\n\n_+3:_ _6턴_\n\n_+4:_ _8턴_

actors.hero.abilities.greed.goldrain.name=황금비
actors.hero.abilities.greed.goldrain.short_desc=주변에 금화를 쏟아부어 _보이는 모든 적_에게 피해를 줍니다.
actors.hero.abilities.greed.goldrain.desc=주변 2칸 안에 보이는 모든 적에게 레벨에 비례한 피해에 _소지 골드 100당 0.3_을 더해 입힙니다. 가진 골드가 많을수록 강해집니다.
actors.hero.abilities.greed.insurance.name=보험
actors.hero.abilities.greed.insurance.short_desc=보험에 가입해 기간 안에 받는 _치명상 한 번_을 버텨냅니다.
actors.hero.abilities.greed.insurance.desc=50턴 동안 보험이 유지됩니다. 그동안 죽을 피해를 받으면 대신 _최대 체력의 30%_로 살아나고 보험이 해지됩니다. 십자가보다 먼저 발동합니다.
actors.hero.abilities.greed.insurance.payout=보험금이 지급되었다! 죽음을 면했다.
actors.hero.abilities.greed.bankruptcy.name=파산 선고
actors.hero.abilities.greed.bankruptcy.short_desc=보이는 적 모두에게 파산을 선고합니다. _채무자_는 빚에 비례한 큰 피해를 받습니다.
actors.hero.abilities.greed.bankruptcy.desc=4칸 안에 보이는 모든 적에게 레벨에 비례한 피해를 줍니다. 채무 상태인 적은 추가로 _원금의 50%_만큼 피해를 받습니다. 고리대금업자와 특히 잘 어울립니다.

actors.buffs.greedvault.name=황금 금고
actors.buffs.greedvault.desc_money=소지 골드: _%d_\n결제 한도: _%d / %d_
actors.buffs.greedvault.desc_stats=근접 추가 피해: _+%d_\n정확도: _+%d%%_\n최대 체력: _+%d_\n추가 방어력: _0~%d_\n회피: _+%d%%_
actors.buffs.greedvault.desc_interest=층 이자율: _%d%%_
actors.buffs.greedvault.interest=이자 %d 골드가 입금되었다.
actors.buffs.greedvault$debt.name=채무
actors.buffs.greedvault$debt.desc=탐욕에게 _%d_ 골드를 억지로 빌렸습니다. 공격받을 때마다 빚 독촉에 시달리며, 죽으면 _%d_ 골드를 갚게 됩니다.
actors.buffs.greedvault$debt.collected=빚 %d 골드를 회수했다!
actors.buffs.greedvault$insurance.name=보험 가입
actors.buffs.greedvault$insurance.desc=보험이 유효합니다. 치명적인 피해를 한 번 버텨냅니다.\n\n남은 기간: %s턴
