actors.mobs.ascent.ascentchaser.staggered=Staggered!
actors.mobs.ascent.moloch.name=Moloch
actors.mobs.ascent.moloch.desc=The bull-headed furnace god who devoured offerings. The furnace in his chest glows red, and burning offerings gather around him.\n\nHe charges in a straight line, wreathes his surroundings in flame when the furnace heats up, and calls forth burning offerings.
actors.mobs.ascent.moloch.notice=More offerings! Into the furnace with you!
actors.mobs.ascent.moloch.skill_charge=Charge
actors.mobs.ascent.moloch.skill_furnace=Furnace
actors.mobs.ascent.moloch.skill_offering=Offering
actors.mobs.ascent.lilith.name=Lilith
actors.mobs.ascent.lilith.desc=Queen of the night and the first witch. Not even moonlight remains where she has passed.\n\nShe scatters charming curses in a checker pattern, calls the night's wraiths and drains life with a kiss.
actors.mobs.ascent.lilith.notice=A new god? The night belongs to no one, darling.
actors.mobs.ascent.lilith.skill_night=Night's Curse
actors.mobs.ascent.lilith.skill_spirits=Wraiths
actors.mobs.ascent.lilith.skill_kiss=Kiss of Death
actors.mobs.ascent.azazel.name=Azazel
actors.mobs.ascent.azazel.desc=The fallen angel who taught men to forge blades, the scapegoat. Behind him an armory spits out blades without end.\n\nHe scatters blades, drags with chains and, below half health, lets the armory run wild.
actors.mobs.ascent.azazel.notice=Become a god with blades I forged? How amusing.
actors.mobs.ascent.azazel.skill_blades=Rain of Blades
actors.mobs.ascent.azazel.skill_chains=Chains
actors.mobs.ascent.azazel.skill_armory=Armory Unleashed
actors.mobs.ascent.abaddon.name=Abaddon
actors.mobs.ascent.abaddon.desc=King of the bottomless pit, lord of the locusts. Every beat of his wings darkens the sky with them.\n\nHis locusts sweep in bands, the ground opens under you to hold you fast, and he hardens his carapace and calls vermin.
actors.mobs.ascent.abaddon.notice=The gates of the pit never close. Back down with you!
actors.mobs.ascent.abaddon.skill_locusts=Locust Swarm
actors.mobs.ascent.abaddon.skill_pit=Bottomless Pit
actors.mobs.ascent.abaddon.skill_carapace=Carapace
actors.mobs.ascent.cherubim.name=Cherubim
actors.mobs.ascent.cherubim.desc=The angel guarding the gate of Eden, with the four faces of lion, ox, eagle and man and a flaming sword turning every way.\n\nThe sword sweeps the ground around it quarter by quarter, the four faces cast light in an X and pillars of fire bar the way in a cross.
actors.mobs.ascent.cherubim.notice=Sinner, this gate will not open for you.
actors.mobs.ascent.cherubim.skill_sword=Turning Sword
actors.mobs.ascent.cherubim.skill_faces=Four Faces
actors.mobs.ascent.cherubim.skill_guard=Gatekeeper
actors.mobs.ascent.ophanim.name=Ophanim
actors.mobs.ascent.ophanim.desc=Wheels turning within wheels, covered in eyes. Not a single sin escapes them.\n\nIts wheels roll across the floor in bands, its gaze burns in a straight line and its eyes open in a checker pattern to hex.
actors.mobs.ascent.ophanim.notice=Every eye is upon you.
actors.mobs.ascent.ophanim.skill_wheel=Rolling Wheel
actors.mobs.ascent.ophanim.skill_gaze=Gaze
actors.mobs.ascent.ophanim.skill_eyes=Thousand Eyes
actors.mobs.ascent.azrael.name=Azrael
actors.mobs.ascent.azrael.desc=The angel of death. Whoever's name is written in his scroll breathes their last at the appointed time.\n\nHe writes a death mark (a heavy blow if you are near him when it runs out), reaps the souls around him and swings his scythe in a fan.
actors.mobs.ascent.azrael.notice=Your name is already written.
actors.mobs.ascent.azrael.skill_mark=Death Mark
actors.mobs.ascent.azrael.skill_harvest=Soul Harvest
actors.mobs.ascent.azrael.skill_scythe=Scythe
actors.mobs.ascent.azrael.marked=Azrael wrote your name! Get more than %d tiles away before it runs out.
actors.mobs.ascent.azrael.escaped=The death mark fades into the air.
actors.mobs.ascent.azrael$deathmark.name=Death Mark
actors.mobs.ascent.azrael$deathmark.desc=Your name is in Azrael's scroll. If you are within %d tiles of him when the mark ends, you take a heavy blow.\n\nTurns left: %s
actors.mobs.ascent.sandalphon.name=Sandalphon
actors.mobs.ascent.sandalphon.desc=The towering angel who weaves the prayers into song, twin of Metatron. His song shakes the earth.\n\nHe sends out rings of song, calls believers with a hymn while shielding himself, and lets his twin's voice ring out in a cross.
actors.mobs.ascent.sandalphon.notice=Listen. This is your last hymn.
actors.mobs.ascent.sandalphon.skill_song=Ring of Song
actors.mobs.ascent.sandalphon.skill_hymn=Hymn
actors.mobs.ascent.sandalphon.skill_voice=Twin's Voice
actors.mobs.ascent.behemoth.name=Behemoth
actors.mobs.ascent.behemoth.desc=The giant beast of the land. The sewers crumble at its every step. It can't be slain: blows only make it stagger, so run for the surface.\n\nIt tramples forward in a straight line and stamps to shake the ground.
actors.mobs.ascent.behemoth.notice=GRRRRR...!
actors.mobs.ascent.behemoth.skill_stampede=Stampede
actors.mobs.ascent.behemoth.skill_quake=Quake
actors.mobs.ascent.metatron.name=Metatron
actors.mobs.ascent.metatron.desc=The voice of God, an angel tall as heaven. He can't be slain: blows only make him stagger, so run for the surface.\n\nHe brings down pillars of light and sends out shockwaves of his voice.
actors.mobs.ascent.metatron.notice=Sinner, you shall not walk into the light.
actors.mobs.ascent.metatron.skill_pillars=Pillars of Light
actors.mobs.ascent.metatron.skill_voice=Voice of God
