actors.hero.heroclass.gluttony_desc_short=Bearer of the sin of _Gluttony_. Gluttony grows stronger by _eating anything_. Every potion, food and scroll it consumes grants _permanent stats_, and even harmful potions become power.
actors.hero.heroclass.gluttony_desc=The Glutton starts with the _Predator's Maw_ worn in the artifact slot. Growth stays if it's taken off, but its skills only work while worn.\n\nThe Glutton grows by _consuming_. _Potions_ raise melee damage and accuracy, _food and seeds_ raise max HP and armor, and _scrolls and runestones_ raise a bit of everything, mostly evasion. Every new kind tasted goes into the _gourmet codex_, which unlocks new perks as it fills.\n\nA glutton eats anything: even _harmful potions and scrolls become buffs_. The maw's skills cost satiety.\n\nThe Glutton starts with a _worn shortsword_ and can identify _potions of healing_ and _scrolls of remove curse_.
actors.hero.herosubclass.gourmand=gourmand
actors.hero.herosubclass.gourmand_short_desc=The _Gourmand_ gets _50% more satiety_ from food and _double devour points_ from food and seeds.
actors.hero.herosubclass.gourmand_desc=The Gourmand savors every bite. Food gives _50%_ more satiety, and food and seeds give _double_ devour points.\n\nIts talents squeeze even more out of every meal.
actors.hero.herosubclass.inheritor=alchemic glutton
actors.hero.herosubclass.inheritor_short_desc=The _Alchemic Glutton_ gets _50% more devour points_ from potions, scrolls and runestones.
actors.hero.herosubclass.inheritor_desc=The Alchemic Glutton has a taste for magic. Potions, scrolls and runestones give _50%_ more devour points.\n\nIts talents draw even more power out of potions and scrolls.
actors.hero.talent.predator_feast.title=feast
actors.hero.talent.predator_feast.desc=_+1:_ Eating food heals _10%_ of max HP.\n\n_+2:_ Eating food heals _20%_ of max HP.
actors.hero.talent.predator_taste.title=discerning tongue
actors.hero.talent.predator_taste.desc=_+1:_ Using a consumable reveals whether one unidentified item in your bag is _cursed_.\n\n_+2:_ Using a consumable _identifies_ one unidentified item in your bag.
actors.hero.talent.predator_fang.title=hungry fang
actors.hero.talent.predator_fang.desc=_+1:_ After using a consumable, your next _3_ melee hits deal _15%_ more damage.\n\n_+2:_ After using a consumable, your next _3_ melee hits deal _30%_ more damage.
actors.hero.talent.predator_hide.title=tough stomach
actors.hero.talent.predator_hide.desc=_+1:_ Using a consumable grants shielding equal to _4%_ of max HP.\n\n_+2:_ Using a consumable grants shielding equal to _8%_ of max HP.
actors.hero.talent.predator_gluttony.title=hearty appetite
actors.hero.talent.predator_gluttony.desc=Eating takes _1 turn_ instead of 3, and food gives more satiety.\n\n_+1:_ _20%_ more satiety\n\n_+2:_ _40%_ more satiety
actors.hero.talent.predator_curse_eater.title=acid constitution
actors.hero.talent.predator_curse_eater.desc=_+1:_ Damage from poison, ooze and corrosion is _halved_.\n\n_+2:_ You become _immune_ to poison, ooze and corrosion.
actors.hero.talent.predator_efficiency.title=efficient digestion
actors.hero.talent.predator_efficiency.desc=_+1:_ All devour points are increased by _10%_.\n\n_+2:_ All devour points are increased by _20%_.
actors.hero.talent.predator_scraps.title=wide gullet
actors.hero.talent.predator_scraps.desc=Swallow Whole gives more devour points. (3x by default)\n\n_+1:_ _4.5x_\n\n_+2:_ _6x_
actors.hero.talent.predator_instinct.title=hunting instinct
actors.hero.talent.predator_adapt.title=balanced diet
actors.hero.talent.predator_adapt.desc=Gaining devour points also adds some to the other two categories.\n\n_+1:_ _5%_ of the points to each\n\n_+2:_ _10%_ to each\n\n_+3:_ _15%_ to each
actors.hero.talent.gourmand_second_stomach.title=second stomach
actors.hero.talent.gourmand_second_stomach.desc=_+1:_ All devour points are increased by another _10%_.\n\n_+2:_ All devour points are increased by another _20%_.\n\n_+3:_ All devour points are increased by another _30%_.
actors.hero.talent.gourmand_leftovers.title=clean plate
actors.hero.talent.gourmand_leftovers.desc=Every meal permanently raises max HP.\n\n_+1:_ _+1_ per meal\n\n_+2:_ _+2_ per meal\n\n_+3:_ _+3_ per meal
actors.hero.talent.gourmand_food_coma.title=food coma
actors.hero.talent.gourmand_food_coma.desc=After eating food, the next hit you take is reduced.\n\n_+1:_ _20%_ less\n\n_+2:_ _35%_ less\n\n_+3:_ _50%_ less
actors.hero.talent.inheritor_resonance.title=resonance
actors.hero.talent.inheritor_resonance.desc=Drinking a potion has a chance to also grant _haste_, _bless_ or _shielding_.\n\n_+1:_ _15%_ chance\n\n_+2:_ _30%_ chance\n\n_+3:_ _45%_ chance
actors.hero.talent.inheritor_memory.title=lasting mutation
actors.hero.talent.inheritor_memory.desc=Buffs made from harmful potions and scrolls last longer.\n\n_+1:_ _25%_\n\n_+2:_ _50%_\n\n_+3:_ _75%_
actors.hero.talent.inheritor_purify.title=cleansing taste
actors.hero.talent.inheritor_purify.desc=_+1:_ Reading a scroll removes _one_ harmful effect.\n\n_+2:_ Reading a scroll removes _all_ harmful effects.\n\n_+3:_ It also grants shielding equal to _10%_ of max HP.
actors.hero.talent.bite_digest.desc=Killing with Gorge Bite gives more food points. (2 by default)\n\n_+1:_ _3_\n\n_+2:_ _4_\n\n_+3:_ _5_\n\n_+4:_ _6_
actors.hero.abilities.predator.gorgebite.short_desc=Lunge at a nearby enemy and _bite_ it. Killing it grants _food points_ and heals.
actors.hero.abilities.predator.gorgebite.devoured=food +%s
actors.hero.abilities.predator.irongut.desc=Instantly gain shielding equal to _10 + level + food points_. The more you eat, the stronger it gets.
actors.buffs.predatorstomach.name=devoured
actors.buffs.predatorstomach.desc_head=You have consumed _%d_ items.
actors.buffs.predatorstomach.desc_points=Devour points\nPotions: _%s_   Food: _%s_   Scrolls: _%s_
actors.buffs.predatorstomach.desc_codex=Gourmet codex: _%d kinds_
actors.buffs.predatorstomach.cat_0=potion
actors.buffs.predatorstomach.cat_1=food
actors.buffs.predatorstomach.cat_2=scroll
actors.buffs.predatorstomach.codex_new=%s added to the gourmet codex! (%d kinds)
actors.buffs.predatorstomach.codex_unlock=Gourmet codex reward: %s
actors.buffs.predatorstomach.codex_5=heal 3% HP whenever you use a consumable
actors.buffs.predatorstomach.codex_10=eat seeds for only their helpful side
actors.buffs.predatorstomach.codex_20=converted buffs last 50% longer
actors.buffs.predatorstomach.codex_30=15% chance to keep a scroll after reading it (not upgrade or transmutation)
actors.buffs.predatorstomach.codex_40=the maw's skills cost half the satiety
actors.buffs.predatorstomach.codex_50=feast: every consumable gives 30 satiety and 5% HP shielding
actors.buffs.predatorstomach.codex_60=potions have a 25% chance to take effect twice (not growth potions)
actors.buffs.predatorstomach.converted=Your stomach turns the harmful power into your own!
actors.buffs.predatorstomach.echo=The taste lingers... the effect triggers again!
actors.buffs.predatorstomach.preserved=You finished %s, but it didn't vanish!
actors.buffs.predatorstomach.ac_eat_seed=EAT
actors.buffs.predatorstomach$fang.desc=Your fangs are sharp from what you just ate. Your next _%d_ melee hits are stronger.
actors.buffs.predatorstomach$coma.desc=You're full and sluggish, but sturdier for it. The next hit you take is reduced by _%d%%_.
actors.buffs.gluttonimbue$venom.name=venom gut
actors.buffs.gluttonimbue$venom.desc=The toxic gas you swallowed has soaked into your body. Your melee hits _poison_, and you're immune to poison.\n\nTurns remaining: %s.
actors.buffs.gluttonimbue$numbing.name=numbing gut
actors.buffs.gluttonimbue$numbing.desc=The paralytic gas you swallowed has soaked into your body. Your melee hits have a _25%%_ chance to _paralyze_, and you're immune to paralysis.\n\nTurns remaining: %s.
actors.buffs.gluttonimbue$acid.name=acid gut
actors.buffs.gluttonimbue$acid.desc=The corrosive gas you swallowed has soaked into your body. Your melee hits _corrode_, and you're immune to corrosion.\n\nTurns remaining: %s.
actors.buffs.gluttonimbue$frenzy.name=frenzy
actors.buffs.gluttonimbue$frenzy.desc=You chewed up a scroll of rage. Your melee damage is increased by _35%%_.\n\nTurns remaining: %s.
