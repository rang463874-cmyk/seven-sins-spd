actors.hero.heroclass.gluttony_desc=Gluttony starts with the _Predator's Maw_ worn in an artifact slot. Growth stays if it is taken off, but its skills only work while it is worn. Use it on unequipped gear to gain devour points based on the item's _tier and upgrades_.\n\n_Weapons_ raise melee damage and accuracy, _armor_ raises max HP, armor and evasion, and _accessories_ (rings, artifacts, trinkets) raise everything a little. Cursed gear is only half absorbed.\n\nThe maw can also spend satiety to _bite_ enemies and steal their health.\n\nGluttony starts with a _worn shortsword_ and knows _potions of healing_ and _scrolls of remove curse_.
