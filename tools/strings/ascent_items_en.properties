ascent.ascenthooks.t_kindness=The light of kindness settles on you.
ascent.ascenthooks.t_diligence=The light of diligence settles on you.
ascent.ascenthooks.gamble=The dice of fate are rolling...
ascent.ascenthooks.shade_reward=Power flows into you as the shadow shatters.
ascent.ascenthooks.charity_gold=A giving hand does not grasp for gold.
ascent.ascenthooks.martyr=Martyrdom
ascent.ascenthooks.martyr_saved=The martyr's will keeps you standing!
ascent.ascenthooks.no_potions=You can't drink potions on the road of abstinence.
ascent.ascenthooks.no_scrolls=You can't read scrolls on the road of silence.
ascent.ascenthooks.end_god_of_sin=Ending: God of Sin
ascent.ascenthooks.end_god_of_sin_text=You took the throne of the gods without letting go of sin. Under the light of the surface, an age begins in which the seven sins serve you.
ascent.ascenthooks.end_god_of_dawn=Ending: God of Dawn
ascent.ascenthooks.end_god_of_dawn_text=Born of sin but risen through virtue, you became the god of a new dawn. The gates of hell close, and the first sunlight touches the surface.
ascent.ascenthooks.end_heir=Ending: Heir of the Demon Lords
ascent.ascenthooks.end_heir_text=You shook off every judgment of the angels and stand on the surface as sin itself. The crown of the seven demon lords is yours.
ascent.ascenthooks.end_penitent=Ending: The Penitent
ascent.ascenthooks.end_penitent_text=You chose to remain a sin, yet kept to virtue all the way up. At last the angels sheathe their swords and accept your penance.
ascent.ascenthooks.end_wanderer=Ending: The Grey Wanderer
ascent.ascenthooks.end_wanderer_text=Neither sin nor virtue could hold you. Neither god nor demon lord, you walk on alone under a grey sky.
ascent.ascenthooks.end_scores=Sin _%d_ - Virtue _%d_
ascent.ascenthooks.end_go=To the surface
ascent.ascenthooks.scale_name=Scale of the Ascent
ascent.ascenthooks.scale_desc=The roads you choose and what you do on the way up weigh on this scale. At the surface, your first choice and the way the scale tips decide the ending.\n\nFirst choice: _%s_\nSin _%d_ - Virtue _%d_\n\nEach kind of deed adds at most 3 points per floor.
