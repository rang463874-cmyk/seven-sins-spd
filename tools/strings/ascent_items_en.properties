ascent.ascenthooks.time_up=Time is up! The faction's hordes are coming.
ascent.ascenthooks.demons_near=You sense demons nearby.
ascent.ascenthooks.angels_near=You hear angels singing.
ascent.ascenthooks.diligence_prize=Diligence rewards you with %s.
