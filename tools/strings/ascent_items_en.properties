ascent.ascentcard.side_sin=Sin
ascent.ascentcard.side_virtue=Virtue
ascent.ascentcard.side_neutral=Neutral
ascent.ascentcard.card_desc=_%s_ card\n\nRisk: %s\n\nReward: %s
ascent.ascentcard.glutton_march=Gluttony: Starving March
ascent.ascentcard.glutton_march_risk=Hunger comes twice as fast.
ascent.ascentcard.glutton_march_reward=Enemies often drop meat, and eating heals 20% of your max health.
ascent.ascentcard.glutton_feast=Gluttony: Predator's Feast
ascent.ascentcard.glutton_feast_risk=Enemies swallow some of the items lying on the floor.
ascent.ascentcard.glutton_feast_reward=They spit them out when slain, and you deal 20% more damage.
ascent.ascentcard.greed_curse=Greed: Golden Curse
ascent.ascentcard.greed_curse_risk=The more gold you pick up in this region, the harder enemies hit (up to 50%).
ascent.ascentcard.greed_curse_reward=Gold picked up is doubled.
ascent.ascentcard.greed_vault=Greed: Crumbling Vault
ascent.ascentcard.greed_vault_risk=Six more hidden traps on every floor.
ascent.ascentcard.greed_vault_reward=Two treasure chests on every floor.
ascent.ascentcard.wrath_fire=Wrath: Burning Road
ascent.ascentcard.wrath_fire_risk=Flames keep bursting from the floor.
ascent.ascentcard.wrath_fire_reward=Enemies take 50% more fire damage, and kills give 50% more experience.
ascent.ascentcard.wrath_legion=Wrath: Legion
ascent.ascentcard.wrath_legion_risk=More enemies come in packs on every floor.
ascent.ascentcard.wrath_legion_reward=Kills give double experience.
ascent.ascentcard.pride_road=Pride: King's Road
ascent.ascentcard.pride_road_risk=Every hit you take makes the next one 10% stronger (up to 100%, reset each floor).
ascent.ascentcard.pride_road_reward=Each kill made without being hurt since the last one drops gold.
ascent.ascentcard.lust_blood=Lust: Blood Pact
ascent.ascentcard.lust_blood_risk=No natural regeneration.
ascent.ascentcard.lust_blood_reward=All your attacks steal 15% of their damage as health.
ascent.ascentcard.envy_mirror=Envy: Mirror Maze
ascent.ascentcard.envy_mirror_risk=A shadow of yourself (weakened) hunts you on every floor.
ascent.ascentcard.envy_mirror_reward=Slaying it grants a random boon and a shield.
ascent.ascentcard.sloth_fog=Sloth: Deep Fog
ascent.ascentcard.sloth_fog_risk=You move 25% slower.
ascent.ascentcard.sloth_fog_reward=Enemies start asleep, and resting heals three times as fast.
ascent.ascentcard.sin_parade=Parade of Sins
ascent.ascentcard.sin_parade_risk=Every enemy is a sin elite.
ascent.ascentcard.sin_parade_reward=Sin points (wisdom for Solomon) are doubled.
ascent.ascentcard.humility_pilgrim=Humility: Pilgrim
ascent.ascentcard.humility_pilgrim_risk=Your equipped weapon and armor count one level lower.
ascent.ascentcard.humility_pilgrim_reward=A well of healing springs up on every floor.
ascent.ascentcard.charity_hand=Charity: Giving Hand
ascent.ascentcard.charity_hand_risk=You can't pick up gold.
ascent.ascentcard.charity_hand_reward=Shops are free, and a wandering merchant sets out wares on every floor.
ascent.ascentcard.chastity_abstain=Chastity: Abstinence
ascent.ascentcard.chastity_abstain_risk=You can't drink potions (throwing still works).
ascent.ascentcard.chastity_abstain_reward=Max health +30%.
ascent.ascentcard.patience_endure=Patience: Endurance
ascent.ascentcard.patience_endure_risk=Enemies have 50% more health.
ascent.ascentcard.patience_endure_reward=You take 25% less damage.
ascent.ascentcard.temperance_silence=Temperance: Silence
ascent.ascentcard.temperance_silence_risk=You can't read scrolls.
ascent.ascentcard.temperance_silence_reward=Your class skills and spells cost half.
ascent.ascentcard.kindness_trial=Kindness: Champion's Trial
ascent.ascentcard.kindness_trial_risk=A champion of virtue hunts you on every floor.
ascent.ascentcard.kindness_trial_reward=Slain champions leave a scroll of upgrade.
ascent.ascentcard.diligence_time=Diligence: Trial of Time
ascent.ascentcard.diligence_time_risk=After 300 turns on a floor, the faction keeps sending packs.
ascent.ascentcard.diligence_time_reward=Leave a floor upwards within 300 turns for a potion or scroll.
ascent.ascentcard.martyr=Martyr's Road
ascent.ascentcard.martyr_risk=Max health -20%.
ascent.ascentcard.martyr_reward=Once in this region, a lethal blow leaves you at 1 health.
ascent.ascentcard.quiet=Quiet Road
ascent.ascentcard.quiet_risk=Gold and enemy loot are halved.
ascent.ascentcard.quiet_reward=Half the enemies on each floor are gone.
ascent.ascentcard.dark=Dark Road
ascent.ascentcard.dark_risk=Your sight is halved.
ascent.ascentcard.dark_reward=Hits on enemies that haven't noticed you deal 50% more.
ascent.ascentcard.flood=Flood
ascent.ascentcard.flood_risk=Much of each floor is under water.
ascent.ascentcard.flood_reward=+20% evasion while standing in water.
ascent.ascentcard.alchemist=Alchemist's Road
ascent.ascentcard.alchemist_risk=Four dangerous traps hidden on every floor.
ascent.ascentcard.alchemist_reward=An alchemy pot and two sin essences on every floor.
ascent.ascentcard.gambler=Gambler's Road
ascent.ascentcard.gambler_risk=Each new floor brings a random curse for 40 turns.
ascent.ascentcard.gambler_reward=Each new floor also brings a random blessing for 40 turns.
ascent.ascenthooks.faction_title=The First Crossroads
ascent.ascenthooks.faction_msg=The amulet throbs in your hand. The way to the surface will depend on what you have chosen to become.\n\nThis choice lies over the whole dungeon for the entire ascent.
ascent.ascenthooks.faction_divinity=Become a new divinity
ascent.ascenthooks.faction_divinity_desc=You rise above sin to become a new god. _Demons_ coveting the old gods' throne appear all over the dungeon and hunt you the whole way up, more of them the higher you climb, fiercest in the final sewers.
ascent.ascenthooks.faction_sinner=Remain a sin
ascent.ascenthooks.faction_sinner_desc=You remain sin itself. _Angels_ (believers, priests, lesser angels) come to judge you, appearing all over the dungeon the whole way up, more of them the higher you climb, fiercest in the final sewers.
ascent.ascenthooks.chose_divinity=You chose to become a new divinity. Somewhere, the gates of hell creak open...
ascent.ascenthooks.chose_sinner=You chose to remain a sin. Heavenly trumpets ring out...
ascent.ascenthooks.cards_title=Crossroads
ascent.ascenthooks.cards_msg=You stand at the threshold of the %s. Choose the road for its five floors. The choice is final.\n\nSin and virtue cards shape the ending. Tap the info button next to a road for details.
ascent.ascenthooks.region_0=Demon Halls
ascent.ascenthooks.region_1=Metropolis
ascent.ascenthooks.region_2=Caves
ascent.ascenthooks.region_3=Prison
