ascent.ascenthooks.t_sloth=Your sloth deepens.
ascent.ascenthooks.t_temperance=The light of temperance settles on you.
ascent.ascenthooks.t_charity=The light of charity settles on you.
ascent.ascenthooks.t_patience=The light of patience settles on you.
ascent.ascenthooks.t_humility=The light of humility settles on you.
