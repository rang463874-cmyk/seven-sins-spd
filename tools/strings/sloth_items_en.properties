items.slothpillow.name=cozy pillow
items.slothpillow.desc=A soft, fluffy blue pillow. Hugging it makes you want to do absolutely nothing. It takes no equipment slot.\n\nIts _charges_ let you rest, shoo away nuisances and lull them to sleep. Charges refill over time. Defeating enemies while you've built up _torpor_ grants _sloth points_, making you permanently stronger.
items.slothpillow.ac_laze=laze
items.slothpillow.prompt=What now... (charges %d/%d)
items.slothpillow.opt_nap=Nap (%d charge)
items.slothpillow.opt_shoo=Shoo (%d charge)
items.slothpillow.opt_yawn=Yawn (%d charges)
items.slothpillow.opt_roll=Roll (%d charge)
items.slothpillow.prompt_roll=Choose where to roll (up to %d tiles, keeps torpor)
items.slothpillow.nobody_near=There's no one nearby to shoo away.
items.slothpillow.yawn_none=You yawn, but no one dozes off.
items.slothpillow.bad_cell=You can't roll there.
items.armor.slotharmor.name=pajamas of sloth
items.armor.slotharmor.desc=Thick, snug pajamas. Far too comfortable to be called armor, and very hard to take off.
