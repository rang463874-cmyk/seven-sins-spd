items.slothpillow.not_puppet=There is no dream puppet there.
items.slothpillow.no_room=There's no room to summon a puppet.
items.slothpillow.yawn_none=You yawned, but nobody caught it.
items.armor.slotharmor.name=pajamas of sloth
items.armor.slotharmor.desc=Thick, snug pajamas. Far too comfortable to be called armor, and very hard to take off.
items.slothpillow.skill_header=Dream puppets %d / %d
items.slothpillow.skill_summon=Summon Puppet
items.slothpillow.skill_mend=Mend Puppets
items.slothpillow.skill_summon_desc=Summons a dream puppet beside you. You can command up to _%d_; with all of them out, it fully heals them instead.
items.slothpillow.skill_nap=Nap
items.slothpillow.skill_nap_desc=Heals 10% of your max HP, and every dream puppet heals 25%.
items.slothpillow.skill_swap=Swap
items.slothpillow.skill_swap_desc=Swaps places with a visible dream puppet.
items.slothpillow.skill_yawn=Yawn
items.slothpillow.skill_yawn_desc=Puts enemies within _%d tiles_ to sleep. Bosses don't fall asleep.
