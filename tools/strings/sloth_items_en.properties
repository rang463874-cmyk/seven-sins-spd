items.slothpillow.name=cozy pillow
items.slothpillow.desc=A soft, fluffy blue pillow. Holding it makes you want to do nothing at all. An artifact worn in the artifact/ring slot; it must be worn to use its skills.\n\nWith the pillow you summon _dream puppets_ to fight for you, nap, swap places with them, put enemies to sleep, point the puppets at a target, and even dream your gear stronger. The price is time: every skill makes you _doze off_ for a few turns, during which you can't do anything. The fighting is the puppets' job.
items.slothpillow.ac_laze=laze
items.slothpillow.prompt=What now? (charges %d / %d, puppets %d / %d)
items.slothpillow.opt_summon=Summon Puppet (%d)
items.slothpillow.opt_mend=Fully Mend Puppets (%d)
items.slothpillow.opt_nap=Nap (%d)
items.slothpillow.opt_swap=Swap (%d)
items.slothpillow.opt_yawn=Yawn (%d)
items.slothpillow.prompt_swap=Choose a dream puppet to swap with
items.slothpillow.not_puppet=There is no dream puppet there.
items.slothpillow.no_room=There's no room to summon a puppet.
items.slothpillow.yawn_none=You yawned, but nobody caught it.
items.armor.slotharmor.name=pajamas of sloth
items.armor.slotharmor.desc=Thick, snug pajamas. Far too comfortable to be called armor, and very hard to take off.
items.slothpillow.skill_header=Dream puppets %d / %d
items.slothpillow.skill_summon=Summon Puppet
items.slothpillow.skill_mend=Mend Puppets
items.slothpillow.skill_summon_desc=Summons a dream puppet beside you. You can command up to _%d_; with all of them out, it fully heals them instead. Each puppet out borrows _%d%%_ of your max HP until it is gone.
items.slothpillow.skill_nap=Nap
items.slothpillow.skill_nap_desc=Heals 10% of your max HP, and every dream puppet heals 25%.
items.slothpillow.skill_swap=Swap
items.slothpillow.skill_swap_desc=Swaps places with a visible dream puppet.
items.slothpillow.skill_yawn=Yawn
items.slothpillow.skill_yawn_desc=Puts enemies within _%d tiles_ to sleep. Bosses don't fall asleep.
items.slothpillow.skill_order=Order
items.slothpillow.skill_order_desc=Points your dream puppets at a visible enemy. Every puppet, wherever it is on the floor, drops what it's doing to hunt that enemy and deals _+%d%%_ damage to it for _%d turns_ or until it dies. Only one enemy can be marked at a time.
items.slothpillow.skill_forge=Dream Forge
items.slothpillow.skill_forge_desc=Fall into a deep sleep of _200 turns (+25 per upgrade, at most 300)_ and dream your equipped weapon or armor _one level stronger_. You can't start with enemies in view, and taking any damage wakes you up and the dream is lost. Dream puppets keep guarding you while you sleep.
items.slothpillow.skill_patrol=Dream Patrol
items.slothpillow.skill_patrol_desc=Doze off and let your dream puppets wander the whole floor in your dream: its layout is revealed (hidden doors and traps stay hidden). Needs at least one puppet.
items.slothpillow.patrol_done=Your puppets wander through your dream and bring back a map of the floor.
items.slothpillow.skill_replicate=Dream Copy
items.slothpillow.skill_replicate_desc=Hug a scroll of upgrade, potion of strength or scroll of enchantment and doze off; you wake up with _two_. Costs a long doze. No limit on uses.
items.slothpillow.forge_ready=_Not used on this floor yet._
items.slothpillow.forge_used=_Already used on this floor._
items.slothpillow.prompt_order=Choose an enemy for your puppets to hunt
items.slothpillow.not_enemy=There is no enemy there.
items.slothpillow.order_shout=Sic!
items.slothpillow.forge_enemies=You can't fall asleep with enemies in view.
items.slothpillow.forge_prompt=Which item will you dream about? Any damage will wake you.
items.slothpillow.forge_option=%s (%d turns)
items.slothpillow.forge_start=You hug the pillow and drift into a deep dream about your %s... (%d turns)
