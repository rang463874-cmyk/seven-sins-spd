items.slothpillow.name=cozy pillow
items.slothpillow.desc=A soft, fluffy blue pillow. Hugging it makes you want to do absolutely nothing. It is worn in an artifact or ring slot, and its skills only work while it is worn.\n\nThe pillow summons _dream puppets_ to fight for you, lets you rest, swaps places with a puppet and lulls enemies to sleep. The price is time: every skill makes you _doze off_ and lose a few turns. Meanwhile the fighting is the puppets' job.
items.slothpillow.ac_laze=laze
