actors.mobs.npcs.prophet.name=prophet of seals
actors.mobs.npcs.prophet.desc=A prophet with a deep hood pulled low. They hide in the sewers, waiting for the day the seals of the apocalypse break.
actors.mobs.npcs.prophet.intro=So you've come, %s. I have been waiting.\n\nFour _fragments of the apocalypse's seals_ are scattered across this floor. _Strong beasts_, drunk on the seals' power, each carry one.\n\nBring me all four fragments, and I will share with you the power of one of the _four horsemen_ waiting beyond the seals.
actors.mobs.npcs.prophet.reminder=You only have _%d / %d_ seal fragments. Find the beasts drunk on their power; they bear the seal's mark.
actors.mobs.npcs.prophet$sealbearer.name=seal bearer
actors.mobs.npcs.prophet$sealbearer.desc=This creature carries a fragment of the apocalypse's seals. Defeat it and it will drop the fragment.
