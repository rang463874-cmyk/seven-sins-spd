actors.mobs.npcs.prophet.name=prophet of seals
actors.mobs.npcs.prophet.desc=A prophet with a deep hood pulled low. They hide in the sewers, waiting for the day the seals of the apocalypse break.
actors.mobs.npcs.prophet.intro=So you've come, %s. I have been waiting.\n\nOn this floor lies a sealed _sanctum_, where the _Seal Warden_ guards the _seal of the apocalypse_. Once you step inside, it will close the way out behind you. It borrows the power of the four horsemen, and every time it is wounded it shifts between the aspects of Conquest, War, Famine and Death, gaining a new technique each time. When the ground beneath you is marked, move.\n\nDefeat it and bring me the seal, and I will share with you the power of one of the _four horsemen_ waiting beyond.
actors.mobs.npcs.prophet.reminder=You haven't brought the seal yet. The _Seal Warden_ waits in its sanctum on this floor. Remember: each time it changes its aspect it learns a new technique, and every one of them is marked on the ground a moment before it strikes.
actors.mobs.sealwarden.name=seal warden
actors.mobs.sealwarden.desc=An armored warden guarding the seal of the apocalypse from its sanctum. It borrows the power of the four horsemen, taking on the next horseman's aspect each time it loses a quarter of its health. Its techniques are marked on the ground a moment before they land; step out of the marks to avoid them.
actors.mobs.sealwarden.desc_conquest=_Aspect of Conquest:_ thick armor turns blows aside.
actors.mobs.sealwarden.desc_war=_Aspect of War:_ attacks half again as fast.
actors.mobs.sealwarden.desc_famine=_Aspect of Famine:_ its hits weaken you and steal satiety.
actors.mobs.sealwarden.desc_death=_Aspect of Death:_ hits much harder against foes below half health.
actors.mobs.sealwarden.aspect_war=War!
actors.mobs.sealwarden.aspect_famine=Famine!
actors.mobs.sealwarden.aspect_death=Death!
actors.mobs.sealwarden.aspect_conquest=Conquest!
actors.mobs.sealwarden.notice=You who would touch the seal... in the name of the four horsemen, I will stop you!
actors.mobs.sealwarden.yell_war=The red horse rides! The blade will not rest!
actors.mobs.sealwarden.yell_famine=The black scales tip... I will take your strength.
actors.mobs.sealwarden.yell_death=The pale horse has come, and hell follows with it...
actors.mobs.sealwarden.yell_conquest=He who rides the white horse conquers, and conquers again!
actors.mobs.sealwarden.defeated=The seal... is breaking...
actors.mobs.sealwarden.sealed=Stone grinds shut over the doorway. There is no way out but through the warden!
actors.mobs.sealwarden.unsealed=The stone over the doorway crumbles away.
actors.mobs.sealwarden.skill_volley=Volley!
actors.mobs.sealwarden.skill_charge=Charge!
actors.mobs.sealwarden.skill_blight=Blight!
actors.mobs.sealwarden.skill_reap=Reap!
actors.mobs.sealwarden.skill_kill=The Seal Warden's technique struck you down...
actors.mobs.sealwarden.desc_skills=_Techniques:_
actors.mobs.sealwarden.desc_skill_volley=- _Volley_ (Conquest): arrows rain on your tile and the four tiles beside it.
actors.mobs.sealwarden.desc_skill_charge=- _Charge_ (War): it dashes in a straight line through you, crippling whoever it runs over.
actors.mobs.sealwarden.desc_skill_blight=- _Blight_ (Famine): an X of withering spreads diagonally through you, weakening and starving you and healing the warden.
actors.mobs.sealwarden.desc_skill_reap=- _Reap_ (Death): a sweep over every tile around it, deadlier against the badly wounded.
actors.mobs.npcs.prophet$sealbearer.name=seal bearer
actors.mobs.npcs.prophet$sealbearer.desc=This creature carries a fragment of the apocalypse's seals. Defeat it and it will drop the fragment.
